<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鼠标视差层</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-radius: 14px;       /* 图片圆角 */
    --mt-color: #f2f3f8;     /* 标题颜色 */
    --mt-fontSize: 56px;     /* 标题字号 */
    --mt-font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; /* 字体 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; display: grid; place-items: center; font-family: var(--mt-font); }

  .mt-scene { position: fixed; inset: 0; perspective: 1000px; }
  /* 每张图一个「深度」：越近的越大、越清楚、跟手幅度越大；进场时从模糊淡入 */
  .mt-layer {
    position: absolute; left: var(--x); top: var(--y); width: var(--w); aspect-ratio: 4 / 3;
    transform: translate3d(calc(var(--mx) * var(--depth)), calc(var(--my) * var(--depth)), 0) scale(var(--s, 1));
    transition: transform 0.12s linear;
    opacity: 0; filter: blur(12px);
    animation: mt-in 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) both; animation-delay: var(--delay);
  }
  .mt-layer img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: var(--mt-radius); box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6); }
  @keyframes mt-in { to { opacity: var(--o, 1); filter: blur(0); } }
  .mt-title { position: relative; margin: 0; text-align: center; color: var(--mt-color); font-size: var(--mt-fontSize); font-weight: 800; letter-spacing: -0.03em; text-wrap: balance; padding: 0 24px; text-shadow: 0 4px 30px rgba(0, 0, 0, 0.6); animation: mt-in 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) both 0.3s; opacity: 0; filter: blur(12px); }
  .mt-title small { display: block; margin-top: 12px; font-size: 0.32em; font-weight: 400; opacity: 0.6; letter-spacing: 0; }

  /* 用户开启「减少动态效果」时：不跟手、直接显示 */
  @media (prefers-reduced-motion: reduce) {
    .mt-layer, .mt-title { animation: none; opacity: var(--o, 1); filter: none; }
    .mt-layer { transform: none; transition: none; }
  }
</style>
</head>
<body>
<div class="mt-scene" id="mtScene" aria-hidden="true"></div>
<h1 class="mt-title" id="mtTitle"></h1>
<script>
  const CONFIG = {
    slides: [{"src":"/samples/sample-1.webp","caption":""},{"src":"/samples/sample-2.webp","caption":""},{"src":"/samples/sample-3.webp","caption":""},{"src":"/samples/sample-4.webp","caption":""},{"src":"/samples/sample-5.webp","caption":""},{"src":"/samples/sample-6.webp","caption":""}], // 图片列表
    title: "每一层都在不同的深度",     // 标题
    sub: "移动鼠标，近的动得多，远的动得少",   // 副标题
    strength: 40,        // 跟手幅度（px，最近一层）
    spread: 1,           // 图片散布范围倍率
  };

  const scene = document.getElementById('mtScene'), title = document.getElementById('mtTitle');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  title.textContent = CONFIG.title; if (CONFIG.sub) { const s = document.createElement('small'); s.textContent = CONFIG.sub; title.appendChild(s); }

  // 预设 8 个落点（围着标题一圈），深度 0.3–1：远的小而淡、近的大而实
  const slots = [
    { x: 6, y: 8, d: 0.45 }, { x: 62, y: 4, d: 0.8 }, { x: 80, y: 40, d: 0.35 }, { x: 68, y: 66, d: 1 },
    { x: 8, y: 58, d: 0.9 }, { x: 34, y: 74, d: 0.5 }, { x: 40, y: 6, d: 0.3 }, { x: 88, y: 12, d: 0.6 },
  ];
  CONFIG.slides.slice(0, 8).forEach((s, i) => {
    const slot = slots[i % slots.length];
    const el = document.createElement('div'); el.className = 'mt-layer';
    const cx = 50 + (slot.x - 50) * CONFIG.spread, cy = 50 + (slot.y - 50) * CONFIG.spread;
    el.style.setProperty('--x', cx + '%'); el.style.setProperty('--y', cy + '%');
    el.style.setProperty('--w', (10 + slot.d * 14) + 'vw');           // 近的更大
    el.style.setProperty('--depth', slot.d); el.style.setProperty('--o', (0.45 + slot.d * 0.55).toFixed(2)); // 远的更淡
    el.style.setProperty('--delay', (i * 0.12) + 's'); el.style.zIndex = Math.round(slot.d * 10);
    const img = document.createElement('img'); img.src = s.src; img.alt = ''; el.appendChild(img); scene.appendChild(el);
  });

  // 鼠标相对屏幕中心的偏移（-1..1）× 幅度 → 写进 --mx/--my，各层再乘自己的深度
  let userTook = false;
  function setMouse(nx, ny) { scene.style.setProperty('--mx', (nx * CONFIG.strength) + 'px'); scene.style.setProperty('--my', (ny * CONFIG.strength) + 'px'); }
  addEventListener('pointermove', (e) => { userTook = true; setMouse(e.clientX / innerWidth * 2 - 1, e.clientY / innerHeight * 2 - 1); });
  setMouse(0, 0);

  /* @mt:thumb-start */
  // 缩略图演示：没有鼠标时视差自己缓缓漂
  if (!reduceMotion) {
    let t = 0, last = performance.now();
    (function auto(now) {
      if (userTook) return;
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (!document.hidden) { t += dt; setMouse(Math.sin(t * 0.6), Math.cos(t * 0.45) * 0.6); }
      requestAnimationFrame(auto);
    })(performance.now());
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
