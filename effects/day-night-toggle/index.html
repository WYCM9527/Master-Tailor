<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日夜切换开关</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-size: 120px;        /* 开关宽度（高度为一半） */
    --mt-day: #4fb2ff;       /* 白天天空色 */
    --mt-night: #1b1f4a;     /* 夜晚天空色 */
    --mt-sun: #ffcc33;       /* 太阳颜色 */
    --mt-moon: #e8e9f3;      /* 月亮颜色 */
    --mt-duration: 0.6s;     /* 切换时长 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; display: grid; place-items: center; }

  /* 开关：一条胶囊天空 + 一颗会从太阳变成月亮的滑块；白天有云，夜里有星 */
  .mt-toggle { position: relative; width: var(--mt-size); height: calc(var(--mt-size) / 2); border-radius: 999px; border: 0; padding: 0; cursor: pointer; overflow: hidden; background: var(--mt-day); box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.35), 0 8px 24px -8px rgba(0, 0, 0, 0.6); transition: background-color var(--mt-duration) ease; }
  .mt-toggle * { pointer-events: none; }
  .mt-toggle.night { background: var(--mt-night); }
  /* 云：几团圆叠出来，夜里沉下去 */
  .mt-clouds { position: absolute; inset: 0; transition: transform var(--mt-duration) cubic-bezier(0.4, 0, 0.2, 1); }
  .mt-clouds i { position: absolute; background: #fff; border-radius: 50%; opacity: 0.95; }
  .mt-toggle.night .mt-clouds { transform: translateY(110%); }
  /* 星：小白点，白天升上去藏起来 */
  .mt-stars { position: absolute; inset: 0; transform: translateY(-110%); transition: transform var(--mt-duration) cubic-bezier(0.4, 0, 0.2, 1); }
  .mt-stars i { position: absolute; width: 4%; aspect-ratio: 1; background: #fff; border-radius: 50%; animation: mt-twinkle 2s ease-in-out infinite; animation-delay: var(--d); }
  .mt-toggle.night .mt-stars { transform: none; }
  @keyframes mt-twinkle { 50% { opacity: 0.3; transform: scale(0.6); } }
  /* 滑块：太阳；夜里滑到右边并被一枚同色圆「咬」掉一块成月牙 */
  .mt-knob { position: absolute; top: 8%; left: 4%; width: 42%; aspect-ratio: 1; border-radius: 50%; background: var(--mt-sun); box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.18), 0 0 24px rgba(255, 204, 51, 0.6); transition: transform var(--mt-duration) cubic-bezier(0.34, 1.56, 0.64, 1), background-color var(--mt-duration) ease, box-shadow var(--mt-duration) ease; }
  .mt-knob::after { content: ''; position: absolute; top: -20%; left: 40%; width: 100%; height: 100%; border-radius: 50%; background: var(--mt-night); transform: translate(60%, -60%) scale(0.6); opacity: 0; transition: transform var(--mt-duration) cubic-bezier(0.34, 1.56, 0.64, 1), opacity var(--mt-duration) ease; }
  .mt-toggle.night .mt-knob { transform: translateX(calc(var(--mt-size) * 0.5)) rotate(-30deg); background: var(--mt-moon); box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.1), 0 0 16px rgba(232, 233, 243, 0.4); }
  .mt-toggle.night .mt-knob::after { transform: none; opacity: 1; }
  .mt-toggle:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  .mt-label { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); color: #f2f3f8; opacity: 0.5; font: 13px -apple-system, "PingFang SC", sans-serif; letter-spacing: 0.15em; }
  @media (prefers-reduced-motion: reduce) { .mt-toggle, .mt-knob, .mt-knob::after, .mt-clouds, .mt-stars { transition: none; } .mt-stars i { animation: none; } }
</style>
</head>
<body>
<button type="button" class="mt-toggle" id="mtToggle" role="switch" aria-checked="false" aria-label="切换日夜模式">
  <span class="mt-clouds" id="mtClouds"></span>
  <span class="mt-stars" id="mtStars"></span>
  <span class="mt-knob"></span>
</button>
<div class="mt-label" id="mtLabel">白天</div>
<script>
  const CONFIG = {
    startNight: false,     // 初始为夜间
    labels: "白天｜夜晚",   // 两个状态的文字，用「｜」分隔
    stars: 7,              // 夜空星星数量
  };
  const toggle = document.getElementById('mtToggle'), clouds = document.getElementById('mtClouds'), stars = document.getElementById('mtStars'), label = document.getElementById('mtLabel');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const [dayText = '白天', nightText = '夜晚'] = CONFIG.labels.split('｜').map(s => s.trim());
  // 云：右下方几团圆
  [[52, 55, 30], [66, 45, 34], [80, 58, 28], [90, 70, 40]].forEach(([x, y, s]) => { const c = document.createElement('i'); c.style.cssText = `left:${x}%;top:${y}%;width:${s}%;aspect-ratio:1;transform:translate(-50%,-50%)`; clouds.appendChild(c); });
  // 星：左半边随机撒
  const rnd = (a, b) => a + Math.random() * (b - a);
  for (let i = 0; i < CONFIG.stars; i++) { const s = document.createElement('i'); s.style.cssText = `left:${rnd(6, 48)}%;top:${rnd(12, 78)}%;--d:${rnd(0, 2).toFixed(2)}s;transform:scale(${rnd(0.6, 1.2).toFixed(2)})`; stars.appendChild(s); }
  let night = CONFIG.startNight, userTook = false;
  function render() { toggle.classList.toggle('night', night); toggle.setAttribute('aria-checked', String(night)); label.textContent = night ? nightText : dayText; }
  render();
  toggle.addEventListener('click', () => { userTook = true; night = !night; render(); });

  /* @mt:thumb-start */
  // 缩略图演示：没人点时定期切换
  if (!reduceMotion) setInterval(() => { if (userTook || document.hidden) return; night = !night; render(); }, 2200);
  /* @mt:thumb-end */
</script>
</body>
</html>
