<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多图横滑（笔记风）</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;       /* 页面底色 */
    --mt-accent: #f9cf00;   /* 强调色：当前圆点 */
    --mt-duration: 0.35s;   /* 滑动过渡时长 */
    --mt-rounded: 12px;     /* 容器圆角 */
  }

  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mt-bg);
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  /* 竖版笔记卡的图片区：一屏一张，到头停住不循环 */
  .mt-note {
    position: relative;
    width: min(360px, 82vw);
    aspect-ratio: 3 / 4;
    border-radius: var(--mt-rounded);
    overflow: hidden;
    outline: none;
    touch-action: pan-y;
    cursor: grab;
    background: #14151f;
  }
  .mt-note.dragging { cursor: grabbing; }
  .mt-note:focus-visible { outline: 2px solid var(--mt-accent); outline-offset: 4px; }

  .mt-track {
    display: flex;
    height: 100%;
    transition: transform var(--mt-duration) cubic-bezier(0.25, 0.8, 0.35, 1);
    will-change: transform;
  }
  .mt-track.no-anim { transition: none; }
  .mt-slide {
    flex: none;
    width: 100%;
    height: 100%;
    margin: 0;
    position: relative;
    background: linear-gradient(135deg, #1a1c2c, #2a2f4a);
  }
  .mt-slide img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    -webkit-user-drag: none;
    user-select: none;
  }

  /* 右上角「1/5」分数角标：笔记风的标志细节 */
  .mt-count {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 2;
    padding: 3px 10px;
    border-radius: 999px;
    background: rgba(10, 10, 15, 0.55);
    color: #fff;
    font-size: 12px;
    font-family: ui-monospace, monospace;
    letter-spacing: 0.06em;
  }

  /* 底部小圆点 */
  .mt-dots {
    position: absolute;
    left: 0; right: 0; bottom: 10px;
    z-index: 2;
    display: flex;
    justify-content: center;
    gap: 5px;
    pointer-events: none;
  }
  .mt-dots i {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.45);
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .mt-dots i.active { background: var(--mt-accent); transform: scale(1.3); }

  /* 用户开启「减少动态效果」：滑动瞬间到位（本效果不自动播放） */
  @media (prefers-reduced-motion: reduce) {
    .mt-track { transition: none; }
  }
</style>
</head>
<body>
<div class="mt-note" id="mtRoot"></div>
<script>
  const CONFIG = {
    slides: [{"src":"/samples/sample-1.svg","caption":""},{"src":"/samples/sample-2.svg","caption":""},{"src":"/samples/sample-3.svg","caption":""},{"src":"/samples/sample-4.svg","caption":""},{"src":"/samples/sample-5.svg","caption":""}], // 图片列表
    edgeResist: 0.3, // 到头再拖时的阻力（0-1，越小越拖不动）
  };

  // 笔记风多图横滑的性格：不自动播放、不循环——滑到最后一张就停住，再拖有橡皮筋阻力
  (function () {
    const root = document.getElementById('mtRoot');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const slides = CONFIG.slides;
    const total = slides.length;
    let index = 0;

    root.setAttribute('role', 'region');
    root.setAttribute('aria-roledescription', 'carousel');
    root.setAttribute('aria-label', '多图横滑');
    root.setAttribute('tabindex', '0');

    const track = document.createElement('div');
    track.className = 'mt-track';
    slides.forEach((s, i) => {
      const el = document.createElement('figure');
      el.className = 'mt-slide';
      el.setAttribute('role', 'group');
      el.setAttribute('aria-roledescription', 'slide');
      el.setAttribute('aria-label', '第 ' + (i + 1) + ' 张，共 ' + total + ' 张');
      const img = document.createElement('img');
      img.src = s.src;
      img.alt = s.caption || '第 ' + (i + 1) + ' 张图片';
      img.loading = i === 0 ? 'eager' : 'lazy';
      el.appendChild(img);
      track.appendChild(el);
    });
    root.appendChild(track);

    const count = document.createElement('div');
    count.className = 'mt-count';
    count.setAttribute('aria-hidden', 'true');
    root.appendChild(count);

    const dots = document.createElement('div');
    dots.className = 'mt-dots';
    dots.setAttribute('aria-hidden', 'true');
    const dotEls = slides.map(() => {
      const dot = document.createElement('i');
      dots.appendChild(dot);
      return dot;
    });
    root.appendChild(dots);

    function render(extraPx) {
      const width = root.clientWidth;
      track.style.transform = 'translateX(' + (-index * width + (extraPx || 0)) + 'px)';
      count.textContent = (index + 1) + '/' + total;
      dotEls.forEach((d, i) => d.classList.toggle('active', i === index));
    }

    // 不循环：到头夹住
    function goTo(next) {
      index = Math.max(0, Math.min(total - 1, next));
      track.classList.remove('no-anim');
      render(0);
    }

    // 拖拽跟手（Pointer Events）：拖动时轨道实时跟随，越界有橡皮筋阻力
    let dragStartX = null, dragDx = 0;
    root.addEventListener('pointerdown', (e) => {
      dragStartX = e.clientX; dragDx = 0;
      root.classList.add('dragging');
      root.setPointerCapture(e.pointerId);
      track.classList.add('no-anim');
    });
    root.addEventListener('pointermove', (e) => {
      if (dragStartX === null) return;
      dragDx = e.clientX - dragStartX;
      const atEdge = (index === 0 && dragDx > 0) || (index === total - 1 && dragDx < 0);
      render(atEdge ? dragDx * CONFIG.edgeResist : dragDx);
    });
    function endDrag() {
      if (dragStartX === null) return;
      root.classList.remove('dragging');
      track.classList.remove('no-anim');
      if (Math.abs(dragDx) > root.clientWidth * 0.18) {
        goTo(index + (dragDx < 0 ? 1 : -1));
      } else {
        render(0); // 距离不够：弹回
      }
      dragStartX = null;
    }
    root.addEventListener('pointerup', endDrag);
    root.addEventListener('pointercancel', endDrag);

    // 键盘
    root.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { e.preventDefault(); goTo(index + 1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(index - 1); }
    });

    // 窗口变化后按新宽度无动画重排；reduced-motion 时切换本来就是瞬间的
    addEventListener('resize', () => { track.classList.add('no-anim'); render(0); });
    if (reduceMotion) track.classList.add('no-anim');
    render(0);

    /* @mt:thumb-start */
    if (window.__MT_ENV && window.__MT_ENV.thumb && !reduceMotion) {
      // 缩略图演示：自动左右翻页，到头折返（本效果真实使用中不自动播放）
      let dir = 1;
      setInterval(() => {
        if (document.hidden) return;
        if (index >= total - 1) dir = -1;
        if (index <= 0) dir = 1;
        goTo(index + dir);
      }, 1800);
    }
    /* @mt:thumb-end */
  })();
</script>
</body>
</html>
