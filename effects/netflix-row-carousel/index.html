<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>影视行悬停放大</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-accent: #f9cf00;    /* 强调色：箭头悬停 */
    --mt-scale: 1.35;        /* 悬停放大倍数 */
    --mt-duration: 0.3s;     /* 放大过渡时长 */
    --mt-gap: 10px;          /* 海报间距 */
    --mt-rounded: 8px;       /* 海报圆角 */
  }

  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mt-bg);
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  .mt-row-wrap {
    position: relative;
    width: min(780px, 94vw);
    outline: none;
    /* 给放大的海报留出上下空间 */
    padding: 46px 0;
  }
  .mt-row-wrap:focus-visible { outline: 2px solid var(--mt-accent); outline-offset: 4px; }

  .mt-row {
    display: flex;
    gap: var(--mt-gap);
    overflow-x: auto;
    scroll-behavior: smooth;
    scrollbar-width: none;
    padding: 0 2px;
    touch-action: pan-y;
    cursor: grab;
  }
  .mt-row.dragging { cursor: grabbing; scroll-behavior: auto; }
  .mt-row::-webkit-scrollbar { display: none; }

  .mt-poster {
    flex: none;
    width: 150px;
    aspect-ratio: 2 / 3;
    margin: 0;
    position: relative;
    border-radius: var(--mt-rounded);
    overflow: hidden;
    background: linear-gradient(135deg, #1a1c2c, #2a2f4a);
    transition: transform var(--mt-duration) cubic-bezier(0.22, 1, 0.36, 1), box-shadow var(--mt-duration) ease;
  }
  .mt-poster img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    -webkit-user-drag: none;
    user-select: none;
  }
  .mt-poster .mt-caption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 26px 10px 8px;
    color: #fff;
    font-size: 12.5px;
    font-weight: 600;
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
    opacity: 0;
    transition: opacity var(--mt-duration) ease;
  }
  /* 影视站的招牌：悬停的海报放大浮起，标题浮现，旁边的被推开一点 */
  .mt-row:hover .mt-poster:hover {
    transform: scale(var(--mt-scale));
    z-index: 2;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.6);
  }
  .mt-poster:hover .mt-caption { opacity: 1; }
  .mt-poster:has(~ .mt-poster:hover) { transform: translateX(calc((var(--mt-scale) - 1) * -46px)); }
  .mt-poster:hover ~ .mt-poster { transform: translateX(calc((var(--mt-scale) - 1) * 46px)); }

  /* 行两端的翻页箭头：悬停行时才浮现 */
  .mt-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 3;
    width: 38px; height: 66px;
    border: none;
    border-radius: 8px;
    background: rgba(10, 10, 15, 0.65);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: grid;
    place-items: center;
    opacity: 0;
    transition: opacity 0.2s ease, background 0.15s ease, color 0.15s ease;
  }
  .mt-row-wrap:hover .mt-arrow, .mt-row-wrap:focus-within .mt-arrow { opacity: 1; }
  .mt-arrow:hover { background: var(--mt-accent); color: #191400; }
  .mt-arrow.prev { left: -8px; }
  .mt-arrow.next { right: -8px; }

  /* 用户开启「减少动态效果」：不放大不推挤，只浮现标题 */
  @media (prefers-reduced-motion: reduce) {
    .mt-poster, .mt-row { transition: none; scroll-behavior: auto; }
    .mt-row:hover .mt-poster:hover { transform: none; box-shadow: none; }
    .mt-poster:has(~ .mt-poster:hover), .mt-poster:hover ~ .mt-poster { transform: none; }
  }
</style>
</head>
<body>
<div class="mt-row-wrap" id="mtRoot"></div>
<script>
  const CONFIG = {
    slides: [{"src":"/samples/sample-1.webp","caption":"夜枭小憩"},{"src":"/samples/sample-2.webp","caption":"海边老爷车"},{"src":"/samples/sample-3.webp","caption":"日落海滩"},{"src":"/samples/sample-4.webp","caption":"山谷晨光"},{"src":"/samples/sample-5.webp","caption":"蓝天夹竹桃"},{"src":"/samples/sample-6.webp","caption":"建筑一角"},{"src":"/samples/sample-7.webp","caption":"仰望丝兰"},{"src":"/samples/sample-8.webp","caption":"星云深处"}], // 海报列表
  };

  // 本效果由用户驱动（无自动播放）：悬停放大是 CSS，JS 负责箭头按「屏」翻页与拖拽滚动
  (function () {
    const root = document.getElementById('mtRoot');
    const slides = CONFIG.slides;
    const total = slides.length;

    root.setAttribute('role', 'region');
    root.setAttribute('aria-roledescription', 'carousel');
    root.setAttribute('aria-label', '海报行');
    root.setAttribute('tabindex', '0');

    const row = document.createElement('div');
    row.className = 'mt-row';
    slides.forEach((s, i) => {
      const el = document.createElement('figure');
      el.className = 'mt-poster';
      el.setAttribute('role', 'group');
      el.setAttribute('aria-roledescription', 'slide');
      el.setAttribute('aria-label', '第 ' + (i + 1) + ' 张，共 ' + total + ' 张' + (s.caption ? '：' + s.caption : ''));
      const img = document.createElement('img');
      img.src = s.src;
      img.alt = s.caption || '第 ' + (i + 1) + ' 张海报';
      img.loading = 'lazy';
      el.appendChild(img);
      if (s.caption) {
        const cap = document.createElement('div');
        cap.className = 'mt-caption';
        cap.textContent = s.caption;
        el.appendChild(cap);
      }
      row.appendChild(el);
    });
    root.appendChild(row);

    // 箭头：一次翻一「屏」
    const page = () => row.clientWidth * 0.9;
    for (const [cls, label, dir] of [['prev', '往前翻一屏', -1], ['next', '往后翻一屏', 1]]) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'mt-arrow ' + cls;
      btn.setAttribute('aria-label', label);
      btn.textContent = cls === 'prev' ? '‹' : '›';
      btn.addEventListener('click', () => row.scrollBy({ left: dir * page(), behavior: 'smooth' }));
      root.appendChild(btn);
    }

    // 键盘：← / → 翻屏
    root.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { e.preventDefault(); row.scrollBy({ left: page(), behavior: 'smooth' }); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); row.scrollBy({ left: -page(), behavior: 'smooth' }); }
    });

    // 鼠标拖拽滚动（触屏由原生滚动接管；Pointer Events 只处理鼠标）
    let dragStartX = null, startScroll = 0, moved = false;
    row.addEventListener('pointerdown', (e) => {
      if (e.pointerType !== 'mouse') return;
      dragStartX = e.clientX;
      startScroll = row.scrollLeft;
      moved = false;
      row.classList.add('dragging');
      row.setPointerCapture(e.pointerId);
    });
    row.addEventListener('pointermove', (e) => {
      if (dragStartX === null) return;
      const dx = e.clientX - dragStartX;
      if (Math.abs(dx) > 6) moved = true;
      row.scrollLeft = startScroll - dx;
    });
    const endDrag = () => { dragStartX = null; row.classList.remove('dragging'); };
    row.addEventListener('pointerup', endDrag);
    row.addEventListener('pointercancel', endDrag);
    // 拖拽后抑制点击
    row.addEventListener('click', (e) => { if (moved) e.stopPropagation(); }, true);

    /* @mt:thumb-start */
    if (window.__MT_ENV && window.__MT_ENV.thumb && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      // 缩略图演示：行缓慢往返滚动，展示海报行的密度
      let dir = 1;
      setInterval(() => {
        if (document.hidden) return;
        const max = row.scrollWidth - row.clientWidth;
        if (row.scrollLeft >= max - 4) dir = -1;
        if (row.scrollLeft <= 4) dir = 1;
        row.scrollBy({ left: dir * 120, behavior: 'smooth' });
      }, 1400);
    }
    /* @mt:thumb-end */
  })();
</script>
</body>
</html>
