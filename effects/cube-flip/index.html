<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>立方体翻页转场</title>
    <style>
      :root {
        --mt-bg: #0a0a0f; /* 页面底色 */
        --mt-imageA: url('/samples/sample-7.webp'); /* 第一面海报 */
        --mt-imageB: url('/samples/sample-2.webp'); /* 第二面海报 */
        --mt-angle: 72; /* 折面角度（度，90 为标准立方体） */
        --mt-depth: 1100; /* 纵深感（透视距离 px，越小越立体） */
        --mt-duration: 0.7s; /* 转场时长 */
        --mt-accent: #ffffff; /* 强调色：标题与按钮 */
        --cube-ease: cubic-bezier(0.45, 0, 0.25, 1); /* 翻面曲线：两头稳中间快 */
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--mt-bg);
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #f2f2f7;
      }

      .mt-app {
        position: relative;
        width: min(880px, 94vw);
        height: min(560px, 92vh);
        border-radius: 18px;
        overflow: clip;
        background: #060608;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
      }
      .page {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        display: grid;
        place-items: end start;
        backface-visibility: hidden;
      }
      .page[hidden] {
        display: none;
      }
      .page::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(transparent 45%, rgba(0, 0, 0, 0.62));
        pointer-events: none;
      }
      .page-a {
        background-image: var(--mt-imageA);
      }
      .page-b {
        background-image: var(--mt-imageB);
      }
      .poster-copy {
        position: relative;
        z-index: 1;
        padding: 0 44px 46px;
      }
      .poster-copy h1 {
        margin: 0 0 6px;
        font-size: clamp(30px, 5.4vw, 52px);
        color: var(--mt-accent);
        outline: none;
      }
      .poster-copy p {
        margin: 0;
        color: rgba(255, 255, 255, 0.72);
        font-size: 14.5px;
      }
      .stage-btn {
        position: absolute;
        z-index: 2;
        bottom: 20px;
        right: 22px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 999px;
        padding: 9px 20px;
        background: rgba(10, 10, 15, 0.45);
        color: var(--mt-accent);
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      .stage-btn.prev {
        right: auto;
        left: 22px;
      }
      .stage-btn:focus-visible {
        outline: 2px solid var(--mt-accent);
        outline-offset: 2px;
      }

      /* ===== 过渡层：立方体折面 =====
         前进：新面沿左棱从右侧转入，旧面沿右棱向左转出，像立方体转了一格；
         返回严格镜像。透视写在每帧的变换里（快照上无法共享 3D 舞台）。 */
      ::view-transition-old(page),
      ::view-transition-new(page) {
        animation-duration: var(--mt-duration);
        animation-timing-function: var(--cube-ease);
        animation-fill-mode: both;
      }
      html[data-vt='forward']::view-transition-new(page) {
        transform-origin: left center;
        animation-name: cube-in-right;
      }
      html[data-vt='forward']::view-transition-old(page) {
        transform-origin: right center;
        animation-name: cube-out-left;
      }
      html[data-vt='back']::view-transition-new(page) {
        transform-origin: right center;
        animation-name: cube-in-left;
      }
      html[data-vt='back']::view-transition-old(page) {
        transform-origin: left center;
        animation-name: cube-out-right;
      }

      /* 从右侧转入 / 向左转出（前进）；镜像一组（返回） */
      @keyframes cube-in-right {
        from {
          transform: perspective(calc(var(--mt-depth) * 1px)) translateX(100%)
            rotateY(calc(var(--mt-angle) * 1deg));
          opacity: 0.35;
        }
        to {
          transform: perspective(calc(var(--mt-depth) * 1px)) translateX(0) rotateY(0);
          opacity: 1;
        }
      }
      @keyframes cube-out-left {
        from {
          transform: perspective(calc(var(--mt-depth) * 1px)) translateX(0) rotateY(0);
          opacity: 1;
        }
        to {
          transform: perspective(calc(var(--mt-depth) * 1px)) translateX(-100%)
            rotateY(calc(var(--mt-angle) * -1deg));
          opacity: 0.35;
        }
      }
      @keyframes cube-in-left {
        from {
          transform: perspective(calc(var(--mt-depth) * 1px)) translateX(-100%)
            rotateY(calc(var(--mt-angle) * -1deg));
          opacity: 0.35;
        }
        to {
          transform: perspective(calc(var(--mt-depth) * 1px)) translateX(0) rotateY(0);
          opacity: 1;
        }
      }
      @keyframes cube-out-right {
        from {
          transform: perspective(calc(var(--mt-depth) * 1px)) translateX(0) rotateY(0);
          opacity: 1;
        }
        to {
          transform: perspective(calc(var(--mt-depth) * 1px)) translateX(100%)
            rotateY(calc(var(--mt-angle) * 1deg));
          opacity: 0.35;
        }
      }

      /* @mt:fallback 无 API 回退：同一套 keyframes 直接加在真实页面上，效果一致 */
      .page.fx-in,
      .page.fx-out {
        animation-duration: var(--mt-duration);
        animation-timing-function: var(--cube-ease);
        animation-fill-mode: both;
      }
      html[data-vt='forward'] .page.fx-in {
        transform-origin: left center;
        animation-name: cube-in-right;
        z-index: 2;
      }
      html[data-vt='forward'] .page.fx-out {
        transform-origin: right center;
        animation-name: cube-out-left;
        z-index: 1;
      }
      html[data-vt='back'] .page.fx-in {
        transform-origin: right center;
        animation-name: cube-in-left;
        z-index: 1;
      }
      html[data-vt='back'] .page.fx-out {
        transform-origin: left center;
        animation-name: cube-out-right;
        z-index: 2;
      }

      /* 用户开启「减少动态效果」：一律瞬间切换（JS 同步跳过转场） */
      @media (prefers-reduced-motion: reduce) {
        ::view-transition-group(*),
        ::view-transition-old(*),
        ::view-transition-new(*) {
          animation: none !important;
        }
        .page.fx-in,
        .page.fx-out {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="mt-app" id="mtApp">
      <section class="page page-a" id="pageA" aria-label="第一面">
        <div class="poster-copy">
          <h1 tabindex="-1">换个面看。</h1>
          <p>第一面 · 点右下角，立方体向左转一格</p>
        </div>
        <button type="button" class="stage-btn next" id="nextBtn">下一面 ›</button>
      </section>

      <section class="page page-b" id="pageB" aria-label="第二面" hidden>
        <div class="poster-copy">
          <h1 tabindex="-1">转回去也行。</h1>
          <p>第二面 · 返回时立方体原路转回</p>
        </div>
        <button type="button" class="stage-btn prev" id="prevBtn">‹ 上一面</button>
      </section>
    </div>

    <script>
      const CONFIG = {
        faceA: '第一面', // 面 A 的无障碍名称
        faceB: '第二面', // 面 B 的无障碍名称
      };

      (function () {
        const html = document.documentElement;
        const pageA = document.getElementById('pageA');
        const pageB = document.getElementById('pageB');
        const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
        let navigating = false; // 转场进行中忽略新的导航

        pageA.setAttribute('aria-label', CONFIG.faceA);
        pageB.setAttribute('aria-label', CONFIG.faceB);

        function swap(from, to) {
          from.hidden = true;
          to.hidden = false;
        }
        function focusHeading(to) {
          const heading = to.querySelector('h1');
          if (heading) heading.focus({ preventScroll: true });
        }

        // ---- 方向化转场 ----
        function go(to, direction) {
          const from = to === pageB ? pageA : pageB;
          if (navigating || !to.hidden) return;

          if (reduceMotion.matches) {
            swap(from, to);
            focusHeading(to);
            return;
          }
          navigating = true;
          html.dataset.vt = direction;

          from.style.viewTransitionName = 'page';
          const cleanup = () => {
            from.style.viewTransitionName = '';
            to.style.viewTransitionName = '';
            delete html.dataset.vt;
            navigating = false;
            focusHeading(to);
          };

          if (document.startViewTransition) {
            const vt = document.startViewTransition(() => {
              swap(from, to);
              from.style.viewTransitionName = '';
              to.style.viewTransitionName = 'page';
            });
            vt.finished.finally(cleanup);
          } else {
            // @mt:fallback：两面短暂同框，播同一套 keyframes
            to.hidden = false;
            from.classList.add('fx-out');
            to.classList.add('fx-in');
            const done = () => {
              to.removeEventListener('animationend', done);
              from.hidden = true;
              from.classList.remove('fx-out');
              to.classList.remove('fx-in');
              cleanup();
            };
            to.addEventListener('animationend', done);
          }
        }
        const goBack = () => go(pageA, 'back');

        // ---- 换面途径：按钮 / Esc / Backspace ----
        document.getElementById('nextBtn').addEventListener('click', () => go(pageB, 'forward'));
        document.getElementById('prevBtn').addEventListener('click', goBack);
        document.addEventListener('keydown', (e) => {
          if (pageB.hidden) return;
          if (e.key === 'Escape' || e.key === 'Backspace') {
            e.preventDefault();
            goBack();
          }
        });

        /* @mt:thumb-start */
        // 缩略图演示：自动转面往返；切后台暂停，reduced-motion 不启动
        if (!reduceMotion.matches) {
          setInterval(() => {
            if (document.hidden || navigating) return;
            if (pageB.hidden) go(pageB, 'forward');
            else goBack();
          }, 2800);
        }
        /* @mt:thumb-end */
      })();
    </script>
  </body>
</html>
