<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>底部弹层转场</title>
    <style>
      :root {
        --mt-bg: #0a0a0f; /* 页面底色 */
        --mt-duration: 0.4s; /* 转场时长 */
        --mt-sheetH: 65%; /* 弹层高度（占容器） */
        --mt-sheetRadius: 18px; /* 弹层顶部圆角 */
        --mt-scaleBack: 0.94; /* 背后页面缩小倍率 */
        --mt-dim: 0.25; /* 遮罩不透明度 */
        --mt-accent: #ffffff; /* 强调色：按钮与抓手 */
        --sheet-ease: cubic-bezier(0.32, 0.72, 0, 1); /* iOS 弹层曲线 */
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--mt-bg);
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #f2f2f7;
      }

      .mt-app {
        position: relative;
        width: min(400px, 92vw);
        height: min(600px, 92vh);
        background: #000;
        border-radius: 22px;
        overflow: clip;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
      }

      /* ---- 背后的内容页：弹层打开时缩小退后（终态由类控制，转场自动补间） ---- */
      .page-feed {
        position: absolute;
        inset: 0;
        overflow: auto;
        background: #101016;
        padding: 20px 18px;
        transition:
          scale var(--mt-duration) var(--sheet-ease),
          filter var(--mt-duration) var(--sheet-ease),
          border-radius var(--mt-duration) var(--sheet-ease);
      }
      .mt-app.sheet-open .page-feed {
        scale: var(--mt-scaleBack);
        filter: brightness(0.75);
        border-radius: 16px;
        overflow: hidden;
      }
      .page-feed h2 {
        margin: 4px 4px 14px;
        font-size: 24px;
        outline: none;
      }
      .feed-card {
        border-radius: 14px;
        background: #1a1b24;
        padding: 16px;
        margin-bottom: 12px;
      }
      .feed-card h3 {
        margin: 0 0 6px;
        font-size: 15px;
      }
      .feed-card p {
        margin: 0;
        font-size: 13px;
        color: #9a9ba8;
        line-height: 1.6;
      }
      .open-btn {
        position: absolute;
        left: 50%;
        bottom: 22px;
        translate: -50% 0;
        z-index: 2;
        border: none;
        border-radius: 999px;
        padding: 12px 26px;
        background: var(--mt-accent);
        color: #0a0a0f;
        font: inherit;
        font-size: 14.5px;
        font-weight: 600;
        cursor: pointer;
      }
      .open-btn:focus-visible {
        outline: 2px solid var(--mt-accent);
        outline-offset: 3px;
      }

      /* ---- 弹层：遮罩 + 底部面板 ---- */
      .sheet-layer {
        position: absolute;
        inset: 0;
      }
      .sheet-layer[hidden] {
        display: none;
      }
      .scrim {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, var(--mt-dim));
      }
      .sheet {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: var(--mt-sheetH);
        background: #1c1d28;
        border-radius: var(--mt-sheetRadius) var(--mt-sheetRadius) 0 0;
        view-transition-name: sheet;
        display: grid;
        grid-template-rows: auto auto 1fr;
        box-shadow: 0 -18px 60px rgba(0, 0, 0, 0.45);
      }
      .grabber {
        width: 40px;
        height: 5px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.3);
        margin: 10px auto 4px;
        cursor: grab;
      }
      .sheet-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 18px 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .sheet-head h1 {
        margin: 0;
        font-size: 17px;
        outline: none;
      }
      .sheet-head .close {
        border: none;
        border-radius: 50%;
        width: 28px;
        height: 28px;
        background: rgba(255, 255, 255, 0.12);
        color: #d5d6e0;
        font-size: 15px;
        cursor: pointer;
        display: grid;
        place-items: center;
      }
      .sheet-head .close:focus-visible {
        outline: 2px solid var(--mt-accent);
      }
      .sheet-body {
        padding: 16px 18px;
        overflow: auto;
      }
      .sheet-body p {
        margin: 0 0 10px;
        font-size: 14px;
        color: #b9bac6;
        line-height: 1.7;
      }

      /* ===== 过渡层：弹层升降 =====
         打开：面板从底部升起，背后页缩小（快照自动补间）；关闭严格反向。 */
      ::view-transition-group(sheet),
      ::view-transition-group(page) {
        animation-duration: var(--mt-duration);
        animation-timing-function: var(--sheet-ease);
      }
      ::view-transition-new(sheet),
      ::view-transition-old(sheet) {
        animation-duration: var(--mt-duration);
        animation-timing-function: var(--sheet-ease);
        animation-fill-mode: both;
      }
      html[data-vt='forward']::view-transition-new(sheet) {
        animation-name: sheet-up;
      }
      html[data-vt='back']::view-transition-old(sheet) {
        animation-name: sheet-down;
      }
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: var(--mt-duration);
      }
      @keyframes sheet-up {
        from {
          transform: translateY(100%);
        }
        to {
          transform: none;
        }
      }
      @keyframes sheet-down {
        from {
          transform: none;
        }
        to {
          transform: translateY(100%);
        }
      }

      /* @mt:fallback 无 API 回退：同一套 keyframes 加在真实面板上，遮罩用淡化 */
      .sheet-layer.fx-in .sheet {
        animation: sheet-up var(--mt-duration) var(--sheet-ease) both;
      }
      .sheet-layer.fx-out .sheet {
        animation: sheet-down var(--mt-duration) var(--sheet-ease) both;
      }
      .sheet-layer.fx-in .scrim {
        animation: scrim-in var(--mt-duration) ease both;
      }
      .sheet-layer.fx-out .scrim {
        animation: scrim-out var(--mt-duration) ease both;
      }
      @keyframes scrim-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes scrim-out {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }

      /* 用户开启「减少动态效果」：一律瞬间切换（JS 同步跳过转场） */
      @media (prefers-reduced-motion: reduce) {
        ::view-transition-group(*),
        ::view-transition-old(*),
        ::view-transition-new(*) {
          animation: none !important;
        }
        .page-feed {
          transition: none !important;
        }
        .sheet-layer.fx-in .sheet,
        .sheet-layer.fx-out .sheet,
        .sheet-layer.fx-in .scrim,
        .sheet-layer.fx-out .scrim {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="mt-app" id="mtApp">
      <section class="page-feed" id="pageFeed" aria-label="内容页">
        <h2 tabindex="-1">今日推荐</h2>
        <article class="feed-card">
          <h3>底部弹层</h3>
          <p>点下方按钮，面板从底部升起，这一页会缩小退后一步。</p>
        </article>
        <article class="feed-card">
          <h3>拖拽关闭</h3>
          <p>抓住弹层顶部的小横条往下拖，或按 Esc，都能把它放回去。</p>
        </article>
        <article class="feed-card">
          <h3>严格反向</h3>
          <p>关闭是打开的严格倒放：面板落回底部，这一页亮回来恢复原大。</p>
        </article>
      </section>
      <button type="button" class="open-btn" id="openBtn">查看详情</button>

      <div class="sheet-layer" id="sheetLayer" hidden>
        <div class="scrim" id="scrim"></div>
        <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" id="sheet">
          <div class="grabber" id="grabber" aria-hidden="true"></div>
          <div class="sheet-head">
            <h1 id="sheetTitle" tabindex="-1">详情</h1>
            <button type="button" class="close" id="closeBtn" aria-label="关闭弹层">✕</button>
          </div>
          <div class="sheet-body">
            <p>这块面板从容器底部升起，顶部圆角、带抓手条；背后的页面缩小并压暗，交代出「卡片叠在页面上」的层次。</p>
            <p>往下拖抓手条超过一段距离就会关闭；按 Esc 或点右上角 ✕ 也可以。</p>
          </div>
        </div>
      </div>
    </div>

    <script>
      const CONFIG = {
        sheetTitle: '详情', // 弹层标题
      };

      (function () {
        const html = document.documentElement;
        const app = document.getElementById('mtApp');
        const pageFeed = document.getElementById('pageFeed');
        const sheetLayer = document.getElementById('sheetLayer');
        const openBtn = document.getElementById('openBtn');
        const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
        let navigating = false; // 转场进行中忽略新的导航

        document.getElementById('sheetTitle').textContent = CONFIG.sheetTitle;

        function applyState(open) {
          sheetLayer.hidden = !open;
          app.classList.toggle('sheet-open', open);
          pageFeed.inert = open;
          openBtn.inert = open;
        }
        function focusAfter(open) {
          if (open) document.getElementById('sheetTitle').focus({ preventScroll: true });
          else openBtn.focus({ preventScroll: true });
        }

        // ---- 弹层开合（方向化转场） ----
        function toggle(open) {
          if (navigating || sheetLayer.hidden === !open) return;

          if (reduceMotion.matches) {
            applyState(open);
            focusAfter(open);
            return;
          }
          navigating = true;
          html.dataset.vt = open ? 'forward' : 'back';

          // 背后页挂名参与快照补间（缩小/复原由 sheet-open 类的终态样式驱动）
          pageFeed.style.viewTransitionName = 'page';
          const cleanup = () => {
            pageFeed.style.viewTransitionName = '';
            delete html.dataset.vt;
            navigating = false;
            focusAfter(open);
          };

          if (document.startViewTransition) {
            const vt = document.startViewTransition(() => applyState(open));
            vt.finished.finally(cleanup);
          } else {
            // @mt:fallback：面板与遮罩播同一套 keyframes；背后页走 CSS transition
            if (open) {
              applyState(true);
              sheetLayer.classList.add('fx-in');
              const done = () => {
                sheetLayer.classList.remove('fx-in');
                sheetLayer.removeEventListener('animationend', done);
                cleanup();
              };
              sheetLayer.addEventListener('animationend', done);
            } else {
              app.classList.remove('sheet-open');
              sheetLayer.classList.add('fx-out');
              const done = () => {
                sheetLayer.classList.remove('fx-out');
                sheetLayer.removeEventListener('animationend', done);
                applyState(false);
                cleanup();
              };
              sheetLayer.addEventListener('animationend', done);
            }
          }
        }

        // ---- 打开 / 关闭途径：按钮 / ✕ / Esc / 抓手下拉 / 点遮罩 ----
        openBtn.addEventListener('click', () => toggle(true));
        document.getElementById('closeBtn').addEventListener('click', () => toggle(false));
        document.getElementById('scrim').addEventListener('click', () => toggle(false));
        document.addEventListener('keydown', (e) => {
          if (sheetLayer.hidden) return;
          if (e.key === 'Escape') {
            e.preventDefault();
            toggle(false);
          }
        });
        // 抓手下拉关闭（简化手势：起手在抓手，下拉超过 70px 触发）
        let dragStartY = null;
        const grabber = document.getElementById('grabber');
        grabber.addEventListener('pointerdown', (e) => {
          dragStartY = e.clientY;
          grabber.setPointerCapture(e.pointerId);
        });
        grabber.addEventListener('pointerup', (e) => {
          if (dragStartY !== null && e.clientY - dragStartY > 70) toggle(false);
          dragStartY = null;
        });
        grabber.addEventListener('pointercancel', () => (dragStartY = null));

        /* @mt:thumb-start */
        // 缩略图演示：自动开合往返；切后台暂停，reduced-motion 不启动
        if (!reduceMotion.matches) {
          setInterval(() => {
            if (document.hidden || navigating) return;
            toggle(sheetLayer.hidden);
          }, 2400);
        }
        /* @mt:thumb-end */
      })();
    </script>
  </body>
</html>
