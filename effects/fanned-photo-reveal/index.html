<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>照片扇开揭示</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-frame: #ffffff;     /* 相框颜色 */
    --mt-frameWidth: 6px;    /* 相框宽度 */
    --mt-size: 150px;        /* 照片边长 */
    --mt-overlap: 56px;      /* 相邻照片重叠 */
    --mt-color: #f2f3f8;     /* 文字颜色 */
    --mt-font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; /* 字体 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; display: grid; place-items: center; font-family: var(--mt-font); color: var(--mt-color); }

  .mt-wrap { text-align: center; }
  .mt-title { margin: 0 0 40px; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .mt-row { display: flex; justify-content: center; padding-left: var(--mt-overlap); }
  /* 每张照片：白边相框、各自一个倾角；进场从中心缩小状态弹出（弹簧过冲）、依次错开；悬停时转正放到最上层 */
  .mt-photo {
    position: relative; width: var(--mt-size); height: var(--mt-size); margin-left: calc(var(--mt-overlap) * -1); border-radius: 18px;
    border: var(--mt-frameWidth) solid var(--mt-frame); box-sizing: border-box; object-fit: cover; box-shadow: 0 18px 40px -16px rgba(0, 0, 0, 0.8);
    transform: rotate(var(--angle)) scale(0.2); opacity: 0;
    transition: transform 0.3s cubic-bezier(0.34, 1.3, 0.64, 1), opacity 0.25s, z-index 0s; transition-delay: var(--delay);
  }
  .mt-row.in .mt-photo { transform: rotate(var(--angle)) scale(1); opacity: 1; }
  .mt-row.in .mt-photo:hover { transform: rotate(0deg) scale(1.06); z-index: 10; transition-delay: 0s; }
  @media (prefers-reduced-motion: reduce) { .mt-photo { transition: none; } }
</style>
</head>
<body>
<div class="mt-wrap">
  <h1 class="mt-title" id="mtTitle"></h1>
  <div class="mt-row" id="mtRow"></div>
</div>
<script>
  const CONFIG = {
    slides: [{"src":"/samples/sample-1.webp","caption":""},{"src":"/samples/sample-2.webp","caption":""},{"src":"/samples/sample-3.webp","caption":""},{"src":"/samples/sample-4.webp","caption":""},{"src":"/samples/sample-5.webp","caption":""}], // 照片
    title: "这次旅行的照片",   // 标题
    tilt: 12,                  // 最大倾角（度，各张在 ± 之间交错）
    stagger: 100,              // 相邻照片进场延迟（毫秒）
    loop: true,                // 演示循环：全部出现后停一会儿再重放
  };
  const row = document.getElementById('mtRow');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.getElementById('mtTitle').textContent = CONFIG.title;
  const angles = [8, -15, -5, 10, -5, 12, -9, 6];
  CONFIG.slides.forEach((s, i) => {
    const img = document.createElement('img'); img.className = 'mt-photo'; img.src = s.src; img.alt = s.caption || '';
    img.style.setProperty('--angle', (angles[i % angles.length] / 15 * CONFIG.tilt) + 'deg'); img.style.setProperty('--delay', (i * CONFIG.stagger) + 'ms');
    row.appendChild(img);
  });
  let userTook = false, timer = 0;
  row.addEventListener('pointerenter', () => (userTook = true));
  function play() { row.classList.remove('in'); requestAnimationFrame(() => requestAnimationFrame(() => row.classList.add('in'))); }
  play();
  row.addEventListener('click', play);

  /* @mt:thumb-start */
  // 演示：全部弹出后停 2.4s 重放
  if (!reduceMotion && CONFIG.loop) timer = setInterval(() => { if (!document.hidden && !userTook) play(); }, CONFIG.slides.length * CONFIG.stagger + 2800);
  /* @mt:thumb-end */
</script>
</body>
</html>
