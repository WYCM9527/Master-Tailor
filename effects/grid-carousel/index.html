<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网格分页轮播</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-accent: #f9cf00;    /* 强调色：分页圆点 */
    --mt-duration: 0.55s;    /* 翻页过渡时长 */
    --mt-gap: 12px;          /* 格子间距 */
    --mt-rounded: 12px;      /* 格子圆角 */
  }

  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mt-bg);
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  .mt-carousel {
    position: relative;
    width: min(720px, 92vw);
    outline: none;
  }
  .mt-carousel:focus-visible { outline: 2px solid var(--mt-accent); outline-offset: 4px; }

  .mt-viewport {
    overflow: hidden;
    touch-action: pan-y;
    cursor: grab;
  }
  .mt-viewport.dragging { cursor: grabbing; }

  /* 轨道：一「页」= 一个 2×N 的网格，整页横向滑动 */
  .mt-track {
    display: flex;
    transition: transform var(--mt-duration) cubic-bezier(0.33, 1, 0.68, 1);
    will-change: transform;
  }
  .mt-page {
    flex: none;
    width: 100%;
    display: grid;
    grid-template-columns: repeat(var(--mt-cols, 3), 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: var(--mt-gap);
    padding: 2px;
  }
  .mt-cell {
    aspect-ratio: 4 / 3;
    margin: 0;
    position: relative;
    border-radius: var(--mt-rounded);
    overflow: hidden;
    background: linear-gradient(135deg, #1a1c2c, #2a2f4a);
  }
  .mt-cell img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    -webkit-user-drag: none;
    user-select: none;
  }
  .mt-cell .mt-caption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 24px 10px 8px;
    color: #fff;
    font-size: 12.5px;
    font-weight: 600;
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.62));
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .mt-pager { margin-top: 14px; display: flex; justify-content: center; gap: 7px; }
  .mt-pager .dot {
    width: 8px; height: 8px;
    border: none; border-radius: 50%;
    background: rgba(255, 255, 255, 0.35);
    cursor: pointer; padding: 0;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .mt-pager .dot.active { background: var(--mt-accent); transform: scale(1.25); }

  /* 用户开启「减少动态效果」：翻页瞬间到位、不自动翻（JS 同步处理） */
  @media (prefers-reduced-motion: reduce) {
    .mt-track { transition: none; }
  }
</style>
</head>
<body>
<div class="mt-carousel" id="mtRoot"></div>
<script>
  const CONFIG = {
    slides: [{"src":"/samples/sample-1.svg","caption":"格子一"},{"src":"/samples/sample-2.svg","caption":"格子二"},{"src":"/samples/sample-3.svg","caption":"格子三"},{"src":"/samples/sample-4.svg","caption":"格子四"},{"src":"/samples/sample-5.svg","caption":"格子五"},{"src":"/samples/sample-6.svg","caption":"格子六"},{"src":"/samples/sample-7.svg","caption":"格子七"},{"src":"/samples/sample-8.svg","caption":"格子八"}], // 格子列表
    cols: 3,     // 每页列数（2 行 × 列数 = 每页格子数）
    interval: 4, // 自动翻页间隔（秒，0 为不自动翻）
  };

  (function () {
    const root = document.getElementById('mtRoot');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const slides = CONFIG.slides;
    const perPage = CONFIG.cols * 2;
    const pages = Math.max(1, Math.ceil(slides.length / perPage));
    let page = 0;

    root.setAttribute('role', 'region');
    root.setAttribute('aria-roledescription', 'carousel');
    root.setAttribute('aria-label', '网格分页轮播');
    root.setAttribute('tabindex', '0');
    root.style.setProperty('--mt-cols', String(CONFIG.cols));

    const viewport = document.createElement('div');
    viewport.className = 'mt-viewport';
    const track = document.createElement('div');
    track.className = 'mt-track';
    for (let p = 0; p < pages; p++) {
      const grid = document.createElement('div');
      grid.className = 'mt-page';
      grid.setAttribute('role', 'group');
      grid.setAttribute('aria-roledescription', 'slide');
      grid.setAttribute('aria-label', '第 ' + (p + 1) + ' 页，共 ' + pages + ' 页');
      for (const [k, s] of slides.slice(p * perPage, (p + 1) * perPage).entries()) {
        const cell = document.createElement('figure');
        cell.className = 'mt-cell';
        const img = document.createElement('img');
        img.src = s.src;
        img.alt = s.caption || '第 ' + (p * perPage + k + 1) + ' 张图片';
        img.loading = 'lazy';
        cell.appendChild(img);
        if (s.caption) {
          const cap = document.createElement('div');
          cap.className = 'mt-caption';
          cap.textContent = s.caption;
          cell.appendChild(cap);
        }
        grid.appendChild(cell);
      }
      track.appendChild(grid);
    }
    viewport.appendChild(track);
    root.appendChild(viewport);

    function render() {
      track.style.transform = 'translateX(' + (-page * 100) + '%)';
      dots.forEach((d, i) => d.classList.toggle('active', i === page));
    }
    // 到最后一页回卷到第一页（网格分页用回卷比克隆更直观）
    const nextPage = () => { page = (page + 1) % pages; render(); };
    const prevPage = () => { page = (page - 1 + pages) % pages; render(); };

    // 自动翻页：悬停 / 聚焦 / 后台暂停；reduced-motion 不启动
    let timer = null;
    function play() {
      if (timer || CONFIG.interval <= 0 || reduceMotion || pages < 2) return;
      timer = setInterval(nextPage, CONFIG.interval * 1000);
    }
    function pause() { clearInterval(timer); timer = null; }
    root.addEventListener('mouseenter', pause);
    root.addEventListener('mouseleave', play);
    root.addEventListener('focusin', pause);
    root.addEventListener('focusout', play);
    document.addEventListener('visibilitychange', () => (document.hidden ? pause() : play()));
    play();

    // 拖拽 / 触摸（Pointer Events）
    let dragStartX = null, dragDx = 0;
    viewport.addEventListener('pointerdown', (e) => {
      dragStartX = e.clientX; dragDx = 0;
      viewport.classList.add('dragging');
      viewport.setPointerCapture(e.pointerId);
    });
    viewport.addEventListener('pointermove', (e) => {
      if (dragStartX === null) return;
      dragDx = e.clientX - dragStartX;
    });
    viewport.addEventListener('pointerup', () => {
      viewport.classList.remove('dragging');
      if (dragStartX === null) return;
      if (Math.abs(dragDx) > 50) (dragDx < 0 ? nextPage : prevPage)();
      dragStartX = null;
    });
    viewport.addEventListener('pointercancel', () => { viewport.classList.remove('dragging'); dragStartX = null; });

    // 键盘
    root.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { e.preventDefault(); nextPage(); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); prevPage(); }
    });

    // 分页圆点：每页一个
    const pager = document.createElement('div');
    pager.className = 'mt-pager';
    const dots = Array.from({ length: pages }, (_v, i) => {
      const dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'dot';
      dot.setAttribute('aria-label', '翻到第 ' + (i + 1) + ' 页');
      dot.addEventListener('click', () => { page = i; render(); });
      pager.appendChild(dot);
      return dot;
    });
    root.appendChild(pager);
    render();
  })();
</script>
</body>
</html>
