<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>卡片展开转场</title>
    <style>
      :root {
        --mt-bg: #0a0a0f; /* 页面底色 */
        --mt-duration: 0.45s; /* 转场时长 */
        --mt-ease: cubic-bezier(0.2, 0.8, 0.2, 1); /* 缓动曲线 */
        --mt-rounded: 14px; /* 卡片圆角：列表卡与详情大图共用 */
        --mt-accent: #ffffff; /* 强调色：焦点环与返回按钮 */
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--mt-bg);
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #f2f2f7;
      }

      /* ===== 迷你站：列表页 / 详情页互斥显示 ===== */
      .mt-app {
        position: relative;
        width: min(880px, 94vw);
        height: min(560px, 92vh);
        background: #101016;
        border-radius: 18px;
        overflow: clip;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
      }
      .page {
        position: absolute;
        inset: 0;
        overflow: auto;
        background: #101016;
      }
      .page[hidden] {
        display: none;
      }
      h1,
      h2 {
        outline: none;
      }

      /* ---- 列表页 ---- */
      .page-list {
        padding: 24px 28px;
      }
      .page-list h2 {
        margin: 0 0 16px;
        font-size: 21px;
        letter-spacing: 0.01em;
      }
      .card-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
      }
      .card {
        border: none;
        border-radius: var(--mt-rounded);
        padding: 0;
        overflow: clip;
        cursor: pointer;
        background: #1a1b24;
        color: inherit;
        text-align: left;
        font: inherit;
        display: block;
      }
      .card:focus-visible {
        outline: 2px solid var(--mt-accent);
        outline-offset: 2px;
      }
      .card img {
        display: block;
        width: 100%;
        height: 128px;
        object-fit: cover;
        border-radius: var(--mt-rounded);
        -webkit-user-drag: none;
      }
      .card .name {
        display: block;
        padding: 10px 14px 12px;
        font-weight: 600;
        font-size: 15px;
      }

      /* ---- 详情页 ---- */
      .page-detail .hero {
        display: block;
        width: 100%;
        height: 260px;
        object-fit: cover;
        border-radius: var(--mt-rounded);
      }
      .page-detail .body {
        padding: 18px 28px 26px;
      }
      .page-detail h1 {
        margin: 0 0 10px;
        font-size: 26px;
      }
      .page-detail p {
        margin: 0 0 10px;
        line-height: 1.75;
        color: #b9bac6;
        font-size: 14.5px;
      }
      .back {
        position: absolute;
        top: 14px;
        left: 14px;
        z-index: 2;
        border: none;
        border-radius: 999px;
        padding: 8px 16px;
        background: rgba(10, 10, 15, 0.6);
        color: var(--mt-accent);
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      .back:focus-visible {
        outline: 2px solid var(--mt-accent);
      }

      /* ===== 过渡层：共享元素承接 =====
         点击的卡片图与标题临时命名为 hero / title，与详情页大图、大标题同名，
         浏览器自动补间两者的位置与尺寸；页面其余部分交叉淡化。 */
      ::view-transition-group(hero),
      ::view-transition-group(title) {
        animation-duration: var(--mt-duration);
        animation-timing-function: var(--mt-ease);
      }
      /* 宽高比变化时按 cover 裁切，避免快照被拉伸 */
      ::view-transition-old(hero),
      ::view-transition-new(hero) {
        height: 100%;
        width: 100%;
        object-fit: cover;
      }
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: var(--mt-duration);
      }

      /* @mt:fallback 无 API 回退：两页交叉淡化（形变承接不可复刻，保证可用与节奏一致） */
      .page.fx-in,
      .page.fx-out {
        animation-duration: var(--mt-duration);
        animation-timing-function: var(--mt-ease);
        animation-fill-mode: both;
      }
      .page.fx-in {
        z-index: 2;
        animation-name: fx-fade-in;
      }
      .page.fx-out {
        z-index: 1;
        animation-name: fx-fade-out;
      }
      @keyframes fx-fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes fx-fade-out {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }

      /* 用户开启「减少动态效果」：一律瞬间切换（JS 同步跳过转场） */
      @media (prefers-reduced-motion: reduce) {
        ::view-transition-group(*),
        ::view-transition-old(*),
        ::view-transition-new(*) {
          animation: none !important;
        }
        .page.fx-in,
        .page.fx-out {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="mt-app" id="mtApp">
      <section class="page page-list" id="pageList" aria-label="列表页">
        <h2 tabindex="-1">精选专题</h2>
        <div class="card-grid" id="cardGrid"></div>
      </section>

      <section class="page page-detail" id="pageDetail" aria-label="详情页" hidden>
        <button type="button" class="back" id="backBtn">‹ 返回</button>
        <img class="hero" id="detailHero" alt="" />
        <div class="body">
          <h1 id="detailTitle" tabindex="-1">专题标题</h1>
          <p>点击列表里的卡片，图片会原地长大成这张大图；标题也从卡片上的小字一路放大到这里。</p>
          <p>按返回、Esc，或从左缘右滑，整个过程会严格倒放，大图收回原来那张卡的位置。</p>
        </div>
      </section>
    </div>

    <script>
      const CONFIG = {
        slides: [{ src: '/samples/sample-1.webp', caption: '示例标题' }], // 卡片列表（图片 + 标题）
      };

      (function () {
        const html = document.documentElement;
        const app = document.getElementById('mtApp');
        const pageList = document.getElementById('pageList');
        const pageDetail = document.getElementById('pageDetail');
        const detailHero = document.getElementById('detailHero');
        const detailTitle = document.getElementById('detailTitle');
        const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
        let navigating = false; // 转场进行中忽略新的导航
        let activeCard = null; // 记录点开的卡片，返回时把共享元素名挂回它

        // ---- 生成列表卡片 ----
        const grid = document.getElementById('cardGrid');
        const cards = CONFIG.slides.map((s, i) => {
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'card';
          const img = document.createElement('img');
          img.src = s.src;
          img.alt = s.caption || '第 ' + (i + 1) + ' 张';
          const name = document.createElement('span');
          name.className = 'name';
          name.textContent = s.caption || '专题 ' + (i + 1);
          card.append(img, name);
          card.addEventListener('click', () => {
            activeCard = card;
            detailHero.src = s.src;
            detailHero.alt = img.alt;
            detailTitle.textContent = name.textContent;
            go(pageDetail, 'forward');
          });
          grid.appendChild(card);
          return card;
        });

        // ---- 共享元素命名：只在参与转场时挂，避免重名导致转场被跳过 ----
        function nameCard(on) {
          if (!activeCard) return;
          activeCard.querySelector('img').style.viewTransitionName = on ? 'hero' : '';
          activeCard.querySelector('.name').style.viewTransitionName = on ? 'title' : '';
        }
        function nameDetail(on) {
          detailHero.style.viewTransitionName = on ? 'hero' : '';
          detailTitle.style.viewTransitionName = on ? 'title' : '';
        }

        function swap(from, to) {
          from.hidden = true;
          to.hidden = false;
        }
        function focusHeading(to) {
          const heading = to.querySelector('h1, h2');
          if (heading) heading.focus({ preventScroll: true });
        }

        // ---- 方向化转场 ----
        function go(to, direction) {
          const from = to === pageDetail ? pageList : pageDetail;
          if (navigating || !to.hidden) return;

          if (reduceMotion.matches) {
            swap(from, to);
            focusHeading(to);
            return;
          }
          navigating = true;
          html.dataset.vt = direction;

          const cleanup = () => {
            nameCard(false);
            nameDetail(false);
            delete html.dataset.vt;
            navigating = false;
            focusHeading(to);
          };

          if (document.startViewTransition) {
            // 旧快照一侧：离场页里参与承接的元素挂名
            if (direction === 'forward') nameCard(true);
            else nameDetail(true);
            const vt = document.startViewTransition(() => {
              swap(from, to);
              // 新快照一侧：进场页里的承接元素挂名（隐藏页不参与快照，不会重名）
              if (direction === 'forward') {
                nameCard(false);
                nameDetail(true);
              } else {
                nameDetail(false);
                nameCard(true);
              }
            });
            vt.finished.finally(cleanup);
          } else {
            // @mt:fallback：两页短暂同框交叉淡化
            to.hidden = false;
            from.classList.add('fx-out');
            to.classList.add('fx-in');
            const done = () => {
              to.removeEventListener('animationend', done);
              from.hidden = true;
              from.classList.remove('fx-out');
              to.classList.remove('fx-in');
              cleanup();
            };
            to.addEventListener('animationend', done);
          }
        }
        const goBack = () => go(pageList, 'back');

        // ---- 返回途径：按钮 / Esc / Backspace / 左缘右滑 ----
        document.getElementById('backBtn').addEventListener('click', goBack);
        document.addEventListener('keydown', (e) => {
          if (pageDetail.hidden) return;
          if (e.key === 'Escape' || e.key === 'Backspace') {
            e.preventDefault();
            goBack();
          }
        });
        let edgeStartX = null;
        app.addEventListener('pointerdown', (e) => {
          if (pageDetail.hidden) return;
          const rect = app.getBoundingClientRect();
          edgeStartX = e.clientX - rect.left <= 32 ? e.clientX : null;
        });
        app.addEventListener('pointerup', (e) => {
          if (edgeStartX !== null && e.clientX - edgeStartX > 60) goBack();
          edgeStartX = null;
        });
        app.addEventListener('pointercancel', () => (edgeStartX = null));

        /* @mt:thumb-start */
        // 缩略图演示：自动点开→返回往返播放；切后台暂停，reduced-motion 不启动
        if (!reduceMotion.matches) {
          let demoIndex = 0;
          setInterval(() => {
            if (document.hidden || navigating) return;
            if (pageDetail.hidden) {
              cards[demoIndex % cards.length].click();
              demoIndex++;
            } else {
              goBack();
            }
          }, 2400);
        }
        /* @mt:thumb-end */
      })();
    </script>
  </body>
</html>
