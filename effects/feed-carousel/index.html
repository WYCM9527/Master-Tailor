<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>竖向沉浸 Feed</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-accent: #f9cf00;    /* 强调色：侧栏图标点亮 */
    --mt-duration: 0.45s;    /* 翻页时长 */
    --mt-rounded: 16px;      /* 容器圆角 */
  }

  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mt-bg);
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  /* 手机屏一样的竖版容器：一屏一条内容 */
  .mt-feed {
    position: relative;
    height: min(560px, 86vh);
    aspect-ratio: 9 / 16;
    border-radius: var(--mt-rounded);
    overflow: hidden;
    background: #000;
    outline: none;
    touch-action: none;
    cursor: grab;
  }
  .mt-feed.dragging { cursor: grabbing; }
  .mt-feed:focus-visible { outline: 2px solid var(--mt-accent); outline-offset: 4px; }

  .mt-item {
    position: absolute;
    inset: 0;
    transform: translateY(100%);
    transition: transform var(--mt-duration) cubic-bezier(0.25, 0.9, 0.3, 1);
  }
  .mt-item.is-active { transform: none; z-index: 1; }
  .mt-item.is-prev { transform: translateY(-100%); }
  .mt-item img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    -webkit-user-drag: none;
    user-select: none;
  }

  /* 底部信息：@作者 + 文案，像短视频描述区 */
  .mt-info {
    position: absolute;
    left: 14px;
    right: 74px;
    bottom: 16px;
    color: #fff;
    z-index: 2;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
  }
  .mt-info .author { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .mt-info .text { font-size: 13.5px; line-height: 1.5; opacity: 0.95; }

  /* 右侧竖排互动图标（纯装饰，短视频的气质担当） */
  .mt-side {
    position: absolute;
    right: 12px;
    bottom: 20px;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 16px;
    align-items: center;
  }
  .mt-side button {
    width: 44px; height: 44px;
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.14);
    color: #fff;
    font-size: 19px;
    cursor: pointer;
    display: grid;
    place-items: center;
    backdrop-filter: blur(6px);
    transition: background 0.15s ease, color 0.15s ease, transform 0.12s ease;
  }
  .mt-side button:hover { transform: scale(1.1); }
  .mt-side button.lit { background: var(--mt-accent); color: #191400; }

  /* 右侧页码竖条 */
  .mt-rail {
    position: absolute;
    right: 5px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .mt-rail i {
    width: 3px;
    height: 14px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.3);
    transition: background 0.15s ease;
  }
  .mt-rail i.active { background: var(--mt-accent); }

  /* 用户开启「减少动态效果」：翻页瞬间完成（本效果不自动播放） */
  @media (prefers-reduced-motion: reduce) {
    .mt-item { transition: none; }
  }
</style>
</head>
<body>
<div class="mt-feed" id="mtRoot"></div>
<script>
  const CONFIG = {
    slides: [{"src":"/samples/sample-1.webp","caption":"树枝上打盹的小夜枭，别吵醒它"},{"src":"/samples/sample-2.webp","caption":"海边停着一辆退休的老爷车"},{"src":"/samples/sample-3.webp","caption":"日落时分的海滩，人影都被染成金色"},{"src":"/samples/sample-4.webp","caption":"山谷里的第一道光，值得早起"},{"src":"/samples/sample-5.webp","caption":"蓝天下的夹竹桃，开得毫无保留"}], // 内容列表（标题写文案）
    author: "@裁缝大师", // 作者名（每条相同，可改）
  };

  // 短视频 feed 的性格：不自动播放，靠滚轮 / 上下滑动一屏一条
  (function () {
    const root = document.getElementById('mtRoot');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const slides = CONFIG.slides;
    const total = slides.length;
    let index = 0;

    root.setAttribute('role', 'region');
    root.setAttribute('aria-roledescription', 'carousel');
    root.setAttribute('aria-label', '竖向内容流');
    root.setAttribute('tabindex', '0');

    const items = slides.map((s, i) => {
      const el = document.createElement('figure');
      el.className = 'mt-item' + (i === 0 ? ' is-active' : '');
      el.style.margin = '0';
      el.setAttribute('role', 'group');
      el.setAttribute('aria-roledescription', 'slide');
      el.setAttribute('aria-label', '第 ' + (i + 1) + ' 条，共 ' + total + ' 条');
      const img = document.createElement('img');
      img.src = s.src;
      img.alt = s.caption || '第 ' + (i + 1) + ' 条内容';
      img.loading = i === 0 ? 'eager' : 'lazy';
      el.appendChild(img);
      const info = document.createElement('div');
      info.className = 'mt-info';
      const author = document.createElement('div');
      author.className = 'author';
      author.textContent = CONFIG.author;
      const text = document.createElement('div');
      text.className = 'text';
      text.textContent = s.caption || '';
      info.appendChild(author);
      info.appendChild(text);
      el.appendChild(info);
      root.appendChild(el);
      return el;
    });

    // 右侧互动图标（点赞可点亮，纯本地状态）
    const side = document.createElement('div');
    side.className = 'mt-side';
    for (const [icon, label, likable] of [['♥', '点赞', true], ['✉', '评论', false], ['➦', '分享', false]]) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = icon;
      btn.setAttribute('aria-label', label);
      if (likable) btn.addEventListener('click', () => btn.classList.toggle('lit'));
      side.appendChild(btn);
    }
    root.appendChild(side);

    // 右侧页码竖条
    const rail = document.createElement('div');
    rail.className = 'mt-rail';
    rail.setAttribute('aria-hidden', 'true');
    const railDots = slides.map((_s, i) => {
      const dot = document.createElement('i');
      if (i === 0) dot.className = 'active';
      rail.appendChild(dot);
      return dot;
    });
    root.appendChild(rail);

    // 三态类切换（竖向），到头不循环（feed 的习惯：滑不动了）
    function goTo(next, dir) {
      if (next < 0 || next >= total || next === index) return;
      const current = items[index];
      const target = items[next];
      target.style.transition = 'none';
      target.classList.toggle('is-prev', dir < 0);
      void target.offsetWidth;
      target.style.transition = '';
      current.classList.remove('is-active');
      current.classList.toggle('is-prev', dir > 0);
      target.classList.remove('is-prev');
      target.classList.add('is-active');
      index = next;
      railDots.forEach((d, i) => d.classList.toggle('active', i === index));
    }
    const nextItem = () => goTo(index + 1, 1);
    const prevItem = () => goTo(index - 1, -1);

    // 滚轮翻条：节流，一次滚动只翻一条
    let wheelLock = false;
    root.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (wheelLock) return;
      wheelLock = true;
      setTimeout(() => (wheelLock = false), reduceMotion ? 150 : 550);
      if (e.deltaY > 0) nextItem();
      else prevItem();
    }, { passive: false });

    // 上下拖拽（Pointer Events）
    let dragStartY = null, dragDy = 0;
    root.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.mt-side')) return; // 侧栏按钮不当作拖拽
      dragStartY = e.clientY; dragDy = 0;
      root.classList.add('dragging');
      root.setPointerCapture(e.pointerId);
    });
    root.addEventListener('pointermove', (e) => {
      if (dragStartY === null) return;
      dragDy = e.clientY - dragStartY;
    });
    root.addEventListener('pointerup', () => {
      root.classList.remove('dragging');
      if (dragStartY === null) return;
      if (Math.abs(dragDy) > 50) (dragDy < 0 ? nextItem : prevItem)();
      dragStartY = null;
    });
    root.addEventListener('pointercancel', () => { root.classList.remove('dragging'); dragStartY = null; });

    // 键盘：↑ / ↓ 翻条
    root.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') { e.preventDefault(); nextItem(); }
      if (e.key === 'ArrowUp') { e.preventDefault(); prevItem(); }
    });

    /* @mt:thumb-start */
    if (window.__MT_ENV && window.__MT_ENV.thumb && !reduceMotion) {
      // 缩略图演示：自动上下翻条，到头折返（真实使用中不自动播放）
      let dir = 1;
      setInterval(() => {
        if (document.hidden) return;
        if (index >= total - 1) dir = -1;
        if (index <= 0) dir = 1;
        (dir > 0 ? nextItem : prevItem)();
      }, 2000);
    }
    /* @mt:thumb-end */
  })();
</script>
</body>
</html>
