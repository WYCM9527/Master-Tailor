<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>景深残影大字</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;         /* 页面底色 */
    --mt-duration: 1.05s;     /* 切换时长 */
    --mt-perspective: 220px;  /* 透视距离（越小广角拉伸越剧烈） */
    --mt-stageColor: #d8d1a8; /* 舞台底色（中心聚光提亮、四周暗角压暗） */
    --mt-glyphColor: #0c0a08; /* 主字与底部说明颜色 */
  }

  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mt-bg);
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  }

  /* ===== 聚光舞台：中心提亮、边缘暗角，模拟幻灯片棚拍背景 ===== */
  .mt-stage {
    position: relative;
    width: min(940px, 94vw);
    aspect-ratio: 16 / 9;
    max-height: 90vh;
    container-type: size;
    border-radius: 16px;
    overflow: hidden;
    outline: none;
    touch-action: pan-y;
    cursor: grab;
    user-select: none;
    box-shadow: 0 24px 72px rgba(0, 0, 0, 0.42);
    background: radial-gradient(
      ellipse 70% 74% at 50% 45%,
      color-mix(in srgb, var(--mt-stageColor) 86%, #ffffff 14%) 0%,
      var(--mt-stageColor) 34%,
      color-mix(in srgb, var(--mt-stageColor) 56%, #14130f 44%) 72%,
      color-mix(in srgb, var(--mt-stageColor) 32%, #14130f 68%) 100%
    );
  }
  .mt-stage.dragging { cursor: grabbing; }
  .mt-stage:focus-visible {
    outline: 2px solid var(--mt-glyphColor);
    outline-offset: -6px;
  }

  /* ===== 大字轨道层：外层全幅承载高斯模糊（不裁边），内层做广角三维透视翻转 ===== */
  .mt-orbit {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .mt-slot {
    position: absolute;
    inset: 0;
    will-change: filter, opacity;
    transition:
      filter var(--mt-duration) cubic-bezier(0.22, 1, 0.36, 1),
      opacity var(--mt-duration) cubic-bezier(0.22, 1, 0.36, 1);
  }
  .mt-glyph {
    position: absolute;
    left: 50%;
    top: 43.5%;
    font-family: Didot, "Bodoni MT", "Times New Roman", Georgia, "Songti SC", "Noto Serif SC", serif;
    font-weight: 900;
    font-size: clamp(140px, 34vmin, 340px);
    font-size: 52cqh;
    line-height: 0.88;
    letter-spacing: -0.04em;
    color: var(--mt-glyphColor);
    white-space: nowrap;
    will-change: transform;
    filter: drop-shadow(0 16px 28px rgba(0, 0, 0, 0.18));
    transition: transform var(--mt-duration) cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* ===== 底部说明区：小标题 + 两行摘要，随主字同步切换 ===== */
  .mt-captions {
    position: absolute;
    left: 50%;
    bottom: 8.5%;
    transform: translateX(-50%);
    width: min(520px, 78%);
    height: 16cqh;
    z-index: 30;
    pointer-events: none;
  }
  .mt-caption {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    text-align: center;
    color: var(--mt-glyphColor);
    opacity: 0;
    filter: blur(6px);
    transform: translateX(24px);
    transition:
      opacity calc(var(--mt-duration) * 0.8) ease,
      filter calc(var(--mt-duration) * 0.8) ease,
      transform var(--mt-duration) cubic-bezier(0.22, 1, 0.36, 1);
  }
  .mt-caption.is-prev {
    transform: translateX(-24px);
  }
  .mt-caption.is-active {
    opacity: 1;
    filter: blur(0px);
    transform: translateX(0);
  }
  .mt-caption h3 {
    margin: 0 0 0.45em;
    font-size: clamp(13px, 2.2vmin, 19px);
    font-size: 3.1cqh;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .mt-caption p {
    margin: 0;
    font-size: clamp(11px, 1.65vmin, 14px);
    font-size: 2.25cqh;
    line-height: 1.58;
    opacity: 0.82;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ===== 底部极简圆点指示器 ===== */
  .mt-dots {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 2.6%;
    z-index: 35;
    display: flex;
    justify-content: center;
    gap: 8px;
  }
  .mt-dot {
    width: 6px;
    height: 6px;
    padding: 0;
    border: none;
    border-radius: 999px;
    background: var(--mt-glyphColor);
    opacity: 0.24;
    cursor: pointer;
    transition: opacity 0.25s ease, width 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .mt-dot:hover { opacity: 0.55; }
  .mt-dot.is-active {
    width: 20px;
    opacity: 0.78;
  }
  .mt-dot:focus-visible {
    outline: 2px solid var(--mt-glyphColor);
    outline-offset: 2px;
  }

  /* 用户开启「减少动态效果」：关闭补间与自动轮播（JS 同步停表） */
  @media (prefers-reduced-motion: reduce) {
    .mt-slot,
    .mt-glyph,
    .mt-caption,
    .mt-dot {
      transition: none !important;
    }
  }
</style>
</head>
<body>
<div class="mt-stage" id="mtStage" role="region" aria-roledescription="carousel" aria-label="景深残影大字展示" tabindex="0">
  <div class="mt-orbit" id="mtOrbit" aria-hidden="true"></div>
  <div class="mt-captions" id="mtCaptions" aria-live="polite"></div>
  <div class="mt-dots" id="mtDots"></div>
</div>
<script>
  const CONFIG = {
    items: "S=Strengths=核心引擎自研、交互响应丝滑，设计语言高度克制且辨识度鲜明。｜W=Weaknesses=早期生态插件尚少，重度三维场景在低功耗设备上的帧率仍需打磨。｜O=Opportunities=AI 辅助生成降低创作门槛，轻量化网页动效正在替代传统演示文稿。｜T=Threats=同质化模板快速涌入市场，跨端浏览器的渲染差异带来持续维护成本。", // 条目列表（大字=标题=说明，用｜分隔）
    interval: 2.8,   // 自动轮换间隔（秒，0 为不自动轮换）
    tiltAngle: 110,  // 后方大字绕竖轴侧翻角度（度）
    pitchAngle: 20,  // 后方大字上下俯仰倾角（度）
    blurAmount: 16,  // 两侧偏轴残影的基准模糊半径（px）
  };

  (function () {
    const stage = document.getElementById('mtStage');
    const orbitEl = document.getElementById('mtOrbit');
    const captionsEl = document.getElementById('mtCaptions');
    const dotsEl = document.getElementById('mtDots');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    // 自动轮换时不让读屏软件每一轮都播报，手动切换时才播报
    captionsEl.setAttribute('aria-live', CONFIG.interval > 0 && !reduceMotion ? 'off' : 'polite');

    // 解析条目；至少保留 2 项以形成前后景深对比
    const parsed = CONFIG.items
      .split('｜')
      .map((raw) => raw.trim())
      .filter(Boolean)
      .map((entry) => {
        const parts = entry.split('=');
        const glyph = (parts[0] || '').trim() || 'S';
        const title = (parts[1] || glyph).trim();
        const desc = parts.slice(2).join('=').trim();
        return { glyph, title, desc };
      });
    if (parsed.length === 0) {
      parsed.push({ glyph: 'S', title: 'Strengths', desc: '' });
    }
    if (parsed.length === 1) {
      parsed.push({ ...parsed[0] });
    }

    const total = parsed.length;
    // 累加式游标（不取模）：保证圆周旋转角度单调递增/递减，首尾循环零跳变
    let cursor = 0;
    let stageW = stage.clientWidth || 800;
    let stageH = stage.clientHeight || 450;

    const slots = [];
    const captions = [];
    const dots = [];

    parsed.forEach((item, i) => {
      const slot = document.createElement('div');
      slot.className = 'mt-slot';
      const glyph = document.createElement('div');
      glyph.className = 'mt-glyph';
      glyph.textContent = item.glyph;
      slot.appendChild(glyph);
      orbitEl.appendChild(slot);
      slots.push({ slot, glyph });

      const cap = document.createElement('article');
      cap.className = 'mt-caption';
      cap.setAttribute('aria-label', '第 ' + (i + 1) + ' 项：' + item.title);
      const h3 = document.createElement('h3');
      h3.textContent = item.title;
      const p = document.createElement('p');
      p.textContent = item.desc;
      cap.appendChild(h3);
      if (item.desc) cap.appendChild(p);
      captionsEl.appendChild(cap);
      captions.push(cap);

      const dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'mt-dot';
      dot.setAttribute('aria-label', '切换到 ' + item.title);
      dot.addEventListener('click', (e) => {
        e.stopPropagation();
        jumpTo(i);
      });
      dotsEl.appendChild(dot);
      dots.push(dot);
    });

    function activeIndex() {
      return ((cursor % total) + total) % total;
    }

    /**
     * 按连续相位 u = (i - cursor) / total 计算每个大字的三维姿态与景深虚化：
     * - u 为整数（正前方焦点）：rotY = 360°·k、rotX = 0°、blur = 0、opacity = 1
     * - u 偏移 ±1/4 周（左右侧后方）：rotY = ±tiltAngle（默认 110° 翻过侧面至斜后方）、
     *   rotX = ±pitchAngle（默认 20° 俯仰错落），横向偏心拉开约 17.5% 舞台宽，模拟偏轴环绕
     * - u 偏移 1/2 周（正后方远景）：rotY = 180°、最大模糊半径，垫在主字背后形成柔和暗晕
     */
    function render(lastDir) {
      const act = activeIndex();
      const spreadX = stageW * 0.175;
      const liftY = stageH * 0.022;

      for (let i = 0; i < total; i++) {
        const u = (i - cursor) / total;
        const phi = u * Math.PI * 2;
        const sinP = Math.sin(phi);
        const cosP = Math.cos(phi);
        // depth: 0 = 正前焦点，0.5 = 两侧偏轴残影，1 = 正后远景暗晕
        const depth = (1 - cosP) * 0.5;
        const sideWeight = sinP * sinP;
        const isFront = depth < 0.001;

        const rotY = 360 * u + (CONFIG.tiltAngle - 90) * sinP;
        const rotX = sinP * CONFIG.pitchAngle;
        const tx = sinP * spreadX;
        const ty = -depth * liftY;
        const scale = isFront ? 1 : 1.12 + sideWeight * 0.14;

        // 两侧残影侧翻后变窄，需保留约 0.88 的不透明度，模糊后才不被稀释；正后方压到 0.2 只作柔光底晕
        const blurPx = isFront ? 0 : CONFIG.blurAmount * (0.85 + depth * 0.55);
        const opacity = isFront ? 1 : 0.2 + sideWeight * 0.62 + (1 - depth) * 0.12;
        const zIndex = Math.round((1 - depth) * 20);

        const { slot, glyph } = slots[i];
        slot.style.zIndex = String(zIndex);
        slot.style.opacity = opacity.toFixed(3);
        slot.style.filter = isFront ? 'blur(0px)' : 'blur(' + blurPx.toFixed(1) + 'px)';

        glyph.style.transform =
          'translate(-50%, -50%) ' +
          'translate3d(' + tx.toFixed(1) + 'px, ' + ty.toFixed(1) + 'px, 0px) ' +
          'perspective(var(--mt-perspective)) ' +
          'rotateY(' + rotY.toFixed(2) + 'deg) ' +
          'rotateX(' + rotX.toFixed(2) + 'deg) ' +
          'scale(' + scale.toFixed(3) + ')';

        const isAct = i === act;
        captions[i].classList.toggle('is-active', isAct);
        captions[i].setAttribute('aria-hidden', isAct ? 'false' : 'true');
        if (!isAct) {
          // 让即将进场的一侧排在运动正方向，离场的一侧滑向反方向
          const onPrevSide = sinP < -0.01 || (Math.abs(sinP) <= 0.01 && lastDir > 0);
          captions[i].classList.toggle('is-prev', onPrevSide);
        } else {
          captions[i].classList.remove('is-prev');
        }
        dots[i].classList.toggle('is-active', isAct);
      }
    }

    function step(dir) {
      cursor += dir;
      render(dir);
    }

    function jumpTo(targetIdx) {
      const cur = activeIndex();
      if (targetIdx === cur) return;
      let delta = targetIdx - cur;
      if (delta > total / 2) delta -= total;
      if (delta < -total / 2) delta += total;
      cursor += delta;
      render(delta > 0 ? 1 : -1);
    }

    // 监听尺寸变化并缓存宽高，避免切换时读取布局属性
    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver((entries) => {
        const box = entries[0] && entries[0].contentRect;
        if (!box || (!box.width && !box.height)) return;
        stageW = box.width;
        stageH = box.height;
        render(1);
      }).observe(stage);
    }

    // 自动轮换：悬停 / 聚焦 / 切后台暂停；reduced-motion 下不启动
    let timer = null;
    function play() {
      if (timer || CONFIG.interval <= 0 || reduceMotion || total < 2) return;
      timer = setInterval(() => {
        if (!document.hidden) step(1);
      }, CONFIG.interval * 1000);
    }
    function pause() {
      if (!timer) return;
      clearInterval(timer);
      timer = null;
    }
    stage.addEventListener('mouseenter', pause);
    stage.addEventListener('mouseleave', play);
    stage.addEventListener('focusin', pause);
    stage.addEventListener('focusout', play);
    document.addEventListener('visibilitychange', () => (document.hidden ? pause() : play()));

    // 拖拽滑动与左右半区点击切换（Pointer Events 统一）
    let startX = null;
    let dx = 0;
    stage.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button')) return;
      startX = e.clientX;
      dx = 0;
      stage.classList.add('dragging');
      stage.setPointerCapture(e.pointerId);
    });
    stage.addEventListener('pointermove', (e) => {
      if (startX === null) return;
      dx = e.clientX - startX;
    });
    stage.addEventListener('pointerup', (e) => {
      stage.classList.remove('dragging');
      if (startX === null) return;
      if (Math.abs(dx) > 42) {
        step(dx < 0 ? 1 : -1);
      } else if (Math.abs(dx) < 8) {
        const rect = stage.getBoundingClientRect();
        step(e.clientX - rect.left < rect.width * 0.5 ? -1 : 1);
      }
      startX = null;
    });
    stage.addEventListener('pointercancel', () => {
      stage.classList.remove('dragging');
      startX = null;
    });

    // 键盘左右方向键切换
    stage.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        step(1);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        step(-1);
      }
    });

    render(1);
    play();
  })();
</script>
</body>
</html>
