<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>像素抖动场</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色（像素以外透出它） */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; cursor: crosshair; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* 用户开启「减少动态效果」时：云团本身极慢（0.05 倍时间），不做额外处理 */
</style>
</head>
<body>
<canvas id="mtCanvas" aria-hidden="true"></canvas>
<script>
  const CONFIG = {
    variant: "square",       // 像素形状：square / circle / triangle / diamond
    color: "#b19eef",        // 颜色
    pixelSize: 3,            // 像素大小（px）
    patternScale: 2,         // 云团尺度
    patternDensity: 1,       // 密度
    speed: 0.5,              // 翻涌速度
    enableRipples: true,     // 点击涟漪
    rippleThickness: 0.1,    // 涟漪厚度
    rippleSpeed: 0.3,        // 涟漪速度
    edgeFade: 0.5,           // 边缘渐隐
  };
  const MAX_CLICKS = 10, RIPPLE_INTENSITY = 1, PIXEL_JITTER = 0;

  const canvas = document.getElementById('mtCanvas');
  const gl = canvas.getContext('webgl2', { antialias: false, alpha: true, premultipliedAlpha: false });
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const VS = `#version 300 es
    in vec2 aPos;
    void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
  `;
  // 片元：以 8 像素为一「格」采样一团 3D 值噪声 fbm 得到密度 feed（点击涟漪抬高附近密度），
  // 再用 8×8 Bayer 有序抖动把密度二值化成一颗颗像素；像素可画成方 / 圆 / 三角 / 菱形；四边渐隐
  const FS = `#version 300 es
    precision highp float;
    out vec4 fragColor;
    uniform vec2  uRes;
    uniform float uTime, uPixelSize, uScale, uDensity, uPixelJitter, uRippleSpeed, uRippleThick, uRippleK, uEdgeFade;
    uniform int   uShape, uRipples;
    uniform vec3  uColor;
    uniform vec2  uClickPos[${MAX_CLICKS}];
    uniform float uClickTimes[${MAX_CLICKS}];

    float Bayer2(vec2 a) { a = floor(a); return fract(a.x / 2.0 + a.y * a.y * 0.75); }
    #define Bayer4(a) (Bayer2(0.5 * (a)) * 0.25 + Bayer2(a))
    #define Bayer8(a) (Bayer4(0.5 * (a)) * 0.25 + Bayer2(a))
    float hash11(float n) { return fract(sin(n) * 43758.5453); }
    // 三维值噪声（五次平滑）
    float vnoise(vec3 p) {
      vec3 ip = floor(p), fp = fract(p);
      const vec3 K = vec3(1.0, 57.0, 113.0);
      float n000 = hash11(dot(ip, K)), n100 = hash11(dot(ip + vec3(1, 0, 0), K)), n010 = hash11(dot(ip + vec3(0, 1, 0), K)), n110 = hash11(dot(ip + vec3(1, 1, 0), K));
      float n001 = hash11(dot(ip + vec3(0, 0, 1), K)), n101 = hash11(dot(ip + vec3(1, 0, 1), K)), n011 = hash11(dot(ip + vec3(0, 1, 1), K)), n111 = hash11(dot(ip + vec3(1, 1, 1), K));
      vec3 w = fp * fp * fp * (fp * (fp * 6.0 - 15.0) + 10.0);
      float y0 = mix(mix(n000, n100, w.x), mix(n010, n110, w.x), w.y), y1 = mix(mix(n001, n101, w.x), mix(n011, n111, w.x), w.y);
      return mix(y0, y1, w.z) * 2.0 - 1.0;
    }
    float fbm2(vec2 uv, float t) {
      vec3 p = vec3(uv * uScale, t);
      float amp = 1.0, freq = 1.0, sum = 1.0;
      for (int i = 0; i < 5; ++i) { sum += amp * vnoise(p * freq); freq *= 1.25; }
      return sum * 0.5 + 0.5;
    }
    float maskCircle(vec2 p, float cov) { float r = sqrt(cov) * 0.25, d = length(p - 0.5) - r, aa = 0.5 * fwidth(d); return cov * (1.0 - smoothstep(-aa, aa, d * 2.0)); }
    float maskTriangle(vec2 p, vec2 id, float cov) { if (mod(id.x + id.y, 2.0) > 0.5) p.x = 1.0 - p.x; float d = p.y - sqrt(cov) * (1.0 - p.x), aa = fwidth(d); return cov * clamp(0.5 - d / aa, 0.0, 1.0); }
    float maskDiamond(vec2 p, float cov) { return step(abs(p.x - 0.49) + abs(p.y - 0.49), sqrt(cov) * 0.564); }

    void main() {
      vec2 frag = gl_FragCoord.xy - uRes * 0.5;
      float aspect = uRes.x / uRes.y;
      vec2 pixelId = floor(frag / uPixelSize), pixelUV = fract(frag / uPixelSize);
      float cell = 8.0 * uPixelSize;
      vec2 uv = floor(frag / cell) * cell / uRes * vec2(aspect, 1.0);
      float feed = (fbm2(uv, uTime * 0.05) * 0.5 - 0.65) + (uDensity - 0.5) * 0.3;
      // 点击涟漪：以点击点为中心、随时间扩大的高斯环，随时间与距离衰减
      if (uRipples == 1) {
        for (int i = 0; i < ${MAX_CLICKS}; ++i) {
          vec2 pos = uClickPos[i];
          if (pos.x < 0.0) continue;
          vec2 cuv = ((pos - uRes * 0.5 - cell * 0.5) / uRes) * vec2(aspect, 1.0);
          float t = max(uTime - uClickTimes[i], 0.0), r = distance(uv, cuv);
          float ring = exp(-pow((r - uRippleSpeed * t) / uRippleThick, 2.0));
          feed = max(feed, ring * exp(-t) * exp(-10.0 * r) * uRippleK);
        }
      }
      // 有序抖动二值化
      float bw = step(0.5, feed + Bayer8(frag / uPixelSize) - 0.5);
      float h = fract(sin(dot(pixelId, vec2(127.1, 311.7))) * 43758.5453);
      float cov = bw * (1.0 + (h - 0.5) * uPixelJitter);
      float M = uShape == 1 ? maskCircle(pixelUV, cov) : uShape == 2 ? maskTriangle(pixelUV, pixelId, cov) : uShape == 3 ? maskDiamond(pixelUV, cov) : cov;
      if (uEdgeFade > 0.0) {
        vec2 n = gl_FragCoord.xy / uRes;
        M *= smoothstep(0.0, uEdgeFade, min(min(n.x, n.y), min(1.0 - n.x, 1.0 - n.y)));
      }
      fragColor = vec4(uColor, M);
    }
  `;

  // ---- WebGL 底座 ----
  function compile(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  const U = (n) => gl.getUniformLocation(prog, n);
  const hexRgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);

  const dpr = Math.min(2, devicePixelRatio || 1);
  function resize() {
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(U('uRes'), canvas.width, canvas.height);
  }
  resize(); addEventListener('resize', resize);
  gl.uniform1f(U('uPixelSize'), CONFIG.pixelSize * dpr);
  gl.uniform1f(U('uScale'), CONFIG.patternScale);
  gl.uniform1f(U('uDensity'), CONFIG.patternDensity);
  gl.uniform1f(U('uPixelJitter'), PIXEL_JITTER);
  gl.uniform1f(U('uRippleSpeed'), CONFIG.rippleSpeed);
  gl.uniform1f(U('uRippleThick'), CONFIG.rippleThickness);
  gl.uniform1f(U('uRippleK'), RIPPLE_INTENSITY);
  gl.uniform1f(U('uEdgeFade'), CONFIG.edgeFade);
  gl.uniform1i(U('uShape'), { square: 0, circle: 1, triangle: 2, diamond: 3 }[CONFIG.variant] ?? 0);
  gl.uniform1i(U('uRipples'), CONFIG.enableRipples ? 1 : 0);
  gl.uniform3fv(U('uColor'), hexRgb(CONFIG.color));
  const uTime = U('uTime'), uClickPos = U('uClickPos'), uClickTimes = U('uClickTimes');

  // 点击环形缓冲：位置（像素，y 向上）与时刻
  const clickPos = new Float32Array(MAX_CLICKS * 2).fill(-1), clickTimes = new Float32Array(MAX_CLICKS);
  let clickIx = 0, time = 5, userTook = false;
  function ripple(x, y) {
    clickPos[clickIx * 2] = x * dpr; clickPos[clickIx * 2 + 1] = (innerHeight - y) * dpr;
    clickTimes[clickIx] = time;
    clickIx = (clickIx + 1) % MAX_CLICKS;
  }
  addEventListener('pointerdown', (e) => { userTook = true; ripple(e.clientX, e.clientY); });

  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    if (document.hidden) { last = now; return; }
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    time += dt * CONFIG.speed;   // 云团用 0.05×time 翻涌，涟漪用 time 计时（减少动态时云团本就极慢）
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(uTime, time);
    gl.uniform2fv(uClickPos, clickPos);
    gl.uniform1fv(uClickTimes, clickTimes);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  gl.clearColor(0, 0, 0, 0);
  requestAnimationFrame(frame);

  /* @mt:thumb-start */
  // 缩略图演示：每 2.5s 在随机位置点一下；用户点过后交还
  if (CONFIG.enableRipples && !reduceMotion) {
    setInterval(() => { if (document.hidden || userTook) return; ripple(innerWidth * (0.25 + Math.random() * 0.5), innerHeight * (0.25 + Math.random() * 0.5)); }, 2500);
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
