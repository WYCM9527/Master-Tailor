<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>棱镜爆发</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #000000;        /* 页面底色（canvas 覆盖前的兜底色） */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* 用户开启「减少动态效果」时：JS 停止时间推进，光线定格 */
</style>
</head>
<body>
<canvas id="mtCanvas" aria-hidden="true"></canvas>
<script>
  const CONFIG = {
    intensity: 2,               // 亮度
    speed: 0.5,                 // 速度
    animationType: "rotate3d",  // 运动方式：rotate3d / rotate / hover
    distort: 0,                 // 扭曲
    rayCount: 0,                // 光束分组
    customColors: false,        // 使用自定义颜色
    colors: ["#ff007a", "#4d3dff", "#ffffff"], // 自定义颜色
    hoverDampness: 0,           // 鼠标跟随阻尼
  };
  const RENDER_SCALE = 0.7;     // 渲染分辨率折扣（44 步光线步进较重）
  const NOISE_AMOUNT = 0;       // 步长抖动噪声

  const canvas = document.getElementById('mtCanvas');
  const gl = canvas.getContext('webgl2', { antialias: false });
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const VS = `#version 300 es
    in vec2 aPos;
    void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
  `;
  // 片元：从镜头沿视线步进 44 步，每步把采样点投影到半径 10 的球面并旋转（三种运动方式之一），
  // 用一个三角函数干涉图案决定「这里有没有光线」，颜色沿步进距离走一遍光谱（或自定义色表），
  // 靠近镜头的步贡献更亮；最后乘边缘渐暗与亮度
  const FS = `#version 300 es
    precision highp float;
    out vec4 fragColor;
    uniform vec2  uRes, uMouse;
    uniform float uTime, uIntensity, uSpeed, uDistort, uNoise;
    uniform int   uAnim, uRayCount, uColorCount;
    uniform vec3  uColors[8];

    float hash21(vec2 p) { p = floor(p); return fract(52.9829189 * fract(dot(p, vec2(0.065, 0.005)))); }
    mat2 rot30() { return mat2(0.8, -0.5, 0.5, 0.8); }
    // 五层分块噪声（做步长抖动与边缘颗粒）
    float layeredNoise(vec2 px) {
      vec2 p = mod(px + vec2(uTime * 30.0, -uTime * 21.0), 1024.0);
      vec2 q = rot30() * p;
      return 0.40 * hash21(q) + 0.25 * hash21(q * 2.0 + 17.0) + 0.20 * hash21(q * 4.0 + 47.0) + 0.10 * hash21(q * 8.0 + 113.0) + 0.05 * hash21(q * 16.0 + 191.0);
    }
    // 边缘渐暗：五次平滑 + 幂 + 轻微噪声
    float edgeFade(vec2 frag) {
      vec2 toC = frag - 0.5 * uRes;
      float x = clamp(length(toC) / (0.5 * min(uRes.x, uRes.y)), 0.0, 1.0);
      float q = x * x * x * (x * (x * 6.0 - 15.0) + 10.0);
      float s = pow(q * 0.5, 1.5);
      float tail = 1.0 - pow(1.0 - s, 2.0);
      s = mix(s, tail, 0.2);
      return clamp(s + (layeredNoise(frag * 0.15) - 0.5) * 0.0015 * s, 0.0, 1.0);
    }
    mat3 rotX(float a) { float c = cos(a), s = sin(a); return mat3(1, 0, 0, 0, c, -s, 0, s, c); }
    mat3 rotY(float a) { float c = cos(a), s = sin(a); return mat3(c, 0, s, 0, 1, 0, -s, 0, c); }
    mat3 rotZ(float a) { float c = cos(a), s = sin(a); return mat3(c, -s, 0, s, c, 0, 0, 0, 1); }
    vec2 rot2(vec2 v, float a) { float s = sin(a), c = cos(a); return mat2(c, -s, s, c) * v; }
    // 自定义色表：线性插值
    vec3 gradient(float t) {
      float x = clamp(t, 0.0, 1.0) * float(uColorCount - 1);
      int i = int(floor(x));
      int j = min(i + 1, uColorCount - 1);
      return mix(uColors[i], uColors[j], fract(x));
    }
    float bendAngle(vec3 q, float t) { return 0.8 * sin(q.x * 0.55 + t * 0.6) + 0.7 * sin(q.y * 0.50 - t * 0.5) + 0.6 * sin(q.z * 0.60 + t * 0.7); }

    void main() {
      vec2 frag = gl_FragCoord.xy;
      float t = uTime * uSpeed;
      float jitter = 0.1 * clamp(uNoise, 0.0, 1.0);
      vec3 dir = normalize(vec3(2.0 * frag - uRes, uRes.y));   // 视线
      float marchT = 0.0;
      vec3 col = vec3(0.0);
      float n = layeredNoise(frag);
      vec4 c = cos(t * 0.2 + vec4(0.0, 33.0, 11.0, 0.0));
      mat2 M2 = mat2(c.x, c.y, c.z, c.w);
      float amp = clamp(uDistort, 0.0, 50.0) * 0.15;
      mat3 rot3 = mat3(1.0), hoverM = mat3(1.0);
      if (uAnim == 1) rot3 = rotZ(t * 0.17) * rotY(t * 0.21) * rotX(t * 0.31);
      if (uAnim == 2) { vec2 m = uMouse * 2.0 - 1.0; hoverM = rotY(m.x * 0.6) * rotX(m.y * 0.6); }

      for (int i = 0; i < 44; ++i) {
        vec3 P = marchT * dir;
        P.z -= 2.0;
        float rad = length(P);
        vec3 Pl = P * (10.0 / max(rad, 1e-6));           // 投到球面
        if (uAnim == 0) Pl.xz *= M2; else if (uAnim == 1) Pl = rot3 * Pl; else Pl = hoverM * Pl;
        float stepLen = min(rad - 0.3, n * jitter) + 0.1;
        // 可选扭曲：随步进距离增长的两次弯折
        float grow = smoothstep(0.35, 3.0, marchT);
        float a1 = amp * grow * bendAngle(Pl * 0.6, t);
        float a2 = 0.5 * amp * grow * bendAngle(Pl.zyx * 0.5 + 3.1, t * 0.9);
        vec3 Pb = Pl;
        Pb.xz = rot2(Pb.xz, a1);
        Pb.xy = rot2(Pb.xy, a2);
        // 光线图案：两组正弦干涉的乘积
        float ray = smoothstep(0.5, 0.7, sin(Pb.x + cos(Pb.y) * cos(Pb.z)) * sin(Pb.z + sin(Pb.y) * cos(Pb.x + t)));
        if (uRayCount > 0) {
          float ang = atan(Pb.y, Pb.x);
          float comb = pow(0.5 + 0.5 * cos(float(uRayCount) * ang), 3.0);
          ray *= smoothstep(0.15, 0.95, comb);
        }
        // 颜色：沿步进距离走光谱，或按锯齿走自定义色表
        vec3 spectral = 1.0 + vec3(cos(marchT * 3.0), cos(marchT * 3.0 + 1.0), cos(marchT * 3.0 + 2.0));
        float saw = fract(marchT * 0.25);
        float tRay = saw * saw * (3.0 - 2.0 * saw);
        vec3 tint = uColorCount > 0 ? 2.0 * gradient(tRay) : spectral;
        col += (0.05 / (0.4 + stepLen)) * smoothstep(5.0, 0.0, rad) * tint * ray;
        marchT += stepLen;
      }
      col *= edgeFade(frag) * uIntensity;
      fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
    }
  `;

  // ---- WebGL 底座 ----
  function compile(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  const U = (n) => gl.getUniformLocation(prog, n);
  const hexRgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);

  const dpr = Math.min(2, devicePixelRatio || 1) * RENDER_SCALE;
  function resize() {
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(U('uRes'), canvas.width, canvas.height);
  }
  resize(); addEventListener('resize', resize);
  gl.uniform1f(U('uIntensity'), CONFIG.intensity);
  gl.uniform1f(U('uSpeed'), CONFIG.speed);
  gl.uniform1f(U('uDistort'), CONFIG.distort);
  gl.uniform1f(U('uNoise'), NOISE_AMOUNT);
  gl.uniform1i(U('uAnim'), { rotate: 0, rotate3d: 1, hover: 2 }[CONFIG.animationType] ?? 1);
  gl.uniform1i(U('uRayCount'), CONFIG.rayCount);
  const stops = CONFIG.customColors ? CONFIG.colors.slice(0, 8) : [];
  const arr = new Float32Array(24);
  stops.forEach((c, i) => arr.set(hexRgb(c), i * 3));
  gl.uniform3fv(U('uColors'), arr);
  gl.uniform1i(U('uColorCount'), stops.length);
  const uTime = U('uTime'), uMouse = U('uMouse');

  // 鼠标 0–1（y 向上），时间常数 0.02–0.52s 随阻尼参数
  const target = { x: 0.5, y: 0.5 }, mouse = { x: 0.5, y: 0.5 };
  addEventListener('pointermove', (e) => { target.x = e.clientX / innerWidth; target.y = 1 - e.clientY / innerHeight; });

  let time = reduceMotion ? 4 : 0, last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    if (document.hidden) { last = now; return; }
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!reduceMotion) time += dt;
    const tau = 0.02 + Math.max(0, Math.min(1, CONFIG.hoverDampness)) * 0.5;
    const k = reduceMotion ? 1 : 1 - Math.exp(-dt / tau);
    mouse.x += (target.x - mouse.x) * k; mouse.y += (target.y - mouse.y) * k;
    gl.uniform1f(uTime, time);
    gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
