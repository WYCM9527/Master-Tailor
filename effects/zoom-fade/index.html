<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>缩放淡入转场</title>
    <style>
      :root {
        --mt-bg: #0a0a0f; /* 页面底色 */
        --mt-duration: 0.3s; /* 转场时长 */
        --mt-zoomFrom: 0.92; /* 新页起始缩放（放大到 1 登场） */
        --mt-zoomOut: 1.04; /* 旧页退场缩放（放大淡出，镜头前推感） */
        --mt-blur: 0; /* 进出场模糊开关（1 开 / 0 关） */
        --mt-accent: #ffffff; /* 强调色：焦点环与关闭按钮 */
        --zoom-ease: cubic-bezier(0.2, 0.9, 0.3, 1); /* 缩放专用缓动：快起慢收 */
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--mt-bg);
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #f2f2f7;
      }

      .mt-app {
        position: relative;
        width: min(880px, 94vw);
        height: min(560px, 92vh);
        background: #101016;
        border-radius: 18px;
        overflow: clip;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
      }
      .page {
        position: absolute;
        inset: 0;
        overflow: auto;
        background: #101016;
      }
      .page[hidden] {
        display: none;
      }
      h1,
      h2 {
        outline: none;
      }

      /* ---- 启动台页 ---- */
      .page-launcher {
        display: grid;
        place-content: center;
        gap: 26px 34px;
        grid-template-columns: repeat(3, auto);
      }
      .app-icon {
        border: none;
        background: none;
        color: inherit;
        font: inherit;
        cursor: pointer;
        display: grid;
        justify-items: center;
        gap: 8px;
        padding: 6px;
        border-radius: 12px;
      }
      .app-icon:focus-visible {
        outline: 2px solid var(--mt-accent);
      }
      .app-icon .tile {
        width: 74px;
        height: 74px;
        border-radius: 18px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
      }
      .app-icon .label {
        font-size: 13px;
        color: #d5d6e0;
      }

      /* ---- 应用窗口页 ---- */
      .page-window {
        display: grid;
        place-items: center;
        background: rgba(10, 10, 15, 0.55);
      }
      .window {
        width: min(560px, 84%);
        border-radius: 14px;
        overflow: clip;
        background: #1a1b24;
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.55);
      }
      .titlebar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        background: #22232e;
      }
      .titlebar .close {
        width: 14px;
        height: 14px;
        border: none;
        border-radius: 50%;
        background: #ff5f57;
        cursor: pointer;
        padding: 0;
      }
      .titlebar .close:focus-visible {
        outline: 2px solid var(--mt-accent);
        outline-offset: 2px;
      }
      .titlebar h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }
      .window .content {
        padding: 20px 22px 26px;
      }
      .window .content p {
        margin: 0 0 10px;
        line-height: 1.7;
        color: #b9bac6;
        font-size: 14px;
      }

      /* ===== 过渡层：缩放淡入 =====
         前进：新页从中心缩放淡入，旧页放大淡出（镜头前推）；返回严格反向。 */
      ::view-transition-old(page),
      ::view-transition-new(page) {
        animation-duration: var(--mt-duration);
        animation-timing-function: var(--zoom-ease);
        animation-fill-mode: both;
      }
      html[data-vt='forward']::view-transition-new(page) {
        animation-name: zoom-in;
      }
      html[data-vt='forward']::view-transition-old(page) {
        animation-name: zoom-away;
      }
      html[data-vt='back']::view-transition-new(page) {
        animation-name: zoom-return;
      }
      html[data-vt='back']::view-transition-old(page) {
        animation-name: zoom-back-out;
      }

      @keyframes zoom-in {
        from {
          transform: scale(var(--mt-zoomFrom));
          opacity: 0;
          filter: blur(calc(var(--mt-blur) * 10px));
        }
        to {
          transform: none;
          opacity: 1;
          filter: blur(0);
        }
      }
      @keyframes zoom-away {
        from {
          transform: none;
          opacity: 1;
          filter: blur(0);
        }
        to {
          transform: scale(var(--mt-zoomOut));
          opacity: 0;
          filter: blur(calc(var(--mt-blur) * 10px));
        }
      }
      @keyframes zoom-return {
        from {
          transform: scale(var(--mt-zoomOut));
          opacity: 0;
          filter: blur(calc(var(--mt-blur) * 10px));
        }
        to {
          transform: none;
          opacity: 1;
          filter: blur(0);
        }
      }
      @keyframes zoom-back-out {
        from {
          transform: none;
          opacity: 1;
          filter: blur(0);
        }
        to {
          transform: scale(var(--mt-zoomFrom));
          opacity: 0;
          filter: blur(calc(var(--mt-blur) * 10px));
        }
      }

      /* @mt:fallback 无 API 回退：同一套 keyframes 直接加在真实页面上，效果一致 */
      .page.fx-in,
      .page.fx-out {
        animation-duration: var(--mt-duration);
        animation-timing-function: var(--zoom-ease);
        animation-fill-mode: both;
      }
      .page.fx-in {
        z-index: 2;
      }
      .page.fx-out {
        z-index: 1;
      }
      html[data-vt='forward'] .page.fx-in {
        animation-name: zoom-in;
      }
      html[data-vt='forward'] .page.fx-out {
        animation-name: zoom-away;
      }
      html[data-vt='back'] .page.fx-in {
        animation-name: zoom-return;
      }
      html[data-vt='back'] .page.fx-out {
        animation-name: zoom-back-out;
      }

      /* 用户开启「减少动态效果」：一律瞬间切换（JS 同步跳过转场） */
      @media (prefers-reduced-motion: reduce) {
        ::view-transition-group(*),
        ::view-transition-old(*),
        ::view-transition-new(*) {
          animation: none !important;
        }
        .page.fx-in,
        .page.fx-out {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="mt-app" id="mtApp">
      <section class="page page-launcher" id="pageLauncher" aria-label="启动台"></section>

      <section class="page page-window" id="pageWindow" aria-label="应用窗口" hidden>
        <div class="window">
          <div class="titlebar">
            <button type="button" class="close" id="closeBtn" aria-label="关闭窗口"></button>
            <h1 id="windowTitle" tabindex="-1">应用</h1>
          </div>
          <div class="content">
            <p>窗口从屏幕中央轻轻放大浮现，启动台同时放大退到虚处——像镜头往前推了一步。</p>
            <p>点左上角红点、按 Esc 或 Backspace 关闭，整个过程严格倒放。</p>
          </div>
        </div>
      </section>
    </div>

    <script>
      const CONFIG = {
        apps: ['音乐', '邮件', '照片', '地图', '备忘录', '天气'], // 启动台应用名
      };

      (function () {
        const html = document.documentElement;
        const pageLauncher = document.getElementById('pageLauncher');
        const pageWindow = document.getElementById('pageWindow');
        const windowTitle = document.getElementById('windowTitle');
        const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
        let navigating = false; // 转场进行中忽略新的导航

        // ---- 生成启动台图标（色相均匀分布的渐变方块） ----
        const icons = CONFIG.apps.map((name, i) => {
          const hue = (i * 47 + 210) % 360;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'app-icon';
          const tile = document.createElement('span');
          tile.className = 'tile';
          tile.style.background =
            'linear-gradient(135deg, hsl(' + hue + ' 62% 52%), hsl(' + hue + ' 66% 30%))';
          const label = document.createElement('span');
          label.className = 'label';
          label.textContent = name;
          btn.append(tile, label);
          btn.addEventListener('click', () => {
            windowTitle.textContent = name;
            go(pageWindow, 'forward');
          });
          pageLauncher.appendChild(btn);
          return btn;
        });

        function swap(from, to) {
          from.hidden = true;
          to.hidden = false;
        }
        function focusHeading(to) {
          const heading = to.querySelector('h1, h2') || to.querySelector('.app-icon');
          if (heading) heading.focus({ preventScroll: true });
        }

        // ---- 方向化转场 ----
        function go(to, direction) {
          const from = to === pageWindow ? pageLauncher : pageWindow;
          if (navigating || !to.hidden) return;

          if (reduceMotion.matches) {
            swap(from, to);
            focusHeading(to);
            return;
          }
          navigating = true;
          html.dataset.vt = direction;

          from.style.viewTransitionName = 'page';
          const cleanup = () => {
            from.style.viewTransitionName = '';
            to.style.viewTransitionName = '';
            delete html.dataset.vt;
            navigating = false;
            focusHeading(to);
          };

          if (document.startViewTransition) {
            const vt = document.startViewTransition(() => {
              swap(from, to);
              from.style.viewTransitionName = '';
              to.style.viewTransitionName = 'page';
            });
            vt.finished.finally(cleanup);
          } else {
            // @mt:fallback：两页短暂同框，播同一套 keyframes，动画结束隐藏旧页
            to.hidden = false;
            from.classList.add('fx-out');
            to.classList.add('fx-in');
            const done = () => {
              to.removeEventListener('animationend', done);
              from.hidden = true;
              from.classList.remove('fx-out');
              to.classList.remove('fx-in');
              cleanup();
            };
            to.addEventListener('animationend', done);
          }
        }
        const goBack = () => go(pageLauncher, 'back');

        // ---- 返回途径：红点 / Esc / Backspace ----
        document.getElementById('closeBtn').addEventListener('click', goBack);
        document.addEventListener('keydown', (e) => {
          if (pageWindow.hidden) return;
          if (e.key === 'Escape' || e.key === 'Backspace') {
            e.preventDefault();
            goBack();
          }
        });

        /* @mt:thumb-start */
        // 缩略图演示：自动打开→关闭往返播放；切后台暂停，reduced-motion 不启动
        if (!reduceMotion.matches) {
          let demoIndex = 0;
          setInterval(() => {
            if (document.hidden || navigating) return;
            if (pageWindow.hidden) {
              icons[demoIndex % icons.length].click();
              demoIndex++;
            } else {
              goBack();
            }
          }, 2200);
        }
        /* @mt:thumb-end */
      })();
    </script>
  </body>
</html>
