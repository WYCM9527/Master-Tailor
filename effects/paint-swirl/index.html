<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>颜料漩涡</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #162325;        /* 页面底色（canvas 覆盖前的兜底色） */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* 用户开启「减少动态效果」时：JS 停止时间推进，保留一帧静态漩涡 */
</style>
</head>
<body>
<canvas id="mtCanvas" aria-hidden="true"></canvas>
<script>
  const CONFIG = {
    color1: "#de443b",     // 颜料一
    color2: "#006bb4",     // 颜料二
    color3: "#162325",     // 底色
    spinRotation: -2,      // 整体扭转
    spinSpeed: 7,          // 搅动速度
    contrast: 3.5,         // 对比度
    lighting: 0.4,         // 高光
    spinAmount: 0.25,      // 扭转随距离
    pixelFilter: 745,      // 像素粒度
    isRotate: false,       // 整体自转
  };
  const SPIN_EASE = 1.0;   // 扭转缓和系数

  const canvas = document.getElementById('mtCanvas');
  const gl = canvas.getContext('webgl', { antialias: false });
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const VS = `
    attribute vec2 aPos;
    varying vec2 vUv;
    void main() { vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }
  `;
  // 片元：先把像素坐标量化成大格（像素化），绕中心按距离扭转一次，
  // 再用 5 轮正弦迭代把坐标搅乱得到「颜料浓度」，按浓度在三色间分配并加高光
  const FS = `
    precision highp float;
    varying vec2 vUv;
    uniform vec2  uRes;          // 画布像素尺寸
    uniform float uTime;         // 累计秒
    uniform float uSpinRotation; // 整体扭转
    uniform float uSpinSpeed;    // 搅动速度
    uniform vec3  uColor1, uColor2, uColor3;
    uniform float uContrast, uLighting, uSpinAmount, uPixelFilter;
    uniform float uRotate;       // 1 = 整体自转
    uniform float uMouseX;       // 鼠标横向 0–1

    void main() {
      // 像素化：以对角线长度 / 粒度 为格子边长量化坐标，再归一化到以中心为原点
      float pixelSize = length(uRes) / uPixelFilter;
      vec2 frag = vUv * uRes;
      vec2 uv = (floor(frag / pixelSize) * pixelSize - 0.5 * uRes) / length(uRes);
      float len = length(uv);

      // 扭转：角度随离中心距离变化，可选随时间自转，鼠标横向位置微调
      float speed = uSpinRotation * 0.2 * ${SPIN_EASE.toFixed(1)};
      if (uRotate > 0.5) speed *= uTime;
      speed += 302.2;
      float mouseK = uMouseX * 2.0 - 1.0;
      speed += mouseK * 0.1;
      float ang = atan(uv.y, uv.x) + speed - 20.0 * ${SPIN_EASE.toFixed(1)} * (uSpinAmount * len + (1.0 - uSpinAmount));
      vec2 mid = (uRes / length(uRes)) / 2.0;
      uv = vec2(len * cos(ang) + mid.x, len * sin(ang) + mid.y) - mid;

      // 搅动：5 轮互相耦合的正弦迭代，时间与鼠标推进相位
      uv *= 30.0;
      float t = uTime * uSpinSpeed + mouseK * 2.0;
      vec2 uv2 = vec2(uv.x + uv.y);
      for (int i = 0; i < 5; i++) {
        uv2 += sin(max(uv.x, uv.y)) + uv;
        uv += 0.5 * vec2(cos(5.1123314 + 0.353 * uv2.y + t * 0.131121), sin(uv2.x - 0.113 * t));
        uv -= cos(uv.x + uv.y) - sin(uv.x * 0.711 - uv.y);
      }

      // 浓度 → 三色权重：颜料一在 paint≈1 处最浓，颜料二在 paint≈0 处，其余是底色
      float cm = 0.25 * uContrast + 0.5 * uSpinAmount + 1.2;
      float paint = min(2.0, max(0.0, length(uv) * 0.035 * cm));
      float c1 = max(0.0, 1.0 - cm * abs(1.0 - paint));
      float c2 = max(0.0, 1.0 - cm * abs(paint));
      float c3 = 1.0 - min(1.0, c1 + c2);
      float light = (uLighting - 0.2) * max(c1 * 5.0 - 4.0, 0.0) + uLighting * max(c2 * 5.0 - 4.0, 0.0);
      vec3 col = (0.3 / uContrast) * uColor1 + (1.0 - 0.3 / uContrast) * (uColor1 * c1 + uColor2 * c2 + uColor3 * c3) + light;
      gl_FragColor = vec4(col, 1.0);
    }
  `;

  // ---- WebGL 底座：编译 → 链接 → 全屏三角形 ----
  function compile(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  const U = (n) => gl.getUniformLocation(prog, n);
  const hexRgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);

  const dpr = Math.min(2, devicePixelRatio || 1);
  function resize() {
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(U('uRes'), canvas.width, canvas.height);
  }
  resize(); addEventListener('resize', resize);

  gl.uniform3fv(U('uColor1'), hexRgb(CONFIG.color1));
  gl.uniform3fv(U('uColor2'), hexRgb(CONFIG.color2));
  gl.uniform3fv(U('uColor3'), hexRgb(CONFIG.color3));
  gl.uniform1f(U('uSpinRotation'), CONFIG.spinRotation);
  gl.uniform1f(U('uSpinSpeed'), CONFIG.spinSpeed);
  gl.uniform1f(U('uContrast'), CONFIG.contrast);
  gl.uniform1f(U('uLighting'), CONFIG.lighting);
  gl.uniform1f(U('uSpinAmount'), CONFIG.spinAmount);
  gl.uniform1f(U('uPixelFilter'), CONFIG.pixelFilter);
  gl.uniform1f(U('uRotate'), CONFIG.isRotate ? 1 : 0);
  const uTime = U('uTime'), uMouseX = U('uMouseX');

  // 鼠标横向位置微调扭转与相位（平滑跟随）
  let mouseX = 0.5, smoothX = 0.5;
  addEventListener('pointermove', (e) => { mouseX = e.clientX / innerWidth; });

  let time = reduceMotion ? 5 : 0, last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    if (document.hidden) { last = now; return; }
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!reduceMotion) time += dt;
    smoothX += (mouseX - smoothX) * 0.05;
    gl.uniform1f(uTime, time);
    gl.uniform1f(uMouseX, smoothX);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
