<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手风琴轮播</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;       /* 页面底色 */
    --mt-accent: #f9cf00;   /* 强调色：展开条的标题下划线 */
    --mt-duration: 0.55s;   /* 展开过渡时长 */
    --mt-grow: 4;           /* 展开倍率：当前条相对其他条的宽度倍数 */
    --mt-gap: 8px;          /* 条与条的间距 */
    --mt-rounded: 14px;     /* 条的圆角 */
  }

  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mt-bg);
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  .mt-accordion {
    display: flex;
    gap: var(--mt-gap);
    width: min(780px, 94vw);
    height: min(400px, 60vh);
    outline: none;
  }
  .mt-accordion:focus-visible { outline: 2px solid var(--mt-accent); outline-offset: 4px; }

  /* 每条：flex-grow 过渡产生「挤开」的手风琴动作 */
  .mt-pane {
    position: relative;
    flex: 1 1 0;
    margin: 0;
    border-radius: var(--mt-rounded);
    overflow: hidden;
    cursor: pointer;
    background: linear-gradient(135deg, #1a1c2c, #2a2f4a);
    transition: flex-grow var(--mt-duration) cubic-bezier(0.33, 1, 0.68, 1);
  }
  .mt-pane.is-active { flex-grow: var(--mt-grow); }
  .mt-pane img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.55) saturate(0.85);
    transition: filter var(--mt-duration) ease;
    -webkit-user-drag: none;
    user-select: none;
  }
  .mt-pane.is-active img { filter: none; }

  /* 收起时标题竖排在条中，展开后横排在左下角 */
  .mt-pane .mt-caption {
    position: absolute;
    left: 14px;
    bottom: 14px;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.08em;
    writing-mode: vertical-rl;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
    transition: writing-mode 0s linear var(--mt-duration);
    white-space: nowrap;
  }
  .mt-pane.is-active .mt-caption {
    writing-mode: horizontal-tb;
    font-size: 19px;
    padding-bottom: 4px;
    border-bottom: 3px solid var(--mt-accent);
  }

  /* 用户开启「减少动态效果」：展开瞬间完成、不自动轮换（JS 同步处理） */
  @media (prefers-reduced-motion: reduce) {
    .mt-pane, .mt-pane img { transition: none; }
  }
</style>
</head>
<body>
<div class="mt-accordion" id="mtRoot"></div>
<script>
  const CONFIG = {
    slides: [{"src":"/samples/sample-1.svg","caption":"琥珀之夜"},{"src":"/samples/sample-2.svg","caption":"海面日出"},{"src":"/samples/sample-3.svg","caption":"山脊星光"},{"src":"/samples/sample-4.svg","caption":"苔原晨雾"},{"src":"/samples/sample-5.svg","caption":"蔷薇暮色"}], // 竖条列表
    interval: 3, // 自动轮流展开间隔（秒，0 为不自动轮换）
  };

  (function () {
    const root = document.getElementById('mtRoot');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const slides = CONFIG.slides;
    const total = slides.length;
    let index = 0;

    root.setAttribute('role', 'region');
    root.setAttribute('aria-roledescription', 'carousel');
    root.setAttribute('aria-label', '手风琴轮播');
    root.setAttribute('tabindex', '0');

    const panes = slides.map((s, i) => {
      const el = document.createElement('figure');
      el.className = 'mt-pane' + (i === 0 ? ' is-active' : '');
      el.setAttribute('role', 'group');
      el.setAttribute('aria-roledescription', 'slide');
      el.setAttribute('aria-label', '第 ' + (i + 1) + ' 张，共 ' + total + ' 张' + (s.caption ? '：' + s.caption : ''));
      const img = document.createElement('img');
      img.src = s.src;
      img.alt = s.caption || '第 ' + (i + 1) + ' 张图片';
      img.loading = 'lazy';
      el.appendChild(img);
      if (s.caption) {
        const cap = document.createElement('div');
        cap.className = 'mt-caption';
        cap.textContent = s.caption;
        el.appendChild(cap);
      }
      // 鼠标悬停或点击（含 pointerdown 触摸）都能展开这一条
      el.addEventListener('mouseenter', () => goTo(i));
      el.addEventListener('pointerdown', () => goTo(i));
      root.appendChild(el);
      return el;
    });

    function goTo(next) {
      next = (next + total) % total;
      if (next === index) return;
      panes[index].classList.remove('is-active');
      panes[next].classList.add('is-active');
      index = next;
    }
    const nextSlide = () => goTo(index + 1);
    const prevSlide = () => goTo(index - 1);

    // 自动轮流展开：悬停 / 聚焦 / 后台暂停；reduced-motion 不启动
    let timer = null;
    function play() {
      if (timer || CONFIG.interval <= 0 || reduceMotion || total < 2) return;
      timer = setInterval(nextSlide, CONFIG.interval * 1000);
    }
    function pause() { clearInterval(timer); timer = null; }
    root.addEventListener('mouseenter', pause);
    root.addEventListener('mouseleave', play);
    root.addEventListener('focusin', pause);
    root.addEventListener('focusout', play);
    document.addEventListener('visibilitychange', () => (document.hidden ? pause() : play()));
    play();

    // 键盘
    root.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
    });
  })();
</script>
</body>
</html>
