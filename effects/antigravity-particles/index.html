<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>反重力粒子</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* 用户开启「减少动态效果」时：光环定格、不脉动（JS 同步处理） */
  @media (prefers-reduced-motion: reduce) { canvas { opacity: 0.9; } }
</style>
</head>
<body>
<canvas id="mtCanvas" aria-hidden="true"></canvas>
<script>
  const CONFIG = {
    count: 300,          // 粒子数量
    magnetRadius: 10,    // 吸附范围（格）
    ringRadius: 10,      // 光环半径（格）
    waveSpeed: 0.4,      // 波动速度
    waveAmplitude: 1,    // 波动幅度
    particleSize: 2,     // 粒子大小
    rotationSpeed: 0,    // 光环旋转
    shape: "capsule",    // 粒子形状：capsule 胶囊 / sphere 圆点 / box 方块
    color: "#27ff64",    // 粒子颜色
    autoAnimate: true,   // 闲置时自动游走
  };

  const canvas = document.getElementById('mtCanvas');
  const ctx = canvas.getContext('2d');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dpr = Math.min(2, devicePixelRatio || 1);

  // 「格」：以视口高度的 1/31.5 为一格（相当于透视相机在 50 单位处看到的视口高），
  // 所有半径 / 尺寸参数都按格给，换成像素后随窗口大小等比缩放
  const UNITS_H = 31.5;
  let W = 0, H = 0, unit = 1;
  function resize() {
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    unit = H / UNITS_H;
  }
  resize(); addEventListener('resize', resize);

  // 粒子：原位 (mx,my) 随机铺满视口，mz 是深度（影响视差与大小），(cx,cy,cz) 是当前位置
  const particles = [];
  for (let i = 0; i < CONFIG.count; i++) {
    const mx = (Math.random() - 0.5), my = (Math.random() - 0.5), mz = (Math.random() - 0.5) * 20;
    particles.push({
      t: Math.random() * 100,               // 各自的相位
      speed: 0.01 + Math.random() / 200,    // 相位推进速度
      mx, my, mz,                           // 原位（mx/my 是视口比例，绘制时乘 W/H）
      cx: mx, cy: my, cz: mz,               // 当前位置（同上单位）
      radiusOffset: (Math.random() - 0.5) * 2, // 环上的随机偏差，环才不是一条死板的圆
    });
  }

  // 指针：真实指针 → 目标点；虚拟指针以 5% 每帧平滑跟随（环有「重量」）
  let px = 0, py = 0, lastMoveAt = 0;
  let vx = 0, vy = 0;
  addEventListener('pointermove', (e) => {
    px = e.clientX / W - 0.5;
    py = e.clientY / H - 0.5;
    lastMoveAt = performance.now();
  });

  function hexRgb(hex) {
    const h = hex.replace('#', '');
    return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16));
  }
  const [cr, cg, cb] = hexRgb(CONFIG.color);

  /* 画一枚粒子：胶囊 = 圆头矩形沿径向排列；圆点 / 方块按形状参数 */
  function drawParticle(x, y, angle, scale) {
    const s = scale * unit;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.fillStyle = `rgb(${cr}, ${cg}, ${cb})`;
    if (CONFIG.shape === 'sphere') {
      ctx.beginPath(); ctx.arc(0, 0, 0.2 * s, 0, Math.PI * 2); ctx.fill();
    } else if (CONFIG.shape === 'box') {
      ctx.fillRect(-0.15 * s, -0.15 * s, 0.3 * s, 0.3 * s);
    } else {
      const r = 0.1 * s, len = 0.4 * s;   // 胶囊：半径 0.1 格、直段 0.4 格
      ctx.beginPath();
      ctx.roundRect(-r, -len / 2 - r, r * 2, len + r * 2, r);
      ctx.fill();
    }
    ctx.restore();
  }

  let elapsed = 0;
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    if (document.hidden) { last = now; return; }        // 切后台暂停
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!reduceMotion) elapsed += dt;

    // 目标点：真实指针；闲置两秒后（若开启）自动沿 8 字游走
    let destX = px, destY = py;
    if (CONFIG.autoAnimate && now - lastMoveAt > 2000) {
      destX = Math.sin(elapsed * 0.5) * 0.25;
      destY = Math.cos(elapsed * 1.0) * 0.25;
    }
    vx += (destX - vx) * 0.05;
    vy += (destY - vy) * 0.05;
    const targetX = vx * W, targetY = vy * H;           // 像素
    const globalRot = elapsed * CONFIG.rotationSpeed;

    ctx.clearRect(0, 0, W, H);
    ctx.translate(W / 2, H / 2);                          // 以画面中心为原点

    for (const p of particles) {
      if (!reduceMotion) p.t += p.speed / 2;
      const t = p.t;
      // 深度视差：越靠近相机（cz 大）目标点位移越小
      const proj = 1 - p.cz / 50;
      const tx0 = targetX * proj, ty0 = targetY * proj;

      const mxPx = p.mx * W, myPx = p.my * H;
      const dx = mxPx - tx0, dy = myPx - ty0;
      const dist = Math.hypot(dx, dy);

      // 默认目标 = 原位；在吸附范围内 → 目标改为环上的一点（半径随波起伏 + 随机偏差）
      let gx = mxPx, gy = myPx, gz = p.mz;
      if (dist < CONFIG.magnetRadius * unit) {
        const angle = Math.atan2(dy, dx) + globalRot;
        const wave = Math.sin(t * CONFIG.waveSpeed + angle) * (0.5 * CONFIG.waveAmplitude);
        const deviation = p.radiusOffset * (5 / 10.1);   // 场强 10 时的散乱度
        const r = (CONFIG.ringRadius + wave + deviation) * unit;
        gx = tx0 + r * Math.cos(angle);
        gy = ty0 + r * Math.sin(angle);
        gz = p.mz + Math.sin(t) * CONFIG.waveAmplitude;
      }
      // 10% 阻尼趋近目标
      const cxPx = p.cx * W + (gx - p.cx * W) * 0.1;
      const cyPx = p.cy * H + (gy - p.cy * H) * 0.1;
      p.cx = cxPx / W; p.cy = cyPx / H;
      p.cz += (gz - p.cz) * 0.1;

      // 大小：离环越远越小，超过 10 格即不可见 —— 画面上只留下环附近的粒子
      const distToMouse = Math.hypot(cxPx - tx0, cyPx - ty0);
      const distFromRing = Math.abs(distToMouse - CONFIG.ringRadius * unit) / unit;
      let scaleFactor = Math.max(0, Math.min(1, 1 - distFromRing / 10));
      if (scaleFactor <= 0.01) continue;
      // 脉动：0.8 ± 0.2；近处（cz 大）略大，模拟透视
      const pulse = 0.8 + Math.sin(t * 3) * 0.2;
      const persp = 50 / (50 - p.cz);
      const finalScale = scaleFactor * pulse * CONFIG.particleSize * persp;

      // 朝向：胶囊长轴指向光标（径向）
      const angleTo = Math.atan2(cyPx - ty0, cxPx - tx0) + Math.PI / 2;
      drawParticle(cxPx, cyPx, angleTo, finalScale);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);               // 还原原点
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
