<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>反重力粒子</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* 用户开启「减少动态效果」时：粒子静止（JS 同步处理） */
  @media (prefers-reduced-motion: reduce) {
    canvas { opacity: 0.8; }
  }
</style>
</head>
<body>
<canvas id="mtCanvas" aria-hidden="true"></canvas>
<script>
  const CONFIG = {
    count: 160,        // 粒子数量
    drift: 18,         // 上浮速度（px/秒）
    radius: 140,       // 排斥半径（px）
    force: 1.2,        // 排斥力度
    size: 2,           // 粒子大小（px）
    color: "#ffffff",  // 粒子颜色
    connect: false,    // 近距连线
  };

  const canvas = document.getElementById('mtCanvas');
  const ctx = canvas.getContext('2d');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, dpr = Math.min(2, devicePixelRatio || 1);
  function resize() {
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  addEventListener('resize', resize);

  // 粒子：位置、速度、微小的左右摆动相位
  const dots = Array.from({ length: CONFIG.count }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    vx: 0, vy: 0, phase: Math.random() * Math.PI * 2, r: CONFIG.size * (0.6 + Math.random() * 0.8),
  }));

  let px = -9999, py = -9999, auto = true; // auto：缩略图演示的虚拟指针是否在控制
  addEventListener('pointermove', e => { auto = false; px = e.clientX; py = e.clientY; });
  document.documentElement.addEventListener('pointerleave', () => { auto = true; px = -9999; py = -9999; });

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!document.hidden) {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = CONFIG.color;
      ctx.strokeStyle = CONFIG.color;
      for (const d of dots) {
        if (!reduceMotion) {
          // 鼠标排斥：半径内受一个随距离衰减的推力
          const dx = d.x - px, dy = d.y - py;
          const dist = Math.hypot(dx, dy);
          if (dist < CONFIG.radius && dist > 0.01) {
            const k = (1 - dist / CONFIG.radius) * CONFIG.force * 900 * dt;
            d.vx += dx / dist * k; d.vy += dy / dist * k;
          }
          // 上浮 + 轻微左右摆动 + 阻尼
          d.phase += dt;
          d.vx += Math.sin(d.phase) * 6 * dt;
          d.vy -= CONFIG.drift * 0.5 * dt;
          d.vx *= 0.94; d.vy *= 0.94;
          d.x += d.vx * dt * 20 + Math.sin(d.phase) * 0.2;
          d.y += d.vy * dt * 20 - CONFIG.drift * dt;
          // 越界回卷
          if (d.y < -10) { d.y = H + 10; d.x = Math.random() * W; }
          if (d.y > H + 10) d.y = -10;
          if (d.x < -10) d.x = W + 10;
          if (d.x > W + 10) d.x = -10;
        }
        ctx.globalAlpha = 0.85;
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
      }
      if (CONFIG.connect) {
        ctx.globalAlpha = 0.18; ctx.lineWidth = 1;
        for (let i = 0; i < dots.length; i++) for (let j = i + 1; j < dots.length; j++) {
          const a = dots[i], b = dots[j];
          const dd = Math.hypot(a.x - b.x, a.y - b.y);
          if (dd < 90) { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
        }
      }
      ctx.globalAlpha = 1;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* @mt:thumb-start */
  // 缩略图演示：虚拟指针画椭圆游走；真实鼠标一动就交还控制
  if (!reduceMotion) {
    let t = 0;
    setInterval(() => {
      if (document.hidden || !auto) return;
      t += 0.025;
      px = W / 2 + Math.cos(t) * W * 0.3; py = H / 2 + Math.sin(t * 1.3) * H * 0.3;
    }, 30);
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
