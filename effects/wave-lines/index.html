<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>波浪流体线条</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;     /* 页面底色 */
    --mt-color: #ffffff;  /* 线条颜色（canvas 每帧读取，调参实时生效） */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; }
  canvas { position: fixed; inset: 0; display: block; }
</style>
</head>
<body>
<canvas id="mtCanvas" aria-hidden="true"></canvas>
<script>
  const CONFIG = {
    lineCount: 6,   // 线条数量（3-12）
    amplitude: 40,  // 波幅：波峰到中线的高度（px）
    speed: 0.8,     // 流速倍率：相位滚动速度
    thickness: 1.5, // 线宽（px）
  };

  const canvas = document.getElementById('mtCanvas');
  const ctx = canvas.getContext('2d');
  const rootStyle = getComputedStyle(document.documentElement);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let width = 0, height = 0, dpr = 1;
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    width = innerWidth; height = innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize);
  resize();

  function hexToRgb(hex) {
    return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  }

  function frame(timeSec) {
    ctx.clearRect(0, 0, width, height);
    const color = rootStyle.getPropertyValue('--mt-color').trim() || '#ffffff';
    const [r, g, b] = hexToRgb(color);

    // 每条线：垂直位置均匀分布，相位、频率、透明度各不相同，叠出「流体」层次
    for (let i = 0; i < CONFIG.lineCount; i++) {
      const progress = CONFIG.lineCount === 1 ? 0.5 : i / (CONFIG.lineCount - 1);
      const baseY = height * (0.28 + progress * 0.44);
      const alpha = 0.25 + 0.6 * (1 - Math.abs(progress - 0.5) * 2) ** 1.5; // 中间的线最亮
      const freq = 1.6 + i * 0.35;             // 每条线波长略不同
      const phase = timeSec * CONFIG.speed * (0.6 + i * 0.13) + i * 1.7; // 相位滚动

      ctx.strokeStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + alpha.toFixed(3) + ')';
      ctx.lineWidth = CONFIG.thickness;
      ctx.beginPath();
      // 沿 x 每 6px 取一个点，双正弦叠加让波形不那么规则
      for (let x = 0; x <= width; x += 6) {
        const n = x / width;
        const y = baseY
          + Math.sin(n * Math.PI * freq + phase) * CONFIG.amplitude
          + Math.sin(n * Math.PI * freq * 2.7 + phase * 1.4) * CONFIG.amplitude * 0.24;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }

  // rAF 主循环：页面切到后台时暂停，避免空耗性能
  let rafId = null;
  function loop(now) { frame(now / 1000); rafId = requestAnimationFrame(loop); }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { cancelAnimationFrame(rafId); rafId = null; }
    else if (!rafId) rafId = requestAnimationFrame(loop);
  });
  if (reduceMotion) {
    frame(0); // 减少动态效果：只画一帧静态波形
  } else {
    rafId = requestAnimationFrame(loop);
  }
</script>
</body>
</html>
