<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浮线背景</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* 用户开启「减少动态效果」时：线条静止平直（JS 同步处理） */
  @media (prefers-reduced-motion: reduce) {
    canvas { opacity: 0.8; }
  }
</style>
</head>
<body>
<canvas id="mtCanvas" aria-hidden="true"></canvas>
<script>
  const CONFIG = {
    count: 18,         // 线条数量
    amplitude: 22,     // 起伏幅度（px）
    speed: 1,          // 流动速度倍率
    dent: 60,          // 鼠标凹陷深度（px）
    thickness: 1,      // 线粗
    color: "#ffffff",  // 线条颜色
    fadeEdges: true,   // 两端渐隐
  };

  const canvas = document.getElementById('mtCanvas');
  const ctx = canvas.getContext('2d');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dpr = Math.min(2, devicePixelRatio || 1);
  let W = 0, H = 0;
  function resize() { W = innerWidth; H = innerHeight; canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  resize(); addEventListener('resize', resize);

  let mx = -9999, my = -9999, sx = -9999, sy = -9999, auto = true;
  addEventListener('pointermove', e => { auto = false; mx = e.clientX; my = e.clientY; });
  document.documentElement.addEventListener('pointerleave', () => { auto = true; mx = -9999; my = -9999; });

  let t = 0;
  function frame() {
    if (!document.hidden) {
      if (!reduceMotion) t += 0.016 * CONFIG.speed;
      // 鼠标位置平滑，凹陷跟着慢慢走
      sx += (mx - sx) * 0.12; sy += (my - sy) * 0.12;
      ctx.clearRect(0, 0, W, H);
      ctx.lineWidth = CONFIG.thickness;
      const step = 8;
      for (let i = 0; i < CONFIG.count; i++) {
        const baseY = H * (i + 1) / (CONFIG.count + 1);
        const phase = i * 0.6;
        // 两端渐隐：用横向渐变作描边色
        if (CONFIG.fadeEdges) {
          const g = ctx.createLinearGradient(0, 0, W, 0);
          g.addColorStop(0, 'transparent'); g.addColorStop(0.15, CONFIG.color); g.addColorStop(0.85, CONFIG.color); g.addColorStop(1, 'transparent');
          ctx.strokeStyle = g;
        } else ctx.strokeStyle = CONFIG.color;
        ctx.globalAlpha = 0.35 + 0.5 * (i / CONFIG.count);
        ctx.beginPath();
        for (let x = 0; x <= W; x += step) {
          // 两个不同频率的正弦叠加做起伏；鼠标附近按高斯凹陷向下压
          let y = baseY + Math.sin(x * 0.006 + t + phase) * CONFIG.amplitude * 0.6 + Math.sin(x * 0.013 - t * 0.7 + phase) * CONFIG.amplitude * 0.4;
          if (!reduceMotion) {
            const dx = x - sx, dy = baseY - sy;
            y += Math.exp(-(dx * dx + dy * dy) / (2 * 120 * 120)) * CONFIG.dent * (dy < 0 ? -1 : 1) * Math.min(1, Math.abs(dy) / 60);
          }
          if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* @mt:thumb-start */
  // 缩略图演示：虚拟指针在画面上游走；真实鼠标一动就交还
  if (!reduceMotion) {
    let k = 0;
    setInterval(() => { if (document.hidden || !auto) return; k += 0.025; mx = W / 2 + Math.sin(k) * W * 0.35; my = H / 2 + Math.sin(k * 1.7) * H * 0.3; }, 30);
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
