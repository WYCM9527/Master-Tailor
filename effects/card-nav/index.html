<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡片式导航</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;           /* 页面底色 */
    --mt-cardText: #ffffff;     /* 卡片文字色 */
    --mt-baseColor: #ffffff;    /* 导航底色 */
    --mt-menuColor: #000000;    /* 导航文字色 */
    --mt-ctaColor: #111111;     /* 右侧按钮底色 */
  }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mt-bg);
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  /* 导航条：默认 60px 高，展开时高度过渡到能容纳卡片 */
  .mt-nav {
    position: absolute; left: 50%; top: 2em; transform: translateX(-50%);
    width: min(800px, 90vw);
    height: 60px;
    border-radius: 12px;
    background: var(--mt-baseColor);
    color: var(--mt-menuColor);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
    overflow: hidden;
    transition: height var(--dur, 0.4s) cubic-bezier(0.22, 1, 0.36, 1);
    will-change: height;
  }
  .mt-top {
    position: absolute; inset: 0 0 auto 0; height: 60px;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 0 8px 0 18px; box-sizing: border-box;
  }
  /* 汉堡：两条线，开时交叉成 × */
  .mt-burger { display: flex; flex-direction: column; gap: 6px; width: 30px; cursor: pointer; background: none; border: 0; padding: 0; justify-self: start; }
  .mt-burger span { display: block; width: 30px; height: 2px; background: currentColor; transform-origin: 50% 50%; transition: transform 0.3s linear, opacity 0.3s linear, margin 0.3s linear; }
  .mt-burger:hover span { opacity: 0.75; }
  .mt-nav.is-open .mt-burger span:first-child { transform: translateY(4px) rotate(45deg); }
  .mt-nav.is-open .mt-burger span:last-child { transform: translateY(-4px) rotate(-45deg); }
  .mt-logo { font-weight: 800; letter-spacing: 0.12em; font-size: 14px; }
  .mt-cta {
    justify-self: end;
    height: 44px; padding: 0 18px; border: 0; border-radius: calc(12px - 3px);
    background: var(--mt-ctaColor); color: #fff; font-weight: 500; font-size: 14px; cursor: pointer;
    transition: opacity 0.3s;
  }
  .mt-cta:hover { opacity: 0.85; }
  /* 卡片区：三张并排，卡片默认下移 50px 透明，展开时依次浮上来 */
  .mt-cards {
    position: absolute; left: 8px; right: 8px; top: 60px; bottom: 8px;
    display: flex; gap: 12px;
  }
  .mt-card {
    flex: 1;
    min-height: 200px;
    border-radius: 12px;
    padding: 14px 16px;
    box-sizing: border-box;
    display: flex; flex-direction: column;
    color: var(--mt-cardText);
    transform: translateY(50px); opacity: 0;
    transition: transform var(--dur, 0.4s) cubic-bezier(0.22, 1, 0.36, 1) var(--delay, 0s), opacity var(--dur, 0.4s) cubic-bezier(0.22, 1, 0.36, 1) var(--delay, 0s);
  }
  .mt-nav.is-open .mt-card { transform: translateY(0); opacity: 1; }
  .mt-card h3 { margin: 0; font-weight: 400; font-size: 22px; letter-spacing: -0.5px; }
  .mt-card ul { list-style: none; margin: auto 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .mt-card a { color: inherit; text-decoration: none; font-size: 16px; display: inline-flex; align-items: center; gap: 6px; transition: opacity 0.3s; }
  .mt-card a::before { content: "↗"; font-size: 14px; }
  .mt-card a:hover { opacity: 0.75; }

  /* 用户开启「减少动态效果」时：直接开合 */
  @media (prefers-reduced-motion: reduce) { .mt-nav, .mt-card, .mt-burger span { transition: none; } }
</style>
</head>
<body>
<nav class="mt-nav" id="mtNav" aria-label="主导航">
  <div class="mt-top">
    <button type="button" class="mt-burger" id="mtBurger" aria-label="打开菜单" aria-expanded="false"><span></span><span></span></button>
    <div class="mt-logo" id="mtLogo">LOGO</div>
    <button type="button" class="mt-cta" id="mtCta">开始使用</button>
  </div>
  <div class="mt-cards" id="mtCards"></div>
</nav>
<script>
  const CONFIG = {
    cards: "关于:公司,团队,招聘｜项目:精选案例,服务范围｜联系:邮箱,微信,LinkedIn", // 卡片内容
    colors: ["#0d0716", "#170d27", "#271e37"],  // 卡片底色
    logoText: "LOGO",       // 中间标识
    ctaText: "开始使用",     // 右侧按钮文字
    duration: 0.4,          // 展开时长（s）
    autoDemo: true,         // 自动开合演示
  };

  const nav = document.getElementById('mtNav');
  const burger = document.getElementById('mtBurger');
  const cardsEl = document.getElementById('mtCards');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.getElementById('mtLogo').textContent = CONFIG.logoText;
  document.getElementById('mtCta').textContent = CONFIG.ctaText;
  nav.style.setProperty('--dur', `${CONFIG.duration}s`);

  // 解析「标题:链接,链接｜...」生成卡片
  const cards = CONFIG.cards.split('｜').map(s => s.trim()).filter(Boolean).map((seg, i) => {
    const [title, linksStr = ''] = seg.split(/[:：]/);
    const el = document.createElement('div');
    el.className = 'mt-card';
    el.style.background = CONFIG.colors[i % CONFIG.colors.length];
    el.style.setProperty('--delay', `${i * 0.08}s`);
    const h = document.createElement('h3'); h.textContent = title.trim();
    const ul = document.createElement('ul');
    linksStr.split(/[,，]/).map(s => s.trim()).filter(Boolean).forEach(l => {
      const li = document.createElement('li'); const a = document.createElement('a'); a.href = '#'; a.textContent = l;
      a.addEventListener('click', e => e.preventDefault()); li.appendChild(a); ul.appendChild(li);
    });
    el.append(h, ul); cardsEl.appendChild(el);
    return el;
  });

  // 展开高度 = 顶栏 60 + 卡片实际高度 + 内边距
  let open = false, userTook = false;
  function setOpen(next) {
    open = next;
    nav.classList.toggle('is-open', open);
    burger.setAttribute('aria-expanded', String(open));
    burger.setAttribute('aria-label', open ? '关闭菜单' : '打开菜单');
    nav.style.height = open ? `${60 + Math.max(200, ...cards.map(c => c.scrollHeight)) + 16}px` : '60px';
  }
  burger.addEventListener('click', () => { userTook = true; setOpen(!open); });

  /* @mt:thumb-start */
  // 自动演示：开 → 停 → 关，循环；用户一点就交还
  if (CONFIG.autoDemo && !reduceMotion) {
    let step = 0;
    setInterval(() => {
      if (document.hidden || userTook) return;
      if (step % 4 === 0) setOpen(true);
      else if (step % 4 === 3) setOpen(false);
      step++;
    }, 1100);
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
