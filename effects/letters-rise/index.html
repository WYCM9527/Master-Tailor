<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>逐字弹入</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-distance: 0.7em;    /* 起跳距离（字高倍数） */
    --mt-duration: 1.2s;     /* 单字时长 */
    --mt-ease: cubic-bezier(0.22, 1, 0.36, 1); /* 手感曲线（默认干脆落定） */
    --mt-rotate: 0;          /* 带一点旋转：1 开 / 0 关 */
    --mt-color: #f2f3f8;     /* 文字颜色 */
    --mt-fontSize: 56px;     /* 字号 */
    --mt-font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; /* 字体 */
  }

  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mt-bg);
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  .mt-rise {
    max-width: 90vw;
    text-align: center;
    font-family: var(--mt-font);
    font-size: var(--mt-fontSize);
    font-weight: 700;
    line-height: 1.3;
    color: var(--mt-color);
    letter-spacing: 0.02em;
  }
  /* 每个字一个 span，从下方弹起；overflow 由外层裁掉起跳前的部分 */
  .mt-rise .line {
    display: inline-block;
    overflow: hidden;
    padding: 0.1em 0.05em 0.15em;
    vertical-align: bottom;
  }
  .mt-rise .c {
    display: inline-block;
    white-space: pre;
    opacity: 0;
    transform: translateY(var(--mt-distance)) rotate(calc(var(--mt-rotate) * 12deg));
    animation: mt-rise var(--mt-duration) var(--mt-ease) forwards;
    animation-delay: var(--d, 0s);
  }
  @keyframes mt-rise {
    to { opacity: 1; transform: translateY(0) rotate(0deg); }
  }

  /* 用户开启「减少动态效果」时：直接显示 */
  @media (prefers-reduced-motion: reduce) {
    .mt-rise .c { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<h1 class="mt-rise" id="mtRise"></h1>
<script>
  const CONFIG = {
    text: "Hello，裁缝大师", // 文案
    splitBy: "chars",       // 切分方式：chars 按字 / words 按词
    stagger: 50,            // 相邻错开（毫秒）
  };

  const host = document.getElementById('mtRise');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  host.setAttribute('aria-label', CONFIG.text);

  function render() {
    host.textContent = '';
    const line = document.createElement('span');
    line.className = 'line';
    line.setAttribute('aria-hidden', 'true');
    const units = CONFIG.splitBy === 'words' ? CONFIG.text.split(/(\s+)/).filter(Boolean) : Array.from(CONFIG.text);
    units.forEach((ch, i) => {
      const c = document.createElement('span');
      c.className = 'c';
      c.textContent = ch;
      c.style.setProperty('--d', (i * CONFIG.stagger) + 'ms');
      line.appendChild(c);
    });
    host.appendChild(line);
  }

  render();
  // 循环演示：全部落定后停 1.6s 再来一遍
  if (!reduceMotion) {
    const durationMs = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--mt-duration')) * 1000 || 700;
    const total = (CONFIG.splitBy === 'words' ? CONFIG.text.split(/\s+/).length : Array.from(CONFIG.text).length) * CONFIG.stagger + durationMs + 1600;
    setInterval(() => { if (!document.hidden) render(); }, total);
  }
</script>
</body>
</html>
