<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>激光流束</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #060010;        /* 页面底色（激光以外透出它） */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* 用户开启「减少动态效果」时：JS 停止时间推进，光流与雾定格 */
</style>
</head>
<body>
<canvas id="mtCanvas" aria-hidden="true"></canvas>
<script>
  const CONFIG = {
    color: "#a0ffbc",             // 激光颜色
    horizontalBeamOffset: 0.1,    // 横向位置
    verticalBeamOffset: 0,        // 纵向位置
    flowSpeed: 0.35,              // 光流速度
    flowStrength: 0.25,           // 光流强度
    verticalSizing: 2,            // 束长
    horizontalSizing: 0.5,        // 落点光晕宽
    wispIntensity: 5,             // 光丝亮度
    fogIntensity: 0.45,           // 雾气
    mouseTiltStrength: 0.01,      // 雾随鼠标偏斜
  };
  const WISP_DENSITY = 1, WISP_SPEED = 15, FOG_SCALE = 0.3, FOG_FALL = 0.6, DECAY = 1.1, FALLOFF_START = 1.2, RENDER_SCALE = 0.8;

  const canvas = document.getElementById('mtCanvas');
  const gl = canvas.getContext('webgl2', { antialias: false, alpha: true, premultipliedAlpha: false });
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const VS = `#version 300 es
    in vec2 aPos;
    void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
  `;
  // 片元：把一段圆弧参数 τ 上的一串点光源沿横（落点光晕）与纵（束身）两条轴排开并按距离平方衰减叠加，
  // 束身叠加三角波光流与底部喇叭口；光丝是沿束两侧多条「车道」上随机长度的亮段向上跑；
  // 雾是域扭曲 fbm，按束的亮度遮罩、向底部偏重、随鼠标横向偏斜；最后 sRGB 压亮、抖动、横向边缘遮罩
  const FS = `#version 300 es
    precision highp float;
    precision mediump int;
    out vec4 fragColor;
    uniform vec2  uRes, uMouse;
    uniform float uFlowTime, uFogTime, uFade;
    uniform float uWispDensity, uTilt, uBeamX, uBeamY, uFlowSpeed, uVLen, uHLen, uFogK, uFogScale, uWSpeed, uWK, uFlowK, uDecay, uFalloff, uFogFall;
    uniform vec3  uColor;
    #define PI 3.14159265359
    #define TWO_PI 6.28318530718
    #define EPS 1e-6
    #define DT 0.0038
    #define EDGE_SOFT (DT * 4.0)
    #define TAPS 6
    #define R_H 150.0
    #define R_V 150.0
    #define FLARE_H 16.0
    #define FLARE_AMT 8.0
    #define W_LANES 10
    #define FOG_OCT 5

    float srgb(float x) { return x <= 0.00031308 ? 12.92 * x : 1.055 * pow(x, 1.0 / 2.4) - 0.055; }
    // 点光：功率 × min(1, (f²)/(d²))
    float bs(vec2 p, vec2 q, float powr) { float d = distance(p, q), f = powr * uFalloff; return powr * min(1.0, (f * f) / (d * d + EPS)); }
    float bsa(vec2 p, vec2 q, float powr, vec2 s) { vec2 d = p - q; float dd = (d.x * d.x) / (s.x * s.x) + (d.y * d.y) / (s.y * s.y), f = powr * uFalloff; return powr * min(1.0, (f * f) / (dd + EPS)); }
    float tri01(float x) { float f = fract(x); return 1.0 - abs(f * 2.0 - 1.0); }
    float tauWf(float t, float a0, float a1) { return max(0.0, smoothstep(a0, a0 + EDGE_SOFT, t) * (1.0 - smoothstep(a1 - EDGE_SOFT, a1, t))); }
    float h21(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 34.123); return fract(p.x * p.y); }
    float vnoise(vec2 p) { vec2 i = floor(p), f = fract(p); float a = h21(i), b = h21(i + vec2(1, 0)), c = h21(i + vec2(0, 1)), d = h21(i + vec2(1, 1)); vec2 u = f * f * (3.0 - 2.0 * f); return mix(mix(a, b, u.x), mix(c, d, u.x), u.y); }
    float fbm2(vec2 p) { float v = 0.0, amp = 0.6; mat2 m = mat2(0.86, 0.5, -0.5, 0.86); for (int i = 0; i < FOG_OCT; ++i) { v += amp * vnoise(p); p = m * p * 2.03 + 17.1; amp *= 0.52; } return v; }
    float rGate(float x, float l) { return max(0.0, smoothstep(0.0, 0.15, x) * (1.0 - smoothstep(l, l + 0.15, x))); }
    float flareY(float y) { float t = clamp(1.0 - (clamp(y, 0.0, FLARE_H) / FLARE_H), 0.0, 1.0); return t * t; }

    // 光丝：束两侧各 N 条车道，每格随机一段亮线向上流动，靠底部更亮、底部喇叭口处向外弯
    float wisps(vec2 uv, float topF) {
      float y = uv.y, yf = (y + uFlowTime * uWSpeed) / 20.0;
      float dRaw = clamp(uWispDensity, 0.0, 2.0), d = dRaw <= 0.0 ? 1.0 : dRaw;
      int lanes = int(max(1.0, floor(float(W_LANES) * min(d, 1.0) + 0.5)));
      float sp = min(d, 1.0), ep = max(d - 1.0, 0.0);
      float fm = flareY(max(y, 0.0)), rm = clamp(1.0 - (y / (FLARE_H - 3.0)), 0.0, 1.0), cm = fm * rm;
      float xS = 1.0 + (FLARE_AMT * 15.0 * 0.05) * cm;
      float bGain = pow(1.0 - clamp(y / R_V, 0.0, 1.0), 10.0), sum = 0.0;
      for (int s = 0; s < 2; ++s) {
        float sgn = s == 0 ? -1.0 : 1.0;
        for (int i = 0; i < W_LANES; ++i) {
          if (i >= lanes) break;
          float off = 1.5 + float(i) * 0.25, xc = sgn * (off * xS);
          float lat = 1.0 - smoothstep(0.01, 0.16, abs(uv.x - xc)), amp = exp(-off * 0.5);
          float seed = h21(vec2(off, sgn * 17.0)), yf2 = yf + seed * 7.0, ci = floor(yf2), fy = fract(yf2);
          float seg = mix(0.01, 0.55, h21(vec2(ci, off * 2.3)));
          float seg1 = rGate(fy, seg) * step(h21(vec2(ci, off + sgn * 31.0)), sp);
          if (ep > 0.0) seg1 += rGate(fract(fy + 0.5), seg * 0.9) * step(h21(vec2(ci * 3.1 + 7.0, off * 5.3 + sgn * 13.0)), ep);
          sum += amp * lat * seg1;
        }
      }
      float span = smoothstep(-3.0, 0.0, y) * (1.0 - smoothstep(R_V - 6.0, R_V, y));
      return uWK * sum * topF * bGain * span;
    }

    void main() {
      vec2 frag = gl_FragCoord.xy;
      vec2 C = uRes * 0.5; float invW = 1.0 / max(C.x, 1.0);
      float sc = 512.0 / uRes.x * 0.4;
      vec2 uv = (frag - C) * sc, off = vec2(uBeamX * uRes.x * sc, uBeamY * uRes.y * sc);
      vec2 uvc = uv - off;
      float a = 0.0, b = 0.0;
      float basePhase = 1.5 * PI + uDecay * 0.5, tauMin = basePhase - uDecay, tauMax = basePhase;
      // 横向光晕：沿 x 轴的一串点光
      float cx = clamp(uvc.x / (R_H * uHLen), -1.0, 1.0), tH = clamp(TWO_PI - acos(cx), tauMin, tauMax);
      for (int k = -TAPS; k <= TAPS; ++k) {
        float tu = tH + float(k) * DT, wt = tauWf(tu, tauMin, tauMax); if (wt <= 0.0) continue;
        float spd = max(abs(sin(tu)), 0.02), u = clamp((basePhase - tu) / max(uDecay, EPS), 0.0, 1.0), env = pow(1.0 - abs(u * 2.0 - 1.0), 0.8);
        a += wt * bs(uvc, vec2((R_H * uHLen) * cos(tu), 0.0), env * spd);
      }
      // 束身：沿 y 轴的一串椭圆点光，带光流脉动与底部喇叭口
      float yPix = uvc.y, cy = clamp(-yPix / (R_V * uVLen), -1.0, 1.0), tV = clamp(TWO_PI - acos(cy), tauMin, tauMax);
      for (int k = -TAPS; k <= TAPS; ++k) {
        float tu = tV + float(k) * DT, wt = tauWf(tu, tauMin, tauMax); if (wt <= 0.0) continue;
        float yb = (-R_V) * cos(tu), s = clamp(yb / R_V, 0.0, 1.0), spd = max(abs(sin(tu)), 0.02);
        float env = pow(1.0 - s, 0.6) * spd * (1.0 - smoothstep(0.1, 1.0, s));
        float fl = pow(tri01(s / 0.5 + uFlowTime * uFlowSpeed), 1.5);
        env *= mix(1.0 - uFlowK, 1.0, fl);
        float yp = (-R_V * uVLen) * cos(tu), m = pow(smoothstep(FLARE_H, 0.0, yp), 2.0), wx = 1.0 + FLARE_AMT * m;
        b += wt * bsa(uvc, vec2(0.0, yp), step(0.0, yp) * env, vec2(wx, 1.0));
      }
      float sPix = clamp(yPix / R_V, 0.0, 1.0), topA = 1.0 - smoothstep(0.1, 1.0, sPix);
      float L = a + b * topA;
      float w = wisps(vec2(uvc.x, yPix), topA);
      // 雾：域扭曲 fbm，方向随鼠标横向偏斜，向下飘落
      vec2 fuv = uvc * uFogScale;
      float mAct = step(1.0, length(uMouse)), nx = ((uMouse.x - C.x) * invW) * mAct;
      float ax = abs(nx), stMag = mix(ax, pow(ax, 1.5), 0.35);
      float st = clamp(sign(nx) * stMag * uTilt, -0.35, 0.35);
      vec2 dir = normalize(vec2(st, 1.0));
      fuv += uFogTime * uFogFall * dir;
      vec2 prp = vec2(-dir.y, dir.x);
      fuv += prp * (0.08 * sin(dot(uvc, prp) * 0.08 + uFogTime * 0.9));
      float n = pow(clamp(fbm2(fuv + vec2(fbm2(fuv + vec2(7.3, 2.1)), fbm2(fuv + vec2(-3.7, 5.9))) * 0.6), 0.0, 1.0), 1.2);
      float wL = max(fwidth(L), 1.0 / max(uRes.y, 1.0));
      float m0 = pow(smoothstep(0.0 - wL, 0.75 + wL, L), 0.5);
      float bm = 1.0 - pow(1.0 - m0, 12.2); bm = mix(bm * m0, bm, 0.5);
      float yP = 1.0 - smoothstep(25.0, 85.0, abs(yPix));
      float nxF = abs((frag.x - C.x) * invW), hE = pow(clamp(1.0 - smoothstep(0.2, 0.98, nxF), 0.0, 1.0), 1.4);
      float hW = mix(1.0, hE, clamp(yP, 0.0, 1.0));
      float bBias = mix(1.0, 1.0 - sPix, 0.8);
      float radial = 1.0 - smoothstep(0.0, 0.7, length(uvc) / 120.0);
      float fog = n * uFogK * 1.8 * bBias * bm * hW * radial;
      // 合成
      float LF = L + fog;
      float dith = (h21(frag) - 0.5) * (1.0 / 255.0);
      vec3 col = srgb(LF + w) * uColor + dith;
      float alpha = clamp(srgb(L + w * 0.6) + dith * 0.6, 0.0, 1.0);
      float xF = pow(clamp(1.0 - smoothstep(0.22, 0.995, nxF), 0.0, 1.0), 1.25);
      float hi = smoothstep(0.0, 2.0, LF + max(0.0, w) * 0.5);
      float eM = mix(xF, 1.0, hi);
      fragColor = vec4(col * eM * uFade, alpha * eM * uFade);
    }
  `;

  // ---- WebGL 底座 ----
  function compile(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  const U = (n) => gl.getUniformLocation(prog, n);
  const hexRgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);

  const dpr = Math.min(2, devicePixelRatio || 1) * RENDER_SCALE;
  function resize() {
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(U('uRes'), canvas.width, canvas.height);
  }
  resize(); addEventListener('resize', resize);
  gl.uniform3fv(U('uColor'), hexRgb(CONFIG.color));
  gl.uniform1f(U('uWispDensity'), WISP_DENSITY);
  gl.uniform1f(U('uTilt'), CONFIG.mouseTiltStrength);
  gl.uniform1f(U('uBeamX'), CONFIG.horizontalBeamOffset);
  gl.uniform1f(U('uBeamY'), CONFIG.verticalBeamOffset);
  gl.uniform1f(U('uFlowSpeed'), CONFIG.flowSpeed);
  gl.uniform1f(U('uVLen'), CONFIG.verticalSizing);
  gl.uniform1f(U('uHLen'), CONFIG.horizontalSizing);
  gl.uniform1f(U('uFogK'), CONFIG.fogIntensity);
  gl.uniform1f(U('uFogScale'), FOG_SCALE);
  gl.uniform1f(U('uWSpeed'), WISP_SPEED);
  gl.uniform1f(U('uWK'), CONFIG.wispIntensity);
  gl.uniform1f(U('uFlowK'), CONFIG.flowStrength);
  gl.uniform1f(U('uDecay'), DECAY);
  gl.uniform1f(U('uFalloff'), FALLOFF_START);
  gl.uniform1f(U('uFogFall'), FOG_FALL);
  const uFlowTime = U('uFlowTime'), uFogTime = U('uFogTime'), uFade = U('uFade'), uMouse = U('uMouse');

  // 鼠标像素坐标（y 向上，乘渲染缩放）；离开归零（归零表示无鼠标）
  const mouse = { x: 0, y: 0 };
  addEventListener('pointermove', (e) => { mouse.x = e.clientX * dpr; mouse.y = (innerHeight - e.clientY) * dpr; });
  document.addEventListener('mouseleave', () => { mouse.x = 0; mouse.y = 0; });

  let flowTime = reduceMotion ? 3 : 0, fogTime = flowTime, fade = reduceMotion ? 1 : 0, last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    if (document.hidden) { last = now; return; }
    const dt = Math.min(0.033, Math.max(0.001, (now - last) / 1000));
    last = now;
    if (!reduceMotion) { flowTime += dt; fogTime += dt; fade = Math.min(1, fade + dt); }   // 1 秒淡入
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(uFlowTime, flowTime);
    gl.uniform1f(uFogTime, fogTime);
    gl.uniform1f(uFade, fade);
    gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  gl.clearColor(0, 0, 0, 0);
  requestAnimationFrame(frame);
</script>
</body>
</html>
