<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光柱背景</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-spread: 14deg;      /* 光柱张角 */
    --mt-period: 9s;         /* 摇摆周期 */
    --mt-blur: 20px;         /* 边缘柔化 */
    --mt-intensity: 0.75;    /* 亮度 */
    --mt-reach: 70%;         /* 照射深度：光在画面多深处衰减到看不见 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; }
  .mt-stage { position: fixed; inset: 0; overflow: hidden; }
  /* 每道光柱是一张铺满全宽、上下各多出 20% 的层：
     - 锥形用角向渐变画出（顶点在视口上方），角度上的渐变过渡本身就是柔边，不用任何裁切
     - 纵向用遮罩渐变衰减，越往下越淡
     - 再叠一层模糊把边缘揉开；层与层用 screen 叠亮 */
  .mt-pillar {
    position: absolute;
    /* 左右各外扩 50%：大张角 + 大摇摆时旋转也不会露出层的边界；顶点坐标随之换算 */
    left: -50%; right: -50%;
    top: -20%;
    height: 140%;
    --ax: calc(25% + var(--x) / 2);
    /* --pc 是这一道射灯自己的颜色，由 JS 按颜色列表轮流写入 */
    --c1: color-mix(in srgb, var(--pc) calc(var(--mt-intensity) * 100%), transparent);
    --c2: color-mix(in srgb, var(--pc) calc(var(--mt-intensity) * 45%), transparent);
    --c3: color-mix(in srgb, var(--pc) calc(var(--mt-intensity) * 14%), transparent);
    /* 两层锥形叠加：里层是光的主体，外层是一圈更宽更淡的光晕 */
    background:
      conic-gradient(from calc(180deg - var(--mt-spread) / 2) at var(--ax) 0,
        transparent 0deg,
        var(--c2) calc(var(--mt-spread) * 0.28),
        var(--c1) calc(var(--mt-spread) * 0.5),
        var(--c2) calc(var(--mt-spread) * 0.72),
        transparent var(--mt-spread)),
      conic-gradient(from calc(180deg - var(--mt-spread) * 1.1) at var(--ax) 0,
        transparent 0deg,
        var(--c3) calc(var(--mt-spread) * 1.1),
        transparent calc(var(--mt-spread) * 2.2));
    -webkit-mask-image: linear-gradient(to bottom, #000 14%, rgba(0, 0, 0, 0.7) 40%, transparent var(--mt-reach));
    mask-image: linear-gradient(to bottom, #000 14%, rgba(0, 0, 0, 0.7) 40%, transparent var(--mt-reach));
    filter: blur(var(--mt-blur));
    transform-origin: var(--ax) 0;
    animation:
      mt-sway var(--mt-period) ease-in-out infinite alternate,
      mt-breathe calc(var(--mt-period) * 0.7) ease-in-out infinite alternate;
    animation-delay: var(--d), calc(var(--d) * 0.6);
    mix-blend-mode: screen;
    will-change: transform;
  }
  @keyframes mt-sway {
    from { transform: rotate(calc(var(--sway) * -1)); }
    to   { transform: rotate(var(--sway)); }
  }
  @keyframes mt-breathe { from { opacity: 0.65; } to { opacity: 1; } }

  /* 用户开启「减少动态效果」时：光柱静止 */
  @media (prefers-reduced-motion: reduce) {
    .mt-pillar { animation: none; }
  }
</style>
</head>
<body>
<div class="mt-stage" id="mtStage" aria-hidden="true"></div>
<script>
  const CONFIG = {
    count: 4,   // 光柱数量
    sway: 6,    // 摇摆幅度（度）
    colors: ["#ffffff"], // 射灯颜色：按顺序轮流分配给每道光，颗数多于颜色数时从头再来
  };
  const stage = document.getElementById('mtStage');
  // 光柱顶点在宽度上均匀分布，各自错开相位，颜色按列表轮流取
  for (let i = 0; i < CONFIG.count; i++) {
    const p = document.createElement('div');
    p.className = 'mt-pillar';
    p.style.setProperty('--x', ((i + 0.5) / CONFIG.count * 100) + '%');
    p.style.setProperty('--sway', CONFIG.sway + 'deg');
    p.style.setProperty('--d', (-i * 1.7) + 's');
    p.style.setProperty('--pc', CONFIG.colors[i % CONFIG.colors.length]);
    stage.appendChild(p);
  }
  // 纯 CSS 动画：页面切到后台时浏览器自动暂停渲染
</script>
</body>
</html>
