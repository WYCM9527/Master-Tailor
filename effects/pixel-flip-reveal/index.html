<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>像素块揭示卡片</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-pixelColor: #ffffff; /* 像素块翻走瞬间的过渡色 */
    --mt-rounded: 12px;      /* 卡片圆角 */
  }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mt-bg);
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .mt-card {
    position: relative;
    width: min(420px, 84vw);
    aspect-ratio: 4 / 3;
    border-radius: var(--mt-rounded);
    overflow: hidden;
    cursor: pointer;
    background: #14151f;
  }
  /* 两层内容：封面与揭示图叠着，谁在上由 JS 切换；像素层盖在最上面 */
  .mt-card .face {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .mt-card .face.hidden { display: none; }
  .mt-card .grid {
    position: absolute; inset: 0;
    display: grid;
    pointer-events: none;
  }
  /* 像素块：纯色小方块，两段式——先一格格盖满整卡，换图，再一格格散去 */
  .mt-card .px { background: var(--mt-pixelColor); display: none; }
  .mt-card .px.on { display: block; }

  /* 用户开启「减少动态效果」时：悬停直接切换到揭示图（JS 同步处理） */
</style>
</head>
<body>
<div class="mt-card" id="mtCard">
  <img class="face" id="mtFront" alt="">
  <img class="face hidden" id="mtBack" alt="">
  <div class="grid" id="mtGrid" aria-hidden="true"></div>
</div>
<script>
  const CONFIG = {
    front: "/samples/sample-4.webp", // 封面图
    back: "/samples/sample-8.webp",  // 揭示图
    grid: 7,           // 像素格数（每边）
    duration: 0.3,     // 每一段（盖满 / 散去）的时长（秒）
    order: "random",   // 像素出现顺序：random 随机 / wave 左上到右下 / center 中心向外
  };

  const card = document.getElementById('mtCard');
  const grid = document.getElementById('mtGrid');
  const front = document.getElementById('mtFront'), back = document.getElementById('mtBack');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  front.src = CONFIG.front; back.src = CONFIG.back;
  const n = CONFIG.grid;
  grid.style.gridTemplateColumns = 'repeat(' + n + ', 1fr)';
  grid.style.gridTemplateRows = 'repeat(' + n + ', 1fr)';

  // 每格的出场次序：随机 / 按 (c + r) 斜扫 / 按到中心的距离
  const cells = [];
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    const el = document.createElement('div');
    el.className = 'px';
    let rank;
    if (CONFIG.order === 'wave') rank = (c + r) / (2 * (n - 1));
    else if (CONFIG.order === 'center') rank = Math.hypot(c - (n - 1) / 2, r - (n - 1) / 2) / (Math.SQRT2 * (n - 1) / 2);
    else rank = Math.random();
    grid.appendChild(el);
    cells.push({ el, rank });
  }
  const ordered = cells.slice().sort((a, b) => a.rank - b.rank);

  /* 两段式动画：① 像素按次序逐个出现盖满整卡（时长 duration）；② 到点后换图；③ 像素再按同一次序逐个消失 */
  let active = false, timers = [];
  function animate(activate) {
    timers.forEach(clearTimeout); timers = [];
    active = activate;
    if (reduceMotion) { front.classList.toggle('hidden', activate); back.classList.toggle('hidden', !activate); return; }
    const each = (CONFIG.duration * 1000) / ordered.length;
    ordered.forEach(({ el }) => el.classList.remove('on'));
    ordered.forEach(({ el }, i) => timers.push(setTimeout(() => el.classList.add('on'), i * each)));
    timers.push(setTimeout(() => { front.classList.toggle('hidden', activate); back.classList.toggle('hidden', !activate); }, CONFIG.duration * 1000));
    ordered.forEach(({ el }, i) => timers.push(setTimeout(() => el.classList.remove('on'), CONFIG.duration * 1000 + i * each)));
  }
  card.addEventListener('pointerenter', () => { if (!active) animate(true); });
  card.addEventListener('pointerleave', () => { if (active) animate(false); });
  card.addEventListener('click', () => animate(!active));

  /* @mt:thumb-start */
  // 缩略图演示：自动翻开 / 盖回循环；真实鼠标进入后停止
  if (!reduceMotion) {
    let auto = true;
    card.addEventListener('pointerenter', () => (auto = false));
    setInterval(() => {
      if (document.hidden || !auto) return;
      animate(!active);
    }, CONFIG.duration * 2000 + 1500);
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
