<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>细丝波浪</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* 用户开启「减少动态效果」时：JS 停止时间推进，保留一帧静态丝束 */
  @media (prefers-reduced-motion: reduce) { canvas { opacity: 0.9; } }
</style>
</head>
<body>
<canvas id="mtCanvas" aria-hidden="true"></canvas>
<script>
  const CONFIG = {
    color: "#ffffff",  // 丝线颜色
    lineCount: 40,     // 丝线数量
    amplitude: 1,      // 波动幅度
    spread: 0,         // 散开程度
    mouse: false,      // 鼠标扰动
  };

  const canvas = document.getElementById('mtCanvas');
  const gl = canvas.getContext('webgl', { alpha: false });
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const VS = `
    attribute vec2 aPos;
    void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
  `;
  // 片元着色器：N 条细丝各自用 Perlin 噪声决定 y 位移，
  // 左端拧成一束（幅度沿 x 渐入），越靠后的丝越细、越模糊，透明度连乘叠加
  const FS = `
    precision highp float;
    uniform float uTime;    // 时间（秒）
    uniform vec3  uRes;     // 分辨率（z = 宽高比）
    uniform vec3  uColor;   // 丝线颜色
    uniform float uAmp;     // 波动幅度
    uniform float uSpread;  // 散开程度（0 一束 / 1 铺满）
    uniform float uCount;   // 丝线数量
    uniform vec2  uMouse;   // 鼠标（0–1，y 向上；扰动幅度与相位）

    #define PI 3.1415926538
    const int MAX_LINES = 60;       // WebGL1 循环上限必须是常量
    const float LINE_W = 7.0;       // 基准线宽（像素）
    const float LINE_BLUR = 10.0;   // 边缘羽化（像素）

    /* 经典 Perlin 2D（公域实现，哈希取梯度 + 五次插值） */
    float perlin(vec2 P) {
      vec2 Pi = floor(P);
      vec4 Pf_Pfmin1 = P.xyxy - vec4(Pi, Pi + 1.0);
      vec4 Pt = vec4(Pi.xy, Pi.xy + 1.0);
      Pt = Pt - floor(Pt * (1.0 / 71.0)) * 71.0;
      Pt += vec2(26.0, 161.0).xyxy;
      Pt *= Pt;
      Pt = Pt.xzxz * Pt.yyww;
      vec4 hash_x = fract(Pt * (1.0 / 951.135664));
      vec4 hash_y = fract(Pt * (1.0 / 642.949883));
      vec4 grad_x = hash_x - 0.49999;
      vec4 grad_y = hash_y - 0.49999;
      vec4 grad_results = inversesqrt(grad_x * grad_x + grad_y * grad_y)
        * (grad_x * Pf_Pfmin1.xzxz + grad_y * Pf_Pfmin1.yyww);
      grad_results *= 1.4142135623730950;
      vec2 blend = Pf_Pfmin1.xy * Pf_Pfmin1.xy * Pf_Pfmin1.xy
        * (Pf_Pfmin1.xy * (Pf_Pfmin1.xy * 6.0 - 15.0) + 10.0);
      vec4 blend2 = vec4(blend, vec2(1.0 - blend));
      return dot(grad_results, blend2.zxzx * blend2.wwyy);
    }

    /* 1 像素在归一坐标里的大小 */
    float px(float count) { return (1.0 / max(uRes.x, uRes.y)) * count; }

    /* 单条丝：返回该像素被这条丝覆盖的不透明度 */
    float lineFn(vec2 st, float width, float perc, vec2 mouse, float time) {
      float split_offset = perc * 0.4;
      float split_point = 0.1 + split_offset;                    // 每条丝「开始散开」的 x 位置

      /* 幅度沿 x 渐入：左端收拢成束，右侧才荡开；鼠标 y 微调整体幅度 */
      float amp_norm = smoothstep(split_point, 0.7, st.x);
      float finalAmp = amp_norm * 0.5 * uAmp * (1.0 + (mouse.y - 0.5) * 0.2);

      float time_scaled = time / 10.0 + (mouse.x - 0.5) * 1.0;   // 鼠标 x 拨动相位
      float blur = smoothstep(split_point, split_point + 0.05, st.x) * perc;

      /* 两套频率的 Perlin 混合：低频大摆 + 高频细颤 */
      float xnoise = mix(
        perlin(vec2(time_scaled, st.x + perc) * 2.5),
        perlin(vec2(time_scaled, st.x + time_scaled) * 3.5) / 1.5,
        st.x * 0.3
      );

      /* 该丝的中心线 y：束心 0.5 + 散开偏移 + 噪声摆动 */
      float y = 0.5 + (perc - 0.5) * uSpread + xnoise / 2.0 * finalAmp;

      float line_start = smoothstep(y + width / 2.0 + LINE_BLUR * px(1.0) * blur, y, st.y);
      float line_end = smoothstep(y, y - width / 2.0 - LINE_BLUR * px(1.0) * blur, st.y);
      /* 越后面的丝（perc 大）整体越淡 */
      return clamp((line_start - line_end) * (1.0 - smoothstep(0.0, 1.0, pow(perc, 0.3))), 0.0, 1.0);
    }

    void main() {
      vec2 uv = gl_FragCoord.xy / uRes.xy;
      /* 不透明度连乘：每条丝在其上「打洞」，天然处理丝与丝的叠加 */
      float strength = 1.0;
      for (int i = 0; i < MAX_LINES; i++) {
        if (float(i) >= uCount) break;
        float p = float(i) / uCount;
        strength *= (1.0 - lineFn(uv, LINE_W * px(1.0) * (1.0 - p), p, uMouse, uTime));
      }
      float c = 1.0 - strength;
      gl_FragColor = vec4(uColor * c, 1.0);
    }
  `;

  // ---- WebGL 底座 ----
  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  const U = (n) => gl.getUniformLocation(prog, n);

  function hexRgb(hex) {
    const h = hex.replace('#', '');
    return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16) / 255);
  }

  const dpr = Math.min(2, devicePixelRatio || 1);
  function resize() {
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform3f(U('uRes'), canvas.width, canvas.height, canvas.width / canvas.height);
  }

  gl.uniform3fv(U('uColor'), hexRgb(CONFIG.color));
  gl.uniform1f(U('uAmp'), CONFIG.amplitude);
  gl.uniform1f(U('uSpread'), CONFIG.spread);
  gl.uniform1f(U('uCount'), CONFIG.lineCount);
  const uTime = U('uTime'), uMouse = U('uMouse');
  resize(); addEventListener('resize', resize);

  // 鼠标扰动（y 调幅、x 拨相位），关闭时钉在中点；开启时 5% 平滑趋近
  let tx = 0.5, ty = 0.5, cx = 0.5, cy = 0.5;
  if (CONFIG.mouse) {
    addEventListener('pointermove', (e) => {
      tx = e.clientX / innerWidth;
      ty = 1 - e.clientY / innerHeight;
    });
    addEventListener('pointerleave', () => { tx = 0.5; ty = 0.5; });
  }

  let time = reduceMotion ? 10 : 0;   // 减少动态：定格一帧成型的丝束
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    if (document.hidden) { last = now; return; }   // 切后台暂停
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!reduceMotion) time += dt;
    cx += 0.05 * (tx - cx);
    cy += 0.05 * (ty - cy);
    gl.uniform1f(uTime, time);
    gl.uniform2f(uMouse, cx, cy);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
