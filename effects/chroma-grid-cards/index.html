<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>彩光网格卡片</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-radius: 260px;      /* 聚光半径 */
    --mt-softness: 60%;      /* 边缘柔度 */
    --mt-borderGlow: 1;      /* 边框跟随亮起：1 开 / 0 关 */
    --mt-rounded: 12px;      /* 卡片圆角 */
  }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mt-bg);
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .mt-wall {
    position: relative;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    width: min(960px, 94vw);
    padding: 14px;
  }
  .mt-card {
    position: relative;
    aspect-ratio: 4 / 3;
    border-radius: var(--mt-rounded);
    overflow: hidden;
    /* 每卡专属彩色渐变底 + 悬停时亮起同色描边 */
    background: var(--card-grad, #14151f);
    border: 1px solid #333;
    transition: border-color 0.3s ease;
  }
  .mt-card:hover { border-color: var(--card-border, #fff); }
  /* 卡内跟随鼠标的高光：白色径向光斑叠在图上（图本身略透，露出彩色底） */
  .mt-card::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: inherit;
    background: radial-gradient(circle at var(--gx, 50%) var(--gy, 50%), rgba(255, 255, 255, 0.3), transparent 70%);
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
    z-index: 2;
  }
  .mt-card:hover::after { opacity: 1; }
  .mt-card::before {
    content: '';
    position: absolute; inset: -1px;
    border-radius: inherit;
    padding: 1px;
    background: radial-gradient(180px at var(--gx) var(--gy), rgba(255, 255, 255, calc(0.9 * var(--mt-borderGlow))), transparent 70%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    pointer-events: none;
    z-index: 2;
  }
  .mt-card img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0.92;
  }
  .mt-card .cap {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 30px 14px 12px;
    color: #fff; font-size: 13px; font-weight: 600;
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.6));
  }
  /* 去色罩：整墙盖一层灰度滤镜，用径向渐变遮罩在鼠标处挖出一个透明洞 */
  .mt-veil {
    position: absolute; inset: 0;
    -webkit-backdrop-filter: grayscale(1) brightness(0.6);
    backdrop-filter: grayscale(1) brightness(0.6);
    -webkit-mask: radial-gradient(circle var(--mt-radius) at var(--mx) var(--my), transparent calc(100% - var(--mt-softness)), #000 100%);
    mask: radial-gradient(circle var(--mt-radius) at var(--mx) var(--my), transparent calc(100% - var(--mt-softness)), #000 100%);
    pointer-events: none;
    z-index: 3;
  }

  /* 用户开启「减少动态效果」时：去色罩不跟随（保持中心位置） */
  @media (prefers-reduced-motion: reduce) {
    .mt-veil { transition: none; }
  }
</style>
</head>
<body>
<div class="mt-wall" id="mtWall">
  <div class="mt-veil" id="mtVeil" aria-hidden="true"></div>
</div>
<script>
  const CONFIG = {
    slides: [{ src: '/samples/sample-1.webp', caption: '示例' }], // 卡片图片（图 + 标题）
    lag: 0.25,  // 跟随迟滞（1 完全跟手）
  };

  const wall = document.getElementById('mtWall');
  const veil = document.getElementById('mtVeil');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // 每张卡一套专属色：描边色 + 从该色斜向压暗到黑的渐变底
  const PALETTE = [['#4f46e5', 145], ['#10b981', 210], ['#f59e0b', 165], ['#ef4444', 195], ['#8b5cf6', 225], ['#06b6d4', 135]];
  const cards = CONFIG.slides.map((s, i) => {
    const c = document.createElement('div');
    c.className = 'mt-card';
    const [col, ang] = PALETTE[i % PALETTE.length];
    c.style.setProperty('--card-border', col);
    c.style.setProperty('--card-grad', `linear-gradient(${ang}deg, ${col}, #000)`);
    const img = document.createElement('img'); img.src = s.src; img.alt = s.caption || '';
    const cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = s.caption || '';
    c.append(img, cap);
    wall.insertBefore(c, veil);
    return c;
  });

  // 鼠标位置（相对墙）插值后写入遮罩中心与各卡边框光心
  let tx = -9999, ty = -9999, x = wall.clientWidth / 2, y = wall.clientHeight / 2, auto = true;
  wall.addEventListener('pointermove', e => {
    auto = false;
    const r = wall.getBoundingClientRect();
    tx = e.clientX - r.left; ty = e.clientY - r.top;
  });
  wall.addEventListener('pointerleave', () => { tx = -9999; ty = -9999; });
  document.documentElement.addEventListener('pointerleave', () => (auto = true));

  function frame() {
    if (!document.hidden) {
      const k = reduceMotion ? 1 : CONFIG.lag;
      x += (tx - x) * k; y += (ty - y) * k;
      veil.style.setProperty('--mx', x + 'px'); veil.style.setProperty('--my', y + 'px');
      for (const c of cards) {
        c.style.setProperty('--gx', (x - c.offsetLeft) + 'px');
        c.style.setProperty('--gy', (y - c.offsetTop) + 'px');
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* @mt:thumb-start */
  // 缩略图演示：虚拟指针在墙上游走；真实鼠标一动就交还
  if (!reduceMotion) {
    let t = 0;
    setInterval(() => {
      if (document.hidden || !auto) return;
      t += 0.025;
      tx = wall.clientWidth * (0.5 + 0.4 * Math.sin(t)); ty = wall.clientHeight * (0.5 + 0.35 * Math.sin(t * 1.6));
    }, 30);
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
