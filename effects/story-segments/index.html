<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分段故事进度</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0e0e10;            /* 页面底色 */
    --mt-color: #ffffff;         /* 进度色：分段条已经播过的部分 */
    --mt-gap: 4px;               /* 段间距 */
    --mt-height: 2.5px;          /* 条高 */
    --mt-radius: 18px;           /* 卡片圆角 */
    --mt-font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; /* 字体 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; display: grid; place-items: center; font-family: var(--mt-font); }
  /* 竖版卡片：9:16，图片铺满裁切 */
  .mt-story { position: relative; width: min(360px, 88vw, calc(88vh * 9 / 16)); aspect-ratio: 9 / 16; border-radius: var(--mt-radius); overflow: hidden; background: #000; color: #fff; cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; outline: none; }
  .mt-story:focus-visible { box-shadow: 0 0 0 2px var(--mt-color); }
  .mt-media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.15s; pointer-events: none; -webkit-user-drag: none; }
  .mt-media img.on { opacity: 1; }
  /* 叠在图上的界面：按住时整体淡出 */
  .mt-ui { position: absolute; inset: 0; pointer-events: none; transition: opacity 0.2s; }
  .mt-story.hide-ui .mt-ui { opacity: 0; }
  .mt-top { position: absolute; left: 0; right: 0; top: 0; padding: 10px 10px 32px; background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0)); }
  .mt-bars { display: flex; gap: var(--mt-gap); }
  .mt-seg { flex: 1; height: var(--mt-height); border-radius: calc(var(--mt-height) / 2); background: rgba(255, 255, 255, 0.35); overflow: hidden; }
  .mt-seg i { display: block; height: 100%; background: var(--mt-color); transform-origin: left; transform: scaleX(0); }
  .mt-head { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); }
  .mt-avatar { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; background: #f2b84b; color: #3a2400; font-weight: 700; font-size: 13px; text-shadow: none; }
  .mt-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mt-time { opacity: 0.7; white-space: nowrap; }
  .mt-icons { margin-left: auto; display: flex; gap: 12px; flex: none; }
  .mt-icons svg { width: 20px; height: 20px; display: block; }
  /* 图片说明：下方三分之一处的文字贴纸，没有说明就不显示 */
  .mt-caption { position: absolute; left: 50%; top: 66%; transform: translateX(-50%); max-width: 80%; padding: 6px 12px; border-radius: 8px; background: rgba(0, 0, 0, 0.55); font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mt-caption:empty { display: none; }
  .mt-foot { position: absolute; left: 0; right: 0; bottom: 0; padding: 32px 12px 14px; display: flex; align-items: center; gap: 14px; background: linear-gradient(rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.4)); }
  .mt-reply { flex: 1; min-width: 0; height: 38px; box-sizing: border-box; border-radius: 19px; border: 1px solid rgba(255, 255, 255, 0.6); display: flex; align-items: center; padding: 0 14px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mt-foot svg { width: 24px; height: 24px; flex: none; display: block; }

  /* 用户开启「减少动态效果」时：切图不淡入、图片不缓慢放大（进度照常走） */
  @media (prefers-reduced-motion: reduce) {
    .mt-media img, .mt-ui { transition: none; }
  }
</style>
</head>
<body>
<div class="mt-story" id="mtStory" tabindex="0" aria-label="故事：轻点右侧下一段、左侧上一段，按住暂停">
  <div class="mt-media" id="mtMedia"></div>
  <div class="mt-ui">
    <div class="mt-top">
      <div class="mt-bars" id="mtBars"></div>
      <div class="mt-head">
        <span class="mt-avatar" id="mtAvatar" aria-hidden="true"></span>
        <span class="mt-name" id="mtName"></span>
        <span class="mt-time" id="mtTime"></span>
        <span class="mt-icons" aria-hidden="true">
          <!-- IconPark: more -->
          <svg viewBox="0 0 48 48" fill="none"><circle cx="12" cy="24" r="3" fill="currentColor"/><circle cx="24" cy="24" r="3" fill="currentColor"/><circle cx="36" cy="24" r="3" fill="currentColor"/></svg>
          <!-- IconPark: close -->
          <svg viewBox="0 0 48 48" fill="none"><path d="M8 8L40 40" stroke="currentColor" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/><path d="M8 40L40 8" stroke="currentColor" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/></svg>
        </span>
      </div>
    </div>
    <div class="mt-caption" id="mtCaption"></div>
    <div class="mt-foot" aria-hidden="true">
      <span class="mt-reply" id="mtReply"></span>
      <!-- IconPark: like -->
      <svg viewBox="0 0 48 48" fill="none"><path d="M15 8C8.92487 8 4 12.9249 4 19C4 30 17 40 24 42.3262C31 40 44 30 44 19C44 12.9249 39.0751 8 33 8C29.2797 8 25.9907 9.8469 24 12.6738C22.0093 9.8469 18.7203 8 15 8Z" stroke="currentColor" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/></svg>
      <!-- IconPark: send -->
      <svg viewBox="0 0 48 48" fill="none"><path d="M43 5L29.7 43L22.1 25.9L5 18.3L43 5Z" stroke="currentColor" stroke-width="4" stroke-linejoin="miter"/><path d="M43.0001 5L22.1001 25.9" stroke="currentColor" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/></svg>
    </div>
  </div>
</div>
<script>
  const CONFIG = {
    slides: [{ src: "/samples/sample-1.webp", caption: "夜枭小憩" }, { src: "/samples/sample-5.webp", caption: "" }, { src: "/samples/sample-7.webp", caption: "抬头看看" }, { src: "/samples/sample-6.webp", caption: "" }], // 幻灯片：每张图是一段故事；说明文字显示成图上的文字贴纸，留空不显示
    duration: 5,          // 每段时长（秒）
    name: "裁缝大师",     // 账号名
    loop: true,           // 循环播放：播完最后一段回到第一段；关闭则停在结尾
    hideOnHold: true,     // 按住时隐藏界面
  };
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (id) => document.getElementById(id);
  const story = $('mtStory'), media = $('mtMedia'), bars = $('mtBars'), caption = $('mtCaption'), timeEl = $('mtTime');
  const slides = CONFIG.slides.length ? CONFIG.slides : [{ src: '', caption: '' }];
  const N = slides.length, DUR = Math.max(0.5, CONFIG.duration) * 1000;
  const HOLD_MS = 220;   // 按下超过这个时长算「按住」，松开不跳段

  const imgs = slides.map((s, i) => {
    const im = new Image();
    im.decoding = 'async'; im.draggable = false; im.alt = s.caption || `第 ${i + 1} 段`; im.src = s.src;
    media.appendChild(im);
    return im;
  });
  const fills = slides.map(() => {
    const seg = document.createElement('div'), f = document.createElement('i');
    seg.className = 'mt-seg'; seg.appendChild(f); bars.appendChild(seg);
    return f;
  });
  $('mtName').textContent = CONFIG.name;
  $('mtAvatar').textContent = (CONFIG.name || '·').slice(0, 1);
  $('mtReply').textContent = `回复 ${CONFIG.name}…`;

  // cur：当前段；elapsed：本段已播毫秒；holding：按住中；paused：键盘暂停；ended：不循环时播完停在结尾
  let cur = 0, elapsed = 0, holding = false, paused = false, ended = false;
  function show(i) {
    cur = Math.min(N - 1, Math.max(0, i)); elapsed = 0; ended = false;
    imgs.forEach((im, k) => { im.classList.toggle('on', k === cur); if (k !== cur) im.style.transform = ''; });
    fills.forEach((f, k) => { f.style.transform = `scaleX(${k < cur ? 1 : 0})`; });
    caption.textContent = slides[cur].caption || '';
    timeEl.textContent = cur === N - 1 ? '刚刚' : `${(N - 1 - cur) * 2} 小时`;
  }
  function next() {
    if (cur < N - 1) show(cur + 1);
    else if (CONFIG.loop) show(0);
    else { elapsed = DUR; ended = true; paint(); }
  }
  function prev() { show(cur - 1); }   // 第一段时等于重播本段

  function paint() {
    const k = Math.min(1, elapsed / DUR);
    fills[cur].style.transform = `scaleX(${k})`;
    if (!reduceMotion) imgs[cur].style.transform = `scale(${1 + 0.06 * k})`;   // 本段里图片缓慢放大一点点
  }
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(100, now - last); last = now;
    if (document.hidden) return;
    // 当前图还没加载完（complete 为假）时不计时，避免黑屏时进度已经在走
    if (!holding && !paused && !ended && imgs[cur].complete) {
      elapsed += dt;
      if (elapsed >= DUR) { next(); return; }
    }
    paint();
  }

  // 按下立即暂停；HOLD_MS 内松开算轻点：左 30% 回上一段，其余跳下一段；按住更久松开只恢复播放
  let downAt = 0, downX = 0, holdTimer = 0;
  story.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    holding = true; downAt = performance.now(); downX = e.clientX;
    story.setPointerCapture(e.pointerId);
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => { if (holding && CONFIG.hideOnHold) story.classList.add('hide-ui'); }, HOLD_MS);
  });
  function release(tap) {
    if (!holding) return;
    holding = false; clearTimeout(holdTimer);
    story.classList.toggle('hide-ui', paused && CONFIG.hideOnHold);
    if (tap && performance.now() - downAt < HOLD_MS) {
      const r = story.getBoundingClientRect();
      if (downX - r.left < r.width * 0.3) prev(); else next();
    }
  }
  story.addEventListener('pointerup', () => release(true));
  story.addEventListener('pointercancel', () => release(false));
  story.addEventListener('contextmenu', (e) => e.preventDefault());   // 长按不弹系统菜单
  story.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') next();
    else if (e.key === 'ArrowLeft') prev();
    else if (e.key === ' ' || e.key === 'Enter') { paused = !paused; story.classList.toggle('hide-ui', paused && CONFIG.hideOnHold); }
    else return;
    e.preventDefault();
  });

  show(0);
  requestAnimationFrame(frame);
</script>
</body>
</html>
