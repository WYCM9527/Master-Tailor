<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>镜面高光按钮</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
  }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mt-bg);
    display: grid; place-items: center;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  /* 按钮本体：透明底、只有一点内高光与投影，边缘的光全部交给叠在上面的 canvas */
  .mt-wrap { position: relative; display: inline-block; }
  .mt-btn {
    position: relative;
    margin: 0; border: 0; outline: none; cursor: pointer;
    padding: 18px 40px;
    font-size: 1.15rem; font-weight: 500; letter-spacing: 0.01em; line-height: 1;
    color: #f5f5f5;
    background: transparent;
    border-radius: var(--radius, 18px);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 8px 24px rgba(0, 0, 0, 0.25);
    transition: transform 0.15s ease;
  }
  .mt-btn:active { transform: scale(0.97); }
  .mt-btn:focus-visible { outline: 2px solid rgba(255,255,255,0.6); outline-offset: 3px; }
  .mt-btn { display: block; }   /* 块级，外层 wrap 不留行内基线空隙 */
  /* 光层：比按钮四周各大 20px，让高光的羽化有地方呼吸。
     canvas 是替换元素，绝对定位下 inset 不会拉伸它，必须显式给 CSS 宽高，否则按 dpr 倍的属性尺寸显示 */
  .mt-fx {
    position: absolute; left: -20px; top: -20px;
    width: calc(100% + 40px); height: calc(100% + 40px);
    pointer-events: none;
  }
  /* 用户开启「减少动态效果」时：光角不再自转（JS 同步处理） */
</style>
</head>
<body>
<div class="mt-wrap" id="mtWrap">
  <canvas class="mt-fx" id="mtFx" aria-hidden="true"></canvas>
  <button type="button" class="mt-btn" id="mtBtn">立即开始</button>
</div>
<script>
  const CONFIG = {
    label: "立即开始",     // 按钮文字
    radius: 18,            // 圆角（px）
    lineColor: "#ffffff",  // 高光颜色
    baseColor: "#525252",  // 边线底色
    intensity: 1,          // 高光强度
    shineSize: 10,         // 高光段长（度）
    shineFade: 40,         // 高光羽化（度）
    thickness: 1,          // 光线粗细（px）
    speed: 0.35,           // 闲置转速
    autoAnimate: true,     // 常亮自转
  };
  const PAD = 20, PROXIMITY = 250;

  const wrap = document.getElementById('mtWrap');
  const btn = document.getElementById('mtBtn');
  const canvas = document.getElementById('mtFx');
  const gl = canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: false });
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  btn.textContent = CONFIG.label;
  btn.style.setProperty('--radius', CONFIG.radius + 'px');

  const VS = `#version 300 es
    precision highp float;
    in vec2 aPos;
    void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
  `;
  // 片元着色器：圆角矩形 SDF 给出「到按钮边缘的距离」d；
  // 边缘处画一条高斯细线，再用「椭圆法线与光向的夹角」开一个角度窗口，
  // 只让面向 / 背向光源的两段边缘亮起 —— 就是金属边框上那两段对称的镜面反光
  const FS = `#version 300 es
    precision highp float;
    uniform vec2  uCenter;     // 按钮中心（像素）
    uniform vec2  uHalfSize;   // 按钮半宽高（像素）
    uniform float uRadius;     // 圆角（像素）
    uniform float uAngle;      // 光向角
    uniform float uPx;         // 1 个 CSS 像素对应的物理像素
    uniform vec3  uLineColor;  // 高光色
    uniform vec3  uBaseColor;  // 边线底色
    uniform float uIntensity;  // 高光强度（含靠近亮度）
    uniform float uShineSize;  // 高光核心角宽（弧度）
    uniform float uShineFade;  // 高光羽化角宽（弧度）
    uniform float uThickness;  // 光线粗细（像素）
    uniform float uBaseWidth;  // 底边线宽（像素）
    out vec4 fragColor;

    float sdRoundedRect(vec2 p, vec2 b, float r) {
      vec2 q = abs(p) - b + r;
      return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
    }
    /* 高斯细线：中心亮、两侧快速衰减，外侧衰减略快 */
    float gaussianLine(float d, float sigma) {
      float x = d / (sigma + 1e-6);
      float k = mix(1.0, 1.6, smoothstep(0.0, 1.5, x));
      return exp(-k * x * x);
    }

    void main() {
      vec2 p = gl_FragCoord.xy - uCenter;
      float d = sdRoundedRect(p, uHalfSize, uRadius);
      vec2 L = vec2(cos(uAngle), sin(uAngle));

      /* 一圈暗底边，给按钮一点「厚度」 */
      float base = (1.0 - smoothstep(0.0, uBaseWidth, abs(d))) * 0.45;

      /* 椭圆法线（按半宽高归一）与光向的夹角：直边上也连续变化，高光才会沿边滑动 */
      vec2 nEll = normalize(p / (uHalfSize * uHalfSize) + 1e-6);
      float phi = acos(clamp(abs(dot(nEll, L)), 0.0, 1.0));   // abs → 朝光与背光两侧对称
      float rim = 1.0 - smoothstep(uShineSize - uShineFade, uShineSize + uShineFade + 1e-4, phi);
      float line = gaussianLine(d, uThickness);
      float edgeClamp = 1.0 - smoothstep(0.5 * uPx, 3.0 * uPx, abs(d));
      float hi = line * rim * edgeClamp * uIntensity;

      vec3 col = uBaseColor * base + uLineColor * hi;
      fragColor = vec4(col, clamp(base + hi, 0.0, 1.0));
    }
  `;

  // ---- WebGL 底座 ----
  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  const U = (n) => gl.getUniformLocation(prog, n);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

  function hexRgb(hex) {
    const h = hex.replace('#', '');
    return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16) / 255);
  }

  const dpr = Math.min(2, devicePixelRatio || 1);
  let bw = 0, bh = 0;
  function resize() {
    bw = btn.offsetWidth; bh = btn.offsetHeight;
    canvas.width = (bw + PAD * 2) * dpr;
    canvas.height = (bh + PAD * 2) * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(U('uCenter'), (PAD + bw / 2) * dpr, (PAD + bh / 2) * dpr);
    gl.uniform2f(U('uHalfSize'), (bw / 2) * dpr, (bh / 2) * dpr);
    gl.uniform1f(U('uRadius'), Math.min(CONFIG.radius, Math.min(bw, bh) / 2) * dpr);
  }
  gl.uniform1f(U('uPx'), dpr);
  gl.uniform1f(U('uBaseWidth'), dpr);
  gl.uniform3fv(U('uLineColor'), hexRgb(CONFIG.lineColor));
  gl.uniform3fv(U('uBaseColor'), hexRgb(CONFIG.baseColor));
  gl.uniform1f(U('uShineSize'), (CONFIG.shineSize * Math.PI) / 180);
  gl.uniform1f(U('uShineFade'), (CONFIG.shineFade * Math.PI) / 180);
  gl.uniform1f(U('uThickness'), CONFIG.thickness * dpr);
  const uAngle = U('uAngle'), uIntensity = U('uIntensity');
  resize(); addEventListener('resize', resize);
  if (document.fonts) document.fonts.ready.then(resize);

  // 光向：指针在按钮外时指向指针；在按钮内时落在对角线上随指针微摆。亮度随「离按钮的距离」渐起
  let pointerAngle = null, proximityT = 0;
  addEventListener('pointermove', (e) => {
    const r = btn.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const dx = Math.max(r.left - e.clientX, 0, e.clientX - r.right);
    const dy = Math.max(r.top - e.clientY, 0, e.clientY - r.bottom);
    const dist = Math.hypot(dx, dy);
    if (dist === 0) {
      const nx = (e.clientX - cx) / (r.width / 2), ny = (cy - e.clientY) / (r.height / 2);
      pointerAngle = Math.atan2(2 / r.height, -2 / r.width) + nx * 0.3 + ny * 0.15;
    } else {
      pointerAngle = Math.atan2(cy - e.clientY, e.clientX - cx);
    }
    const t = Math.max(0, 1 - dist / PROXIMITY);
    proximityT = t * t * (3 - 2 * t);
  });

  let angle = 2.4, idleAngle = 2.4, bright = 0;
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    if (document.hidden) { last = now; return; }   // 切后台暂停
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!reduceMotion) idleAngle += CONFIG.speed * dt;
    // 有指针且（非常亮模式 或 指针在附近）→ 追指针；否则慢慢自转
    const steer = pointerAngle != null && (!CONFIG.autoAnimate || proximityT > 0);
    const target = steer ? pointerAngle : idleAngle;
    const diff = ((target - angle + Math.PI * 3) % (Math.PI * 2)) - Math.PI;   // 最短路径追角
    angle += diff * (1 - Math.exp(-dt * 7));
    const brightTarget = CONFIG.autoAnimate ? 1 : proximityT;
    bright += (brightTarget - bright) * (1 - Math.exp(-dt * 8));
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(uAngle, angle);
    gl.uniform1f(uIntensity, CONFIG.intensity * bright);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
