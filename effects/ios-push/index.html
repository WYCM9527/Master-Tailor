<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iOS 推屏转场</title>
    <style>
      :root {
        --mt-bg: #0a0a0f; /* 页面底色 */
        --mt-duration: 0.35s; /* 转场时长：iOS 系统推屏约 0.35 秒 */
        --mt-parallax: 25; /* 旧页让位幅度（占页宽百分比） */
        --mt-dim: 0.1; /* 旧页压暗程度（0–0.3） */
        --mt-shadow: 1; /* 新页左缘投影开关（1 开 / 0 关） */
        --mt-accent: #ffffff; /* 强调色：返回按钮与焦点环 */
        /* iOS 推屏实测曲线（UIKit 默认导航），刻意不做成参数 */
        --ios-ease: cubic-bezier(0.19, 0, 0.54, 0.96);
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--mt-bg);
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #f2f2f7;
      }

      /* ===== 迷你站：手机比例窄容器更贴近 iOS 语境 ===== */
      .mt-app {
        position: relative;
        width: min(400px, 92vw);
        height: min(600px, 92vh);
        background: #101016;
        border-radius: 22px;
        overflow: clip;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
      }
      .page {
        position: absolute;
        inset: 0;
        overflow: auto;
        background: #101016;
      }
      .page[hidden] {
        display: none;
      }
      h1,
      h2 {
        outline: none;
      }

      /* ---- 列表页：设置风格的行 ---- */
      .page-list {
        padding: 20px 18px;
      }
      .page-list h2 {
        margin: 4px 4px 14px;
        font-size: 24px;
      }
      .row-group {
        border-radius: 12px;
        overflow: hidden;
        background: #1a1b24;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        border: none;
        padding: 14px 16px;
        background: none;
        color: inherit;
        font: inherit;
        font-size: 15px;
        cursor: pointer;
        text-align: left;
      }
      .row + .row {
        border-top: 1px solid rgba(255, 255, 255, 0.07);
      }
      .row:focus-visible {
        outline: 2px solid var(--mt-accent);
        outline-offset: -2px;
      }
      .row .chevron {
        color: #6c6d78;
      }

      /* ---- 详情页 ---- */
      .page-detail {
        padding: 20px 18px;
      }
      .page-detail .navbar {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 14px;
      }
      .back {
        border: none;
        background: none;
        color: var(--mt-accent);
        font: inherit;
        font-size: 15px;
        cursor: pointer;
        padding: 6px 8px 6px 0;
      }
      .back:focus-visible {
        outline: 2px solid var(--mt-accent);
      }
      .page-detail h1 {
        margin: 0 0 12px 4px;
        font-size: 24px;
      }
      .page-detail p {
        margin: 0 4px 10px;
        line-height: 1.7;
        color: #b9bac6;
        font-size: 14px;
      }

      /* ===== 过渡层：推屏 =====
         前进：新页从右缘整页推入，旧页向左让位并压暗；返回严格反向。 */
      ::view-transition-old(page),
      ::view-transition-new(page) {
        animation-duration: var(--mt-duration);
        animation-timing-function: var(--ios-ease);
        animation-fill-mode: both;
      }
      html[data-vt='forward']::view-transition-new(page) {
        animation-name: push-in;
      }
      html[data-vt='forward']::view-transition-old(page) {
        animation-name: yield-out;
      }
      html[data-vt='back']::view-transition-new(page) {
        animation-name: yield-in;
      }
      html[data-vt='back']::view-transition-old(page) {
        animation-name: push-out;
      }
      /* 处于上层的详情页快照带左缘投影（开关由参数控制） */
      html[data-vt='forward']::view-transition-new(page),
      html[data-vt='back']::view-transition-old(page) {
        box-shadow: -6px 0 24px rgba(0, 0, 0, calc(0.35 * var(--mt-shadow)));
      }

      @keyframes push-in {
        from {
          transform: translateX(100%);
        }
        to {
          transform: none;
        }
      }
      @keyframes push-out {
        from {
          transform: none;
        }
        to {
          transform: translateX(100%);
        }
      }
      @keyframes yield-out {
        from {
          transform: none;
          filter: brightness(1);
        }
        to {
          transform: translateX(calc(var(--mt-parallax) * -1%));
          filter: brightness(calc(1 - var(--mt-dim)));
        }
      }
      @keyframes yield-in {
        from {
          transform: translateX(calc(var(--mt-parallax) * -1%));
          filter: brightness(calc(1 - var(--mt-dim)));
        }
        to {
          transform: none;
          filter: brightness(1);
        }
      }

      /* @mt:fallback 无 API 回退：同一套 keyframes 直接加在真实页面上，效果一致 */
      .page.fx-in,
      .page.fx-out {
        animation-duration: var(--mt-duration);
        animation-timing-function: var(--ios-ease);
        animation-fill-mode: both;
      }
      html[data-vt='forward'] .page.fx-in {
        animation-name: push-in;
        z-index: 2;
        box-shadow: -6px 0 24px rgba(0, 0, 0, calc(0.35 * var(--mt-shadow)));
      }
      html[data-vt='forward'] .page.fx-out {
        animation-name: yield-out;
        z-index: 1;
      }
      html[data-vt='back'] .page.fx-in {
        animation-name: yield-in;
        z-index: 1;
      }
      html[data-vt='back'] .page.fx-out {
        animation-name: push-out;
        z-index: 2;
        box-shadow: -6px 0 24px rgba(0, 0, 0, calc(0.35 * var(--mt-shadow)));
      }

      /* 用户开启「减少动态效果」：一律瞬间切换（JS 同步跳过转场） */
      @media (prefers-reduced-motion: reduce) {
        ::view-transition-group(*),
        ::view-transition-old(*),
        ::view-transition-new(*) {
          animation: none !important;
        }
        .page.fx-in,
        .page.fx-out {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="mt-app" id="mtApp">
      <section class="page page-list" id="pageList" aria-label="列表页">
        <h2 tabindex="-1">设置</h2>
        <div class="row-group" id="rowGroup"></div>
      </section>

      <section class="page page-detail" id="pageDetail" aria-label="详情页" hidden>
        <div class="navbar">
          <button type="button" class="back" id="backBtn">‹ 返回</button>
        </div>
        <h1 id="detailTitle" tabindex="-1">通用</h1>
        <p>新页从右缘整页推入，旧页同时向左让位并轻微压暗，左缘的一道细投影交代了「新页叠在上层」的纵深关系。</p>
        <p>按返回、Esc，或从容器左缘向右滑动，都会严格反向播放这段过渡。</p>
      </section>
    </div>

    <script>
      const CONFIG = {
        rows: ['通用', '显示与亮度', '声音与触感', '隐私与安全性', '电池'], // 列表页条目
      };

      (function () {
        const html = document.documentElement;
        const app = document.getElementById('mtApp');
        const pageList = document.getElementById('pageList');
        const pageDetail = document.getElementById('pageDetail');
        const detailTitle = document.getElementById('detailTitle');
        const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
        let navigating = false; // 转场进行中忽略新的导航

        // ---- 生成列表行 ----
        const group = document.getElementById('rowGroup');
        const rows = CONFIG.rows.map((label) => {
          const row = document.createElement('button');
          row.type = 'button';
          row.className = 'row';
          row.innerHTML = '<span></span><span class="chevron" aria-hidden="true">›</span>';
          row.firstChild.textContent = label;
          row.addEventListener('click', () => {
            detailTitle.textContent = label;
            go(pageDetail, 'forward');
          });
          group.appendChild(row);
          return row;
        });

        function swap(from, to) {
          from.hidden = true;
          to.hidden = false;
        }
        function focusHeading(to) {
          const heading = to.querySelector('h1, h2');
          if (heading) heading.focus({ preventScroll: true });
        }

        // ---- 方向化转场 ----
        function go(to, direction) {
          const from = to === pageDetail ? pageList : pageDetail;
          if (navigating || !to.hidden) return;

          if (reduceMotion.matches) {
            swap(from, to);
            focusHeading(to);
            return;
          }
          navigating = true;
          html.dataset.vt = direction;

          from.style.viewTransitionName = 'page';
          const cleanup = () => {
            from.style.viewTransitionName = '';
            to.style.viewTransitionName = '';
            delete html.dataset.vt;
            navigating = false;
            focusHeading(to);
          };

          if (document.startViewTransition) {
            const vt = document.startViewTransition(() => {
              swap(from, to);
              from.style.viewTransitionName = '';
              to.style.viewTransitionName = 'page';
            });
            vt.finished.finally(cleanup);
          } else {
            // @mt:fallback：两页短暂同框，播同一套 keyframes，动画结束隐藏旧页
            to.hidden = false;
            from.classList.add('fx-out');
            to.classList.add('fx-in');
            const done = () => {
              to.removeEventListener('animationend', done);
              from.hidden = true;
              from.classList.remove('fx-out');
              to.classList.remove('fx-in');
              cleanup();
            };
            to.addEventListener('animationend', done);
          }
        }
        const goBack = () => go(pageList, 'back');

        // ---- 返回途径：按钮 / Esc / Backspace / 左缘右滑 ----
        document.getElementById('backBtn').addEventListener('click', goBack);
        document.addEventListener('keydown', (e) => {
          if (pageDetail.hidden) return;
          if (e.key === 'Escape' || e.key === 'Backspace') {
            e.preventDefault();
            goBack();
          }
        });
        let edgeStartX = null;
        app.addEventListener('pointerdown', (e) => {
          if (pageDetail.hidden) return;
          const rect = app.getBoundingClientRect();
          edgeStartX = e.clientX - rect.left <= 32 ? e.clientX : null;
        });
        app.addEventListener('pointerup', (e) => {
          if (edgeStartX !== null && e.clientX - edgeStartX > 60) goBack();
          edgeStartX = null;
        });
        app.addEventListener('pointercancel', () => (edgeStartX = null));

        /* @mt:thumb-start */
        // 缩略图演示：自动点进→返回往返播放；切后台暂停，reduced-motion 不启动
        if (!reduceMotion.matches) {
          let demoIndex = 0;
          setInterval(() => {
            if (document.hidden || navigating) return;
            if (pageDetail.hidden) {
              rows[demoIndex % rows.length].click();
              demoIndex++;
            } else {
              goBack();
            }
          }, 2200);
        }
        /* @mt:thumb-end */
      })();
    </script>
  </body>
</html>
