<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>甩卡轮播</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-accent: #f9cf00;    /* 强调色：数字角标 */
    --mt-likeColor: #4ade80; /* LIKE 印章颜色（右甩） */
    --mt-nopeColor: #ff4d6d; /* NOPE 印章颜色（左甩） */
    --mt-rounded: 18px;      /* 卡片圆角 */
  }

  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mt-bg);
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  .mt-deck {
    position: relative;
    width: min(360px, 78vw);
    aspect-ratio: 3 / 4;
    outline: none;
    touch-action: pan-y;
  }
  .mt-deck:focus-visible { outline: 2px solid var(--mt-accent); outline-offset: 6px; }

  .mt-card {
    position: absolute;
    inset: 0;
    margin: 0;
    border-radius: var(--mt-rounded);
    overflow: hidden;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
    background: linear-gradient(135deg, #1a1c2c, #2a2f4a);
    cursor: grab;
    /* 弹回与飞出的过渡；拖拽跟随时由 JS 临时关掉 */
    transition: transform 0.45s cubic-bezier(0.22, 1.2, 0.36, 1), opacity 0.45s ease;
  }
  .mt-card.dragging { cursor: grabbing; transition: none; }
  .mt-card img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    -webkit-user-drag: none;
    user-select: none;
  }
  .mt-card .mt-caption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 42px 18px 14px;
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.62));
  }

  /* LIKE / NOPE 印章：拖动方向决定谁浮现 */
  .mt-stamp {
    position: absolute;
    top: 22px;
    padding: 4px 14px;
    border: 3px solid;
    border-radius: 8px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.12em;
    opacity: 0;
    pointer-events: none;
  }
  .mt-stamp.like { left: 18px; color: var(--mt-likeColor); border-color: var(--mt-likeColor); transform: rotate(-14deg); }
  .mt-stamp.nope { right: 18px; color: var(--mt-nopeColor); border-color: var(--mt-nopeColor); transform: rotate(14deg); }

  .mt-fraction {
    position: absolute;
    top: -34px;
    right: 0;
    padding: 3px 12px;
    border-radius: 999px;
    background: rgba(10, 10, 15, 0.6);
    color: var(--mt-accent);
    font-size: 12.5px;
    font-family: ui-monospace, monospace;
  }

  /* 用户开启「减少动态效果」：不做飞行动画（JS 同步瞬切） */
  @media (prefers-reduced-motion: reduce) {
    .mt-card { transition: none; }
  }
</style>
</head>
<body>
<div class="mt-deck" id="mtRoot"></div>
<script>
  const CONFIG = {
    slides: [{"src":"/samples/sample-1.webp","caption":"卡片一 · 夜枭小憩"},{"src":"/samples/sample-2.webp","caption":"卡片二 · 海边老爷车"},{"src":"/samples/sample-3.webp","caption":"卡片三 · 日落海滩"},{"src":"/samples/sample-4.webp","caption":"卡片四 · 山谷晨光"},{"src":"/samples/sample-5.webp","caption":"卡片五 · 蓝天夹竹桃"}], // 卡片列表
    interval: 4,     // 自动甩卡间隔（秒，0 为不自动甩）
    stamps: true,    // 是否显示 LIKE / NOPE 印章
    threshold: 90,   // 甩出判定：拖过这个距离（px）松手就飞出，否则弹回
  };

  (function () {
    const root = document.getElementById('mtRoot');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const slides = CONFIG.slides;
    const total = slides.length;
    let index = 0;

    root.setAttribute('role', 'region');
    root.setAttribute('aria-roledescription', 'carousel');
    root.setAttribute('aria-label', '甩卡轮播');
    root.setAttribute('tabindex', '0');

    const cards = slides.map((s, i) => {
      const el = document.createElement('figure');
      el.className = 'mt-card';
      el.setAttribute('role', 'group');
      el.setAttribute('aria-roledescription', 'slide');
      el.setAttribute('aria-label', '第 ' + (i + 1) + ' 张，共 ' + total + ' 张');
      const img = document.createElement('img');
      img.src = s.src;
      img.alt = s.caption || '第 ' + (i + 1) + ' 张卡片';
      img.loading = 'lazy';
      el.appendChild(img);
      if (s.caption) {
        const cap = document.createElement('div');
        cap.className = 'mt-caption';
        cap.textContent = s.caption;
        el.appendChild(cap);
      }
      if (CONFIG.stamps) {
        for (const [cls, text] of [['like', 'LIKE'], ['nope', 'NOPE']]) {
          const stamp = document.createElement('div');
          stamp.className = 'mt-stamp ' + cls;
          stamp.textContent = text;
          el.appendChild(stamp);
        }
      }
      root.appendChild(el);
      return el;
    });

    const fraction = document.createElement('div');
    fraction.className = 'mt-fraction';
    fraction.setAttribute('aria-hidden', 'true');
    root.appendChild(fraction);

    // 层叠布局：顶卡 + 下面两层微缩
    function layout() {
      for (let i = 0; i < total; i++) {
        const off = (i - index + total) % total;
        const el = cards[i];
        if (off <= 2) {
          el.style.transform = 'translateY(' + off * 14 + 'px) scale(' + (1 - off * 0.05) + ')';
          el.style.opacity = '1';
          el.style.zIndex = String(total - off);
        } else {
          el.style.transform = 'translateY(28px) scale(0.9)';
          el.style.opacity = '0';
          el.style.zIndex = '0';
        }
        el.setAttribute('aria-hidden', off === 0 ? 'false' : 'true');
      }
      fraction.textContent = (index + 1) + ' / ' + total;
    }

    // 甩出：dir>0 右甩（LIKE），dir<0 左甩（NOPE）
    function fling(dir) {
      const top = cards[index];
      if (reduceMotion) {
        index = (index + 1) % total;
        layout();
        return;
      }
      top.style.transform = 'translate(' + dir * 130 + '%, -8%) rotate(' + dir * 22 + 'deg)';
      top.style.opacity = '0';
      index = (index + 1) % total;
      requestAnimationFrame(() => requestAnimationFrame(layout));
    }

    // 自动甩卡：悬停 / 聚焦 / 后台暂停；reduced-motion 不启动
    let timer = null;
    let autoDir = 1;
    function play() {
      if (timer || CONFIG.interval <= 0 || reduceMotion || total < 2) return;
      timer = setInterval(() => {
        autoDir = -autoDir; // 左右交替甩，演示两种方向
        fling(autoDir);
      }, CONFIG.interval * 1000);
    }
    function pause() { clearInterval(timer); timer = null; }
    root.addEventListener('mouseenter', pause);
    root.addEventListener('mouseleave', play);
    root.addEventListener('focusin', pause);
    root.addEventListener('focusout', play);
    document.addEventListener('visibilitychange', () => (document.hidden ? pause() : play()));
    play();

    // 顶卡拖拽跟随（Pointer Events）：位移 + 随距离旋转，印章随方向浮现
    let dragStartX = null, dragDx = 0;
    root.addEventListener('pointerdown', (e) => {
      dragStartX = e.clientX;
      dragDx = 0;
      cards[index].classList.add('dragging');
      root.setPointerCapture(e.pointerId);
    });
    root.addEventListener('pointermove', (e) => {
      if (dragStartX === null || reduceMotion) return;
      dragDx = e.clientX - dragStartX;
      const top = cards[index];
      top.style.transform = 'translateX(' + dragDx + 'px) rotate(' + dragDx * 0.06 + 'deg)';
      if (CONFIG.stamps) {
        const like = top.querySelector('.mt-stamp.like');
        const nope = top.querySelector('.mt-stamp.nope');
        if (like) like.style.opacity = String(Math.min(1, Math.max(0, dragDx / CONFIG.threshold)));
        if (nope) nope.style.opacity = String(Math.min(1, Math.max(0, -dragDx / CONFIG.threshold)));
      }
    });
    function endDrag() {
      if (dragStartX === null) return;
      const top = cards[index];
      top.classList.remove('dragging');
      if (CONFIG.stamps) {
        for (const stamp of top.querySelectorAll('.mt-stamp')) stamp.style.opacity = '0';
      }
      if (Math.abs(dragDx) > CONFIG.threshold) {
        fling(dragDx > 0 ? 1 : -1);
      } else {
        layout(); // 没过阈值：弹回原位
      }
      dragStartX = null;
    }
    root.addEventListener('pointerup', endDrag);
    root.addEventListener('pointercancel', endDrag);

    // 键盘：← 左甩、→ 右甩
    root.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { e.preventDefault(); fling(1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); fling(-1); }
    });

    layout();

    /* @mt:thumb-start */
    if (window.__MT_ENV && window.__MT_ENV.thumb && !reduceMotion) {
      // 缩略图演示由自动甩卡承担；这里接收父页面转发的真实指针做轻微跟手预览
      window.__mtOnPointer = (x) => {
        const rect = root.getBoundingClientRect();
        const dx = (x - rect.width / 2) * 0.3;
        const top = cards[index];
        if (dragStartX === null) top.style.transform = 'translateX(' + dx + 'px) rotate(' + dx * 0.06 + 'deg)';
      };
    }
    /* @mt:thumb-end */
  })();
</script>
</body>
</html>
