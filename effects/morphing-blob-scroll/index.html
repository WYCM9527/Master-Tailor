<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>滚动形变色块</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #f4f1ea;        /* 页面底色 */
    --mt-color: #1b1b1f;     /* 文字颜色 */
    --mt-size: 70vmin;       /* 色块大小 */
    --mt-font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; /* 字体 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); font-family: var(--mt-font); color: var(--mt-color); overflow-x: hidden; }

  /* 固定在背后的 SVG 色块：随滚动在几个形状与颜色之间连续变形 */
  .mt-shape { position: fixed; left: 50%; top: 50%; width: var(--mt-size); height: var(--mt-size); margin: calc(var(--mt-size) / -2) 0 0 calc(var(--mt-size) / -2); z-index: 0; pointer-events: none; }
  .mt-shape svg { width: 100%; height: 100%; overflow: visible; }
  .mt-section { position: relative; z-index: 1; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 0 8vw; box-sizing: border-box; }
  .mt-section h2 { margin: 0 0 14px; font-size: clamp(36px, 7vw, 96px); font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
  .mt-section p { margin: 0; max-width: 34em; font-size: 16px; line-height: 1.8; opacity: 0.7; }
  .mt-section .num { display: block; font-size: 12px; letter-spacing: 0.3em; opacity: 0.5; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="mt-shape" aria-hidden="true"><svg viewBox="-110 -110 220 220"><path id="mtPath" fill="#7c9cff" d=""/></svg></div>
<main id="mtMain"></main>
<script>
  const CONFIG = {
    sections: "第一章=一块颜色，跟着你的滚动慢慢换形状。｜第二章=它没有固定的样子，只在几个姿态之间流动。｜第三章=每一屏对应一种形状和一种颜色。｜第四章=滚回去，它也会原路变回来。",   // 每屏「标题=正文」，用「｜」分隔
    colors: ["#7c9cff", "#f472b6", "#fbbf24", "#34d399"],   // 每屏的色块颜色
    irregular: 0.45,     // 形状的不规则程度（0 接近圆 – 1 很扭）
    points: 8,           // 每个形状的控制点数
    rotate: 40,          // 整页滚完色块转过的角度（度）
    smooth: 0.12,        // 变形跟随滚动的平滑度（越小越跟手）
  };
  const main = document.getElementById('mtMain'), path = document.getElementById('mtPath');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const secs = CONFIG.sections.split('｜').map(s => s.trim()).filter(Boolean).map(s => { const [t, b = ''] = s.split('='); return { t: t.trim(), b: b.trim() }; });
  secs.forEach((s, i) => { const el = document.createElement('section'); el.className = 'mt-section'; el.innerHTML = `<div><span class="num">${String(i + 1).padStart(2, '0')} / ${String(secs.length).padStart(2, '0')}</span><h2></h2><p></p></div>`; el.querySelector('h2').textContent = s.t; el.querySelector('p').textContent = s.b; main.appendChild(el); });
  // 形状 = 均匀分布在圆周上的 N 个点，各自带随机半径；同样的点数让形状之间可以逐点插值
  const seeded = (seed) => () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const N = Math.max(4, CONFIG.points);
  const shapes = secs.map((_, k) => { const r = seeded(17 + k * 101); return Array.from({ length: N }, (_, i) => { const a = (i / N) * Math.PI * 2 + (r() - 0.5) * CONFIG.irregular * 0.6; const rad = 100 * (1 - CONFIG.irregular * 0.5 + r() * CONFIG.irregular * 0.5); return [Math.cos(a) * rad, Math.sin(a) * rad]; }); });
  const cols = secs.map((_, k) => CONFIG.colors[k % CONFIG.colors.length]);
  if (shapes.length < 2) { shapes.push(shapes[0]); cols.push(cols[0]); }   // 只有一屏时也能安全插值
  const hex = (c) => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
  const mixColor = (a, b, t) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; };
  // 用 Catmull-Rom 转三次贝塞尔把点连成光滑闭合曲线
  function toPath(pts) {
    const n = pts.length; let d = `M${pts[0][0].toFixed(2)} ${pts[0][1].toFixed(2)}`;
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += ` C${c1[0].toFixed(2)} ${c1[1].toFixed(2)} ${c2[0].toFixed(2)} ${c2[1].toFixed(2)} ${p2[0].toFixed(2)} ${p2[1].toFixed(2)}`;
    }
    return d + 'Z';
  }
  // 滚动进度 → 形状序号的连续值 f（0..n-1）；在相邻两个形状之间逐点插值（ease-in-out 让停在每屏时形状稳定）
  let target = 0, cur = 0;
  const ease = (t) => t * t * (3 - 2 * t);
  function render() {
    const n = shapes.length, i = Math.min(n - 2, Math.floor(cur)), t = ease(Math.min(1, Math.max(0, cur - i)));
    const A = shapes[i], B = shapes[Math.min(n - 1, i + 1)];
    const pts = A.map((p, k) => [p[0] + (B[k][0] - p[0]) * t, p[1] + (B[k][1] - p[1]) * t]);
    path.setAttribute('d', toPath(pts)); path.setAttribute('fill', mixColor(cols[i], cols[Math.min(n - 1, i + 1)], t));
    path.setAttribute('transform', `rotate(${(cur / Math.max(1, n - 1)) * CONFIG.rotate})`);
  }
  function onScroll() { const max = document.documentElement.scrollHeight - innerHeight; target = (max > 0 ? scrollY / max : 0) * (shapes.length - 1); }
  addEventListener('scroll', onScroll, { passive: true }); addEventListener('resize', onScroll); onScroll(); cur = target; render();
  (function tick() { requestAnimationFrame(tick); if (document.hidden) return; cur += (target - cur) * (reduceMotion ? 1 : CONFIG.smooth); if (Math.abs(target - cur) > 0.0005) render(); })();

  /* @mt:thumb-start */
  // 缩略图演示：没人滚时自动来回慢滚
  let userTook = false; addEventListener('wheel', () => (userTook = true), { passive: true }); addEventListener('touchstart', () => (userTook = true), { passive: true });
  if (!reduceMotion) { let t = 0; (function auto() { requestAnimationFrame(auto); if (userTook || document.hidden) return; t += 0.004; const max = document.documentElement.scrollHeight - innerHeight; scrollTo(0, (0.5 - 0.5 * Math.cos(t)) * max); })(); }
  /* @mt:thumb-end */
</script>
</body>
</html>
