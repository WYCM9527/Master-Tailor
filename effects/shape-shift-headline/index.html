<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>变形图窗标题</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-color: #f2f3f8;     /* 文字颜色 */
    --mt-period: 8s;         /* 变形一轮的时长 */
    --mt-fontSize: 64px;     /* 字号 */
    --mt-font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; /* 字体 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; display: grid; place-items: center; font-family: var(--mt-font); color: var(--mt-color); }

  .mt-line { display: flex; align-items: center; gap: 0.25em; font-size: var(--mt-fontSize); font-weight: 800; letter-spacing: -0.03em; line-height: 1; white-space: nowrap; padding: 0 5vw; flex-wrap: wrap; justify-content: center; row-gap: 0.2em; }
  /* 图窗：一个嵌在句子里的块，宽度与圆角按关键帧不断变化；里面一条图片跑马灯持续滚动，悬停时暂停 */
  .mt-window { position: relative; height: 1em; width: 3.2em; overflow: hidden; border-radius: 0.5em; background: #16161d; animation: mt-shift var(--mt-period) ease-in-out infinite alternate; cursor: pointer; }
  .mt-window:hover, .mt-window.paused { animation-play-state: paused; }
  .mt-window .track { position: absolute; left: 0; top: 0; height: 100%; display: flex; gap: 2px; animation: mt-marquee var(--speed) linear infinite; }
  .mt-window:hover .track { animation-play-state: paused; }
  .mt-window img { height: 100%; width: auto; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
  @keyframes mt-shift {
    0% { width: 3.2em; border-radius: 0.5em; }
    20% { width: 1.6em; border-radius: 50%; }
    40% { width: 4.5em; border-radius: 0.1em; }
    60% { width: 2.4em; border-radius: 0.5em 0.5em 0 0; }
    80% { width: 1em; border-radius: 0.5em 0 0.5em 0; }
    100% { width: 3.8em; border-radius: 1em 0.2em 1em 0.2em; }
  }
  @keyframes mt-marquee { to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .mt-window, .mt-window .track { animation: none; } }
</style>
</head>
<body>
<h1 class="mt-line" id="mtLine"></h1>
<script>
  const CONFIG = {
    prefix: "形状",          // 图窗前的文字
    suffix: "会变",          // 图窗后的文字
    slides: [{"src":"/samples/sample-1.webp","caption":""},{"src":"/samples/sample-2.webp","caption":""},{"src":"/samples/sample-3.webp","caption":""},{"src":"/samples/sample-4.webp","caption":""},{"src":"/samples/sample-6.webp","caption":""}], // 图窗里滚动的图片
    speed: 12,               // 图片滚完一轮的秒数
  };
  const line = document.getElementById('mtLine');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const pre = document.createElement('span'); pre.textContent = CONFIG.prefix;
  const win = document.createElement('span'); win.className = 'mt-window'; win.setAttribute('aria-hidden', 'true'); win.style.setProperty('--speed', CONFIG.speed + 's');
  const track = document.createElement('span'); track.className = 'track';
  // 图片排两遍，位移 -50% 时正好无缝接上
  [...CONFIG.slides, ...CONFIG.slides].forEach(s => { const img = document.createElement('img'); img.src = s.src; img.alt = ''; track.appendChild(img); });
  win.appendChild(track);
  const suf = document.createElement('span'); suf.textContent = CONFIG.suffix;
  line.append(pre, win, suf);
  document.addEventListener('visibilitychange', () => win.classList.toggle('paused', document.hidden));
</script>
</body>
</html>
