<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>目标框光标</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-spin: 3s;           /* 空闲旋转周期 */
    --mt-dot: 1;             /* 中心圆点：1 显示 / 0 隐藏 */
    --mt-color: #ffffff;     /* 框线颜色 */
    --mt-thickness: 2px;     /* 框线粗细 */
  }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mt-bg);
    overflow: hidden;
    cursor: none;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #f2f3f8;
  }
  /* 光标：一个零尺寸的锚点始终贴着鼠标；四个角标是它的子元素，各自独立位移 —
     空闲时角标围成小方框并整体自转，锁定时各自飞到目标四角（相对鼠标反向位移，形成视差） */
  .mt-cursor {
    position: fixed; left: 0; top: 0;
    width: 0; height: 0;
    pointer-events: none;
    transform: translate(var(--x, 50vw), var(--y, 50vh)) scale(var(--press, 1)) rotate(var(--rot, 0deg));
    will-change: transform;
  }
  .mt-cursor i {
    position: absolute; left: 0; top: 0;
    width: var(--corner, 12px); height: var(--corner, 12px);
    border: var(--mt-thickness) solid var(--mt-color);
    box-sizing: border-box;
    transform: translate(var(--cx, 0px), var(--cy, 0px));
    will-change: transform;
  }
  .mt-cursor i:nth-child(1) { border-right: 0; border-bottom: 0; }
  .mt-cursor i:nth-child(2) { border-left: 0; border-bottom: 0; }
  .mt-cursor i:nth-child(3) { border-left: 0; border-top: 0; }
  .mt-cursor i:nth-child(4) { border-right: 0; border-top: 0; }
  .mt-cursor .dot {
    position: absolute; left: -2px; top: -2px;
    width: 4px; height: 4px;
    background: var(--mt-color);
    opacity: var(--mt-dot);
    transform: scale(var(--dot, 1));
    transition: transform 0.3s ease;
  }
  /* 示范目标：几个可被锁定的按钮 */
  .mt-targets {
    position: fixed; inset: 0;
    display: flex; gap: 6vw;
    align-items: center; justify-content: center;
    flex-wrap: wrap;
    padding: 0 8vw;
  }
  .mt-btn {
    padding: 14px 26px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: transparent;
    color: #f2f3f8;
    font-size: 14px;
    letter-spacing: 0.1em;
    cursor: none;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .mt-btn:hover { background: var(--mt-color); color: #0a0a0f; }

  /* 用户开启「减少动态效果」时：不自转、直接跟手（JS 同步处理） */
</style>
</head>
<body>
<div class="mt-targets">
  <button type="button" class="mt-btn">锁定我</button>
  <button type="button" class="mt-btn">或者我</button>
  <button type="button" class="mt-btn">再试这个</button>
</div>
<div class="mt-cursor" id="mtCursor" aria-hidden="true">
  <i></i><i></i><i></i><i></i>
  <div class="dot"></div>
</div>
<script>
  const CONFIG = {
    size: 28,      // 空闲时大小（px）
    padding: 3,    // 锁定时框线离目标边缘的距离（px）
    lag: 0.3,      // 角标飞向目标的迟滞（越小越有视差感）
  };

  const cursor = document.getElementById('mtCursor');
  const corners = [...cursor.querySelectorAll('i')];
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const spinMs = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--mt-spin')) * 1000 || 3000;
  const CORNER = 12;
  cursor.style.setProperty('--corner', CORNER + 'px');
  // 空闲时四角相对鼠标的位置：围成 size 大小的方框
  const half = CONFIG.size / 2;
  const idlePos = [[-half, -half], [half - CORNER, -half], [half - CORNER, half - CORNER], [-half, half - CORNER]];

  // 鼠标位置（光标锚点直接贴手，只留一点点平滑）
  let mx = innerWidth / 2, my = innerHeight / 2, cx = mx, cy = my, locked = null, auto = true, rot = 0;
  const cur = corners.map((_, i) => ({ x: idlePos[i][0], y: idlePos[i][1] }));

  addEventListener('pointermove', (e) => {
    auto = false;
    mx = e.clientX; my = e.clientY;
    setLock(e.target && e.target.closest ? e.target.closest('.mt-btn') : null);
  });
  document.documentElement.addEventListener('pointerleave', () => (auto = true));
  // 按下：中心点缩到 0.7、整框缩到 0.9
  addEventListener('pointerdown', () => { cursor.style.setProperty('--press', '0.9'); cursor.style.setProperty('--dot', '0.7'); });
  addEventListener('pointerup', () => { cursor.style.setProperty('--press', '1'); cursor.style.setProperty('--dot', '1'); });

  function setLock(el) {
    if (el === locked) return;
    locked = el;
    if (locked) rot = 0;   // 锁定时框摆正
  }

  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (document.hidden) return;
    // 锚点贴手
    const kc = reduceMotion ? 1 : 0.5;
    cx += (mx - cx) * kc; cy += (my - cy) * kc;
    // 空闲自转；锁定时停住
    if (!locked && !reduceMotion) rot = (rot + (360 * dt * 1000) / spinMs) % 360;
    cursor.style.setProperty('--x', cx + 'px'); cursor.style.setProperty('--y', cy + 'px');
    cursor.style.setProperty('--rot', rot.toFixed(2) + 'deg');
    // 角标目标：锁定时为「目标四角（外扩 padding） − 锚点位置」，所以鼠标在目标内移动时角标反向位移留在原处（视差）
    let targets = idlePos;
    if (locked) {
      const r = locked.getBoundingClientRect(), p = CONFIG.padding;
      targets = [
        [r.left - p - cx, r.top - p - cy],
        [r.right + p - CORNER - cx, r.top - p - cy],
        [r.right + p - CORNER - cx, r.bottom + p - CORNER - cy],
        [r.left - p - cx, r.bottom + p - CORNER - cy],
      ];
    }
    const k = reduceMotion ? 1 : CONFIG.lag;
    corners.forEach((c, i) => {
      cur[i].x += (targets[i][0] - cur[i].x) * k; cur[i].y += (targets[i][1] - cur[i].y) * k;
      c.style.setProperty('--cx', cur[i].x.toFixed(1) + 'px'); c.style.setProperty('--cy', cur[i].y.toFixed(1) + 'px');
    });
  }
  requestAnimationFrame(frame);

  /* @mt:thumb-start */
  // 缩略图演示：虚拟指针在几个目标之间巡游并停留锁定；真实鼠标一动就交还
  if (!reduceMotion) {
    let t = 0;
    const btns = [...document.querySelectorAll('.mt-btn')];
    setInterval(() => {
      if (document.hidden || !auto) return;
      t += 0.02;
      const i = Math.floor(t) % btns.length, f = t - Math.floor(t);
      const r = btns[i].getBoundingClientRect();
      // 前半段在目标外游走，后半段进到目标里慢慢移动（看得到角标视差）
      if (f < 0.45) { mx = r.left + r.width / 2 + Math.sin(f * Math.PI * 2) * r.width * 0.9; my = r.top + r.height / 2 + Math.cos(f * Math.PI) * 60; setLock(null); }
      else { mx = r.left + r.width * (0.2 + (f - 0.45) * 1.1); my = r.top + r.height / 2; setLock(btns[i]); }
    }, 30);
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
