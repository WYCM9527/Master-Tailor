<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>烈焰之眼</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #000000;        /* 页面底色（canvas 覆盖前的兜底色） */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* 用户开启「减少动态效果」时：JS 停止时间推进，火焰定格 */
</style>
</head>
<body>
<canvas id="mtCanvas" aria-hidden="true"></canvas>
<script>
  const CONFIG = {
    eyeColor: "#ff6f37",        // 火焰颜色
    backgroundColor: "#000000", // 背景色
    intensity: 1.5,             // 亮度
    pupilSize: 0.6,             // 瞳孔大小
    irisWidth: 0.25,            // 虹膜宽度
    glowIntensity: 0.35,        // 外围火光
    scale: 0.8,                 // 眼睛大小
    noiseScale: 1,              // 火纹细密度
    pupilFollow: 1,             // 瞳孔跟随
    flameSpeed: 1,              // 火焰速度
  };

  const canvas = document.getElementById('mtCanvas');
  const gl = canvas.getContext('webgl', { antialias: false });
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const VS = `
    attribute vec2 aPos;
    void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
  `;
  // 片元：把坐标换成极坐标去采样一张可平铺的噪声图（三次不同频率、不同流速），
  // 用「到中心距离」切出虹膜内环 / 外环 / 眼白火光，再减去一个随鼠标偏移的细长竖瞳
  const FS = `
    precision highp float;
    uniform float uTime;
    uniform vec2  uRes;
    uniform sampler2D uNoise;
    uniform float uPupilSize, uIrisWidth, uGlow, uIntensity, uScale, uNoiseScale, uPupilFollow, uFlameSpeed;
    uniform vec2  uMouse;
    uniform vec3  uEye, uBg;

    void main() {
      vec2 uv = (gl_FragCoord.xy * 2.0 - uRes) / uRes.y / uScale;
      float ft = uTime * uFlameSpeed;
      // 极坐标：半径向外、角度压成很窄的一条，噪声沿半径流动就是向外舔的火舌
      vec2 polar = vec2(length(uv) * 2.0, (2.0 * atan(uv.x, uv.y)) / 6.28 * 0.3);
      vec4 nA = texture2D(uNoise, polar * vec2(0.2, 7.0) * uNoiseScale + vec2(-ft * 0.1, 0.0));
      vec4 nB = texture2D(uNoise, polar * vec2(0.3, 4.0) * uNoiseScale + vec2(-ft * 0.2, 0.0));
      vec4 nC = texture2D(uNoise, polar * vec2(0.1, 5.0) * uNoiseScale + vec2(-ft * 0.1, 0.0));
      float dm = 1.0 - length(uv);      // 中心 1 → 边缘 0

      // 虹膜内环：一圈由噪声撕开边缘的亮环
      float inner = clamp(-1.0 * ((dm - 0.7) / uIrisWidth), 0.0, 1.0);
      inner = (inner * dm - 0.2) / 0.28;
      inner += nA.r - 0.5; inner *= 1.3; inner = clamp(inner, 0.0, 1.0);
      // 外环：更大更淡的一圈
      float outer = clamp(-1.0 * ((dm - 0.5) / 0.2), 0.0, 1.0);
      outer = (outer * dm - 0.1) / 0.38;
      outer += nC.r - 0.5; outer *= 1.3; outer = clamp(outer, 0.0, 1.0);
      inner += outer;
      // 眼内火纹
      float innerEye = (dm - 0.2) * nB.r * 2.0;

      // 瞳孔：细长竖椭圆，随鼠标偏移
      vec2 puv = uv - uMouse * uPupilFollow * 0.12;
      float pupil = clamp((1.0 - length(puv * vec2(9.0, 2.3))) * uPupilSize, 0.0, 1.0) / 0.35;

      // 外围火光：横向拉长的椭圆光 + 噪声撕边，再乘远离中心的衰减
      float glow = clamp(1.0 - length(uv * vec2(0.5, 1.5)) + 0.5, 0.0, 1.0) + nC.r - 0.5;
      float bgGlow = glow;
      glow = pow(glow, 2.0) + dm;
      glow = clamp(glow * uGlow, 0.0, 1.0) * pow(1.0 - dm, 2.0) * 2.5;
      bgGlow = pow(bgGlow + dm, 0.5) * 0.15;

      vec3 col = uEye * uIntensity * clamp(max(inner + innerEye, glow + bgGlow) - pupil, 0.0, 3.0) + uBg;
      gl_FragColor = vec4(col, 1.0);
    }
  `;

  // ---- WebGL 底座 ----
  function compile(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  const U = (n) => gl.getUniformLocation(prog, n);
  const hexRgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);

  /* 可平铺的分形值噪声纹理（256²，8 层倍频，基频 32）——火纹的原料 */
  function makeNoiseTexture(size) {
    const data = new Uint8Array(size * size * 4);
    const hash = (x, y, s) => { let n = x * 374761393 + y * 668265263 + s * 1274126177; n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; };
    const value = (px, py, freq, seed) => {
      const fx = (px / size) * freq, fy = (py / size) * freq, ix = Math.floor(fx), iy = Math.floor(fy), tx = fx - ix, ty = fy - iy, w = freq | 0;
      const m = (v) => ((v % w) + w) % w;
      const v00 = hash(m(ix), m(iy), seed), v10 = hash(m(ix + 1), m(iy), seed), v01 = hash(m(ix), m(iy + 1), seed), v11 = hash(m(ix + 1), m(iy + 1), seed);
      return v00 * (1 - tx) * (1 - ty) + v10 * tx * (1 - ty) + v01 * (1 - tx) * ty + v11 * tx * ty;
    };
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      let v = 0, amp = 0.4, total = 0;
      for (let o = 0; o < 8; o++) { v += amp * value(x, y, 32 * (1 << o), o * 31); total += amp; amp *= 0.65; }
      v = Math.max(0, Math.min(1, ((v / total) - 0.5) * 2.2 + 0.5));
      const i = (y * size + x) * 4, val = Math.round(v * 255);
      data[i] = data[i + 1] = data[i + 2] = val; data[i + 3] = 255;
    }
    return data;
  }
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 256, 256, 0, gl.RGBA, gl.UNSIGNED_BYTE, makeNoiseTexture(256));
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.uniform1i(U('uNoise'), 0);

  const dpr = Math.min(2, devicePixelRatio || 1);
  function resize() {
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(U('uRes'), canvas.width, canvas.height);
  }
  resize(); addEventListener('resize', resize);
  gl.uniform1f(U('uPupilSize'), CONFIG.pupilSize);
  gl.uniform1f(U('uIrisWidth'), CONFIG.irisWidth);
  gl.uniform1f(U('uGlow'), CONFIG.glowIntensity);
  gl.uniform1f(U('uIntensity'), CONFIG.intensity);
  gl.uniform1f(U('uScale'), CONFIG.scale);
  gl.uniform1f(U('uNoiseScale'), CONFIG.noiseScale);
  gl.uniform1f(U('uPupilFollow'), CONFIG.pupilFollow);
  gl.uniform1f(U('uFlameSpeed'), CONFIG.flameSpeed);
  gl.uniform3fv(U('uEye'), hexRgb(CONFIG.eyeColor));
  gl.uniform3fv(U('uBg'), hexRgb(CONFIG.backgroundColor));
  const uTime = U('uTime'), uMouse = U('uMouse');

  // 鼠标：归一化到 −1…1（y 向上），5% 平滑；离开回中
  const m = { x: 0, y: 0, tx: 0, ty: 0 };
  addEventListener('pointermove', (e) => { m.tx = (e.clientX / innerWidth) * 2 - 1; m.ty = -((e.clientY / innerHeight) * 2 - 1); });
  document.addEventListener('mouseleave', () => { m.tx = 0; m.ty = 0; });

  let time = reduceMotion ? 3 : 0, last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    if (document.hidden) { last = now; return; }
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!reduceMotion) time += dt;
    m.x += (m.tx - m.x) * 0.05; m.y += (m.ty - m.y) * 0.05;
    gl.uniform1f(uTime, time);
    gl.uniform2f(uMouse, m.x, m.y);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
