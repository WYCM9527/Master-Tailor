<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>百叶窗切片轮播</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-accent: #f9cf00;    /* 强调色：分页圆点 */
    --mt-duration: 0.5s;     /* 每条切片的消失时长 */
    --mt-stagger: 0.06s;     /* 相邻切片的错开延迟 */
    --mt-ratio: 16 / 9;      /* 容器宽高比 */
    --mt-rounded: 16px;      /* 容器圆角 */
  }

  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mt-bg);
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  .mt-carousel {
    position: relative;
    width: min(720px, 92vw);
    aspect-ratio: var(--mt-ratio);
    border-radius: var(--mt-rounded);
    overflow: hidden;
    background: #14151f;
    outline: none;
    touch-action: pan-y;
    cursor: grab;
  }
  .mt-carousel.dragging { cursor: grabbing; }
  .mt-carousel:focus-visible { box-shadow: 0 0 0 2px var(--mt-accent); }

  /* 底层：新图直接显示；切换的戏都在上面的切片层 */
  .mt-slide {
    position: absolute;
    inset: 0;
    opacity: 0;
  }
  .mt-slide.is-active { opacity: 1; }
  .mt-slide img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    -webkit-user-drag: none;
    user-select: none;
  }
  .mt-caption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 42px 20px 14px;
    color: #fff;
    font-size: 18px;
    font-weight: 600;
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.62));
  }

  /* 切片层：旧图被切成 N 条竖片，交替向上/向下滑走 */
  .mt-slices {
    position: absolute;
    inset: 0;
    display: flex;
    z-index: 2;
    pointer-events: none;
  }
  .mt-slices .strip {
    flex: 1 1 0;
    background-repeat: no-repeat;
    transition: transform var(--mt-duration) cubic-bezier(0.45, 0, 0.55, 1), opacity var(--mt-duration) ease;
  }
  .mt-slices .strip.odd.away { transform: translateY(-104%); opacity: 0.4; }
  .mt-slices .strip.even.away { transform: translateY(104%); opacity: 0.4; }

  .mt-pager { position: absolute; z-index: 3; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; gap: 7px; }
  .mt-pager .dot {
    width: 8px; height: 8px;
    border: none; border-radius: 50%;
    background: rgba(255, 255, 255, 0.4);
    cursor: pointer; padding: 0;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .mt-pager .dot.active { background: var(--mt-accent); transform: scale(1.25); }

  /* 用户开启「减少动态效果」：不做切片动画，直接切换（JS 同步处理） */
  @media (prefers-reduced-motion: reduce) {
    .mt-slices .strip { transition: none; }
  }
</style>
</head>
<body>
<div class="mt-carousel" id="mtRoot"></div>
<script>
  const CONFIG = {
    slides: [{"src":"/samples/sample-1.webp","caption":"第一帧 · 夜枭小憩"},{"src":"/samples/sample-2.webp","caption":"第二帧 · 海边老爷车"},{"src":"/samples/sample-3.webp","caption":"第三帧 · 日落海滩"},{"src":"/samples/sample-4.webp","caption":"第四帧 · 山谷晨光"},{"src":"/samples/sample-5.webp","caption":"第五帧 · 蓝天夹竹桃"}], // 幻灯片
    interval: 4, // 自动播放间隔（秒，0 为不自动播放）
    slices: 7,   // 切片条数（4-12）
  };

  (function () {
    const root = document.getElementById('mtRoot');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const slides = CONFIG.slides;
    const total = slides.length;
    let index = 0;
    let busy = false;

    root.setAttribute('role', 'region');
    root.setAttribute('aria-roledescription', 'carousel');
    root.setAttribute('aria-label', '百叶窗切片轮播');
    root.setAttribute('tabindex', '0');

    const slideEls = slides.map((s, i) => {
      const el = document.createElement('figure');
      el.className = 'mt-slide' + (i === 0 ? ' is-active' : '');
      el.style.margin = '0';
      el.setAttribute('role', 'group');
      el.setAttribute('aria-roledescription', 'slide');
      el.setAttribute('aria-label', '第 ' + (i + 1) + ' 张，共 ' + total + ' 张');
      const img = document.createElement('img');
      img.src = s.src;
      img.alt = s.caption || '第 ' + (i + 1) + ' 张图片';
      img.loading = i === 0 ? 'eager' : 'lazy';
      el.appendChild(img);
      if (s.caption) {
        const cap = document.createElement('div');
        cap.className = 'mt-caption';
        cap.textContent = s.caption;
        el.appendChild(cap);
      }
      root.appendChild(el);
      return el;
    });

    // 切换：把「旧图」现场切成 N 条竖片盖在上面，新图直接垫到底下，
    // 然后切片交替向上/向下滑走，露出新图——百叶窗开了
    function goTo(next) {
      next = (next + total) % total;
      if (next === index || busy) return;
      const oldSrc = slides[index].src;
      slideEls[index].classList.remove('is-active');
      slideEls[next].classList.add('is-active');
      index = next;
      updatePager();
      if (reduceMotion) return; // 减少动态效果：直接切换，不做切片戏

      busy = true;
      const w = root.clientWidth, h = root.clientHeight;
      const layer = document.createElement('div');
      layer.className = 'mt-slices';
      layer.setAttribute('aria-hidden', 'true');
      const stripW = w / CONFIG.slices;
      for (let i = 0; i < CONFIG.slices; i++) {
        const strip = document.createElement('div');
        strip.className = 'strip ' + (i % 2 ? 'even' : 'odd');
        // 每条竖片显示旧图对应的一竖条（背景大小=容器大小，位置按条数偏移）
        strip.style.backgroundImage = 'url("' + oldSrc + '")';
        strip.style.backgroundSize = w + 'px ' + h + 'px';
        strip.style.backgroundPosition = -(i * stripW) + 'px 0';
        strip.style.transitionDelay = (i * parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--mt-stagger'))) + 's';
        layer.appendChild(strip);
      }
      root.appendChild(layer);
      // 下一帧让全部切片进入 away 态，各按自己的延迟滑走
      requestAnimationFrame(() => requestAnimationFrame(() => {
        for (const strip of layer.children) strip.classList.add('away');
      }));
      // 最后一条滑完后拆掉切片层
      const totalMs =
        (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--mt-duration')) +
          CONFIG.slices * parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--mt-stagger'))) * 1000;
      setTimeout(() => { layer.remove(); busy = false; }, totalMs + 60);
    }
    const nextSlide = () => goTo(index + 1);
    const prevSlide = () => goTo(index - 1);

    // 自动播放：悬停 / 聚焦 / 后台暂停；reduced-motion 不启动
    let timer = null;
    function play() {
      if (timer || CONFIG.interval <= 0 || reduceMotion || total < 2) return;
      timer = setInterval(nextSlide, CONFIG.interval * 1000);
    }
    function pause() { clearInterval(timer); timer = null; }
    root.addEventListener('mouseenter', pause);
    root.addEventListener('mouseleave', play);
    root.addEventListener('focusin', pause);
    root.addEventListener('focusout', play);
    document.addEventListener('visibilitychange', () => (document.hidden ? pause() : play()));
    play();

    // 拖拽 / 触摸（Pointer Events）
    let dragStartX = null, dragDx = 0;
    root.addEventListener('pointerdown', (e) => {
      dragStartX = e.clientX; dragDx = 0;
      root.classList.add('dragging');
      root.setPointerCapture(e.pointerId);
    });
    root.addEventListener('pointermove', (e) => {
      if (dragStartX === null) return;
      dragDx = e.clientX - dragStartX;
    });
    root.addEventListener('pointerup', () => {
      root.classList.remove('dragging');
      if (dragStartX === null) return;
      if (Math.abs(dragDx) > 50) (dragDx < 0 ? nextSlide : prevSlide)();
      dragStartX = null;
    });
    root.addEventListener('pointercancel', () => { root.classList.remove('dragging'); dragStartX = null; });

    // 键盘
    root.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
    });

    // 分页圆点
    const pager = document.createElement('div');
    pager.className = 'mt-pager';
    const dots = slides.map((_s, i) => {
      const dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dot.setAttribute('aria-label', '跳到第 ' + (i + 1) + ' 张');
      dot.addEventListener('click', () => goTo(i));
      pager.appendChild(dot);
      return dot;
    });
    root.appendChild(pager);
    function updatePager() { dots.forEach((d, i) => d.classList.toggle('active', i === index)); }
  })();
</script>
</body>
</html>
