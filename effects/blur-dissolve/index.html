<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>模糊溶解转场</title>
    <style>
      :root {
        --mt-bg: #0a0a0f; /* 页面底色 */
        --mt-imageA: url('/samples/sample-5.webp'); /* 第一幕海报 */
        --mt-imageB: url('/samples/sample-1.webp'); /* 第二幕海报 */
        --mt-blurAmount: 12px; /* 模糊强度（溶解两端的最大模糊半径） */
        --mt-duration: 0.55s; /* 转场时长 */
        --mt-accent: #ffffff; /* 强调色：标题与按钮 */
        --dis-ease: cubic-bezier(0.45, 0, 0.25, 1); /* 溶解曲线 */
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--mt-bg);
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #f2f2f7;
      }

      .mt-app {
        position: relative;
        width: min(880px, 94vw);
        height: min(560px, 92vh);
        border-radius: 18px;
        overflow: clip;
        background: #101016;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
      }
      .page {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        display: grid;
        place-items: end start;
      }
      .page[hidden] {
        display: none;
      }
      .page::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(transparent 45%, rgba(0, 0, 0, 0.62));
        pointer-events: none;
      }
      .page-a {
        background-image: var(--mt-imageA);
      }
      .page-b {
        background-image: var(--mt-imageB);
      }
      .poster-copy {
        position: relative;
        z-index: 1;
        padding: 0 44px 46px;
      }
      .poster-copy h1 {
        margin: 0 0 6px;
        font-size: clamp(30px, 5.4vw, 52px);
        color: var(--mt-accent);
        outline: none;
      }
      .poster-copy p {
        margin: 0;
        color: rgba(255, 255, 255, 0.72);
        font-size: 14.5px;
      }
      .stage-btn {
        position: absolute;
        z-index: 2;
        bottom: 20px;
        right: 22px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 999px;
        padding: 9px 20px;
        background: rgba(10, 10, 15, 0.45);
        color: var(--mt-accent);
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      .stage-btn.prev {
        right: auto;
        left: 22px;
      }
      .stage-btn:focus-visible {
        outline: 2px solid var(--mt-accent);
        outline-offset: 2px;
      }

      /* ===== 过渡层：模糊溶解（对称，前进返回同一套） =====
         旧幕晕开成雾淡出并轻微放大，新幕从雾里聚焦成形并落回原大。 */
      ::view-transition-old(page),
      ::view-transition-new(page) {
        animation-duration: var(--mt-duration);
        animation-timing-function: var(--dis-ease);
        animation-fill-mode: both;
      }
      ::view-transition-old(page) {
        animation-name: dissolve-out;
      }
      ::view-transition-new(page) {
        animation-name: dissolve-in;
      }

      @keyframes dissolve-out {
        from {
          opacity: 1;
          filter: blur(0);
          transform: scale(1);
        }
        to {
          opacity: 0;
          filter: blur(var(--mt-blurAmount));
          transform: scale(1.03);
        }
      }
      @keyframes dissolve-in {
        from {
          opacity: 0;
          filter: blur(var(--mt-blurAmount));
          transform: scale(0.97);
        }
        to {
          opacity: 1;
          filter: blur(0);
          transform: scale(1);
        }
      }

      /* @mt:fallback 无 API 回退：同一套 keyframes 直接加在真实页面上，效果一致 */
      .page.fx-in,
      .page.fx-out {
        animation-duration: var(--mt-duration);
        animation-timing-function: var(--dis-ease);
        animation-fill-mode: both;
      }
      .page.fx-in {
        z-index: 2;
        animation-name: dissolve-in;
      }
      .page.fx-out {
        z-index: 1;
        animation-name: dissolve-out;
      }

      /* 用户开启「减少动态效果」：一律瞬间切换（JS 同步跳过转场） */
      @media (prefers-reduced-motion: reduce) {
        ::view-transition-group(*),
        ::view-transition-old(*),
        ::view-transition-new(*) {
          animation: none !important;
        }
        .page.fx-in,
        .page.fx-out {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="mt-app" id="mtApp">
      <section class="page page-a" id="pageA" aria-label="第一幕">
        <div class="poster-copy">
          <h1 id="titleA" tabindex="-1"></h1>
          <p>第一幕 · 点右下角，画面晕成光雾换场</p>
        </div>
        <button type="button" class="stage-btn next" id="nextBtn">下一幕 ›</button>
      </section>

      <section class="page page-b" id="pageB" aria-label="第二幕" hidden>
        <div class="poster-copy">
          <h1 id="titleB" tabindex="-1"></h1>
          <p>第二幕 · 返回时从雾里重新聚焦上一幕</p>
        </div>
        <button type="button" class="stage-btn prev" id="prevBtn">‹ 上一幕</button>
      </section>
    </div>

    <script>
      const CONFIG = {
        titleA: '先看清。', // 第一幕标题
        titleB: '再聚焦。', // 第二幕标题
      };

      (function () {
        const html = document.documentElement;
        const pageA = document.getElementById('pageA');
        const pageB = document.getElementById('pageB');
        const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
        let navigating = false; // 转场进行中忽略新的导航

        document.getElementById('titleA').textContent = CONFIG.titleA;
        document.getElementById('titleB').textContent = CONFIG.titleB;

        function swap(from, to) {
          from.hidden = true;
          to.hidden = false;
        }
        function focusHeading(to) {
          const heading = to.querySelector('h1');
          if (heading) heading.focus({ preventScroll: true });
        }

        // ---- 方向化转场（溶解对称，方向仅作记录） ----
        function go(to, direction) {
          const from = to === pageB ? pageA : pageB;
          if (navigating || !to.hidden) return;

          if (reduceMotion.matches) {
            swap(from, to);
            focusHeading(to);
            return;
          }
          navigating = true;
          html.dataset.vt = direction;

          from.style.viewTransitionName = 'page';
          const cleanup = () => {
            from.style.viewTransitionName = '';
            to.style.viewTransitionName = '';
            delete html.dataset.vt;
            navigating = false;
            focusHeading(to);
          };

          if (document.startViewTransition) {
            const vt = document.startViewTransition(() => {
              swap(from, to);
              from.style.viewTransitionName = '';
              to.style.viewTransitionName = 'page';
            });
            vt.finished.finally(cleanup);
          } else {
            // @mt:fallback：两幕短暂同框，播同一套 keyframes
            to.hidden = false;
            from.classList.add('fx-out');
            to.classList.add('fx-in');
            const done = () => {
              to.removeEventListener('animationend', done);
              from.hidden = true;
              from.classList.remove('fx-out');
              to.classList.remove('fx-in');
              cleanup();
            };
            to.addEventListener('animationend', done);
          }
        }
        const goBack = () => go(pageA, 'back');

        // ---- 换幕途径：按钮 / Esc / Backspace ----
        document.getElementById('nextBtn').addEventListener('click', () => go(pageB, 'forward'));
        document.getElementById('prevBtn').addEventListener('click', goBack);
        document.addEventListener('keydown', (e) => {
          if (pageB.hidden) return;
          if (e.key === 'Escape' || e.key === 'Backspace') {
            e.preventDefault();
            goBack();
          }
        });

        /* @mt:thumb-start */
        // 缩略图演示：自动溶解往返；切后台暂停，reduced-motion 不启动
        if (!reduceMotion.matches) {
          setInterval(() => {
            if (document.hidden || navigating) return;
            if (pageB.hidden) go(pageB, 'forward');
            else goBack();
          }, 2600);
        }
        /* @mt:thumb-end */
      })();
    </script>
  </body>
</html>
