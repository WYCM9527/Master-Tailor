<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字母故障矩阵</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-vignette: 1;        /* 四周压暗：1 开 / 0 关 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* 四周压暗：一层径向渐变罩 */
  .mt-vig {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, var(--mt-bg) 100%);
    opacity: var(--mt-vignette);
    pointer-events: none;
  }

  /* 用户开启「减少动态效果」时：字格静止（JS 同步处理） */
  @media (prefers-reduced-motion: reduce) {
    canvas { opacity: 0.85; }
  }
</style>
</head>
<body>
<canvas id="mtCanvas" aria-hidden="true"></canvas>
<div class="mt-vig" aria-hidden="true"></div>
<script>
  const CONFIG = {
    cell: 18,          // 字格大小（px）
    rate: 5,           // 换字频率（每帧换字的字格比例，%）
    colors: ["#ffffff", "#a3a3a3", "#3a3a3a"], // 字符颜色池，随机取
    glyphs: "latin",   // 字符集：latin 字母数字 / binary 0 和 1 / kana 假名符号
    smooth: true,      // 换字时渐变
  };

  const POOLS = {
    latin: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789",
    binary: "01",
    kana: "アイウエオカキクケコサシスセソタチツテトナニヌネノ<>/=+*",
  };
  const canvas = document.getElementById('mtCanvas');
  const ctx = canvas.getContext('2d');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dpr = Math.min(2, devicePixelRatio || 1);
  const pool = Array.from(POOLS[CONFIG.glyphs] || POOLS.latin);
  let cols = 0, rows = 0, cells = [];

  function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  const palette = CONFIG.colors.map(hexToRgb);

  function resize() {
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(innerWidth / CONFIG.cell); rows = Math.ceil(innerHeight / CONFIG.cell);
    // 每格：当前字、当前色、目标色、渐变进度
    cells = Array.from({ length: cols * rows }, () => {
      const c = palette[Math.floor(Math.random() * palette.length)];
      return { ch: pool[Math.floor(Math.random() * pool.length)], from: c, to: c, p: 1 };
    });
    ctx.font = (CONFIG.cell * 0.8) + 'px ui-monospace, SFMono-Regular, Consolas, monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  }
  resize(); addEventListener('resize', resize);

  function frame() {
    if (!document.hidden) {
      if (!reduceMotion) {
        // 随机挑一批字格换字换色
        const n = Math.floor(cells.length * CONFIG.rate / 100);
        for (let k = 0; k < n; k++) {
          const c = cells[Math.floor(Math.random() * cells.length)];
          c.ch = pool[Math.floor(Math.random() * pool.length)];
          c.from = CONFIG.smooth ? mix(c.from, c.to, c.p) : c.to;
          c.to = palette[Math.floor(Math.random() * palette.length)];
          c.p = CONFIG.smooth ? 0 : 1;
        }
      }
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      for (let i = 0; i < cells.length; i++) {
        const c = cells[i];
        if (c.p < 1) c.p = Math.min(1, c.p + 0.08);
        const rgb = c.p >= 1 ? c.to : mix(c.from, c.to, c.p);
        ctx.fillStyle = 'rgb(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ')';
        ctx.fillText(c.ch, (i % cols) * CONFIG.cell + CONFIG.cell / 2, Math.floor(i / cols) * CONFIG.cell + CONFIG.cell / 2);
      }
    }
    requestAnimationFrame(frame);
  }
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t | 0, a[1] + (b[1] - a[1]) * t | 0, a[2] + (b[2] - a[2]) * t | 0]; }
  requestAnimationFrame(frame);
</script>
</body>
</html>
