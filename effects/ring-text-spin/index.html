<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>环形旋转文字</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-period: 16s;        /* 转一圈用时 */
    --mt-direction: normal;  /* 旋转方向：normal 顺时针 / reverse 逆时针 */
    --mt-center: 1;          /* 中心标记：1 显示 / 0 隐藏 */
    --mt-color: #f2f3f8;     /* 文字颜色 */
    --mt-fontSize: 18px;     /* 字号 */
    --mt-font: "JetBrains Mono", ui-monospace, monospace; /* 字体 */
  }

  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mt-bg);
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  /* 圆环容器整体旋转；每个字用 rotate(角度) translateY(-半径) 排到圆周上 */
  .mt-ring {
    position: relative;
    width: var(--size);
    height: var(--size);
    font-family: var(--mt-font);
    font-size: var(--mt-fontSize);
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--mt-color);
    text-transform: uppercase;
    /* 旋转角由 JS 每帧累加（变速时角度连续，不会跳变） */
    transform: rotate(var(--rot, 0deg));
    will-change: transform;
    cursor: default;
    user-select: none;
  }
  .mt-ring .c {
    position: absolute;
    left: 50%; top: 50%;
    width: 1em; height: 1em;
    margin: -0.5em 0 0 -0.5em;
    display: grid;
    place-items: center;
    transform: rotate(var(--a)) translateY(calc(var(--r) * -1));
    white-space: pre;
  }
  /* 中心标记：一个小方块，跟随开关 */
  .mt-ring::after {
    content: '';
    position: absolute;
    left: 50%; top: 50%;
    width: 10px; height: 10px;
    margin: -5px 0 0 -5px;
    background: var(--mt-color);
    opacity: var(--mt-center);
  }

  /* 用户开启「减少动态效果」时：静止的环形文字（JS 不推进角度） */
</style>
</head>
<body>
<div class="mt-ring" id="mtRing" role="img"></div>
<script>
  const CONFIG = {
    text: "MASTER TAILOR · 裁缝大师 · ", // 环上文字，首尾相接
    radius: 110,       // 圆环半径（px）
    hoverMode: "fast", // 鼠标悬停时：fast 加速 / slow 放慢 / pause 暂停 / bonkers 狂转 / none 不变
  };

  const ring = document.getElementById('mtRing');
  const chars = Array.from(CONFIG.text);
  const size = CONFIG.radius * 2 + 40;
  ring.style.setProperty('--size', size + 'px');
  ring.setAttribute('aria-label', CONFIG.text);

  // 字符均匀分布在 360° 上，字号越大越挤——由使用者通过半径/字号自行平衡
  chars.forEach((ch, i) => {
    const c = document.createElement('span');
    c.className = 'c';
    c.textContent = ch;
    c.setAttribute('aria-hidden', 'true');
    c.style.setProperty('--a', (360 / chars.length) * i + 'deg');
    c.style.setProperty('--r', CONFIG.radius + 'px');
    ring.appendChild(c);
  });

  // 旋转：角速度 = 360° / 周期 × 倍率；悬停切换倍率目标（加速 ×4、放慢 ÷2、暂停 0、狂转 ×20），
  // 倍率本身平滑过渡，所以角度始终连续、不会跳变
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cs = getComputedStyle(document.documentElement);
  const period = parseFloat(cs.getPropertyValue('--mt-period')) || 20;
  const dir = cs.getPropertyValue('--mt-direction').trim() === 'reverse' ? -1 : 1;
  const MODES = { fast: 4, slow: 0.5, pause: 0, bonkers: 20, none: 1 };
  let rot = 0, rate = 1, targetRate = 1, last = performance.now();
  ring.addEventListener('pointerenter', () => { targetRate = MODES[CONFIG.hoverMode] ?? 1; });
  ring.addEventListener('pointerleave', () => { targetRate = 1; });
  (function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (document.hidden || reduceMotion) return;
    rate += (targetRate - rate) * Math.min(1, dt * 6);
    rot = (rot + dir * (360 / period) * rate * dt) % 360;
    ring.style.setProperty('--rot', rot.toFixed(3) + 'deg');
  })(last);
</script>
</body>
</html>
