<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角落光束</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色（光束以外透出它） */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* 用户开启「减少动态效果」时：JS 停止时间推进，光束定格 */
</style>
</head>
<body>
<canvas id="mtCanvas" aria-hidden="true"></canvas>
<script>
  const CONFIG = {
    colors: ["#27ff64", "#a8ffb6"],  // 两组光色
    origin: "top-right",   // 光源角落
    speed: 2.5,            // 摇曳速度
    intensity: 2,          // 亮度
    spread: 2,             // 扇面张角
    tilt: 0,               // 整体倾斜（度）
    saturation: 1.5,       // 饱和度
    blend: 0.75,           // 两组混合
    falloff: 2,            // 距离衰减
    opacity: 1,            // 整体不透明度
  };

  const canvas = document.getElementById('mtCanvas');
  const gl = canvas.getContext('webgl', { antialias: false, alpha: true, premultipliedAlpha: false });
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const VS = `
    attribute vec2 aPos;
    void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
  `;
  // 片元：光源放在画面右上角外侧；对每个像素算「像素方向与参考方向的夹角余弦」，
  // 用两组不同种子的正弦随时间摇曳得到光束明暗；两组光束按比例混合后乘距离衰减，再调饱和度
  const FS = `
    precision highp float;
    uniform float uTime;
    uniform vec2  uRes;
    uniform float uSpeed, uIntensity, uSpread, uFlipX, uFlipY, uTilt, uSat, uBlend, uFalloff, uOpacity;
    uniform vec3  uC1, uC2;

    float rayStrength(vec2 src, vec2 refDir, vec2 coord, float seedA, float seedB, float speed) {
      vec2 toCoord = coord - src;
      float cosA = dot(normalize(toCoord), refDir);
      return clamp((0.45 + 0.15 * sin(cosA * seedA + uTime * speed)) + (0.3 + 0.2 * cos(-cosA * seedB + uTime * speed)), 0.0, 1.0)
           * clamp((uRes.x - length(toCoord)) / uRes.x, 0.5, 1.0);
    }

    void main() {
      vec2 frag = gl_FragCoord.xy;
      if (uFlipX > 0.5) frag.x = uRes.x - frag.x;   // 其他角落靠翻转坐标得到
      if (uFlipY > 0.5) frag.y = uRes.y - frag.y;
      vec2 coord = vec2(frag.x, uRes.y - frag.y);
      vec2 src = vec2(uRes.x * 1.1, -0.5 * uRes.y);   // 光源：右上角外
      // 整体倾斜：绕光源旋转坐标
      float c = cos(uTilt), s = sin(uTilt);
      vec2 rel = coord - src;
      vec2 tc = vec2(rel.x * c - rel.y * s, rel.x * s + rel.y * c) + src;
      // 两组参考方向：以 45° 为中心左右张开
      float hs = uSpread * 0.275;
      vec2 dir1 = normalize(vec2(cos(0.785398 + hs), sin(0.785398 + hs)));
      vec2 dir2 = normalize(vec2(cos(0.785398 - hs), sin(0.785398 - hs)));
      vec3 rays1 = uC1 * rayStrength(src, dir1, tc, 36.2214, 21.11349, uSpeed);
      vec3 rays2 = uC2 * rayStrength(src, dir2, tc, 22.3991, 18.0234, uSpeed * 0.2);
      vec3 col = rays1 * (1.0 - uBlend) * 0.9 + rays2 * uBlend * 0.9;
      // 距离衰减：离光源越远越暗
      float dist = length(frag - vec2(src.x, uRes.y - src.y)) / uRes.y;
      col *= uIntensity * 0.4 / pow(max(dist, 0.001), uFalloff);
      // 饱和度
      float gray = dot(col, vec3(0.299, 0.587, 0.114));
      col = mix(vec3(gray), col, uSat);
      gl_FragColor = vec4(col, max(col.r, max(col.g, col.b)) * uOpacity);
    }
  `;

  // ---- WebGL 底座 ----
  function compile(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  const U = (n) => gl.getUniformLocation(prog, n);
  const hexRgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);

  const dpr = Math.min(2, devicePixelRatio || 1);
  function resize() {
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(U('uRes'), canvas.width, canvas.height);
  }
  resize(); addEventListener('resize', resize);
  const FLIP = { 'top-right': [0, 0], 'top-left': [1, 0], 'bottom-right': [0, 1], 'bottom-left': [1, 1] };
  const [fx, fy] = FLIP[CONFIG.origin] || FLIP['top-right'];
  gl.uniform1f(U('uFlipX'), fx); gl.uniform1f(U('uFlipY'), fy);
  gl.uniform1f(U('uSpeed'), CONFIG.speed);
  gl.uniform1f(U('uIntensity'), CONFIG.intensity);
  gl.uniform1f(U('uSpread'), CONFIG.spread);
  gl.uniform1f(U('uTilt'), (CONFIG.tilt * Math.PI) / 180);
  gl.uniform1f(U('uSat'), CONFIG.saturation);
  gl.uniform1f(U('uBlend'), CONFIG.blend);
  gl.uniform1f(U('uFalloff'), CONFIG.falloff);
  gl.uniform1f(U('uOpacity'), CONFIG.opacity);
  gl.uniform3fv(U('uC1'), hexRgb(CONFIG.colors[0]));
  gl.uniform3fv(U('uC2'), hexRgb(CONFIG.colors[1] || CONFIG.colors[0]));
  const uTime = U('uTime');

  let time = reduceMotion ? 2 : 0, last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    if (document.hidden) { last = now; return; }
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!reduceMotion) time += dt;
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(uTime, time);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  gl.clearColor(0, 0, 0, 0);
  requestAnimationFrame(frame);
</script>
</body>
</html>
