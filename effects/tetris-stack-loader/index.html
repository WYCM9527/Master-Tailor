<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>俄罗斯方块</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-color: #7c9cff;     /* 方块颜色 */
    --mt-accent: #f2f3f8;    /* 满行闪光色 */
    --mt-cell: 14px;         /* 格子大小 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; display: grid; place-items: center; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .mt-well { position: relative; display: grid; grid-template-columns: repeat(var(--cols), var(--mt-cell)); grid-template-rows: repeat(4, var(--mt-cell)); gap: 2px; padding: 4px; border-radius: 6px; background: rgba(255, 255, 255, 0.05); }
  .mt-cell { border-radius: 2px; background: var(--mt-color); opacity: 0; transition: opacity 0.05s; }
  .mt-cell.on { opacity: 1; }
  /* 满行：整行闪白再消失 */
  .mt-well.flash .mt-cell.on { animation: mt-flash 0.28s ease-out both; }
  @keyframes mt-flash { 30% { background: var(--mt-accent); transform: scale(1.1); } 100% { opacity: 0; transform: scale(0.6); } }
  .mt-drop { position: absolute; width: var(--mt-cell); height: var(--mt-cell); border-radius: 2px; background: var(--mt-color); left: calc(4px + var(--c) * (var(--mt-cell) + 2px)); top: -4px; transition: top var(--t) cubic-bezier(0.5, 0, 1, 0.5); }
  @media (prefers-reduced-motion: reduce) { * { animation-play-state: paused !important; } }
</style>
</head>
<body>
<div class="mt-well" id="mtWell" role="status" aria-label="加载中"></div>
<script>
  const CONFIG = {
    cols: 5,       // 每行格数
    speed: 0.3,    // 每块下落用时（秒）
  };
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.addEventListener('visibilitychange', () => document.querySelectorAll('*').forEach(el => { if (getComputedStyle(el).animationName !== 'none') el.style.animationPlayState = document.hidden ? 'paused' : 'running'; }));
  const well = document.getElementById('mtWell');
  well.style.setProperty('--cols', CONFIG.cols);
  const ROWS = 4, cells = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < CONFIG.cols; c++) { const d = document.createElement('div'); d.className = 'mt-cell'; well.appendChild(d); cells.push(d); }
  const cellAt = (r, c) => cells[r * CONFIG.cols + c];
  // 一块方块：随机选一列，落到该列最高空位，堆满一行即闪光清行；一直堆到 4 行满就整体清空重来
  let order = [], filled = Array.from({ length: ROWS }, () => Array(CONFIG.cols).fill(false));
  const shuffle = () => { order = Array.from({ length: CONFIG.cols }, (_, i) => i).sort(() => Math.random() - 0.5); };
  shuffle();
  async function drop() {
    if (reduceMotion || document.hidden) return setTimeout(drop, 500);
    if (!order.length) shuffle();
    const c = order.pop();
    let r = ROWS - 1; while (r >= 0 && filled[r][c]) r--;
    if (r < 0) { return setTimeout(drop, 50); }
    const piece = document.createElement('div'); piece.className = 'mt-drop'; piece.style.setProperty('--c', c); piece.style.setProperty('--t', CONFIG.speed + 's'); well.appendChild(piece);
    await new Promise(res => requestAnimationFrame(() => requestAnimationFrame(res)));
    piece.style.top = `calc(4px + ${r} * (var(--mt-cell) + 2px))`;
    await new Promise(res => setTimeout(res, CONFIG.speed * 1000));
    piece.remove(); filled[r][c] = true; cellAt(r, c).classList.add('on');
    // 该行满了？闪光清除并让上面的行落下来
    if (filled[r].every(Boolean)) {
      well.classList.add('flash'); cells.forEach((el, i) => { if (Math.floor(i / CONFIG.cols) !== r) el.style.animation = 'none'; });
      await new Promise(res => setTimeout(res, 300));
      well.classList.remove('flash'); cells.forEach(el => (el.style.animation = ''));
      for (let rr = r; rr > 0; rr--) filled[rr] = filled[rr - 1].slice(); filled[0] = Array(CONFIG.cols).fill(false);
      cells.forEach((el, i) => el.classList.toggle('on', filled[Math.floor(i / CONFIG.cols)][i % CONFIG.cols]));
    }
    if (filled[0].some(Boolean)) { await new Promise(res => setTimeout(res, 400)); filled = filled.map(row => row.map(() => false)); cells.forEach(el => el.classList.remove('on')); }
    setTimeout(drop, 80);
  }
  drop();
</script>
</body>
</html>
