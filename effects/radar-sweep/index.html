<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雷达扫描</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #000000;        /* 页面底色 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* 用户开启「减少动态效果」时：JS 停止时间推进，保留一帧静态雷达 */
  @media (prefers-reduced-motion: reduce) { canvas { opacity: 0.9; } }
</style>
</head>
<body>
<canvas id="mtCanvas" aria-hidden="true"></canvas>
<script>
  const CONFIG = {
    color: "#27ff64",    // 雷达颜色
    speed: 1,            // 圆环外扩速度
    scale: 0.5,          // 盘面缩放
    ringCount: 10,       // 圆环数
    spokeCount: 10,      // 辐条数
    ringThickness: 0.05, // 圆环粗细
    sweepSpeed: 1,       // 光束转速
    sweepWidth: 2,       // 光束收窄
    falloff: 2,          // 边缘衰减
    mouse: true,         // 鼠标视差
  };
  const SPOKE_THICKNESS = 0.01, MOUSE_INFLUENCE = 0.1;

  const canvas = document.getElementById('mtCanvas');
  const gl = canvas.getContext('webgl');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const VS = `
    attribute vec2 aPos;
    void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
  `;
  // 片元着色器：极坐标下三层叠加——同心环（fract 相位随时间外扩）、辐条（角度取模）、
  // 旋转光束（sin 波瓣的幂次收窄）；整体乘边缘衰减，再乘雷达色
  const FS = `
    precision highp float;
    uniform float uTime;        // 时间（秒）
    uniform vec3  uRes;         // 分辨率
    uniform float uSpeed;       // 圆环外扩速度
    uniform float uScale;       // 盘面缩放
    uniform float uRingCount;   // 圆环数
    uniform float uSpokeCount;  // 辐条数
    uniform float uRingThick;   // 圆环粗细
    uniform float uSpokeThick;  // 辐条粗细
    uniform float uSweepSpeed;  // 光束转速
    uniform float uSweepWidth;  // 光束收窄幂次
    uniform vec3  uColor;       // 雷达色
    uniform float uFalloff;     // 边缘衰减幂次
    uniform vec2  uMouse;       // 鼠标（0–1）
    uniform float uMouseOn;     // 视差开关
    #define TAU 6.28318530718

    void main() {
      vec2 st = gl_FragCoord.xy / uRes.xy * 2.0 - 1.0;
      st.x *= uRes.x / uRes.y;
      if (uMouseOn > 0.5) {
        vec2 mShift = uMouse * 2.0 - 1.0;                  // 鼠标视差：整盘反向轻移
        mShift.x *= uRes.x / uRes.y;
        st -= mShift * ${MOUSE_INFLUENCE.toFixed(2)};
      }
      st *= uScale;

      float dist = length(st);
      float theta = atan(st.y, st.x);
      float t = uTime * uSpeed;

      /* 同心环：半径 × 环数 − 时间 取小数 → 环随时间向外推 */
      float ringPhase = dist * uRingCount - t;
      float ringDist = abs(fract(ringPhase) - 0.5);
      float ringGlow = 1.0 - smoothstep(0.0, uRingThick, ringDist);

      /* 辐条：角度按辐条数取模，转成弧长后按粗细羽化；圆心附近淡出避免糊成一团 */
      float spokeGlow = 0.0;
      if (uSpokeCount > 0.5) {
        float spokeAngle = abs(fract(theta * uSpokeCount / TAU + 0.5) - 0.5) * TAU / uSpokeCount;
        float arcDist = spokeAngle * dist;
        spokeGlow = (1.0 - smoothstep(0.0, uSpokeThick, arcDist)) * smoothstep(0.0, 0.1, dist);
      }

      /* 旋转光束：sin 波瓣抬到 0–1，再取幂收窄成一道柔光 */
      float sweepBeam = pow(max(0.5 * sin(theta + uTime * uSweepSpeed) + 0.5, 0.0), uSweepWidth);

      /* 边缘衰减：1.05→0.85 处软边收口，再乘 (1−dist)^falloff */
      float fade = smoothstep(1.05, 0.85, dist) * pow(max(1.0 - dist, 0.0), uFalloff);

      float intensity = max((ringGlow + spokeGlow + sweepBeam) * fade, 0.0);
      gl_FragColor = vec4(uColor * intensity, 1.0);
    }
  `;

  // ---- WebGL 底座 ----
  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  const U = (n) => gl.getUniformLocation(prog, n);

  function hexRgb(hex) {
    const h = hex.replace('#', '');
    return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16) / 255);
  }

  const dpr = Math.min(2, devicePixelRatio || 1);
  function resize() {
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform3f(U('uRes'), canvas.width, canvas.height, canvas.width / canvas.height);
  }

  gl.uniform1f(U('uSpeed'), CONFIG.speed);
  gl.uniform1f(U('uScale'), CONFIG.scale);
  gl.uniform1f(U('uRingCount'), CONFIG.ringCount);
  gl.uniform1f(U('uSpokeCount'), CONFIG.spokeCount);
  gl.uniform1f(U('uRingThick'), CONFIG.ringThickness);
  gl.uniform1f(U('uSpokeThick'), SPOKE_THICKNESS);
  gl.uniform1f(U('uSweepSpeed'), CONFIG.sweepSpeed);
  gl.uniform1f(U('uSweepWidth'), CONFIG.sweepWidth);
  gl.uniform3fv(U('uColor'), hexRgb(CONFIG.color));
  gl.uniform1f(U('uFalloff'), CONFIG.falloff);
  gl.uniform1f(U('uMouseOn'), CONFIG.mouse ? 1 : 0);
  const uTime = U('uTime'), uMouse = U('uMouse');
  resize(); addEventListener('resize', resize);

  // 鼠标（0–1，y 向上）5% 平滑
  let tmx = 0.5, tmy = 0.5, mx = 0.5, my = 0.5;
  if (CONFIG.mouse) {
    addEventListener('pointermove', (e) => { tmx = e.clientX / innerWidth; tmy = 1 - e.clientY / innerHeight; });
    addEventListener('pointerleave', () => { tmx = 0.5; tmy = 0.5; });
  }

  let time = reduceMotion ? 2 : 0;   // 减少动态：定格一帧雷达
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    if (document.hidden) { last = now; return; }   // 切后台暂停
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!reduceMotion) time += dt;
    mx += (tmx - mx) * 0.05; my += (tmy - my) * 0.05;
    gl.uniform1f(uTime, time);
    gl.uniform2f(uMouse, mx, my);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
