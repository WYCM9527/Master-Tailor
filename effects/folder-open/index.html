<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文件夹展开</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-folder: #ffffff;    /* 文件夹颜色 */
    --mt-paper: #d0d0d0;     /* 纸张颜色 */
    --mt-size: 200px;        /* 文件夹大小（宽） */
    --mt-lift: 45%;          /* 纸张探出高度 */
    --mt-duration: 0.45s;    /* 打开时长 */
  }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mt-bg);
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #f2f3f8;
  }
  .mt-wrap { display: grid; justify-items: center; gap: 18px; cursor: pointer; }
  /* 文件夹：后板 + 纸张 + 前封口（前封口在悬停时向前下方掀开） */
  .mt-folder {
    position: relative;
    width: var(--mt-size);
    height: calc(var(--mt-size) * 0.72);
    perspective: 900px;
  }
  .mt-back {
    position: absolute; inset: 0;
    background: color-mix(in srgb, var(--mt-folder) 70%, #000);
    border-radius: 6px 14px 10px 10px;
  }
  .mt-back::before {
    /* 后板的标签突起 */
    content: '';
    position: absolute; left: 0; top: -10%;
    width: 42%; height: 12%;
    background: inherit;
    border-radius: 6px 10px 0 0;
  }
  .mt-paper {
    position: absolute;
    left: 10%; right: 10%; bottom: 8%;
    height: 90%;
    background: var(--mt-paper);
    border-radius: 6px;
    transform-origin: bottom center;
    transform: translateY(0) rotate(0deg);
    transition: transform var(--mt-duration) cubic-bezier(0.2, 0.8, 0.2, 1);
    box-shadow: 0 -4px 14px rgba(0, 0, 0, 0.18);
  }
  .mt-paper::after {
    /* 纸上的几条「文字」线 */
    content: '';
    position: absolute; left: 14%; right: 14%; top: 14%;
    height: 34%;
    background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.16) 0 3px, transparent 3px 11px);
  }
  .mt-front {
    position: absolute; inset: 0;
    top: 18%;
    z-index: 10; /* 封口始终盖在纸张之前 */
    background: var(--mt-folder);
    border-radius: 6px 6px 10px 10px;
    transform-origin: bottom center;
    transition: transform var(--mt-duration) cubic-bezier(0.2, 0.8, 0.2, 1);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }
  /* 悬停：前封口向前掀开，纸张按各自幅度探出并微微扇开 */
  .mt-wrap:hover .mt-front, .mt-wrap.is-open .mt-front { transform: rotateX(-28deg) translateY(4%); }
  .mt-wrap:hover .mt-paper, .mt-wrap.is-open .mt-paper {
    transform: translateY(calc(var(--mt-lift) * -1 * var(--k))) rotate(var(--r));
  }
  .mt-name { font-size: 14px; letter-spacing: 0.06em; opacity: 0.8; }

  /* 用户开启「减少动态效果」时：直接开合，不做过渡 */
  @media (prefers-reduced-motion: reduce) {
    .mt-front, .mt-paper { transition: none; }
  }
</style>
</head>
<body>
<div class="mt-wrap" id="mtWrap">
  <div class="mt-folder" id="mtFolder" role="img" aria-label="文件夹">
    <div class="mt-back"></div>
    <div class="mt-front"></div>
  </div>
  <div class="mt-name" id="mtName">项目资料</div>
</div>
<script>
  const CONFIG = {
    papers: 3,          // 纸张数量（1–3）
    label: "项目资料",   // 文件夹名
  };

  const wrap = document.getElementById('mtWrap');
  const folder = document.getElementById('mtFolder');
  const front = folder.querySelector('.mt-front');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.getElementById('mtName').textContent = CONFIG.label;

  // 纸张：越靠后的探得越高、越向两侧扇开
  const tilts = [[1, '-8deg'], [0.8, '0deg'], [0.6, '8deg']];
  for (let i = 0; i < CONFIG.papers; i++) {
    const p = document.createElement('div');
    p.className = 'mt-paper';
    const [k, r] = tilts[(i + (3 - CONFIG.papers)) % 3];
    p.style.setProperty('--k', k);
    p.style.setProperty('--r', r);
    p.style.zIndex = String(i + 1);
    folder.insertBefore(p, front);
  }

  /* @mt:thumb-start */
  // 缩略图演示：自动开合循环；真实鼠标进入后停止
  if (!reduceMotion) {
    let auto = true;
    wrap.addEventListener('pointerenter', () => { auto = false; wrap.classList.remove('is-open'); });
    setInterval(() => { if (!document.hidden && auto) wrap.classList.toggle('is-open'); }, 1500);
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
