<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双图裁切悬停</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-color: #f2f3f8;     /* 文字颜色 */
    --mt-duration: 0.7s;     /* 过渡时长 */
    --mt-hue: 190deg;        /* 底图初始的偏色角度 */
    --mt-radius: 6px;        /* 圆角 */
    --mt-font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; /* 字体 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; display: grid; place-items: center; font-family: var(--mt-font); color: var(--mt-color); }

  .mt-grid { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 24px; width: min(960px, 92vw); }
  .mt-item { position: relative; cursor: pointer; }
  .mt-item .box { position: relative; aspect-ratio: 3 / 4; overflow: hidden; border-radius: var(--mt-radius); background: #16161d; }
  .mt-item .box .img { position: absolute; inset: 0; background: var(--img) center / cover; }
  .mt-item .cap { display: flex; justify-content: space-between; margin-top: 10px; font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; opacity: 0.6; }
  /* 通用：底图带强烈偏色并放大，顶图完整盖住；悬停时顶图被裁掉、底图回到正常色 */
  .mt-item .bottom { transform: scale(1.15); filter: brightness(4) saturate(2) hue-rotate(var(--mt-hue)); transition: filter var(--mt-duration) cubic-bezier(0.7, 0, 0.3, 1), transform var(--mt-duration) cubic-bezier(0.7, 0, 0.3, 1); }
  .mt-item .top { transition: clip-path var(--mt-duration) cubic-bezier(0.7, 0, 0.3, 1), transform var(--mt-duration) cubic-bezier(0.7, 0, 0.3, 1); }
  .mt-item.on .bottom, .mt-grid .mt-item:hover .bottom { filter: brightness(1) saturate(1) hue-rotate(0deg); transform: scale(1); }
  /* wipe：顶图从右往左被抹掉 */
  .mt-grid.wipe .top { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
  .mt-grid.wipe .mt-item:hover .top, .mt-grid.wipe .mt-item.on .top { clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); }
  /* circle：顶图从满圆收成一个点 */
  .mt-grid.circle .top { clip-path: circle(71% at 50% 50%); }
  .mt-grid.circle .mt-item:hover .top, .mt-grid.circle .mt-item.on .top { clip-path: circle(0% at 50% 50%); transform: scale(1.3); }
  .mt-grid.circle .bottom { transform: scale(1.5); }
  /* corner：以右上角为圆心的圆缩回角落 */
  .mt-grid.corner .top { clip-path: circle(141% at 100% 0); }
  .mt-grid.corner .mt-item:hover .top, .mt-grid.corner .mt-item.on .top { clip-path: circle(0% at 100% 0); }
  .mt-grid.corner .bottom { filter: brightness(0) saturate(6); transform: scale(1.2); }
  /* quads：顶图分四块，各自向自己的外角缩没 */
  .mt-grid.quads .top { transition-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
  .mt-grid.quads .top.q1 { clip-path: polygon(0 0, 50% 0, 50% 50%, 0 50%); }
  .mt-grid.quads .top.q2 { clip-path: polygon(50% 0, 100% 0, 100% 50%, 50% 50%); transition-delay: 0.05s; }
  .mt-grid.quads .top.q3 { clip-path: polygon(0 50%, 50% 50%, 50% 100%, 0 100%); transition-delay: 0.1s; }
  .mt-grid.quads .top.q4 { clip-path: polygon(50% 50%, 100% 50%, 100% 100%, 50% 100%); transition-delay: 0.15s; }
  .mt-grid.quads .mt-item:hover .top.q1, .mt-grid.quads .mt-item.on .top.q1 { clip-path: polygon(0 0, 0 0, 0 50%, 0 50%); }
  .mt-grid.quads .mt-item:hover .top.q2, .mt-grid.quads .mt-item.on .top.q2 { clip-path: polygon(100% 0, 100% 0, 100% 50%, 100% 50%); }
  .mt-grid.quads .mt-item:hover .top.q3, .mt-grid.quads .mt-item.on .top.q3 { clip-path: polygon(0 100%, 50% 100%, 50% 100%, 0 100%); }
  .mt-grid.quads .mt-item:hover .top.q4, .mt-grid.quads .mt-item.on .top.q4 { clip-path: polygon(50% 100%, 100% 100%, 100% 100%, 50% 100%); }
  .mt-grid.quads .bottom { transform: scale(1.3); filter: saturate(2); }
  /* blinds：顶图切成横条百叶，各条依次收薄 */
  .mt-grid.blinds .top { clip-path: inset(var(--t) 0 var(--b) 0); transition-delay: var(--d); }
  .mt-grid.blinds .mt-item:hover .top, .mt-grid.blinds .mt-item.on .top { clip-path: inset(var(--m) 0 var(--m) 0); }
  @media (prefers-reduced-motion: reduce) { .mt-item .top, .mt-item .bottom { transition: none; } }
</style>
</head>
<body>
<div class="mt-grid" id="mtGrid"></div>
<script>
  const CONFIG = {
    slides: [{"src":"/samples/sample-1.webp","caption":"山谷晨雾"},{"src":"/samples/sample-3.webp","caption":"黄昏海滩"},{"src":"/samples/sample-6.webp","caption":"街角"}], // 图片与说明
    variant: "wipe",     // 揭示方式：wipe 从右抹掉 / circle 圆收缩 / corner 角落圆缩 / quads 四块分缩 / blinds 百叶收薄
    columns: 3,          // 列数
  };
  const grid = document.getElementById('mtGrid');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  grid.classList.add(CONFIG.variant); grid.style.setProperty('--cols', CONFIG.columns);
  CONFIG.slides.forEach((s, i) => {
    const item = document.createElement('div'); item.className = 'mt-item';
    const box = document.createElement('div'); box.className = 'box';
    const bottom = document.createElement('div'); bottom.className = 'img bottom'; bottom.style.setProperty('--img', `url("${s.src}")`); box.appendChild(bottom);
    // 顶图：多数变体一份；四块 / 百叶变体切成多份同图
    if (CONFIG.variant === 'quads') { ['q1', 'q2', 'q3', 'q4'].forEach(q => { const t = document.createElement('div'); t.className = 'img top ' + q; t.style.setProperty('--img', `url("${s.src}")`); box.appendChild(t); }); }
    else if (CONFIG.variant === 'blinds') { const n = 6; for (let k = 0; k < n; k++) { const t = document.createElement('div'); t.className = 'img top'; t.style.setProperty('--img', `url("${s.src}")`); t.style.setProperty('--t', (k * 100 / n) + '%'); t.style.setProperty('--b', (100 - (k + 1) * 100 / n) + '%'); t.style.setProperty('--m', ((k + 0.5) * 100 / n) + '%'); t.style.setProperty('--d', k * 0.05 + 's'); box.appendChild(t); } }
    else { const t = document.createElement('div'); t.className = 'img top'; t.style.setProperty('--img', `url("${s.src}")`); box.appendChild(t); }
    const cap = document.createElement('div'); cap.className = 'cap'; cap.innerHTML = `<span></span><span>${String(i + 1).padStart(2, '0')}</span>`; cap.firstChild.textContent = s.caption || '';
    item.append(box, cap); grid.appendChild(item);
    item.addEventListener('pointerenter', () => (userTook = true));
  });
  let userTook = false;

  /* @mt:thumb-start */
  // 缩略图演示：没有鼠标时轮流悬停
  if (!reduceMotion) { let i = 0; const items = grid.querySelectorAll('.mt-item'); setInterval(() => { if (userTook || document.hidden) return; items.forEach(it => it.classList.remove('on')); items[i % items.length].classList.add('on'); i++; }, 1800); }
  /* @mt:thumb-end */
</script>
</body>
</html>
