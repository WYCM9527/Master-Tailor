<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面倒影</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #1a0b37;        /* 页面底色 */
    --mt-color: #9577cc;     /* 文字颜色 */
    --mt-band: 15vh;         /* 倒影带高度 */
    --mt-font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; /* 字体 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); font-family: var(--mt-font); color: var(--mt-color); overflow-x: hidden; }

  /* 顶部一条固定的「水面」：上下翻转，里面放一份内容副本并随滚动反向位移，于是永远映出紧挨水面下方的那截页面 */
  .mt-band { position: fixed; left: 0; top: 0; width: 100%; height: var(--mt-band); overflow: hidden; z-index: 3; background: var(--mt-bg); transform: scaleY(-1); box-shadow: 0 -25px 45px rgba(0, 0, 0, 0.35); }
  .mt-band::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, transparent, color-mix(in srgb, var(--mt-bg) 70%, transparent)); pointer-events: none; }
  .mt-content { position: relative; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 300px)); column-gap: 10vw; row-gap: 10vh; justify-content: center; align-items: start; width: 100%; box-sizing: border-box; padding: 18vh 5vw 60vh; margin: var(--mt-band) auto 0; }
  .mt-band .mt-content { position: absolute; top: 0; left: 0; margin: 0; }
  .mt-item { margin: 0; width: 100%; }
  .mt-item .img { position: relative; aspect-ratio: 2 / 3; overflow: hidden; border-radius: 6px; transform-origin: 50% 100%; will-change: transform, filter; }
  .mt-item .img img { display: block; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; }
  .mt-item figcaption { margin-top: 12px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; display: flex; justify-content: space-between; transform-origin: 50% 0; }
  .mt-title { grid-column: 1 / -1; margin: 6vh 0 0; font-size: clamp(28px, 4.5vw, 56px); font-weight: 300; letter-spacing: -0.02em; text-align: center; }
  .mt-band .mt-title { visibility: hidden; }
</style>
</head>
<body>
<div class="mt-band" id="mtBand"></div>
<main class="mt-content" id="mtContent"></main>
<script>
  const CONFIG = {
    slides: [{"src":"/samples/sample-1.webp","caption":"山谷晨雾"},{"src":"/samples/sample-2.webp","caption":"海边球车"},{"src":"/samples/sample-3.webp","caption":"黄昏海滩"},{"src":"/samples/sample-4.webp","caption":"林间逆光"},{"src":"/samples/sample-5.webp","caption":"雪线"},{"src":"/samples/sample-6.webp","caption":"街角"}], // 图片与说明
    title: "向上滚，让画面沉入水面",   // 顶部标题
    melt: 1,             // 靠近水面时的融化程度（0 只倒影不变形）
    blur: 25,            // 融化时的最大模糊（px）
  };
  const content = document.getElementById('mtContent'), band = document.getElementById('mtBand');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const h = document.createElement('h1'); h.className = 'mt-title'; h.textContent = CONFIG.title; content.appendChild(h);
  const items = CONFIG.slides.map((s, i) => {
    const fig = document.createElement('figure'); fig.className = 'mt-item';
    fig.innerHTML = `<div class="img"><img alt=""></div><figcaption><span></span><span>${String(i + 1).padStart(2, '0')}</span></figcaption>`;
    fig.querySelector('img').src = s.src; fig.querySelector('figcaption span').textContent = s.caption || '';
    content.appendChild(fig); return fig;
  });
  // 倒影 = 整份内容的克隆放进翻转的水面带里
  const mirror = content.cloneNode(true); mirror.id = ''; mirror.setAttribute('aria-hidden', 'true'); band.appendChild(mirror);
  const mirrorItems = [...mirror.querySelectorAll('.mt-item')];
  // 每帧：副本跟随滚动；每张图按「到顶部的进度」融化——进度 0（从底部进入）到 1（完全滚出顶部），power3 入
  function update() {
    mirror.style.transform = `translateY(${-scrollY}px)`;
    if (!CONFIG.melt) return;
    const vh = innerHeight;
    items.forEach((fig, i) => {
      const r = fig.getBoundingClientRect();
      const p = Math.max(0, Math.min(1, (vh - r.top) / (vh + r.height))), e = p * p * p * CONFIG.melt, e4 = p * p * p * p;
      const tf = `scale(${(1 + 0.1 * e).toFixed(3)}, ${Math.max(0, 1 - e).toFixed(3)}) skew(${(3 * e).toFixed(2)}deg, ${(-3 * e4).toFixed(2)}deg)`;
      const fl = `brightness(${(1.2 - 0.7 * e).toFixed(2)}) blur(${(CONFIG.blur * e).toFixed(1)}px)`;
      const inner = `scale(${(1 + e).toFixed(3)})`, cap = `scale(${(1 - e4).toFixed(3)})`;
      for (const f of [fig, mirrorItems[i]]) {
        const img = f.querySelector('.img'); img.style.transform = tf; img.style.filter = fl; img.style.borderRadius = (6 + 94 * e) + 'px';
        img.firstElementChild.style.transform = inner; const c = f.querySelector('figcaption'); c.style.transform = cap; c.style.opacity = (1 - e4).toFixed(2);
      }
    });
  }
  if (reduceMotion) CONFIG.melt = 0;
  addEventListener('scroll', update, { passive: true }); addEventListener('resize', update); update();

  /* @mt:thumb-start */
  // 缩略图演示：没人滚时自动慢慢往下滚再回来
  let userTook = false; addEventListener('wheel', () => (userTook = true), { passive: true }); addEventListener('touchstart', () => (userTook = true), { passive: true });
  if (!reduceMotion) { let t = 0; (function auto() { requestAnimationFrame(auto); if (userTook || document.hidden) return; t += 0.005; const max = document.documentElement.scrollHeight - innerHeight; scrollTo(0, (0.5 - 0.5 * Math.cos(t)) * max); })(); }
  /* @mt:thumb-end */
</script>
</body>
</html>
