<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>粒子星空连线</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;       /* 页面底色 */
    --mt-color: #ffffff;    /* 粒子与连线颜色（canvas 每帧读取，调参实时生效） */
    --mt-lineAlpha: 0.4;    /* 连线浓度：粒子贴得最近时线的不透明度 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; }
  canvas { position: fixed; inset: 0; display: block; }
</style>
</head>
<body>
<canvas id="mtCanvas" aria-hidden="true"></canvas>
<script>
  const CONFIG = {
    count: 80,     // 粒子数量（30-150，越多越密也越吃性能）
    linkDist: 120, // 连线距离：两个粒子近于该距离才连线（px）
    speed: 0.6,    // 漂移速度倍率
  };

  const canvas = document.getElementById('mtCanvas');
  const ctx = canvas.getContext('2d');
  const rootStyle = getComputedStyle(document.documentElement);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let width = 0, height = 0, dpr = 1;
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    width = innerWidth; height = innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize);
  resize();

  // 初始化粒子：随机位置与速度
  const particles = [];
  for (let i = 0; i < CONFIG.count; i++) {
    particles.push({
      x: Math.random() * width,
      y: Math.random() * height,
      vx: (Math.random() - 0.5) * CONFIG.speed,
      vy: (Math.random() - 0.5) * CONFIG.speed,
    });
  }

  // 鼠标是「第 N+1 个粒子」：靠近的粒子会与它连线
  const mouse = { x: -9999, y: -9999 };
  function feed(x, y) { mouse.x = x; mouse.y = y; }
  document.addEventListener('mousemove', (e) => feed(e.clientX, e.clientY));
  document.addEventListener('mouseleave', () => feed(-9999, -9999));

  // 把 #rrggbb 转成 rgba 前缀，方便按距离控制连线透明度
  function hexToRgb(hex) {
    return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  }

  function frame() {
    ctx.clearRect(0, 0, width, height);
    // 每帧从 CSS 变量读颜色：站内调参时颜色实时变化，无需重建
    const color = rootStyle.getPropertyValue('--mt-color').trim() || '#ffffff';
    const lineAlpha = parseFloat(rootStyle.getPropertyValue('--mt-lineAlpha')) || 0.4;
    const [r, g, b] = hexToRgb(color);

    for (const p of particles) {
      if (!reduceMotion) {
        p.x += p.vx; p.y += p.vy;
        // 碰到边缘反弹
        if (p.x < 0 || p.x > width) p.vx *= -1;
        if (p.y < 0 || p.y > height) p.vy *= -1;
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1.6, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
    }

    // 两两连线：距离越近线越实
    for (let i = 0; i < particles.length; i++) {
      const a = particles[i];
      for (let j = i + 1; j < particles.length; j++) {
        const bp = particles[j];
        const dx = a.x - bp.x, dy = a.y - bp.y;
        const dist = Math.hypot(dx, dy);
        if (dist < CONFIG.linkDist) {
          ctx.strokeStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + (lineAlpha * (1 - dist / CONFIG.linkDist)).toFixed(3) + ')';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(bp.x, bp.y);
          ctx.stroke();
        }
      }
      // 与鼠标连线（范围稍大，鼠标像引力源一样聚拢周围的线）
      const md = Math.hypot(a.x - mouse.x, a.y - mouse.y);
      if (md < CONFIG.linkDist * 1.4) {
        ctx.strokeStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + (lineAlpha * (1 - md / (CONFIG.linkDist * 1.4))).toFixed(3) + ')';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(mouse.x, mouse.y);
        ctx.stroke();
      }
    }
  }

  // rAF 主循环：页面切到后台时暂停，避免空耗性能
  let rafId = null;
  function loop() { frame(); rafId = requestAnimationFrame(loop); }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { cancelAnimationFrame(rafId); rafId = null; }
    else if (!rafId) rafId = requestAnimationFrame(loop);
  });
  if (reduceMotion) {
    frame(); // 减少动态效果：只画一帧静态星图，不做动画
  } else {
    rafId = requestAnimationFrame(loop);
  }

  /* @mt:thumb-start */
  if (window.__MT_ENV && window.__MT_ENV.thumb && !reduceMotion) {
    // 缩略图演示：一个看不见的指针缓慢巡游，展示「鼠标引力」；真实鼠标进入时优先跟随
    let lastReal = 0;
    window.__mtOnPointer = (x, y) => { lastReal = performance.now(); feed(x, y); };
    (function autoDemo() {
      if (document.hidden) { requestAnimationFrame(autoDemo); return; }
      if (performance.now() - lastReal > 1200) {
        const t = performance.now() / 1000;
        feed(
          width / 2 + Math.cos(t * 0.5) * width * 0.3,
          height / 2 + Math.sin(t * 0.8) * height * 0.3
        );
      }
      requestAnimationFrame(autoDemo);
    })();
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
