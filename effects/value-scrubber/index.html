<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数值拖拽条</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #121317;            /* 页面底色（浅色主题时自动换浅底） */
    --mt-accent: #8b7bff;        /* 强调色：拖动中的拇指、数值和预览图形 */
    --mt-height: 36px;           /* 条高 */
    --mt-width: 380px;           /* 面板宽度 */
    --mt-font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; /* 字体 */
  }
  html, body { margin: 0; height: 100%; }
  body { --panel: #1b1c22; --line: #2a2b33; --bar: #24252c; --fill: rgba(255, 255, 255, 0.12); --tick: rgba(255, 255, 255, 0.22); --cap: #fff; --ink: #e7e8ec; --muted: #8c8f99; --check: #2a2b31; background: var(--mt-bg); overflow: hidden; display: grid; place-items: center; font-family: var(--mt-font); color: var(--ink); user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  body.light { --mt-bg: #eceef1; --panel: #fff; --line: #e3e5ea; --bar: #eef0f3; --fill: rgba(17, 20, 28, 0.09); --tick: rgba(17, 20, 28, 0.22); --cap: #1d2027; --ink: #1d2027; --muted: #7a7f8a; --check: #e6e8ec; }
  .mt-panel { width: min(var(--mt-width), 92vw); box-sizing: border-box; padding: 14px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28); }
  .light .mt-panel { box-shadow: 0 18px 50px rgba(20, 24, 36, 0.1); }
  .mt-head { display: flex; justify-content: space-between; align-items: baseline; padding: 2px 4px 10px; font-size: 13px; font-weight: 600; }
  .mt-hint { font-size: 11px; font-weight: 400; color: var(--muted); }
  /* 预览：棋盘格底，中间的图形随四个数值实时变化 */
  .mt-preview { position: relative; height: 150px; margin-bottom: 12px; border-radius: 10px; overflow: hidden; display: grid; place-items: center; background: repeating-conic-gradient(var(--check) 0 25%, transparent 0 50%) 0 0 / 16px 16px; }
  .mt-shape { width: 64px; height: 64px; background: linear-gradient(135deg, var(--mt-accent), color-mix(in oklab, var(--mt-accent) 45%, #ff7ab6)); box-shadow: 0 10px 24px color-mix(in srgb, var(--mt-accent) 35%, transparent); }
  .mt-shape.ease { transition: opacity 0.15s, transform 0.15s cubic-bezier(0.23, 1, 0.32, 1), border-radius 0.15s; }
  .mt-rows { display: grid; gap: 8px; }
  .mt-scrub { position: relative; height: var(--mt-height); border-radius: 8px; background: var(--bar); overflow: hidden; touch-action: none; outline: none; transform-origin: 0 50%; }
  .mt-scrub.rel { cursor: ew-resize; }
  .mt-scrub.abs { cursor: pointer; }
  .mt-scrub.spring { transition: transform 0.45s cubic-bezier(0.3, 1.7, 0.5, 1); }
  .mt-scrub:focus-visible { box-shadow: 0 0 0 2px var(--mt-accent); }
  .mt-fill { position: absolute; top: 0; bottom: 0; left: 0; background: var(--fill); pointer-events: none; }
  .mt-tick { position: absolute; top: 50%; width: 1px; height: 6px; margin: -3px 0 0 -0.5px; border-radius: 1px; background: var(--tick); pointer-events: none; transition: opacity 0.15s; }
  /* 落在标签或数值文字范围里的刻度隐藏，避免和文字打架 */
  .mt-tick.hide { opacity: 0; }
  /* 胶囊拇指：静止时淡而小，悬停 / 拖动 / 聚焦时变实、换强调色，带一点回弹 */
  .mt-cap { position: absolute; top: 50%; left: 0; width: 4px; height: calc(var(--mt-height) * 0.6); margin: calc(var(--mt-height) * -0.3) 0 0 -2px; border-radius: 99px; background: var(--cap); opacity: 0.16; scale: 0.7; pointer-events: none; transition: opacity 0.2s, scale 0.25s cubic-bezier(0.3, 1.6, 0.5, 1), background-color 0.2s; }
  .mt-fill.ease, .mt-cap.ease { transition: opacity 0.2s, scale 0.25s cubic-bezier(0.3, 1.6, 0.5, 1), background-color 0.2s, left 0.15s cubic-bezier(0.23, 1, 0.32, 1), width 0.15s cubic-bezier(0.23, 1, 0.32, 1); }
  .mt-scrub.active .mt-cap, .mt-scrub:focus-visible .mt-cap { opacity: 0.9; scale: 1; background: var(--mt-accent); }
  @media (hover: hover) and (pointer: fine) { .mt-scrub:hover .mt-cap { opacity: 0.9; scale: 1; } }
  .mt-label, .mt-val { position: absolute; top: 50%; translate: 0 -50%; font-size: 13px; font-weight: 500; white-space: nowrap; pointer-events: none; }
  .mt-label { left: 12px; }
  .mt-val { right: 10px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; transition: color 0.2s; }
  .mt-scrub.active .mt-val { color: var(--mt-accent); }
  .mt-edit { position: absolute; right: 6px; top: 50%; translate: 0 -50%; width: 74px; height: calc(var(--mt-height) - 10px); box-sizing: border-box; padding: 0 6px; border: 1px solid var(--mt-accent); border-radius: 6px; outline: none; background: var(--panel); color: var(--ink); font: 500 13px ui-monospace, "SF Mono", Menlo, monospace; text-align: right; }

  /* 用户开启「减少动态效果」时：拇指、填充、预览直接到位，拖过头不拉伸 */
  @media (prefers-reduced-motion: reduce) {
    .mt-cap, .mt-fill.ease, .mt-cap.ease, .mt-shape.ease, .mt-scrub.spring { transition: none !important; }
  }
</style>
</head>
<body>
<div class="mt-panel">
  <div class="mt-head"><span>图层</span><span class="mt-hint" id="mtHint"></span></div>
  <div class="mt-preview" aria-hidden="true"><div class="mt-shape ease" id="mtShape"></div></div>
  <div class="mt-rows" id="mtRows"></div>
</div>
<script>
  const CONFIG = {
    mode: 'relative',   // 拖拽方式：relative 相对拖动（按住左右拖改值）/ absolute 点哪到哪
    sensitivity: 1,     // 灵敏度（倍）：相对拖动时拖过整条宽度改变几倍量程
    ticks: 9,           // 刻度数：条内等距的竖刻度，0 为不显示
    stretch: true,      // 拉伸回弹：相对拖动拖过头时整条微微拉长，松手弹回
    theme: 'dark',      // 主题：dark 深色 / light 浅色
  };
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const REL = CONFIG.mode !== 'absolute';
  const SENS = clamp(+CONFIG.sensitivity || 1, 0.05, 10);
  const TICKS = clamp(Math.round(CONFIG.ticks), 0, 40);
  if (CONFIG.theme === 'light') document.body.classList.add('light');
  document.getElementById('mtHint').textContent = REL ? '左右拖动 · Shift 微调 · 双击输入' : '点按或拖动 · 双击输入';

  // 四个属性：旋转从中点向两侧填充
  const ROWS = [
    { label: '不透明度', min: 0, max: 100, step: 1, unit: '%', value: 80, dec: 0 },
    { label: '缩放', min: 0.25, max: 2.5, step: 0.05, unit: '×', value: 1.2, dec: 2 },
    { label: '旋转', min: -180, max: 180, step: 1, unit: '°', value: 20, dec: 0, center: 0 },
    { label: '圆角', min: 0, max: 32, step: 1, unit: 'px', value: 14, dec: 0 },
  ];
  const shape = document.getElementById('mtShape'), rowsEl = document.getElementById('mtRows');
  const snap = (r, v) => clamp(+(Math.round((v - r.min) / r.step) * r.step + r.min).toFixed(4), r.min, r.max);
  const text = (r, v) => `${v.toFixed(r.dec)}${r.unit}`;

  ROWS.forEach((r) => {
    const el = document.createElement('div');
    el.className = `mt-scrub ${REL ? 'rel' : 'abs'}`;
    el.tabIndex = 0;
    el.setAttribute('role', 'slider'); el.setAttribute('aria-label', r.label);
    el.setAttribute('aria-valuemin', r.min); el.setAttribute('aria-valuemax', r.max);
    el.innerHTML = '<i class="mt-fill ease"></i><i class="mt-cap ease"></i><span class="mt-label"></span><span class="mt-val"></span>';
    const ticks = [];
    for (let i = 0; i < TICKS; i++) { const t = document.createElement('i'); t.className = 'mt-tick'; t.style.left = `${((i + 1) / (TICKS + 1)) * 100}%`; el.insertBefore(t, el.children[1]); ticks.push(t); }
    el.querySelector('.mt-label').textContent = r.label;
    Object.assign(r, { el, ticks, fill: el.querySelector('.mt-fill'), cap: el.querySelector('.mt-cap'), lab: el.querySelector('.mt-label'), val: el.querySelector('.mt-val'), raw: r.value });
    rowsEl.append(el);
    bind(r);
    render(r);
  });

  function render(r) {
    const f = (r.value - r.min) / (r.max - r.min);
    const c = r.center === undefined ? 0 : (r.center - r.min) / (r.max - r.min);
    r.fill.style.left = `${Math.min(c, f) * 100}%`;
    r.fill.style.width = `${Math.abs(f - c) * 100}%`;
    // 拇指留出 6px 边距，贴边时也完整可见
    r.cap.style.left = `calc(${f.toFixed(4)} * (100% - 12px) + 6px)`;
    r.val.textContent = text(r, r.value);
    r.el.setAttribute('aria-valuenow', r.value);
    r.el.setAttribute('aria-valuetext', text(r, r.value));
    const W = r.el.clientWidth, a = r.lab.offsetLeft + r.lab.offsetWidth + 6, b = r.val.offsetLeft - 6;
    r.ticks.forEach((t, i) => { const x = ((i + 1) / (TICKS + 1)) * W; t.classList.toggle('hide', x < a || x > b); });
    preview();
  }
  addEventListener('resize', () => ROWS.forEach(render));
  if (document.fonts) document.fonts.ready.then(() => ROWS.forEach(render));
  function preview() {
    const [op, sc, rot, rad] = ROWS.map((r) => r.value);
    shape.style.opacity = (op / 100).toFixed(3);
    shape.style.transform = `rotate(${rot}deg) scale(${sc})`;
    shape.style.borderRadius = `${rad}px`;
  }
  function setValue(r, v, animate) {
    const ease = animate && !reduceMotion;
    [r.fill, r.cap].forEach((n) => n.classList.toggle('ease', ease));
    shape.classList.toggle('ease', ease);
    r.value = snap(r, v);
    render(r);
  }
  // 拖过头：整条朝拖动方向微微拉长（最多 3%），松手弹回
  function stretch(r, over) {
    if (!CONFIG.stretch || reduceMotion || !REL) return;
    r.el.classList.remove('spring');
    r.el.style.transformOrigin = over > 0 ? '0 50%' : '100% 50%';
    r.el.style.transform = over ? `scaleX(${(1 + 0.03 * Math.tanh(Math.abs(over) * 4)).toFixed(4)})` : '';
  }

  let userTook = false;
  function bind(r) {
    const el = r.el;
    let down = false, moved = false, lastX = 0, startX = 0;
    el.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || r.editing) return;
      userTook = true;
      down = true; moved = false; lastX = startX = e.clientX; r.raw = r.value;
      el.setPointerCapture(e.pointerId);
      el.classList.add('active');
      if (!REL) { const b = el.getBoundingClientRect(); setValue(r, r.min + clamp((e.clientX - b.left) / b.width, 0, 1) * (r.max - r.min), true); }
    });
    el.addEventListener('pointermove', (e) => {
      if (!down) return;
      const b = el.getBoundingClientRect();
      if (Math.abs(e.clientX - startX) > 2) moved = true;
      if (REL) {
        // 相对拖动：按位移增量改值，Shift 时十分之一
        const span = r.max - r.min;
        // 拖过头的量最多累计到量程的 25%，往回拖时不会空走太久
        r.raw = clamp(r.raw + ((e.clientX - lastX) / b.width) * span * SENS * (e.shiftKey ? 0.1 : 1), r.min - span * 0.25, r.max + span * 0.25);
        lastX = e.clientX;
        setValue(r, r.raw, false);
        stretch(r, r.raw > r.max ? (r.raw - r.max) / span : r.raw < r.min ? (r.raw - r.min) / span : 0);
      } else setValue(r, r.min + clamp((e.clientX - b.left) / b.width, 0, 1) * (r.max - r.min), false);
    });
    const up = () => {
      if (!down) return;
      down = false; el.classList.remove('active');
      r.raw = r.value;
      if (el.style.transform) { el.classList.add('spring'); el.style.transform = ''; }
    };
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((t) => el.addEventListener(t, up));
    el.addEventListener('dblclick', () => edit(r));
    el.addEventListener('keydown', (e) => {
      if (r.editing) return;
      if (e.key === 'Enter') { e.preventDefault(); edit(r); return; }
      const k = e.shiftKey ? 10 : 1;
      const d = { ArrowLeft: -r.step * k, ArrowDown: -r.step * k, ArrowRight: r.step * k, ArrowUp: r.step * k }[e.key];
      if (d === undefined && e.key !== 'Home' && e.key !== 'End') return;
      e.preventDefault(); userTook = true;
      setValue(r, e.key === 'Home' ? r.min : e.key === 'End' ? r.max : r.value + d, true);
    });
  }

  // 双击或回车：数值处换成输入框，回车确认、Esc 取消
  function edit(r) {
    if (r.editing) return;
    userTook = true;
    r.editing = true; r.val.style.visibility = 'hidden';
    const inp = document.createElement('input');
    inp.className = 'mt-edit'; inp.inputMode = 'decimal'; inp.value = r.value.toFixed(r.dec);
    inp.setAttribute('aria-label', `${r.label}数值`);
    r.el.append(inp); inp.focus(); inp.select();
    let done = false;
    const close = (commit) => {
      if (done) return;
      done = true;
      const n = parseFloat(inp.value.replace(/[^\d.\-]/g, ''));
      inp.remove(); r.val.style.visibility = ''; r.editing = false;
      if (commit && Number.isFinite(n)) setValue(r, n, true);
      r.el.focus({ preventScroll: true });
    };
    inp.addEventListener('keydown', (e) => { e.stopPropagation(); if (e.key === 'Enter') close(true); if (e.key === 'Escape') close(false); });
    inp.addEventListener('pointerdown', (e) => e.stopPropagation());
    inp.addEventListener('blur', () => close(true));
  }

  /* @mt:thumb-start */
  // 缩略图演示：依次「拖」几条，拇指亮起、预览跟着变；用户一碰就交还
  if (window.__MT_ENV && window.__MT_ENV.thumb && !reduceMotion) {
    const wait = (ms) => new Promise((res) => setTimeout(res, ms));
    const scrub = (r, to, ms) => new Promise((done) => {
      const from = r.value, t0 = performance.now();
      r.el.classList.add('active');
      (function f(now) {
        if (userTook) { r.el.classList.remove('active'); return done(); }
        const k = Math.min(1, (now - t0) / ms), e = k < 0.5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
        setValue(r, from + (to - from) * e, false);
        if (k < 1) requestAnimationFrame(f); else { r.el.classList.remove('active'); done(); }
      })(t0);
    });
    (async () => {
      await wait(800);
      const seq = [[2, -60], [1, 1.9], [3, 32], [0, 35], [2, 135], [1, 0.8], [3, 4], [0, 90], [2, 20], [1, 1.2], [3, 14]];
      for (let i = 0; !userTook; i = (i + 1) % seq.length) {
        if (document.hidden) { await wait(500); continue; }
        await scrub(ROWS[seq[i][0]], seq[i][1], 700); await wait(450);
      }
    })();
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
