<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弹性下载进度</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-color: #6c5ce7;         /* 主色：按钮、已下载的线与气泡 */
    --mt-track: #d9d8e8;         /* 轨道色：还没下载的那段线 */
    --mt-success: #20b26b;       /* 完成色 */
    --mt-width: 360px;           /* 线长 */
    --mt-bg: #f1f0f6;            /* 页面底色 */
    --mt-font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; /* 字体 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; display: grid; place-items: center; font-family: var(--mt-font); color: #2b2a3a; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  .mt-wrap { display: grid; justify-items: center; gap: 4px; width: min(calc(var(--mt-width) + 80px), 94vw); }
  .mt-stage { width: 100%; cursor: pointer; outline: none; border-radius: 18px; }
  .mt-stage:focus-visible { outline: 2px solid color-mix(in srgb, var(--mt-color) 55%, transparent); outline-offset: 2px; }
  .mt-stage.busy { cursor: default; }
  .mt-stage svg { display: block; width: 100%; height: auto; overflow: visible; }
  .mt-btn { filter: drop-shadow(0 10px 14px color-mix(in srgb, var(--mt-color) 30%, transparent)); }
  .mt-btn.ok { filter: drop-shadow(0 10px 14px color-mix(in srgb, var(--mt-success) 30%, transparent)); }
  .mt-left { fill: none; stroke: var(--mt-color); stroke-width: 6; stroke-linecap: round; transition: stroke 0.3s; }
  .mt-right { fill: none; stroke: var(--mt-track); stroke-width: 6; stroke-linecap: round; }
  .mt-tag rect, .mt-tag .tip { fill: var(--mt-color); transition: fill 0.3s; }
  .mt-tag text { fill: #fff; font: 700 13px var(--mt-font); text-anchor: middle; dominant-baseline: central; font-variant-numeric: tabular-nums; }
  .mt-ico path { fill: none; stroke: #fff; stroke-width: 4; stroke-linejoin: miter; }
  /* 下载完成：整根线和气泡换成完成色，气泡里的百分比换成对勾 */
  .done .mt-left { stroke: var(--mt-success); }
  .done .mt-tag rect, .done .mt-tag .tip { fill: var(--mt-success); }
  .mt-tag .mt-ico { opacity: 0; }
  .done .mt-tag .mt-ico { opacity: 1; }
  .done .mt-tag text { opacity: 0; }
  .mt-cap { min-height: 1.4em; font-size: 13px; letter-spacing: 0.02em; color: rgba(43, 42, 58, 0.6); font-variant-numeric: tabular-nums; }
  .mt-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) {
    .mt-btn, .mt-left, .mt-tag rect, .mt-tag .tip { transition: none !important; }
  }
</style>
</head>
<body>
<div class="mt-wrap">
  <div class="mt-stage" id="mtStage" role="button" tabindex="0">
    <svg id="mtSvg" aria-hidden="true">
      <rect class="mt-btn" id="mtBtn" />
      <path class="mt-right" id="mtRight" />
      <path class="mt-left" id="mtLeft" />
      <g class="mt-ico" id="mtArrow"><!-- IconPark: arrow-down --><path d="M24 42V6" stroke-linecap="butt" /><path d="M36 30L24 42L12 30" stroke-linecap="butt" /></g>
      <g class="mt-ico" id="mtOk"><!-- IconPark: check --><path d="M43 11L16.875 37L5 25.1818" stroke-linecap="square" /></g>
      <g class="mt-tag" id="mtTag">
        <rect x="-25" y="-39" width="50" height="27" rx="8" />
        <path class="tip" d="M-6.5 -12.5L0 -5L6.5 -12.5Z" />
        <text id="mtPct" y="-25.5">0%</text>
        <g class="mt-ico" transform="translate(-8 -33.5) scale(0.333)"><!-- IconPark: check --><path d="M43 11L16.875 37L5 25.1818" stroke-linecap="square" stroke-width="6" /></g>
      </g>
    </svg>
  </div>
  <div class="mt-cap" id="mtCap"></div>
  <div class="mt-sr" id="mtBar" role="progressbar" aria-label="下载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
  <div class="mt-sr" id="mtLive" aria-live="polite"></div>
</div>
<script>
  const CONFIG = {
    duration: 5,      // 下载时长（秒）
    elastic: 0.6,     // 弹性：越大线越软，变形与回弹越多
    depth: 18,        // 下压深度（px）：进度点在线中间时把线压下去多深
    wobble: 1,        // 气泡晃动（倍）：气泡随速度前后摇摆的幅度
    hold: 1.6,        // 完成停留（秒）：完成后停多久再收回成按钮
    file: '设计稿合集.zip', // 文件名
  };
  const SIZE_MB = 48;                               // 演示文件大小
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const easeInOut = (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
  const $ = (id) => document.getElementById(id);
  const stage = $('mtStage'), svg = $('mtSvg'), btn = $('mtBtn'), left = $('mtLeft'), right = $('mtRight');
  const arrow = $('mtArrow'), ok = $('mtOk'), tag = $('mtTag'), pctEl = $('mtPct'), cap = $('mtCap'), bar = $('mtBar'), live = $('mtLive');
  const FILE = CONFIG.file || '文件';
  const EL = clamp(CONFIG.elastic, 0, 1), D = clamp(CONFIG.depth, 0, 60), WOB = clamp(CONFIG.wobble, 0, 3);
  const DUR = Math.max(0.5, CONFIG.duration) * 1000, HOLD = Math.max(0.2, CONFIG.hold) * 1000;
  stage.setAttribute('aria-label', `下载 ${FILE}`);

  // 视框按线长取：两侧各留 40，线在 y = 84，上面留给气泡、下面留给下压
  const L = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--mt-width')) || 360;
  const VW = L + 80, Y = 84, CX = VW / 2, X0 = 40 + 3, X1 = 40 + L - 3, R0 = 32;
  svg.setAttribute('viewBox', `0 0 ${VW} 150`);
  const iconAt = (g) => g.setAttribute('transform', `translate(${CX - 13} ${Y - 13}) scale(${26 / 48})`);
  iconAt(arrow); iconAt(ok);

  // 弹簧：每个量各带速度，按固有频率与阻尼比积分
  const spring = (o, target, hz, zeta, h) => { const w = 2 * Math.PI * hz; o.v += (-w * w * (o.x - target) - 2 * zeta * w * o.v) * h; o.x += o.v * h; };
  const morph = { x: 0, v: 0 }, dip = { x: 0, v: 0 }, slide = { x: X0, v: 0 }, tilt = { x: 0, v: 0 }, pop = { x: 0, v: 0 };
  const Z_MORPH = 0.9 - 0.6 * EL, Z_DIP = 0.65 - 0.5 * EL, HZ_DIP = 2.2 - 1.2 * EL, Z_SLIDE = 0.8 - 0.5 * EL;

  let phase = 'idle', p = 0, t0 = 0, plan = [], ended = 0, success = false, userTook = false, raf = 0, last = 0, tagX = X0, capHold = 0;
  // 下载节奏：分 4–6 段，每段先停一会儿再冲一截，模拟忽快忽慢的网速
  function makePlan() {
    const k = 4 + Math.floor(Math.random() * 3), w = Array.from({ length: k }, () => 0.5 + Math.random()), sum = w.reduce((a, b) => a + b);
    let acc = 0;
    const segs = w.map((x) => { const from = acc; acc += x / sum; return { from, to: acc, pause: 0.15 + Math.random() * 0.4 }; });
    segs[k - 1].to = 1;
    return segs;
  }
  function progressAt(ms) {
    if (ms >= DUR) return 1;
    const u = clamp(ms / DUR, 0, 1), i = Math.min(plan.length - 1, Math.floor(u * plan.length)), s = plan[i];
    const f = u * plan.length - i;
    return f < s.pause ? s.from : lerp(s.from, s.to, easeInOut((f - s.pause) / (1 - s.pause)));
  }

  function setCap(text) { if (cap.textContent !== text) cap.textContent = text; }
  function start() {
    if (phase !== 'idle') return;
    phase = 'open'; p = 0; success = false; plan = makePlan(); tagX = X0; capHold = 0;
    slide.x = X0; slide.v = 0; dip.x = 0; dip.v = 0; tilt.x = 0; tilt.v = 0; pop.x = 0; pop.v = 0;
    svg.classList.remove('done'); stage.classList.add('busy');
    live.textContent = `开始下载 ${FILE}`;
    wake();
  }
  function close(done) {
    phase = 'close'; ended = performance.now();
    if (!done) { live.textContent = '已取消'; setCap('已取消'); capHold = ended + 1800; }
    wake();
  }
  function activate() {
    userTook = true;
    if (phase === 'idle') start();
    else if (phase === 'load') close(false);
  }
  stage.addEventListener('click', activate);
  stage.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); } });

  // 线：左右两段二次曲线在下压点相接（两侧控制点与下压点同高，接口处切线水平，弯得圆滑）
  function drawLine(x, d) {
    if (phase === 'done') {
      const c = `M${X0},${Y} Q${CX.toFixed(1)},${(Y + 2 * d).toFixed(1)} ${X1},${Y}`;
      left.setAttribute('d', c); right.setAttribute('d', '');
      return;
    }
    const yb = (Y + d).toFixed(1);
    left.setAttribute('d', x - X0 < 0.5 ? '' : `M${X0},${Y} Q${((X0 + x) / 2).toFixed(1)},${yb} ${x.toFixed(1)},${yb}`);
    right.setAttribute('d', X1 - x < 0.5 ? '' : `M${x.toFixed(1)},${yb} Q${((x + X1) / 2).toFixed(1)},${yb} ${X1},${Y}`);
  }
  function drawButton(m, fillDone) {
    const k = clamp(m, 0, 1.2), w = lerp(2 * R0, L, k), h = Math.max(6, lerp(2 * R0, 6, clamp(m, 0, 1)));
    btn.setAttribute('x', (CX - w / 2).toFixed(1)); btn.setAttribute('y', (Y - h / 2).toFixed(1));
    btn.setAttribute('width', w.toFixed(1)); btn.setAttribute('height', h.toFixed(1)); btn.setAttribute('rx', (h / 2).toFixed(1));
    const base = fillDone ? 'var(--mt-success)' : 'var(--mt-color)';
    btn.classList.toggle('ok', fillDone);
    btn.style.fill = `color-mix(in srgb, ${base} ${(clamp(1 - k * 1.15, 0, 1) * 100).toFixed(0)}%, var(--mt-track))`;
  }

  function frame(now) {
    raf = 0;
    if (document.hidden) { last = 0; raf = requestAnimationFrame(frame); return; }
    const dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
    last = now;
    for (let h = dt; h > 0; h -= 1 / 120) {
      const s = Math.min(h, 1 / 120);
      const open = phase === 'open' || phase === 'load' || phase === 'done';
      spring(morph, open ? 1 : 0, 1.5, Z_MORPH, s);
      spring(pop, phase === 'load' || phase === 'done' || (phase === 'open' && morph.x > 0.85) ? 1 : 0, 2.2, 0.45, s);
      const xp = lerp(X0, X1, p);
      spring(slide, xp, 2.4, Z_SLIDE, s);
      const f = clamp((slide.x - X0) / (X1 - X0), 0, 1);
      spring(dip, phase === 'load' ? D * 4 * f * (1 - f) : 0, HZ_DIP, Z_DIP, s);
      spring(tilt, phase === 'load' ? clamp(-slide.v * 0.05 * WOB, -30, 30) : 0, 2.2, 0.3, s);
    }
    if (reduceMotion) {
      const open = phase === 'open' || phase === 'load' || phase === 'done';
      morph.x = open ? 1 : 0; pop.x = phase === 'close' ? 0 : open ? 1 : 0; slide.x = lerp(X0, X1, p);
      const f = p; dip.x = phase === 'load' ? D * 4 * f * (1 - f) : 0; tilt.x = 0;
    }

    if (phase === 'open' && Math.abs(morph.x - 1) < 0.02 && Math.abs(morph.v) < 0.3) { phase = 'load'; t0 = now; }
    if (phase === 'load') {
      p = progressAt(now - t0);
      const pct = Math.round(p * 100);
      pctEl.textContent = pct + '%';
      if (bar.getAttribute('aria-valuenow') !== String(pct)) bar.setAttribute('aria-valuenow', pct);
      setCap(`${(p * SIZE_MB).toFixed(1)} / ${SIZE_MB} MB`);
      if (p >= 1 && Math.abs(slide.x - X1) < 1.5) {
        // 下完：线被猛地一甩，像橡皮筋一样上下弹几下再绷直；气泡变成对勾
        phase = 'done'; ended = now; success = true;
        svg.classList.add('done');
        if (!reduceMotion) { dip.v -= D * 14 + 60; tilt.v += 160 * WOB; }
        live.textContent = '下载完成'; setCap(`已完成 · ${SIZE_MB} MB`);
      }
    }
    if (phase === 'done' && now - ended > HOLD) close(true);
    if (phase === 'close' && morph.x < 0.03 && Math.abs(morph.v) < 0.5) {
      phase = success ? 'rest' : 'idle'; ended = now;
      if (!success) stage.classList.remove('busy');
    }
    if (phase === 'rest' && now - ended > 1400) { phase = 'idle'; success = false; stage.classList.remove('busy'); }
    if (phase === 'idle' && now > capHold) setCap(`${FILE} · ${SIZE_MB} MB`);

    // 画面：按钮形态（变形中 / 收回中 / 待机）或拉直的线 + 气泡
    const lineMode = phase === 'load' || phase === 'done';
    btn.style.display = lineMode ? 'none' : '';
    left.style.display = right.style.display = lineMode ? '' : 'none';
    btn.style.transition = phase === 'idle' || phase === 'rest' ? 'fill 0.4s' : 'none';
    if (lineMode) drawLine(slide.x, dip.x); else drawButton(morph.x, phase === 'close' ? success : phase === 'rest');
    arrow.style.opacity = phase === 'idle' || (phase === 'open' && morph.x < 0.4) ? String(clamp(1 - morph.x * 2.5, 0, 1)) : '0';
    ok.style.opacity = phase === 'rest' ? '1' : '0';
    // 气泡：展开时从线的左端冒出，收回时随线一起缩向中心
    if (lineMode) tagX = slide.x;
    const tx = lineMode ? slide.x : CX + (tagX - CX) * clamp(morph.x, 0, 1), ty = lineMode && phase !== 'done' ? Y + dip.x : Y;
    tag.setAttribute('transform', `translate(${tx.toFixed(1)} ${ty.toFixed(1)}) rotate(${tilt.x.toFixed(2)}) scale(${clamp(pop.x, 0, 1.3).toFixed(3)})`);
    tag.style.display = pop.x < 0.02 ? 'none' : '';

    const settled = phase === 'idle' && morph.x < 0.01 && Math.abs(morph.v) < 0.05 && pop.x < 0.02 && now > capHold;
    if (!settled) raf = requestAnimationFrame(frame); else last = 0;
  }
  const wake = () => { if (!raf) raf = requestAnimationFrame(frame); };
  drawButton(0, false);
  ok.style.opacity = '0';
  tag.style.display = 'none';
  left.style.display = right.style.display = 'none';
  setCap(`${FILE} · ${SIZE_MB} MB`);

  /* @mt:thumb-start */
  // 缩略图演示：空闲时自动点下载，循环播放；用户一碰就交还
  if (window.__MT_ENV && window.__MT_ENV.thumb && !reduceMotion) {
    setInterval(() => {
      if (userTook || document.hidden) return;
      start();
    }, 900);
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
