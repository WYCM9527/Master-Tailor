<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>滚动接力长页</title>
    <style>
      :root {
        --mt-bg: #0a0a0f; /* 页面底色 */
        --mt-pace: 180; /* 每节滚动行程（占容器高度百分比，越大钉得越久） */
        --mt-rise: 36px; /* 文案上浮距离 */
        --mt-accent: #ffffff; /* 强调色：节号与标题 */
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--mt-bg);
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #f2f2f7;
      }

      /* ===== 滚动舞台：容器自身滚动，cqh 以它的高度为基准 ===== */
      .mt-app {
        position: relative;
        width: min(880px, 94vw);
        height: min(560px, 92vh);
        border-radius: 18px;
        overflow: clip;
        background: #101016;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
        container-type: size;
      }
      .mt-scroll {
        height: 100%;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: none;
      }
      .mt-scroll::-webkit-scrollbar {
        display: none;
      }
      .mt-scroll:focus-visible {
        outline: 2px solid var(--mt-accent);
        outline-offset: -2px;
      }

      /* ---- 开场引导 ---- */
      .intro {
        height: 60cqh;
        display: grid;
        place-content: center;
        text-align: center;
        gap: 8px;
      }
      .intro h2 {
        margin: 0;
        font-size: 24px;
        color: var(--mt-accent);
      }
      .intro p {
        margin: 0;
        color: #8a8b98;
        font-size: 14px;
      }
      .outro {
        height: 46cqh;
        display: grid;
        place-content: center;
        color: #8a8b98;
        font-size: 14px;
      }

      /* ---- 分节：大图钉住，下一节整幅顶上接走 ---- */
      .sec {
        position: relative;
        height: calc(var(--mt-pace) * 1cqh);
      }
      .sec .media {
        position: sticky;
        top: 0;
        height: 100cqh;
        overflow: clip;
        background: #14151f;
      }
      .sec .media img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .sec .media::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(transparent 45%, rgba(0, 0, 0, 0.72));
        pointer-events: none;
      }
      .sec .num {
        position: absolute;
        top: 18px;
        left: 22px;
        z-index: 1;
        font-size: 13px;
        letter-spacing: 0.14em;
        color: var(--mt-accent);
        opacity: 0.85;
        font-family: ui-monospace, monospace;
      }
      /* 文案在流内、压着钉住的大图往上走 */
      .sec .copy {
        position: relative;
        z-index: 1;
        margin-top: -52cqh;
        padding: 0 44px;
        max-width: 520px;
      }
      .sec .copy h3 {
        margin: 0 0 8px;
        font-size: clamp(24px, 4.2vw, 38px);
        color: var(--mt-accent);
      }
      .sec .copy p {
        margin: 0;
        line-height: 1.7;
        color: rgba(255, 255, 255, 0.78);
        font-size: 14.5px;
      }

      /* ===== 滚动驱动层：文案随自身入场进度浮现 =====
         渐进增强：@supports 之外的默认样式就是终态（完全可见），
         不支持的浏览器（含 Firefox 稳定版）直接展示终态，接力照常成立。 */
      @supports (animation-timeline: view()) {
        .sec .copy {
          animation: copy-in linear both;
          animation-timeline: view();
          animation-range: entry 0% entry 80%;
        }
        @keyframes copy-in {
          from {
            opacity: 0;
            translate: 0 var(--mt-rise);
          }
          to {
            opacity: 1;
            translate: 0 0;
          }
        }
      }

      /* 用户开启「减少动态效果」：文案不做浮现，保持常显 */
      @media (prefers-reduced-motion: reduce) {
        .sec .copy {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="mt-app">
      <div class="mt-scroll" id="scroller" tabindex="0" aria-label="滚动接力长页，方向键或滚轮浏览">
        <header class="intro">
          <h2>往下滚动</h2>
          <p>每一节的大图会钉在原地，等下一节整幅顶上来接走它</p>
        </header>
        <main id="secHost"></main>
        <footer class="outro">回滚全程可逆 · 到底了</footer>
      </div>
    </div>

    <script>
      const CONFIG = {
        slides: [{ src: '/samples/sample-4.webp', caption: '示例标题' }], // 分节图片（图 + 标题）
      };

      (function () {
        const scroller = document.getElementById('scroller');
        const host = document.getElementById('secHost');
        const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

        // ---- 生成分节 ----
        CONFIG.slides.forEach((s, i) => {
          const sec = document.createElement('section');
          sec.className = 'sec';
          const media = document.createElement('div');
          media.className = 'media';
          const img = document.createElement('img');
          img.src = s.src;
          img.alt = s.caption || '第 ' + (i + 1) + ' 节';
          img.loading = i === 0 ? 'eager' : 'lazy';
          const num = document.createElement('span');
          num.className = 'num';
          num.textContent = String(i + 1).padStart(2, '0') + ' / ' + String(CONFIG.slides.length).padStart(2, '0');
          media.append(img, num);
          const copy = document.createElement('div');
          copy.className = 'copy';
          const h3 = document.createElement('h3');
          h3.textContent = s.caption || '第 ' + (i + 1) + ' 节';
          const p = document.createElement('p');
          p.textContent = '大图先钉住不动，这段文字从下方浮上来；滚过临界点，下一节的画面从底部整幅顶上，把这一节干脆地接走。';
          copy.append(h3, p);
          sec.append(media, copy);
          host.appendChild(sec);
        });

        /* @mt:thumb-start */
        // 缩略图演示：自动往返滚动整条长页；用户上手（滚轮/拖动/按键）即停，切后台暂停
        if (!reduceMotion.matches) {
          let dir = 1;
          let userTook = false;
          const stop = () => (userTook = true);
          for (const ev of ['wheel', 'pointerdown', 'keydown', 'touchstart']) {
            scroller.addEventListener(ev, stop, { passive: true, once: true });
          }
          (function tick() {
            if (userTook) return;
            if (!document.hidden) {
              const maxTop = scroller.scrollHeight - scroller.clientHeight;
              scroller.scrollTop += dir * Math.max(1, maxTop / 600);
              if (scroller.scrollTop >= maxTop - 1) dir = -1;
              if (scroller.scrollTop <= 1) dir = 1;
            }
            requestAnimationFrame(tick);
          })();
        }
        /* @mt:thumb-end */
      })();
    </script>
  </body>
</html>
