<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>色块揭示进场</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-block: #7c9cff;     /* 色块颜色 */
    --mt-color: #f2f3f8;     /* 文字颜色 */
    --mt-duration: 0.5s;     /* 单程（盖住 / 收走）时长 */
    --mt-font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; /* 字体 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; display: grid; place-items: center; font-family: var(--mt-font); color: var(--mt-color); }

  .mt-page { width: min(640px, 90vw); display: grid; gap: 22px; }
  /* 每个内容块外包一层 revealer：内容先隐藏；色块从一侧长满（盖住）→ 内容显示 → 色块向另一侧收走（可留一条） */
  .mt-rev { position: relative; display: inline-block; align-self: start; justify-self: start; }
  .mt-rev .content { visibility: hidden; }
  .mt-rev .block { position: absolute; inset: 0; background: var(--mt-block); transform: scaleX(0); transform-origin: 0 50%; }
  .mt-rev.show .content { visibility: visible; }
  .mt-rev h1 { margin: 0; font-size: clamp(28px, 5vw, 48px); letter-spacing: -0.03em; line-height: 1.15; padding: 4px 8px; }
  .mt-rev p { margin: 0; font-size: 16px; line-height: 1.7; opacity: 0.75; padding: 4px 8px; max-width: 520px; }
  .mt-rev img { display: block; width: 320px; max-width: 90vw; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; }
  .mt-rev .btn { display: inline-block; padding: 12px 26px; border-radius: 999px; background: var(--mt-color); color: var(--mt-bg); font-weight: 700; font-size: 14px; }
</style>
</head>
<body>
<div class="mt-page" id="mtPage"></div>
<script>
  const CONFIG = {
    direction: "lr",       // 色块方向：lr 从左到右 / rl 从右到左 / tb 从上到下 / bt 从下到上
    coverArea: 0,          // 收走后留下的色块比例（0–100，%）：留一条当装饰边
    stagger: 120,          // 各块之间的错开（毫秒）
    title: "先盖住，再揭开",     // 标题
    text: "每一块内容都先被一块颜色盖住，再从另一侧滑走，内容就在色块后面出现了。", // 正文
    button: "开始",             // 按钮文字
    photo: "/samples/sample-7.webp",  // 图片
    loop: true,            // 演示循环
  };
  const page = document.getElementById('mtPage');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--mt-duration')) * 1000 || 500;
  const items = [['h1', CONFIG.title], ['p', CONFIG.text], ['img', CONFIG.photo], ['span', CONFIG.button]];
  const revs = items.map(([tag, val]) => {
    const rev = document.createElement('div'); rev.className = 'mt-rev';
    const el = document.createElement(tag); el.className = 'content' + (tag === 'span' ? ' btn' : '');
    if (tag === 'img') { el.src = val; el.alt = ''; } else el.textContent = val;
    const block = document.createElement('div'); block.className = 'block';
    rev.append(el, block); page.appendChild(rev); return rev;
  });
  // 方向 → 变换轴与两段的 transform-origin（盖住时从起点长，收走时向终点缩）
  const dirs = { lr: ['scaleX', '0 50%', '100% 50%'], rl: ['scaleX', '100% 50%', '0 50%'], tb: ['scaleY', '50% 0', '50% 100%'], bt: ['scaleY', '50% 100%', '50% 0'] };
  const easing = 'cubic-bezier(0.86, 0, 0.07, 1)';   // easeInOutQuint 手感
  async function reveal(rev, delay) {
    const [axis, o1, o2] = dirs[CONFIG.direction] || dirs.lr, block = rev.querySelector('.block');
    rev.classList.remove('show');
    await new Promise(r => setTimeout(r, delay));
    if (reduceMotion) { rev.classList.add('show'); block.style.transform = `${axis}(${CONFIG.coverArea / 100})`; return; }
    block.style.transformOrigin = o1;
    await block.animate([{ transform: `${axis}(0)` }, { transform: `${axis}(1)` }], { duration: dur, easing, fill: 'forwards' }).finished;
    rev.classList.add('show'); block.style.transformOrigin = o2;
    await block.animate([{ transform: `${axis}(1)` }, { transform: `${axis}(${CONFIG.coverArea / 100})` }], { duration: dur, easing, fill: 'forwards' }).finished;
  }
  function play() { revs.forEach((rev, i) => reveal(rev, i * CONFIG.stagger)); }
  play();
  let timer = 0;
  page.addEventListener('click', () => { clearTimeout(timer); play(); });

  /* @mt:thumb-start */
  // 演示：全部揭完停一会儿再来一遍
  if (!reduceMotion && CONFIG.loop) (function loop() { timer = setTimeout(() => { if (!document.hidden) play(); loop(); }, dur * 2 + revs.length * CONFIG.stagger + 2600); })();
  /* @mt:thumb-end */
</script>
</body>
</html>
