<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>挤值圆头滑块</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #141418;            /* 页面底色 */
    --mt-width: 360px;           /* 滑块宽度 */
    --mt-height: 56px;           /* 滑块高度（两端圆头的直径） */
    --mt-thickness: 2.5px;       /* 滑条粗细 */
    --mt-track: #2a2a30;         /* 轨道色（没被填充的部分） */
    --mt-handle: #ffffff;        /* 滑条色 */
    --mt-color: #ffffff;         /* 数字色 */
    --mt-flip: 0.3s;             /* 每位数字模糊翻页的时长 */
    --mt-font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; /* 字体 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; display: grid; place-items: center; font-family: var(--mt-font); }

  /* 轨道：两端圆头的胶囊，内容裁在里面 */
  .mt-slider { position: relative; width: var(--mt-width); height: var(--mt-height); border-radius: calc(var(--mt-height) / 2); background: var(--mt-track); overflow: hidden; cursor: grab; touch-action: none; user-select: none; outline: none; }
  .mt-slider.dragging { cursor: grabbing; }
  .mt-slider:focus-visible::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 2px var(--mt-color); pointer-events: none; opacity: 0.5; }
  /* 填充条：从左端到滑条前一小段的胶囊。背景由 JS 按 CONFIG.fill 生成：一个颜色就是纯色，多个颜色是横向渐变；
     渐变按整根轨道的宽度铺（background-size = 轨道宽），填充条变长时逐渐把它露出来，而不是跟着拉伸 */
  .mt-fill { position: absolute; left: 0; top: 0; height: 100%; width: var(--w, 0px); border-radius: inherit; background-repeat: no-repeat; background-size: var(--W, 100%) 100%; }
  /* 滑条：一条 SVG 路径，中段是竖直线段，进入圆头区域后由 JS 改写成圆弧 */
  .mt-handle { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .mt-handle path { fill: none; stroke: var(--mt-handle); stroke-width: var(--mt-thickness); stroke-linecap: round; }
  /* 数值：默认停在右端；被滑条逼近时翻到滑条左侧，之后贴着滑条走 */
  .mt-value { position: absolute; left: 0; top: 0; height: 100%; display: flex; align-items: center; gap: 0.25em; transform: translateX(var(--vx, 0px)); color: var(--mt-color); font-size: calc(var(--mt-height) * 0.34); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; pointer-events: none; transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .mt-slider.dragging .mt-value { transition-duration: 0.16s; } /* 拖动中数字跟得紧一点 */
  .mt-digits { display: inline-flex; }
  /* 每一位是一个格子，新旧两个字叠在同一格里：旧字往外滚并模糊消失，新字从另一侧模糊滚入 */
  .mt-digits .d { display: inline-grid; min-width: 0.62em; text-align: center; }
  .mt-digits .d > span { grid-area: 1 / 1; }
  .mt-digits .d .old { opacity: 0; }

  /* 用户开启「减少动态效果」时：数字直接换、位置直接跳 */
  @media (prefers-reduced-motion: reduce) {
    .mt-value { transition: none; }
  }
</style>
</head>
<body>
<div class="mt-slider" id="mtSlider" role="slider" tabindex="0" aria-label="进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="64">
  <div class="mt-fill" id="mtFill"></div>
  <svg class="mt-handle" aria-hidden="true"><path id="mtPath" d=""/></svg>
  <div class="mt-value" id="mtValue" aria-hidden="true"><span class="mt-digits" id="mtDigits"></span><span class="mt-unit" id="mtUnit"></span></div>
</div>
<script>
  const CONFIG = {
    value: 64,      // 初始进度（0–100）
    fill: ["#7c9cff", "#c8d6ff", "#ffffff", "#ffd8c6", "#ff8a5c", "#ff5a33"],  // 填充颜色：一个颜色是纯色填充，多个颜色按顺序从左到右渐变
    unit: "%",      // 数值后的单位
  };
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const slider = document.getElementById('mtSlider'), fill = document.getElementById('mtFill'), path = document.getElementById('mtPath'), valueEl = document.getElementById('mtValue'), digitsEl = document.getElementById('mtDigits');
  const colors = CONFIG.fill.length ? CONFIG.fill : ['#4a4a52'];
  fill.style.backgroundImage = colors.length === 1 ? `linear-gradient(${colors[0]}, ${colors[0]})` : `linear-gradient(90deg, ${colors.join(', ')})`;
  document.getElementById('mtUnit').textContent = CONFIG.unit;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v)), lerp = (a, b, k) => a + (b - a) * k;
  const EASE = 'cubic-bezier(0.2, 0.8, 0.2, 1)';
  // pos 是 0–1 的连续位置（拖动时不按 1% 跳格），显示的数值 = round(pos × 100)
  let pos = clamp(CONFIG.value, 0, 100) / 100, shown = null, userTook = false;

  function render() {
    const W = slider.clientWidth, H = slider.clientHeight, cy = H / 2;
    const inset = 0.15 * H;                                // 滑条顶点到轨道端的最小距离
    const r = 0.35 * H;                                    // 完全弯曲时弧的半径 = 半高 − inset，与轨道圆头同心
    const xt = inset + pos * (W - 2 * inset);              // 滑条顶点（弧顶）的 x
    // 进入右 / 左圆头区域（最后半个高度）的深度 0→1，ease-out 让起弯早一些；side 记录弯向哪一侧
    const tr = clamp((xt - (W - H / 2)) / (H / 2 - inset), 0, 1), tl = clamp((H / 2 - xt) / (H / 2 - inset), 0, 1);
    const side = tr >= tl ? 1 : -1, t = 1 - (1 - Math.max(tr, tl)) ** 2;
    const hh = lerp(0.205 * H, 0.29 * H, t);               // 半高：直线时高 0.41H，满弧时 0.58H
    const s = (r - Math.sqrt(r * r - (0.29 * H) ** 2)) * t; // 弓高：0 → 约 0.154H
    const xe = xt - side * s;                              // 弦（两个端点）的 x
    if (s < 0.05) path.setAttribute('d', `M${xt} ${cy - hh}L${xt} ${cy + hh}`);
    else { const rr = (hh * hh + s * s) / (2 * s); path.setAttribute('d', `M${xe} ${cy - hh}A${rr} ${rr} 0 0 ${side > 0 ? 1 : 0} ${xe} ${cy + hh}`); }
    // 填充条停在滑条最左缘前 0.16H；渐变按整根轨道宽度铺
    fill.style.setProperty('--w', Math.max(0, Math.min(xt, xe) - 0.16 * H) + 'px');
    fill.style.setProperty('--W', W + 'px');
    // 数字：先按位刷新（变化的位翻页），再量宽度决定停在右端还是翻到滑条左侧
    const value = Math.round(pos * 100);
    if (shown !== value) { renderDigits(value, shown === null ? 0 : Math.sign(value - shown)); shown = value; slider.setAttribute('aria-valuenow', String(value)); }
    const labelW = valueEl.offsetWidth, restLeft = W - 0.3 * H - labelW;   // 停靠位：右缘离轨道右端 0.3H
    const pushed = xt + 0.3 * H >= restLeft;                                // 顶点逼近到数字左缘前 0.3H：翻到滑条左侧
    valueEl.style.setProperty('--vx', (pushed ? xt - 0.4 * H - labelW : restLeft) + 'px'); // 左侧时右缘贴着顶点左侧 0.4H 跟着走
  }
  function flipMs() { const v = getComputedStyle(document.documentElement).getPropertyValue('--mt-flip').trim(); return parseFloat(v) * (v.endsWith('ms') ? 1 : 1000); }
  function renderDigits(v, dir) {
    const next = String(v).split('');
    if (digitsEl.children.length !== next.length) { digitsEl.textContent = ''; next.forEach(() => { const d = document.createElement('span'); d.className = 'd'; d.innerHTML = '<span class="cur"></span><span class="old"></span>'; digitsEl.appendChild(d); }); }
    next.forEach((ch, i) => {
      const cell = digitsEl.children[i], cur = cell.firstChild, old = cell.lastChild;
      if (cur.textContent === ch) return;
      const prev = cur.textContent; cur.textContent = ch;
      if (reduceMotion || !dir || !prev) return;
      // 翻页还在进行中就只换字（连续拖动时这一位一直是模糊的），停下来后最后一次翻页把它落清楚
      if (cell._anim && cell._anim.playState === 'running') return;
      old.textContent = prev;
      const ms = flipMs(), off = dir * 55;   // 数值增大：新字从下方滚上来、旧字往上滚走；减小则反过来
      cell._anim = cur.animate([{ transform: `translateY(${off}%)`, filter: 'blur(0.2em)', opacity: 0 }, { transform: 'none', filter: 'blur(0)', opacity: 1 }], { duration: ms, easing: EASE });
      old.animate([{ transform: 'none', filter: 'blur(0)', opacity: 1 }, { transform: `translateY(${-off}%)`, filter: 'blur(0.2em)', opacity: 0 }], { duration: ms, easing: EASE });
    });
  }

  // 点击 / 键盘：位置带缓动滑过去；拖动：直接跟手
  let raf = 0;
  function animateTo(target) {
    cancelAnimationFrame(raf);
    if (reduceMotion) { pos = target; render(); return; }
    const from = pos, t0 = performance.now();
    (function step(now) {
      const k = Math.min(1, (now - t0) / 260); pos = lerp(from, target, 1 - (1 - k) ** 3); render();
      if (k < 1) raf = requestAnimationFrame(step);
    })(t0);
  }
  // 指针 x 直接就是滑条顶点的位置
  const fromPointer = (e) => { const W = slider.clientWidth, H = slider.clientHeight, x = e.clientX - slider.getBoundingClientRect().left; return clamp((x - 0.15 * H) / (W - 0.3 * H), 0, 1); };
  let dragging = false;
  slider.addEventListener('pointerdown', (e) => { userTook = true; dragging = true; slider.classList.add('dragging'); slider.setPointerCapture(e.pointerId); animateTo(fromPointer(e)); });
  slider.addEventListener('pointermove', (e) => { if (!dragging) return; cancelAnimationFrame(raf); pos = fromPointer(e); render(); });
  const stop = () => { dragging = false; slider.classList.remove('dragging'); };
  slider.addEventListener('pointerup', stop); slider.addEventListener('pointercancel', stop);
  // 键盘：左右 ±1，按住 Shift ±10，Home / End 到两端
  slider.addEventListener('keydown', (e) => {
    const step = e.shiftKey ? 10 : 1, v = Math.round(pos * 100);
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') animateTo(clamp(v + step, 0, 100) / 100);
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') animateTo(clamp(v - step, 0, 100) / 100);
    else if (e.key === 'Home') animateTo(0);
    else if (e.key === 'End') animateTo(1);
    else return;
    userTook = true; e.preventDefault();
  });
  render();
  // 几何全靠 JS 算：宽高（CSS 变量）被改、字体加载后标签变宽，都要重算，不能等下一次交互
  if ('ResizeObserver' in window) { const ro = new ResizeObserver(render); ro.observe(slider); ro.observe(valueEl); }
  else addEventListener('resize', render);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);

  /* @mt:thumb-start */
  // 缩略图演示：位置在两端之间慢慢往返，把「挤数字」和「弯滑条」都走一遍；用户一碰就交还
  if (window.__MT_ENV && window.__MT_ENV.thumb && !reduceMotion) {
    const t0 = performance.now();
    (function demo(now) {
      if (userTook) return;
      if (!document.hidden) { pos = 0.06 + 0.94 * (1 - Math.cos((now - t0) / 6000 * Math.PI * 2)) / 2; render(); }
      requestAnimationFrame(demo);
    })(t0);
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
