<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>复古透视网格</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-angle: 65deg;       /* 地面倾角：越大越贴近地平线 */
    --mt-cell: 60px;         /* 格子大小 */
    --mt-line: #808080;      /* 网格线颜色 */
    --mt-opacity: 0.5;       /* 网格整体透明度 */
    --mt-speed: 15s;         /* 滚动一轮的时长（越小越快） */
    --mt-fade: 90%;          /* 近处（底部）渐隐到底色的高度 */
    --mt-color: #f2f3f8;     /* 标题文字颜色 */
    --mt-fontSize: 72px;     /* 标题字号 */
    --mt-font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; /* 字体 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; display: grid; place-items: center; }

  /* 地面用 canvas 自己按透视公式画：CSS 3D 平面在远处会把几十条格线挤进一个像素，GPU 采样没有多级纹理，
     结果是地平线附近一片闪烁的噪点；自己画就能按距离控制线的透明度，远处平滑地隐进雾里 */
  .mt-scene { position: fixed; inset: 0; overflow: hidden; pointer-events: none; opacity: var(--mt-opacity); }
  .mt-scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* 近处渐隐：底部融进底色 */
  .mt-haze { position: absolute; inset: 0; background: linear-gradient(to top, var(--mt-bg), transparent var(--mt-fade)); }

  .mt-title {
    position: relative; z-index: 1; margin: 0;
    font-family: var(--mt-font); font-size: var(--mt-fontSize); font-weight: 800; letter-spacing: -0.03em; line-height: 1;
    color: var(--mt-color); text-align: center; white-space: pre-wrap;
  }
</style>
</head>
<body>
<div class="mt-scene" aria-hidden="true"><canvas id="mtGrid"></canvas><div class="mt-haze"></div></div>
<h1 class="mt-title" id="mtTitle"></h1>
<script>
  const CONFIG = {
    title: "RETRO",   // 标题文字（留空则不显示）
  };
  const title = document.getElementById('mtTitle');
  title.textContent = CONFIG.title;
  if (!CONFIG.title) title.hidden = true;

  const canvas = document.getElementById('mtGrid'), ctx = canvas.getContext('2d');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const root = document.documentElement;
  const cssVar = (name, fallback) => { const v = getComputedStyle(root).getPropertyValue(name).trim(); return v || fallback; };
  let W = 0, H = 0, dpr = 1;
  function resize() { dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr); }
  resize(); addEventListener('resize', resize);

  // 透视相机：视线水平、地平线在画面 34% 高处（与 CSS 版 rotateX(65deg) + perspective 200px 的地平线位置一致）。
  // 地面上深度 Z 处的一点投影在 y = 地平线 + f·h / Z；倾角越大 → 相机越低（h 越小）→ 格子越快贴近地平线
  let phase = 0, last = performance.now();
  function draw(now) {
    requestAnimationFrame(draw);
    if (document.hidden) { last = now; return; }
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const cell = parseFloat(cssVar('--mt-cell', '60px')) || 60;
    const angle = parseFloat(cssVar('--mt-angle', '65deg')) || 65;
    const speed = parseFloat(cssVar('--mt-speed', '15s')) || 15;          // 一轮 = 8 格
    const line = cssVar('--mt-line', '#808080');
    if (!reduceMotion) phase = (phase + dt * 8 / speed) % 1;

    const horizon = H * 0.34, f = H * 0.9, cx = W / 2;
    const h = cell * 2.2 * (Math.tan(65 * Math.PI / 180) / Math.tan(angle * Math.PI / 180));   // 相机高度（以格子计）
    const fog = H * 0.14;   // 地平线下这一段内线条由透明渐显

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.lineWidth = 1; ctx.lineCap = 'butt';
    // 远近雾化：一条从地平线（透明）到雾底（线色）的渐变，横线竖线共用
    const grad = ctx.createLinearGradient(0, horizon, 0, horizon + fog);
    grad.addColorStop(0, 'rgba(0,0,0,0)'); grad.addColorStop(1, line);
    ctx.strokeStyle = grad;

    // 横线：深度 Z = (i + phase) × 格子，phase 递增让线向观者滚来；只画投影在地平线以下的
    ctx.beginPath();
    for (let i = 0; i < 400; i++) {
      const Z = (i + 1 - phase) * cell;
      const y = horizon + f * h / Z;
      if (y > H + 2) continue; if (y - horizon < 0.6) break;
      const yy = Math.round(y) + 0.5; ctx.moveTo(0, yy); ctx.lineTo(W, yy);
    }
    ctx.stroke();
    // 竖线：地面上 X = j × 格子的直线，投影后全部汇聚到地平线中心；从雾底画到画面底部
    ctx.beginPath();
    const bottomZ = f * h / (H - horizon);                 // 画面底边对应的深度
    const fogZ = f * h / fog;                              // 雾底对应的深度
    const maxJ = Math.ceil((W / 2) * bottomZ / f / cell) + 1;
    for (let j = -maxJ; j <= maxJ; j++) {
      const X = j * cell;
      const xTop = cx + f * X / fogZ, xBottom = cx + f * X / bottomZ;
      if (Math.min(xTop, xBottom) > W || Math.max(xTop, xBottom) < 0) continue;
      ctx.moveTo(cx + (xTop - cx) * 0.02, horizon + fog * 0.02); ctx.lineTo(xBottom, H);
    }
    ctx.stroke();
  }
  requestAnimationFrame(draw);
</script>
</body>
</html>
