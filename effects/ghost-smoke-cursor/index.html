<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幽灵烟雾光标</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色（烟雾以外透出它） */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; mix-blend-mode: screen; }
  .mt-hint {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    color: rgba(255,255,255,0.3); font: 14px/1 -apple-system, "PingFang SC", sans-serif; letter-spacing: 0.14em;
    pointer-events: none;
  }
  /* 用户开启「减少动态效果」时：无惯性滑行，烟雾直接跟随 */
</style>
</head>
<body>
<canvas id="mtCanvas" aria-hidden="true"></canvas>
<div class="mt-hint">移动鼠标</div>
<script>
  const CONFIG = {
    color: "#a0ffbc",        // 烟雾颜色
    trailLength: 30,         // 拖尾长度
    inertia: 0.5,            // 惯性
    brightness: 1,           // 亮度
    grainIntensity: 0.05,    // 颗粒
    edgeIntensity: 0,        // 边缘压暗
    fadeDelay: 1000,         // 停手多久开始散（ms）
    fadeDuration: 1500,      // 散尽时长（ms）
  };
  const RENDER_SCALE = 0.5;   // 半分辩率渲染（每像素要算几十团烟雾）

  const canvas = document.getElementById('mtCanvas');
  const gl = canvas.getContext('webgl', { antialias: false, alpha: true, premultipliedAlpha: false });
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const N = Math.max(1, Math.min(60, Math.floor(CONFIG.trailLength)));

  const VS = `
    attribute vec2 aPos;
    void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
  `;
  // 片元：一团「烟」= 三层相互扭曲的 fbm（域扭曲）得到烟纹，乘以到中心的软圆；
  // 当前鼠标 + N 个历史位置各画一团，越旧越淡（平方衰减）；最后加颗粒与边缘压暗
  const FS = `
    precision highp float;
    uniform float uTime, uOpacity, uBright, uEdge, uGrain;
    uniform vec2  uRes, uMouse;
    uniform vec2  uTrail[${N}];
    uniform vec3  uColor;

    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }
    float noise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      f *= f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
    }
    float fbm(vec2 p) {
      float v = 0.0, a = 0.5;
      mat2 m = mat2(cos(0.5), sin(0.5), -sin(0.5), cos(0.5));
      for (int i = 0; i < 5; i++) { v += a * noise(p); p = m * p * 2.0; a *= 0.5; }
      return v;
    }
    // 烟纹只与像素位置和时间有关，与团心无关——每像素算一次，所有团共用
    float smokeAt(vec2 p) {
      vec2 q = vec2(fbm(p + uTime * 0.1), fbm(p + vec2(5.2, 1.3) + uTime * 0.1));
      vec2 r = vec2(fbm(p + q * 1.5 + uTime * 0.15), fbm(p + q * 1.5 + vec2(8.3, 2.8) + uTime * 0.15));
      return pow(fbm(p + r * 0.8), 2.5);
    }
    // 一团烟在该像素的 alpha：烟纹 × 到团心的软圆 × 强度
    float blobA(vec2 p, vec2 c, float smoke, float intensity, float activity) {
      return smoke * (1.0 - smoothstep(0.0, 0.8 * activity, length(p - c))) * intensity;
    }

    void main() {
      vec2 asp = vec2(uRes.x / uRes.y, 1.0);
      vec2 uv = (gl_FragCoord.xy / uRes * 2.0 - 1.0) * asp;
      vec2 m = (uMouse * 2.0 - 1.0) * asp;
      float smoke = smokeAt(uv);
      float a = blobA(uv, m, smoke, 1.0, uOpacity);
      for (int i = 0; i < ${N}; i++) {
        float t = 1.0 - float(i) / float(${N});
        t *= t;
        if (t > 0.01) a += blobA(uv, (uTrail[i] * 2.0 - 1.0) * asp, smoke, t * 0.8, uOpacity);
      }
      vec3 c1 = mix(uColor, vec3(1.0), 0.15), c2 = mix(uColor, vec3(0.8, 0.9, 1.0), 0.25);
      vec4 acc = vec4(mix(c1, c2, sin(uTime * 0.5) * 0.5 + 0.5) * a, a);
      vec3 col = acc.rgb * uBright;
      // 颗粒
      col += (hash(gl_FragCoord.xy + uTime) - 0.5) * uGrain;
      // 边缘压暗
      vec2 uv01 = gl_FragCoord.xy / uRes;
      float edge = clamp(min(min(uv01.x, 1.0 - uv01.x), min(uv01.y, 1.0 - uv01.y)) * 2.0, 0.0, 1.0);
      float mask = mix(1.0 - clamp(uEdge, 0.0, 1.0), 1.0, edge);
      gl_FragColor = vec4(col, clamp(acc.a * uOpacity * mask, 0.0, 1.0));
    }
  `;

  // ---- WebGL 底座 ----
  function compile(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  const U = (n) => gl.getUniformLocation(prog, n);
  const hexRgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);

  const dpr = Math.min(2, devicePixelRatio || 1) * RENDER_SCALE;
  function resize() {
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(U('uRes'), canvas.width, canvas.height);
  }
  resize(); addEventListener('resize', resize);
  gl.uniform3fv(U('uColor'), hexRgb(CONFIG.color));
  gl.uniform1f(U('uBright'), CONFIG.brightness);
  gl.uniform1f(U('uEdge'), CONFIG.edgeIntensity);
  gl.uniform1f(U('uGrain'), CONFIG.grainIntensity);
  const uTime = U('uTime'), uMouse = U('uMouse'), uTrail = U('uTrail'), uOpacity = U('uOpacity');

  // 轨迹环形缓冲（0–1，y 向上）：每帧把当前鼠标压进头部，按由新到旧的顺序上传
  const trail = new Float32Array(N * 2).fill(0.5), ordered = new Float32Array(N * 2);
  let head = 0;
  const mouse = { x: 0.5, y: 0.5 }, target = { x: 0.5, y: 0.5 }, vel = { x: 0, y: 0 };
  let active = false, lastMove = 0, opacity = 1, userTook = false;
  addEventListener('pointermove', (e) => { target.x = e.clientX / innerWidth; target.y = 1 - e.clientY / innerHeight; active = true; lastMove = performance.now(); userTook = true; });
  addEventListener('pointerup', () => (active = false));
  document.addEventListener('mouseleave', () => (active = false));

  const start = performance.now();
  let lastFrame = start;
  function frame(now) {
    requestAnimationFrame(frame);
    if (document.hidden) return;
    const t = (now - start) / 1000;
    // 鼠标：指针在动时直接跟随并记录速度；停下后带惯性滑行，并在延迟后开始散去
    if (active && now - lastMove < 100) {
      vel.x = target.x - mouse.x; vel.y = target.y - mouse.y;
      mouse.x = target.x; mouse.y = target.y;
      opacity = 1;
    } else {
      const k = reduceMotion ? 0 : CONFIG.inertia;
      vel.x *= k; vel.y *= k;
      if (vel.x * vel.x + vel.y * vel.y > 1e-6) { mouse.x += vel.x; mouse.y += vel.y; }
      const idle = now - lastMove;
      if (idle > CONFIG.fadeDelay) opacity = Math.max(0, 1 - Math.min(1, (idle - CONFIG.fadeDelay) / CONFIG.fadeDuration));
    }
    head = (head + 1) % N;
    trail[head * 2] = mouse.x; trail[head * 2 + 1] = mouse.y;
    for (let i = 0; i < N; i++) { const s = ((head - i + N) % N) * 2; ordered[i * 2] = trail[s]; ordered[i * 2 + 1] = trail[s + 1]; }
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(uTime, t);
    gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.uniform2fv(uTrail, ordered);
    gl.uniform1f(uOpacity, opacity);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    lastFrame = now;
  }
  gl.clearColor(0, 0, 0, 0);
  requestAnimationFrame(frame);

  /* @mt:thumb-start */
  // 缩略图演示：虚拟鼠标画 8 字；真实鼠标动过后交还
  if (!reduceMotion) {
    let a = 0;
    setInterval(() => {
      if (document.hidden || userTook) return;
      a += 0.03;
      target.x = 0.5 + 0.35 * Math.sin(a); target.y = 0.5 + 0.28 * Math.sin(a * 2);
      active = true; lastMove = performance.now();
    }, 30);
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
