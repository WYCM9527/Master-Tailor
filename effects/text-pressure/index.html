<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文字压力</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;             /* 页面底色 */
    --mt-textColor: #ffffff;      /* 文字颜色 */
    --mt-strokeColor: #00ff00;    /* 描边颜色 */
    --mt-font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;  /* 字体 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; }
  /* 容器占满视口；标题一行、字符用 flex 均分格子，各字变形不会推挤邻字 */
  .mt-wrap { position: fixed; inset: 0; display: flex; align-items: center; }
  .mt-title {
    display: flex; justify-content: space-between;
    width: 88%; margin: 0 auto;      /* 两侧留边，末字放大时不出界 */
    font-family: var(--mt-font);
    font-weight: 700;
    line-height: 1;
    color: var(--mt-textColor);
    text-transform: uppercase;
    user-select: none;
    transform-origin: center top;
  }
  .mt-title.stroke { color: transparent; -webkit-text-stroke: 2px var(--mt-strokeColor); }
  /* 每个字：--wdth 宽度倍数、--wght 加粗描边、--ital 斜切角，全部由 JS 每帧写入 */
  .mt-ch {
    flex: 1; display: inline-block; text-align: center;
    transform: scaleX(var(--wdth, 1)) skewX(calc(var(--ital, 0) * -12deg));
    -webkit-text-stroke: var(--wght, 0px) currentColor;
    will-change: transform;
  }
  .mt-title.stroke .mt-ch { -webkit-text-stroke: calc(2px + var(--wght, 0px)) var(--mt-strokeColor); }
</style>
</head>
<body>
<div class="mt-wrap" id="mtWrap"><h1 class="mt-title" id="mtTitle"></h1></div>
<script>
  const CONFIG = {
    text: "PRESSURE",     // 文字
    width: true,          // 变宽
    weight: true,         // 变粗
    italic: true,         // 变斜
    alpha: false,         // 远处变淡
    stroke: false,        // 描边模式
    minFontSize: 24,      // 最小字号（px）
  };

  const wrap = document.getElementById('mtWrap');
  const title = document.getElementById('mtTitle');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let userTook = false;   // 真实鼠标动过后，自动演示交还控制
  if (CONFIG.stroke) title.classList.add('stroke');

  const chars = [...CONFIG.text.trim()].map((ch) => {
    const s = document.createElement('span');
    s.className = 'mt-ch'; s.textContent = ch;
    title.appendChild(s);
    return s;
  });

  // 字号：让整行大约撑满容器宽（普通字体每字约占 0.65 字号宽，最宽态再放大 1.3 倍），不低于最小字号
  function setSize() {
    const fs = Math.max((wrap.clientWidth / chars.length) * 1.1, CONFIG.minFontSize);
    title.style.fontSize = `${fs}px`;
  }
  setSize(); addEventListener('resize', setSize);

  // 鼠标以 1/15 的速率追上光标，手感有黏性
  const cursor = { x: innerWidth / 2, y: innerHeight / 2 }, mouse = { x: cursor.x, y: cursor.y };
  addEventListener('pointermove', (e) => { cursor.x = e.clientX; cursor.y = e.clientY; userTook = true; });

  function frame() {
    requestAnimationFrame(frame);
    if (document.hidden) return;
    mouse.x += (cursor.x - mouse.x) / 15;
    mouse.y += (cursor.y - mouse.y) / 15;
    const rect = title.getBoundingClientRect();
    const maxDist = rect.width / 2;   // 距离归一化基准：半行宽
    const fs = parseFloat(title.style.fontSize) || 48;
    chars.forEach((span) => {
      const r = span.getBoundingClientRect();
      const d = Math.hypot(mouse.x - (r.x + r.width / 2), mouse.y - (r.y + r.height / 2));
      // 距离越近值越大：max − |max × d / maxDist|，夹到 [min, max]
      const attr = (min, max) => Math.max(min, Math.min(max, max - Math.abs((max * d) / maxDist)));
      const wdth = CONFIG.width ? attr(5, 200) : 100;           // 宽度 5–200（%）
      const wght = CONFIG.weight ? attr(100, 900) : 400;        // 字重 100–900
      const ital = CONFIG.italic ? attr(0, 1) : 0;              // 斜度 0–1
      const alpha = CONFIG.alpha ? attr(0, 1) : 1;
      // 无可变字体时的等价表达：宽度 → scaleX，字重 → 文字描边加粗（900 ≈ 字号 6%），斜体 → skewX
      span.style.setProperty('--wdth', (0.6 + (wdth / 200) * 0.7).toFixed(3));
      span.style.setProperty('--wght', `${(((wght - 100) / 800) * fs * 0.06).toFixed(2)}px`);
      span.style.setProperty('--ital', ital.toFixed(3));
      span.style.opacity = alpha.toFixed(2);
    });
  }
  if (!reduceMotion) requestAnimationFrame(frame);

  /* @mt:thumb-start */
  // 自动演示：虚拟光标沿这行字左右扫；真实鼠标动过后交还
  if (!reduceMotion) {
    let t = 0;
    setInterval(() => {
      if (document.hidden || userTook) return;
      t += 0.025;
      cursor.x = innerWidth * (0.5 + 0.45 * Math.sin(t));
      cursor.y = innerHeight / 2 + Math.sin(t * 2.3) * 30;
    }, 30);
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
