<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>胶囊导航</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-pill: #ffffff;      /* 胶囊底色 */
    --mt-fill: #0a0a0f;      /* 涨起的颜色 */
    --mt-text: #0a0a0f;      /* 文字颜色 */
    --mt-textHover: #ffffff; /* 悬停文字颜色 */
    --mt-duration: 0.35s;    /* 涨起时长 */
  }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mt-bg);
    display: grid;
    place-items: start center;
    padding-top: 40px;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .mt-nav {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  /* 左侧徽标：悬停整条导航时转一圈 */
  .mt-logo {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--mt-pill);
    display: grid; place-items: center;
    color: var(--mt-text);
    font-weight: 800;
    transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .mt-nav:hover .mt-logo { transform: rotate(360deg); }
  .mt-list {
    display: flex;
    gap: 4px;
    padding: 4px;
    border-radius: 999px;
    background: var(--mt-pill);
  }
  .mt-pill {
    position: relative;
    overflow: hidden;
    border: none;
    border-radius: 999px;
    padding: 9px 18px;
    background: transparent;
    color: var(--mt-text);
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    isolation: isolate;
  }
  /* 涨起的圆：一个比胶囊大的圆，缩在底部中心，悬停时放大到盖满 */
  .mt-pill::before {
    content: '';
    position: absolute;
    left: 50%; bottom: -20%;
    width: 160%; aspect-ratio: 1;
    border-radius: 50%;
    background: var(--mt-fill);
    transform: translate(-50%, 100%) scale(0.2);
    transition: transform var(--mt-duration) cubic-bezier(0.2, 0.8, 0.2, 1);
    z-index: -1;
  }
  .mt-pill:hover::before,
  .mt-pill.is-hover::before { transform: translate(-50%, 0) scale(1.1); }
  .mt-pill .label {
    position: relative;
    display: block;
    transition: color var(--mt-duration) ease, transform var(--mt-duration) ease;
  }
  .mt-pill:hover .label,
  .mt-pill.is-hover .label { color: var(--mt-textHover); transform: translateY(-1px); }
  /* 当前项：小圆点标记 */
  .mt-pill.active::after {
    content: '';
    position: absolute;
    left: 50%; bottom: 4px;
    width: 4px; height: 4px;
    margin-left: -2px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.6;
  }

  /* 用户开启「减少动态效果」时：直接变色，不涨起 */
  @media (prefers-reduced-motion: reduce) {
    .mt-pill::before, .mt-pill .label, .mt-logo { transition: none; }
  }
</style>
</head>
<body>
<nav class="mt-nav" id="mtNav" aria-label="主导航">
  <div class="mt-logo" id="mtLogo" aria-hidden="true">M</div>
  <div class="mt-list" id="mtList"></div>
</nav>
<script>
  const CONFIG = {
    items: "作品｜关于｜服务｜日志｜联系", // 菜单项，用「｜」分隔
    activeIndex: 1,   // 默认选中第几项
    logo: true,       // 左侧圆徽标
  };

  const list = document.getElementById('mtList');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!CONFIG.logo) document.getElementById('mtLogo').remove();
  const names = CONFIG.items.split('｜').map(s => s.trim()).filter(Boolean);
  const pills = names.map((name, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'mt-pill' + (i === CONFIG.activeIndex - 1 ? ' active' : '');
    if (i === CONFIG.activeIndex - 1) b.setAttribute('aria-current', 'page');
    b.innerHTML = '<span class="label"></span>';
    b.firstChild.textContent = name;
    b.addEventListener('click', () => {
      pills.forEach(p => { p.classList.remove('active'); p.removeAttribute('aria-current'); });
      b.classList.add('active'); b.setAttribute('aria-current', 'page');
    });
    list.appendChild(b);
    return b;
  });

  /* @mt:thumb-start */
  // 缩略图演示：依次模拟悬停每一颗胶囊；真实鼠标进入后停止
  if (!reduceMotion) {
    let i = 0, auto = true;
    list.addEventListener('pointerenter', () => { auto = false; pills.forEach(p => p.classList.remove('is-hover')); });
    setInterval(() => {
      if (document.hidden || !auto) return;
      pills.forEach(p => p.classList.remove('is-hover'));
      pills[i % pills.length].classList.add('is-hover');
      i++;
    }, 900);
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
