<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星光文字</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-color: #f2f3f8;     /* 文字颜色 */
    --mt-fontSize: 72px;     /* 字号 */
    --mt-star: 21px;         /* 星星大小 */
    --mt-font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; /* 字体 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; display: grid; place-items: center; }

  .mt-text {
    position: relative; display: inline-block; margin: 0; padding: 0.2em 0.3em;
    font-family: var(--mt-font); font-size: var(--mt-fontSize); font-weight: 800; letter-spacing: -0.02em; color: var(--mt-color);
    white-space: pre-wrap; text-align: center;
  }
  /* 四角星：随机落在文字范围内，各自按 0.8s 周期「冒出来—转一下—缩回去」 */
  .mt-star {
    position: absolute; width: var(--mt-star); height: var(--mt-star); left: var(--x); top: var(--y);
    pointer-events: none; opacity: 0;
    animation: mt-twinkle 0.8s ease-in-out infinite; animation-delay: var(--delay);
  }
  @keyframes mt-twinkle {
    0%   { opacity: 0; transform: scale(0) rotate(75deg); }
    50%  { opacity: 1; transform: scale(var(--s)) rotate(120deg); }
    100% { opacity: 0; transform: scale(0) rotate(150deg); }
  }

  /* 用户开启「减少动态效果」时：星星静止显示 */
  @media (prefers-reduced-motion: reduce) {
    .mt-star { animation: none; opacity: 0.8; transform: scale(var(--s)); }
  }
</style>
</head>
<body>
<h1 class="mt-text" id="mtText"></h1>
<script>
  const CONFIG = {
    text: "闪闪发光",      // 文字
    count: 10,            // 同屏星星数量
    color1: "#9e7aff",    // 星星颜色 A
    color2: "#fe8bbb",    // 星星颜色 B
  };

  const wrap = document.getElementById('mtText');
  const label = document.createElement('strong'); label.style.position = 'relative'; label.textContent = CONFIG.text;
  wrap.appendChild(label);
  const STAR = 'M9.83 0.84c0.23-0.63 1.12-0.63 1.35 0l0.69 1.88c0.54 1.47 0.53 3.67 1.64 4.78s3.31 1.1 4.78 1.64l1.88 0.69c0.63 0.23 0.63 1.12 0 1.35l-1.88 0.69c-1.47 0.54-3.67 0.53-4.78 1.64s-1.1 3.31-1.64 4.78l-0.69 1.88c-0.23 0.63-1.12 0.63-1.35 0l-0.69-1.88c-0.54-1.47-0.53-3.67-1.64-4.78s-3.31-1.1-4.78-1.64L0.84 11.18c-0.63-0.23-0.63-1.12 0-1.35l1.88-0.69c1.47-0.54 3.67-0.53 4.78-1.64s1.1-3.31 1.64-4.78z';

  // 每颗星：随机位置、随机颜色、随机大小与起始延迟；活 5–15 秒后换个地方重生
  function place(el) {
    el.style.setProperty('--x', (Math.random() * 100) + '%');
    el.style.setProperty('--y', (Math.random() * 100) + '%');
    el.style.setProperty('--s', (0.3 + Math.random()).toFixed(2));
    el.style.setProperty('--delay', (Math.random() * 2).toFixed(2) + 's');
    el.firstChild.setAttribute('fill', Math.random() > 0.5 ? CONFIG.color1 : CONFIG.color2);
    setTimeout(() => { if (!document.hidden) place(el); else setTimeout(() => place(el), 3000); }, 5000 + Math.random() * 10000);
  }
  for (let i = 0; i < CONFIG.count; i++) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 21 21'); svg.setAttribute('class', 'mt-star'); svg.setAttribute('aria-hidden', 'true');
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', STAR);
    svg.appendChild(p); wrap.insertBefore(svg, label);
    place(svg);
  }
  document.addEventListener('visibilitychange', () => {
    wrap.querySelectorAll('.mt-star').forEach(s => s.style.animationPlayState = document.hidden ? 'paused' : 'running');
  });
</script>
</body>
</html>
