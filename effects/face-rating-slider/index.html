<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>表情评分滑块</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #f3f1ec;            /* 页面底色 */
    --mt-sad: #8fb0dc;           /* 低分色：最低档时脸和填充的颜色 */
    --mt-happy: #ffc83d;         /* 高分色：最高档时的颜色 */
    --mt-size: 148px;            /* 表情大小 */
    --mt-font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; /* 字体 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; display: grid; place-items: center; font-family: var(--mt-font); color: #1f2430; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  /* 当前色：按表情在低分色和高分色之间混合，脸、填充、滑块描边、档位文字共用 */
  .mt-card { --c: color-mix(in oklab, var(--mt-happy) var(--p, 50%), var(--mt-sad)); width: min(440px, 92vw); box-sizing: border-box; padding: 26px 28px 24px; border-radius: 22px; background: #fff; box-shadow: 0 18px 50px rgba(40, 32, 20, 0.1); display: grid; justify-items: center; }
  .mt-title { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.02em; text-align: center; }
  .mt-face { display: block; width: min(var(--mt-size), 46vw); height: auto; margin: 16px 0 4px; overflow: visible; }
  .mt-base { fill: var(--c); }
  .mt-ink { fill: #2d2a32; }
  .mt-line { fill: none; stroke: #2d2a32; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
  .mt-mouth { fill: #2d2a32; stroke: #2d2a32; stroke-width: 3.4; stroke-linejoin: round; }
  /* 档位文字：换档时旧字往外滑出、新字从另一侧滑入（升档向上、降档向下） */
  .mt-word { position: relative; width: 100%; height: 34px; overflow: hidden; margin-bottom: 14px; }
  .mt-word span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 22px; font-weight: 700; color: color-mix(in oklab, var(--c) 50%, #1f2430); }
  .mt-word .in-up { animation: mt-in 0.3s cubic-bezier(0.2, 0.8, 0.3, 1) 0.05s both; --from: 70%; }
  .mt-word .in-down { animation: mt-in 0.3s cubic-bezier(0.2, 0.8, 0.3, 1) 0.05s both; --from: -70%; }
  .mt-word .out-up { animation: mt-out 0.18s ease-in both; --to: -60%; }
  .mt-word .out-down { animation: mt-out 0.18s ease-in both; --to: 60%; }
  @keyframes mt-in { from { translate: 0 var(--from); opacity: 0; } }
  @keyframes mt-out { to { translate: 0 var(--to); opacity: 0; } }
  .mt-slider { position: relative; width: 100%; height: 44px; touch-action: none; cursor: pointer; outline: none; }
  .mt-track { position: absolute; left: 0; right: 0; top: 18px; height: 8px; border-radius: 4px; background: #eceae6; overflow: hidden; }
  .mt-fill { position: absolute; inset: 0; background: var(--c); transform-origin: 0 50%; }
  /* 档位点：轨道里的小圆点，被填充盖住的变白 */
  .mt-tick { position: absolute; top: 20px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: #cfcac2; }
  .mt-tick.on { background: rgba(255, 255, 255, 0.9); }
  .mt-knob { position: absolute; left: 0; top: 22px; width: 0; height: 0; }
  .mt-dot { position: absolute; left: -15px; top: -15px; width: 30px; height: 30px; box-sizing: border-box; border-radius: 50%; background: #fff; border: 3px solid var(--c); box-shadow: 0 3px 10px rgba(40, 32, 20, 0.18); transition: scale 0.2s; }
  .mt-slider.dragging .mt-dot { scale: 1.12; }
  .mt-slider:focus-visible .mt-dot { outline: 2px solid color-mix(in oklab, var(--c) 60%, #1f2430); outline-offset: 3px; }
  .mt-ends { display: flex; justify-content: space-between; width: 100%; margin-top: 2px; font-size: 12px; color: #a3a7ae; }

  /* 用户开启「减少动态效果」时：档位文字直接替换，滑块按下不放大 */
  @media (prefers-reduced-motion: reduce) {
    .mt-word span { animation: none !important; }
    .mt-dot { transition: none; }
  }
</style>
</head>
<body>
<div class="mt-card" id="mtCard">
  <p class="mt-title" id="mtTitle"></p>
  <svg class="mt-face" viewBox="-62 -60 124 128" aria-hidden="true">
    <defs>
      <radialGradient id="mtShade" cx="36%" cy="28%" r="80%">
        <stop offset="0" stop-color="#fff" stop-opacity="0.5"/>
        <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity="0.12"/>
      </radialGradient>
      <clipPath id="mtMouthClip"><path id="mtMouthClipPath"/></clipPath>
    </defs>
    <ellipse id="mtShadow" cx="0" cy="61" rx="34" ry="4.5" fill="rgba(40, 32, 20, 0.1)"/>
    <g id="mtHead">
      <circle class="mt-base" r="50"/>
      <circle r="50" fill="url(#mtShade)"/>
      <ellipse id="mtCheekL" cx="-30" cy="12" rx="8" ry="5" fill="#ff7b8f" opacity="0"/>
      <ellipse id="mtCheekR" cx="30" cy="12" rx="8" ry="5" fill="#ff7b8f" opacity="0"/>
      <g transform="translate(-17 -8)">
        <g id="mtOpenL"><ellipse class="mt-ink" rx="5" ry="6.5"/><circle cx="1.6" cy="-2.6" r="1.7" fill="#fff"/></g>
        <path id="mtHappyL" class="mt-line" d="M-6.5 2.5 Q0 -6.5 6.5 2.5" opacity="0"/>
      </g>
      <g transform="translate(17 -8)">
        <g id="mtOpenR"><ellipse class="mt-ink" rx="5" ry="6.5"/><circle cx="1.6" cy="-2.6" r="1.7" fill="#fff"/></g>
        <path id="mtHappyR" class="mt-line" d="M-6.5 2.5 Q0 -6.5 6.5 2.5" opacity="0"/>
      </g>
      <path id="mtBrowL" class="mt-line" d="M-6 1.2 Q0 -1.8 6 1.2"/>
      <path id="mtBrowR" class="mt-line" d="M-6 1.2 Q0 -1.8 6 1.2"/>
      <path id="mtMouth" class="mt-mouth"/>
      <ellipse id="mtTongue" clip-path="url(#mtMouthClip)" rx="8" ry="5" fill="#ff6b81" opacity="0"/>
      <path id="mtTear" d="M0 -5 C2.6 -1.5 4 0.6 4 2.4 A4 4 0 0 1 -4 2.4 C-4 0.6 -2.6 -1.5 0 -5 Z" fill="#7cc4ff" opacity="0"/>
    </g>
  </svg>
  <div class="mt-word" id="mtWord" aria-hidden="true"></div>
  <div class="mt-slider" id="mtSlider" role="slider" tabindex="0" aria-label="评分">
    <div class="mt-track"><i class="mt-fill" id="mtFill"></i></div>
    <div id="mtTicks"></div>
    <div class="mt-knob" id="mtKnob"><i class="mt-dot"></i></div>
  </div>
  <div class="mt-ends" aria-hidden="true"><span id="mtLo"></span><span id="mtHi"></span></div>
</div>
<script>
  const CONFIG = {
    levels: '很差｜较差｜一般｜不错｜超赞', // 档位文字：用「｜」分隔，2–6 档
    value: 72,          // 初始评分（%）：打开时滑块走到这里，吸附档位时取最近一档
    expression: 1,      // 表情幅度（倍）：嘴角、眉毛、眯眼的夸张程度
    wobble: 1,          // 晃动（倍）：拖动时脑袋歪斜、换档时压扁回弹的幅度
    snap: true,         // 吸附档位：松手后滑块弹到最近一档
    title: '这次的体验怎么样？', // 标题
  };
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const $ = (id) => document.getElementById(id);

  let LEVELS = String(CONFIG.levels).split(/[｜|]/).map((s) => s.trim()).filter(Boolean).slice(0, 6);
  if (LEVELS.length < 2) LEVELS = ['很差', '较差', '一般', '不错', '超赞'];
  const N = LEVELS.length, E = clamp(+CONFIG.expression || 0, 0, 2), WOB = clamp(+CONFIG.wobble || 0, 0, 3);
  const R = 15;           // 滑块半径

  const card = $('mtCard'), slider = $('mtSlider'), fill = $('mtFill'), knob = $('mtKnob'), wordBox = $('mtWord');
  $('mtTitle').textContent = CONFIG.title;
  $('mtLo').textContent = LEVELS[0]; $('mtHi').textContent = LEVELS[N - 1];
  slider.setAttribute('aria-valuemin', 1); slider.setAttribute('aria-valuemax', N);
  const ticks = LEVELS.map(() => { const t = document.createElement('i'); t.className = 'mt-tick'; $('mtTicks').append(t); return t; });

  // 滑块位置、表情都用 0–1 的比例；表情用偏软的弹簧追滑块，换档时会过冲一点
  const pos = { x: 0.5, v: 0 }, mood = { x: 0.5, v: 0 }, tilt = { x: 0, v: 0 }, squash = { x: 0, v: 0 };
  let target = 0.5, W = 0, idx = -1, dragging = false, demoDrag = false, userTook = false, left = 0;
  let nextBlink = performance.now() + 1800, blinkAt = -1, tearT = 0;
  const snapTo = (f) => (CONFIG.snap ? Math.round(f * (N - 1)) / (N - 1) : f);
  const xFor = (f) => R + f * (W - 2 * R);

  function spring(s, to, k, zeta, dt) {
    s.v += (k * (to - s.x) - 2 * Math.sqrt(k) * zeta * s.v) * dt;
    s.x += s.v * dt;
  }

  let curWord = null;
  function showWord(i, dir) {
    const s = document.createElement('span');
    s.textContent = LEVELS[i];
    // 连着换好几档时，只留上一个字退场，更早还没退完的直接拿掉
    wordBox.querySelectorAll('.out-up, .out-down').forEach((el) => el.remove());
    if (curWord) {
      const old = curWord;
      if (dir && !reduceMotion) { old.className = dir > 0 ? 'out-up' : 'out-down'; setTimeout(() => old.remove(), 200); s.className = dir > 0 ? 'in-up' : 'in-down'; }
      else old.remove();
    }
    wordBox.append(s); curWord = s;
  }
  function setLevel(i) {
    if (i === idx) return;
    const dir = idx < 0 ? 0 : Math.sign(i - idx);
    idx = i;
    showWord(i, dir);
    ticks.forEach((t, k) => t.classList.toggle('on', k <= i));
    slider.setAttribute('aria-valuenow', i + 1);
    slider.setAttribute('aria-valuetext', `${LEVELS[i]}（第 ${i + 1} 档，共 ${N} 档）`);
    if (dir && !reduceMotion) squash.v = Math.max(squash.v, 1.7 * WOB);
  }

  function measure() {
    W = slider.clientWidth;
    ticks.forEach((t, k) => { t.style.left = `${xFor(k / (N - 1))}px`; });
    render(performance.now());
  }
  function moveTo(clientX) {
    target = clamp((clientX - left - R) / (W - 2 * R), 0, 1);
    wake();
  }
  function release() {
    if (!dragging) return;
    dragging = false; slider.classList.remove('dragging');
    target = snapTo(target); wake();
  }
  function takeOver() {
    userTook = true;
    if (demoDrag) { demoDrag = false; dragging = false; slider.classList.remove('dragging'); }
  }
  slider.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    takeOver();
    slider.setPointerCapture(e.pointerId);
    left = slider.getBoundingClientRect().left;
    dragging = true; slider.classList.add('dragging');
    moveTo(e.clientX);
  });
  slider.addEventListener('pointermove', (e) => { if (dragging && !demoDrag) moveTo(e.clientX); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((t) => slider.addEventListener(t, release));
  slider.addEventListener('keydown', (e) => {
    const unit = CONFIG.snap ? 1 / (N - 1) : 0.05;
    const d = { ArrowLeft: -unit, ArrowDown: -unit, ArrowRight: unit, ArrowUp: unit, Home: -1, End: 1 }[e.key];
    if (d === undefined) return;
    e.preventDefault(); takeOver();
    target = snapTo(clamp(target + d, 0, 1)); wake();
  });

  function step(dt, now) {
    const prev = pos.x;
    if (reduceMotion) {
      pos.x = target; pos.v = 0; mood.x = target; mood.v = 0; tilt.x = 0; squash.x = 0;
      return;
    }
    spring(pos, target, dragging ? 3000 : 260, dragging ? 1 : 0.75, dt);
    spring(mood, pos.x, 140, 0.42, dt);
    // 脑袋往拖动方向的反向歪，像被拽了一下；换档时压扁再弹回
    spring(tilt, clamp(-(pos.x - prev) / dt * 7 * WOB, -12, 12), 120, 0.5, dt);
    spring(squash, 0, 360, 0.28, dt);
  }

  const P = (id) => $(id);
  const head = P('mtHead'), shadow = P('mtShadow'), mouth = P('mtMouth'), mouthClip = P('mtMouthClipPath'), tongue = P('mtTongue'), tear = P('mtTear');
  const openL = P('mtOpenL'), openR = P('mtOpenR'), happyL = P('mtHappyL'), happyR = P('mtHappyR');
  const browL = P('mtBrowL'), browR = P('mtBrowR'), cheekL = P('mtCheekL'), cheekR = P('mtCheekR');

  function render(now) {
    knob.style.transform = `translateX(${xFor(pos.x).toFixed(2)}px)`;
    fill.style.transform = `scaleX(${(xFor(pos.x) / W).toFixed(4)})`;
    setLevel(Math.round(clamp(pos.x, 0, 1) * (N - 1)));

    const f = clamp(mood.x, -0.06, 1.06), m = f * 2 - 1;
    card.style.setProperty('--p', `${(clamp(f, 0, 1) * 100).toFixed(1)}%`);
    // 眨眼：每 2.6–5.2 秒合一次眼，140 毫秒
    let blink = 0;
    if (!reduceMotion) {
      if (now > nextBlink) { blinkAt = now; nextBlink = now + 2600 + Math.random() * 2600; }
      const b = (now - blinkAt) / 140;
      if (b >= 0 && b < 1) blink = 1 - Math.abs(b * 2 - 1);
    }
    const sq = smooth(0.55, 0.9, m);
    const lookX = (clamp(pos.x, 0, 1) - 0.5) * 3.2;
    const lid = Math.max(0.08, (1 - Math.max(0, -m) * 0.25 * E) * (1 - blink));
    [openL, openR].forEach((g) => { g.setAttribute('transform', `translate(${lookX.toFixed(2)} 0) scale(1 ${lid.toFixed(3)})`); g.style.opacity = (1 - sq).toFixed(3); });
    [happyL, happyR].forEach((g) => { g.style.opacity = sq.toFixed(3); });
    // 眉毛：难过时内端上挑，开心时整体抬高
    const brow = Math.min(0, m) * 20 * E, browY = -23 - Math.max(0, m) * 3 * E;
    browL.setAttribute('transform', `translate(-17 ${browY.toFixed(2)}) rotate(${brow.toFixed(2)})`);
    browR.setAttribute('transform', `translate(17 ${browY.toFixed(2)}) rotate(${(-brow).toFixed(2)})`);
    const cheek = (clamp((m - 0.15) / 0.6, 0, 1) * 0.5).toFixed(3);
    cheekL.setAttribute('opacity', cheek); cheekR.setAttribute('opacity', cheek);
    // 嘴：嘴角与下唇中点反向移动，越开心笑弧越深；够开心时上唇抬起张开嘴、露出舌头
    const w = 15 + 3 * Math.max(0, m) * E, yc = 21 - 7 * m * E, yl = 21 + 9 * m * E;
    const open = clamp((m - 0.3) / 0.6, 0, 1) * 11 * E, yu = yl - open;
    const d = `M${(-w).toFixed(2)} ${yc.toFixed(2)} Q0 ${(2 * yu - yc).toFixed(2)} ${w.toFixed(2)} ${yc.toFixed(2)} Q0 ${(2 * yl - yc).toFixed(2)} ${(-w).toFixed(2)} ${yc.toFixed(2)} Z`;
    mouth.setAttribute('d', d); mouthClip.setAttribute('d', d);
    tongue.setAttribute('cx', '0'); tongue.setAttribute('cy', (yl - 2.5).toFixed(2)); tongue.setAttribute('rx', (w * 0.45).toFixed(2));
    tongue.setAttribute('opacity', clamp((open - 4) / 4, 0, 1).toFixed(3));
    // 最低档：左眼下挂一滴泪，1.6 秒滑落一次
    const sad = clamp((-m - 0.6) / 0.25, 0, 1);
    tearT = reduceMotion ? 0.3 : (now / 1600) % 1;
    tear.setAttribute('transform', `translate(-22 ${(2 + tearT * 26).toFixed(2)})`);
    tear.setAttribute('opacity', (sad * Math.min(1, (1 - tearT) * 4) * Math.min(1, tearT * 8 + (reduceMotion ? 1 : 0))).toFixed(3));

    const s = clamp(squash.x, -0.25, 0.25);
    head.setAttribute('transform', `translate(0 50) rotate(${tilt.x.toFixed(2)}) scale(${(1 + s).toFixed(4)} ${(1 - s).toFixed(4)}) translate(0 -50)`);
    shadow.setAttribute('rx', (34 * (1 + s * 0.8)).toFixed(2));
  }

  let raf = 0, last = 0;
  function wake() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(loop); } }
  function loop(now) {
    raf = 0;
    if (document.hidden) { last = now; raf = requestAnimationFrame(loop); return; }
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const n = Math.max(1, Math.ceil(dt * 240));
    for (let i = 0; i < n; i++) step(dt / n, now);
    render(now);
    // 眨眼和泪滴要一直动；减少动态效果时只在拖动或位置没到时继续
    if (!reduceMotion || dragging || Math.abs(pos.x - target) > 1e-4) raf = requestAnimationFrame(loop);
  }

  addEventListener('resize', measure);
  measure();
  target = snapTo(clamp(CONFIG.value / 100, 0, 1));
  if (reduceMotion) { pos.x = mood.x = target; render(performance.now()); }
  else setTimeout(wake, 300);

  /* @mt:thumb-start */
  // 缩略图演示：在几档之间来回拖，停下吸附；用户一碰就交还
  if (window.__MT_ENV && window.__MT_ENV.thumb && !reduceMotion) {
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const drag = (to, ms) => new Promise((done) => {
      const from = target, t0 = performance.now();
      demoDrag = true; dragging = true; slider.classList.add('dragging');
      (function f(now) {
        if (userTook) return;
        const k = Math.min(1, (now - t0) / ms), e = k < 0.5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
        target = from + (to - from) * e; wake();
        if (k < 1) requestAnimationFrame(f);
        else { demoDrag = false; release(); done(); }
      })(t0);
    });
    (async () => {
      await wait(1200);
      const seq = [0.05, 0.98, 0.45, 0.02, 0.72];
      for (let i = 0; !userTook; i = (i + 1) % seq.length) {
        if (document.hidden) { await wait(500); continue; }
        await drag(seq[i], 650); await wait(1300);
      }
    })();
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
