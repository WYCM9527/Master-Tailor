<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活动圆环</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #000000;            /* 页面底色 */
    --mt-font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; /* 字体 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; display: grid; place-items: center; font-family: var(--mt-font); color: #fff; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  .mt-card { width: min(600px, 94vw); box-sizing: border-box; padding: 28px; border-radius: 28px; background: #141416; border: 1px solid rgba(255, 255, 255, 0.06); display: grid; gap: 24px; }
  .mt-top { display: flex; align-items: center; justify-content: center; gap: clamp(20px, 5vw, 48px); }
  .mt-rings { position: relative; flex: none; width: 220px; height: 220px; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; }
  .mt-rings:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.6); outline-offset: 4px; }
  .mt-rings canvas { display: block; width: 100%; height: 100%; }
  /* 每环起点的黑色小图标，固定在正上方 */
  .mt-glyph { position: absolute; left: 50%; translate: -50% -50%; color: #000; opacity: 0.85; pointer-events: none; }
  .mt-stats { display: grid; gap: 14px; min-width: 150px; }
  .mt-dayname { font-size: 13px; color: rgba(255, 255, 255, 0.5); letter-spacing: 0.06em; }
  .mt-stat b { display: block; margin-bottom: 2px; font-size: 15px; font-weight: 600; color: rgba(255, 255, 255, 0.85); letter-spacing: 0.06em; }
  .mt-stat span { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .mt-stat em { font-style: normal; }
  .mt-stat small { margin-left: 4px; font-size: 15px; font-weight: 500; color: rgba(255, 255, 255, 0.5); }
  /* 本周：一排七天的小圆环，选中那天的标签是白底黑字的圆 */
  .mt-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding-top: 18px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
  .mt-day { display: grid; justify-items: center; gap: 8px; padding: 4px 0; border: 0; border-radius: 12px; background: none; color: rgba(255, 255, 255, 0.55); font: inherit; font-size: 12px; cursor: pointer; }
  .mt-day i { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; font-style: normal; transition: background-color 0.2s, color 0.2s; }
  .mt-day[aria-pressed="true"] i { background: #fff; color: #000; font-weight: 700; }
  .mt-day canvas { width: 36px; height: 36px; }
  .mt-day:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.6); outline-offset: 2px; }
  @media (max-width: 520px) {
    .mt-top { flex-direction: column; gap: 20px; }
    .mt-stats { width: 100%; min-width: 0; grid-template-columns: repeat(3, auto); justify-content: space-between; }
    .mt-dayname { grid-column: 1 / -1; }
    .mt-stat span { font-size: 18px; }
    .mt-stat small { display: block; margin: 0; font-size: 12px; }
  }

  /* 用户开启「减少动态效果」时：日期标签切换不做过渡（圆环直接显示最终值在脚本里处理） */
  @media (prefers-reduced-motion: reduce) {
    .mt-day i { transition: none; }
  }
</style>
</head>
<body>
<div class="mt-card">
  <div class="mt-top">
    <button class="mt-rings" id="mtRings" type="button">
      <canvas id="mtCanvas"></canvas>
      <!-- IconPark: arrow-right -->
      <svg class="mt-glyph" viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M41.9999 24H5.99994" stroke="currentColor" stroke-width="4" stroke-linecap="butt" stroke-linejoin="miter"/><path d="M30 12L42 24L30 36" stroke="currentColor" stroke-width="4" stroke-linecap="butt" stroke-linejoin="miter"/></svg>
      <!-- IconPark: double-right -->
      <svg class="mt-glyph" viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M12 12L24 24L12 36" stroke="currentColor" stroke-width="4" stroke-linecap="butt" stroke-linejoin="miter"/><path d="M24 12L36 24L24 36" stroke="currentColor" stroke-width="4" stroke-linecap="butt" stroke-linejoin="miter"/></svg>
      <!-- IconPark: arrow-up -->
      <svg class="mt-glyph" viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M24 6V42" stroke="currentColor" stroke-width="4" stroke-linecap="butt" stroke-linejoin="miter"/><path d="M12 18L24 6L36 18" stroke="currentColor" stroke-width="4" stroke-linecap="butt" stroke-linejoin="miter"/></svg>
    </button>
    <div class="mt-stats" id="mtStats"><div class="mt-dayname" id="mtDayName"></div></div>
  </div>
  <div class="mt-week" id="mtWeek"></div>
</div>
<script>
  const CONFIG = {
    rings: 3,           // 环数：从外往里依次是活动、锻炼、站立
    move: 135,          // 活动完成度（%）：周日（默认选中那天）的数据，超过 100 时叠着继续绕
    exercise: 80,       // 锻炼完成度（%）
    stand: 50,          // 站立完成度（%）
    thickness: 22,      // 线宽（px）：大圆环每一环的粗细
    duration: 1.6,      // 生长时长（秒）：每个环从当前值转到目标值所用的时间
    stagger: 0.18,      // 错峰间隔（秒）：相邻两环起步相差多久
    palette: 'fitness', // 配色：fitness 健身三色 / ocean 海洋 / sunset 落日
    week: true,         // 显示本周：下方一排每天的小圆环，点哪天看哪天
  };
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const easeOut = (k) => 1 - (1 - k) ** 3;
  const PALETTES = { fitness: ['#fa114f', '#a6ff00', '#00e5ff'], ocean: ['#3d7bff', '#2ad4ff', '#a78bfa'], sunset: ['#ff5f3d', '#ffc233', '#ff4fa0'] };
  const META = [{ name: '活动', goal: 600, unit: '千卡' }, { name: '锻炼', goal: 30, unit: '分钟' }, { name: '站立', goal: 12, unit: '小时' }];
  // 一周的完成度（%）：周一到周六固定，周日用参数
  const WEEK = [[82, 60, 75], [112, 140, 92], [45, 20, 58], [160, 190, 100], [95, 70, 83], [230, 260, 67], [CONFIG.move, CONFIG.exercise, CONFIG.stand]];
  const DAYS = ['一', '二', '三', '四', '五', '六', '日'];
  const BIG = 220, GAP = 3, MINI = 36, MINI_LW = 4, MINI_GAP = 1;
  const N = clamp(Math.round(CONFIG.rings), 1, 3);
  const LW = clamp(CONFIG.thickness, 4, 40);

  const hex = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const mix = (c, t, k) => `rgb(${c.map((x, i) => Math.round(x + (t[i] - x) * k)).join(',')})`;
  const rgba = (c, a) => `rgba(${c.join(',')},${a})`;
  const colors = (PALETTES[CONFIG.palette] || PALETTES.fitness).map(hex);
  const dpr = Math.min(2, devicePixelRatio || 1);

  // 画一环：轨道 + 进度弧；p 可以超过 1
  function drawRing(ctx, c, r, lw, p, col) {
    const start = mix(col, [0, 0, 0], 0.3), end = mix(col, [255, 255, 255], 0.15);
    const conic = typeof ctx.createConicGradient === 'function';
    ctx.lineWidth = lw;
    ctx.strokeStyle = rgba(col, 0.22);
    ctx.beginPath(); ctx.arc(c, c, r, 0, Math.PI * 2); ctx.stroke();
    if (p <= 0.001) return;
    const a0 = -Math.PI / 2, a1 = a0 + Math.PI * 2 * p;
    ctx.lineCap = 'round';
    if (p <= 1) {
      let g = end;
      if (conic) { g = ctx.createConicGradient(a0, c, c); g.addColorStop(0, start); g.addColorStop(p, end); g.addColorStop((1 + p) / 2, end); g.addColorStop(1, start); }
      ctx.strokeStyle = g;
      ctx.beginPath(); ctx.arc(c, c, r, a0, a1); ctx.stroke();
      return;
    }
    // 超过一圈：整圈渐变从环头开始绕一周；环头画一个圆，投影落在前方那一圈上
    let g = end;
    if (conic) { g = ctx.createConicGradient(a1, c, c); g.addColorStop(0, start); g.addColorStop(1, end); }
    ctx.strokeStyle = g;
    ctx.beginPath(); ctx.arc(c, c, r, 0, Math.PI * 2); ctx.stroke();
    const hx = c + r * Math.cos(a1), hy = c + r * Math.sin(a1);
    const fx = -Math.sin(a1), fy = Math.cos(a1);   // 顺时针前进方向
    ctx.save();
    ctx.beginPath(); ctx.arc(c, c, r + lw / 2, 0, Math.PI * 2); ctx.arc(c, c, r - lw / 2, 0, Math.PI * 2); ctx.clip('evenodd');
    ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.shadowBlur = lw * 0.5 * dpr;                 // 投影参数不受缩放影响，按像素比换算
    ctx.shadowOffsetX = fx * lw * 0.2 * dpr; ctx.shadowOffsetY = fy * lw * 0.2 * dpr;
    ctx.fillStyle = end;
    ctx.beginPath(); ctx.arc(hx, hy, lw / 2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // 重画环头之后的一段，盖住往回溢出的阴影
    ctx.strokeStyle = g; ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.arc(c, c, r, a1 - Math.PI * 0.6, a1); ctx.stroke();
    ctx.fillStyle = end;
    ctx.beginPath(); ctx.arc(hx, hy, lw / 2, 0, Math.PI * 2); ctx.fill();
  }
  function drawSet(canvas, size, lw, gap, margin, values) {
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);
    for (let i = 0; i < N; i++) {
      const r = size / 2 - margin - lw / 2 - i * (lw + gap);
      if (r - lw / 2 > 0) drawRing(ctx, size / 2, r, lw, values[i] / 100, colors[i]);
    }
  }
  const sizeCanvas = (cv, size) => { cv.width = Math.round(size * dpr); cv.height = Math.round(size * dpr); };

  const ringsBtn = document.getElementById('mtRings'), canvas = document.getElementById('mtCanvas');
  sizeCanvas(canvas, BIG);
  // 图标放在每环起点（正上方），边长为线宽的 0.62 倍
  document.querySelectorAll('.mt-glyph').forEach((g, i) => {
    if (i >= N) { g.remove(); return; }
    const r = BIG / 2 - 2 - LW / 2 - i * (LW + GAP), s = LW * 0.62;
    Object.assign(g.style, { top: BIG / 2 - r + 'px', width: s + 'px', height: s + 'px' });
  });

  const statsEl = document.getElementById('mtStats'), dayName = document.getElementById('mtDayName');
  const nums = META.slice(0, N).map((m, i) => {
    const row = document.createElement('div');
    row.className = 'mt-stat';
    row.innerHTML = `<b></b><span><em></em><small></small></span>`;
    row.querySelector('b').textContent = m.name;
    row.querySelector('small').textContent = m.unit;
    row.querySelector('span').style.color = mix(colors[i], [255, 255, 255], 0.1);
    statsEl.appendChild(row);
    return row.querySelector('em');
  });

  let shown = [0, 0, 0], anim = null, day = 6, userTook = false;
  function paint() {
    drawSet(canvas, BIG, LW, GAP, 2, shown);
    nums.forEach((em, i) => { em.textContent = `${Math.round((META[i].goal * shown[i]) / 100)}/${META[i].goal}`; });
  }
  function describe() {
    const parts = META.slice(0, N).map((m, i) => `${m.name} ${Math.round((m.goal * shown[i]) / 100)}/${m.goal} ${m.unit}`);
    ringsBtn.setAttribute('aria-label', `周${DAYS[day]}：${parts.join('，')}；点一下重播`);
  }
  function goTo(values, fromZero) {
    const from = fromZero ? [0, 0, 0] : shown.slice();
    if (reduceMotion) { shown = values.slice(); anim = null; paint(); describe(); return; }
    anim = { from, to: values.slice(), t0: performance.now() };
    if (!raf) raf = requestAnimationFrame(loop);
  }
  let raf = 0;
  function loop(now) {
    const t = (now - anim.t0) / 1000;
    let done = true;
    for (let i = 0; i < 3; i++) {
      const k = clamp((t - i * CONFIG.stagger) / Math.max(0.05, CONFIG.duration), 0, 1);
      if (k < 1) done = false;
      shown[i] = anim.from[i] + (anim.to[i] - anim.from[i]) * easeOut(k);
    }
    paint();
    if (done) { anim = null; raf = 0; describe(); return; }
    raf = requestAnimationFrame(loop);
  }

  const weekEl = document.getElementById('mtWeek');
  const dayBtns = DAYS.map((d, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'mt-day';
    b.setAttribute('aria-label', `周${d}`);
    b.innerHTML = `<i>${d}</i><canvas></canvas>`;
    const cv = b.querySelector('canvas');
    sizeCanvas(cv, MINI);
    drawSet(cv, MINI, MINI_LW, MINI_GAP, 0.5, WEEK[i]);
    b.addEventListener('click', () => { takeOver(); select(i); });
    weekEl.appendChild(b);
    return b;
  });
  if (!CONFIG.week) weekEl.remove();
  weekEl.addEventListener('keydown', (e) => {
    const d = { ArrowLeft: -1, ArrowRight: 1 }[e.key];
    if (!d) return;
    e.preventDefault(); takeOver();
    const n = (day + d + 7) % 7;
    select(n); dayBtns[n].focus();
  });
  function select(d, fromZero) {
    day = d;
    dayBtns.forEach((b, i) => b.setAttribute('aria-pressed', String(i === d)));
    dayName.textContent = d === 6 ? '周日 · 今天' : `周${DAYS[d]}`;
    goTo(WEEK[d], fromZero);
  }
  ringsBtn.addEventListener('click', () => { takeOver(); select(day, true); });
  function takeOver() { userTook = true; }

  paint();
  setTimeout(() => select(6, true), reduceMotion ? 0 : 250);

  /* @mt:thumb-start */
  // 缩略图演示：从周日起轮流看每一天（不显示本周时隔一阵从零重播）；用户一碰就交还
  if (window.__MT_ENV && window.__MT_ENV.thumb && !reduceMotion) {
    setInterval(() => {
      if (userTook || document.hidden) return;
      if (CONFIG.week) select((day + 1) % 7); else select(day, true);
    }, CONFIG.week ? 2800 : 3600);
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
