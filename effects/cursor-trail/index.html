<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鼠标流光拖尾</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;     /* 页面底色 */
    --mt-color: #f9cf00;  /* 流光颜色（canvas 每帧读取，调参实时生效） */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; cursor: crosshair; }
  canvas { position: fixed; inset: 0; display: block; pointer-events: none; }
  .mt-hint {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    color: #6d7285;
    font: 13px/-apple-system, "PingFang SC", sans-serif;
    font-size: 13px;
    letter-spacing: 0.1em;
    user-select: none;
  }
</style>
</head>
<body>
<div class="mt-hint">移动鼠标，拖出一条流光</div>
<canvas id="mtCanvas" aria-hidden="true"></canvas>
<script>
  const CONFIG = {
    trailLen: 32,   // 拖尾长度：记录的轨迹点数量（10-60）
    lineWidth: 6,   // 丝带宽度：头部最粗处（px）
    glow: true,     // 发光叠加：true 用加色混合（lighter），流光更亮
    smooth: 0.35,   // 跟随柔顺度：0.1-0.6，越小尾巴甩得越慢越飘
  };

  const canvas = document.getElementById('mtCanvas');
  const ctx = canvas.getContext('2d');
  const rootStyle = getComputedStyle(document.documentElement);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let width = 0, height = 0, dpr = 1;
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    width = innerWidth; height = innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize);
  resize();

  // 轨迹队列：head 用弹性缓动追目标，其余点依次追前一个点，形成丝带
  const target = { x: width / 2, y: height / 2 };
  const points = Array.from({ length: CONFIG.trailLen }, () => ({ x: target.x, y: target.y }));

  function feed(x, y) { target.x = x; target.y = y; }
  document.addEventListener('mousemove', (e) => feed(e.clientX, e.clientY));

  function hexToRgb(hex) {
    return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  }

  function frame() {
    ctx.clearRect(0, 0, width, height);
    const color = rootStyle.getPropertyValue('--mt-color').trim() || '#f9cf00';
    const [r, g, b] = hexToRgb(color);

    // 链式追随：第 0 点追鼠标，第 n 点追第 n-1 点
    points[0].x += (target.x - points[0].x) * CONFIG.smooth;
    points[0].y += (target.y - points[0].y) * CONFIG.smooth;
    for (let i = 1; i < points.length; i++) {
      points[i].x += (points[i - 1].x - points[i].x) * CONFIG.smooth;
      points[i].y += (points[i - 1].y - points[i].y) * CONFIG.smooth;
    }

    ctx.globalCompositeOperation = CONFIG.glow ? 'lighter' : 'source-over';
    // 逐段画线：越靠尾部越细、越透明
    for (let i = 1; i < points.length; i++) {
      const t = 1 - i / points.length;
      ctx.strokeStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + (t * 0.9).toFixed(3) + ')';
      ctx.lineWidth = Math.max(0.5, CONFIG.lineWidth * t);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(points[i - 1].x, points[i - 1].y);
      ctx.lineTo(points[i].x, points[i].y);
      ctx.stroke();
    }
    // 头部一个亮点
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(points[0].x, points[0].y, CONFIG.lineWidth * 0.7, 0, Math.PI * 2);
    ctx.fill();
  }

  // rAF 主循环：页面切到后台时暂停，避免空耗性能
  let rafId = null;
  function loop() { frame(); rafId = requestAnimationFrame(loop); }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { cancelAnimationFrame(rafId); rafId = null; }
    else if (!rafId) rafId = requestAnimationFrame(loop);
  });
  if (reduceMotion) {
    // 减少动态效果：不画拖尾，只画一个跟随鼠标的静态光点（mousemove 时重绘一次）
    document.addEventListener('mousemove', () => {
      ctx.clearRect(0, 0, width, height);
      const color = rootStyle.getPropertyValue('--mt-color').trim() || '#f9cf00';
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(target.x, target.y, CONFIG.lineWidth * 0.7, 0, Math.PI * 2);
      ctx.fill();
    });
  } else {
    rafId = requestAnimationFrame(loop);
  }

  /* @mt:thumb-start */
  if (window.__MT_ENV && window.__MT_ENV.thumb && !reduceMotion) {
    // 缩略图演示：流光沿李萨如曲线自动游走；真实鼠标进入时优先跟随
    let lastReal = 0;
    window.__mtOnPointer = (x, y) => { lastReal = performance.now(); feed(x, y); };
    (function autoDemo() {
      if (document.hidden) { requestAnimationFrame(autoDemo); return; }
      if (performance.now() - lastReal > 1200) {
        const t = performance.now() / 1000;
        feed(
          width / 2 + Math.sin(t * 1.3) * width * 0.32,
          height / 2 + Math.sin(t * 2.1 + 1) * height * 0.3
        );
      }
      requestAnimationFrame(autoDemo);
    })();
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
