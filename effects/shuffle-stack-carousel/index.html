<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>纸堆洗牌轮播</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-accent: #f9cf00;    /* 强调色：数字角标 */
    --mt-duration: 0.5s;     /* 切换过渡时长 */
    --mt-rounded: 18px;      /* 卡片圆角 */
  }

  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mt-bg);
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  .mt-carousel {
    position: relative;
    width: min(420px, 82vw);
    aspect-ratio: 4 / 5;
    outline: none;
    touch-action: pan-y;
    cursor: grab;
  }
  .mt-carousel.dragging { cursor: grabbing; }
  .mt-carousel:focus-visible { outline: 2px solid var(--mt-accent); outline-offset: 6px; }

  .mt-card {
    position: absolute;
    inset: 0;
    margin: 0;
    border-radius: var(--mt-rounded);
    overflow: hidden;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
    background: linear-gradient(135deg, #1a1c2c, #2a2f4a);
    /* 层叠位置（translateY/scale）与飞出都走同一条过渡 */
    transition:
      transform var(--mt-duration) cubic-bezier(0.33, 1, 0.68, 1),
      opacity var(--mt-duration) ease;
  }
  .mt-card img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    -webkit-user-drag: none;
    user-select: none;
  }
  .mt-card .mt-caption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 42px 18px 14px;
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.62));
  }

  .mt-fraction {
    position: absolute;
    top: -34px;
    right: 0;
    padding: 3px 12px;
    border-radius: 999px;
    background: rgba(10, 10, 15, 0.6);
    color: var(--mt-accent);
    font-size: 12.5px;
    font-family: ui-monospace, monospace;
  }

  /* 用户开启「减少动态效果」：切换瞬间到位、不自动播放（JS 同步处理） */
  @media (prefers-reduced-motion: reduce) {
    .mt-card { transition: none; }
  }
</style>
</head>
<body>
<div class="mt-carousel" id="mtRoot"></div>
<script>
  const CONFIG = {
    slides: [{"src":"/samples/sample-1.svg","caption":"第一张 · 琥珀之夜"},{"src":"/samples/sample-2.svg","caption":"第二张 · 海面日出"},{"src":"/samples/sample-3.svg","caption":"第三张 · 山脊星光"},{"src":"/samples/sample-4.svg","caption":"第四张 · 苔原晨雾"},{"src":"/samples/sample-5.svg","caption":"第五张 · 蔷薇暮色"}], // 卡片列表
    interval: 3.5,  // 自动切换间隔（秒，0 为不自动播放）
    stackDepth: 1,  // 层叠强度：下层卡片缩小与下移的幅度倍率（0.5 温和 - 2 夸张）
  };

  (function () {
    const root = document.getElementById('mtRoot');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const slides = CONFIG.slides;
    const total = slides.length;
    const VISIBLE = 3; // 顶卡之下露出的层数
    let index = 0;

    root.setAttribute('role', 'region');
    root.setAttribute('aria-roledescription', 'carousel');
    root.setAttribute('aria-label', '纸堆洗牌轮播');
    root.setAttribute('tabindex', '0');

    const cards = slides.map((s, i) => {
      const el = document.createElement('figure');
      el.className = 'mt-card';
      el.setAttribute('role', 'group');
      el.setAttribute('aria-roledescription', 'slide');
      el.setAttribute('aria-label', '第 ' + (i + 1) + ' 张，共 ' + total + ' 张');
      const img = document.createElement('img');
      img.src = s.src;
      img.alt = s.caption || '第 ' + (i + 1) + ' 张卡片';
      img.loading = 'lazy';
      el.appendChild(img);
      if (s.caption) {
        const cap = document.createElement('div');
        cap.className = 'mt-caption';
        cap.textContent = s.caption;
        el.appendChild(cap);
      }
      root.appendChild(el);
      return el;
    });

    const fraction = document.createElement('div');
    fraction.className = 'mt-fraction';
    fraction.setAttribute('aria-hidden', 'true');
    root.appendChild(fraction);

    // 每张卡固定一个随机小角度：叠起来就是一沓随手放的纸
    const jitters = slides.map((_s, i) => (Math.sin(i * 971) * 5));
    // 布局：off=0 是顶卡；1..VISIBLE 依次错位微旋露出「纸堆」；再往后藏在最底
    function layout() {
      for (let i = 0; i < total; i++) {
        const off = (i - index + total) % total;
        const el = cards[i];
        if (off === 0) {
          el.style.transform = 'rotate(' + (jitters[i] * 0.3) + 'deg)';
          el.style.opacity = '1';
          el.style.zIndex = String(total);
        } else if (off <= VISIBLE) {
          const scale = 1 - off * 0.04 * CONFIG.stackDepth;
          const y = off * 12 * CONFIG.stackDepth;
          el.style.transform = 'translateY(' + y + 'px) rotate(' + jitters[i] + 'deg) scale(' + scale + ')';
          el.style.opacity = String(off === VISIBLE ? 0.55 : 1);
          el.style.zIndex = String(total - off);
        } else {
          // 队列后段：藏在最底层（与最后一层同位置，透明）
          const scale = 1 - VISIBLE * 0.05 * CONFIG.stackDepth;
          el.style.transform = 'translateY(' + VISIBLE * 16 * CONFIG.stackDepth + 'px) scale(' + scale + ')';
          el.style.opacity = '0';
          el.style.zIndex = '0';
        }
        el.setAttribute('aria-hidden', off === 0 ? 'false' : 'true');
      }
      fraction.textContent = ((index % total) + 1) + ' / ' + total;
    }

    // 下一张：顶卡朝随机一侧飞出旋转淡出（洗牌感），落到队尾；其余上浮一层
    function nextSlide() {
      const top = cards[index];
      const side = Math.random() > 0.5 ? 1 : -1;
      const tilt = (10 + Math.random() * 14) * side;
      top.style.transform = 'translate(' + side * 60 + '%, ' + (-10 - Math.random() * 14) + '%) rotate(' + tilt + 'deg)';
      top.style.opacity = '0';
      index = (index + 1) % total;
      // 其余卡片即刻按新次序排布；飞出的卡过渡结束后已是队尾的隐藏位
      requestAnimationFrame(() => requestAnimationFrame(layout));
    }
    // 上一张：队尾的卡从左上飞回顶层
    function prevSlide() {
      index = (index - 1 + total) % total;
      const top = cards[index];
      top.style.transition = 'none';
      top.style.transform = 'translate(-55%, -6%) rotate(-10deg)';
      top.style.opacity = '0';
      top.style.zIndex = String(total + 1);
      void top.offsetWidth; // 强制 reflow 后恢复过渡，飞回原位
      top.style.transition = '';
      layout();
    }

    // 自动播放：悬停 / 聚焦 / 后台暂停；reduced-motion 不启动
    let timer = null;
    function play() {
      if (timer || CONFIG.interval <= 0 || reduceMotion || total < 2) return;
      timer = setInterval(nextSlide, CONFIG.interval * 1000);
    }
    function pause() { clearInterval(timer); timer = null; }
    root.addEventListener('mouseenter', pause);
    root.addEventListener('mouseleave', play);
    root.addEventListener('focusin', pause);
    root.addEventListener('focusout', play);
    document.addEventListener('visibilitychange', () => (document.hidden ? pause() : play()));
    play();

    // 拖拽 / 触摸（Pointer Events）：左滑下一张、右滑上一张
    let dragStartX = null, dragDx = 0;
    root.addEventListener('pointerdown', (e) => {
      dragStartX = e.clientX; dragDx = 0;
      root.classList.add('dragging');
      root.setPointerCapture(e.pointerId);
    });
    root.addEventListener('pointermove', (e) => {
      if (dragStartX === null) return;
      dragDx = e.clientX - dragStartX;
    });
    root.addEventListener('pointerup', () => {
      root.classList.remove('dragging');
      if (dragStartX === null) return;
      if (Math.abs(dragDx) > 50) (dragDx < 0 ? nextSlide : prevSlide)();
      dragStartX = null;
    });
    root.addEventListener('pointercancel', () => { root.classList.remove('dragging'); dragStartX = null; });

    // 键盘
    root.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
    });

    layout();
  })();
</script>
</body>
</html>
