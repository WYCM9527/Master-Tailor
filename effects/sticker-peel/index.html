<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贴纸翻角</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
  }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mt-bg);
    display: grid; place-items: center;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  /* 外层：整体位置（拖拽）与翻折方向的旋转；内层：贴纸自身的歪斜 */
  .mt-wrap {
    position: relative;
    transform: translate(var(--x, 0px), var(--y, 0px)) rotate(var(--dir, 0deg));
    cursor: grab; user-select: none; touch-action: none;
    --p: 12px;                 /* 让 clip-path 向外留出的余量，翻折时阴影不被切 */
    --peel: 0%;                /* 当前翻折比例（悬停 / 按住时改） */
    --s: calc(-1 * var(--p));  /* clip 起点 */
    --e: calc(100% + var(--p));/* clip 终点 */
  }
  .mt-wrap.dragging { cursor: grabbing; }
  .mt-sticker { position: relative; transform: rotate(calc(var(--rot, 30deg) - var(--dir, 0deg))); }
  .mt-sticker img { display: block; width: 100%; height: auto; border-radius: var(--radius, 16px); pointer-events: none; }
  /* 正面：上方 --peel 的部分被裁掉（翻走了） */
  .mt-main {
    position: relative;
    clip-path: polygon(var(--s) var(--peel), var(--e) var(--peel), var(--e) var(--e), var(--s) var(--e));
    transition: clip-path 0.6s ease-out;
    filter: url(#mtDrop);
    will-change: clip-path;
  }
  /* 翻下来的背面：正面的上下翻转副本，只露出 0–peel 那一条，贴在折线下方 */
  .mt-flap {
    position: absolute; left: 0; width: 100%;
    top: calc(-100% + 2 * var(--peel) - 1px);
    transform: scaleY(-1);
    clip-path: polygon(var(--s) var(--s), var(--e) var(--s), var(--e) var(--peel), var(--s) var(--peel));
    transition: clip-path 0.6s ease-out, top 0.6s ease-out;
    will-change: clip-path, transform;
  }
  /* 翻折部分投在正面上的软阴影 */
  .mt-flap-shadow { filter: brightness(0) blur(8px); opacity: 0.4; position: absolute; top: 16px; left: 8px; width: 100%; height: 100%; }
  .mt-flap-shadow .mt-flap { position: absolute; }
  .mt-hint {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    font-size: 12px; letter-spacing: 0.12em; color: rgba(255,255,255,0.35); pointer-events: none;
  }
  /* 用户开启「减少动态效果」时：翻折直接切换 */
  @media (prefers-reduced-motion: reduce) { .mt-main, .mt-flap { transition: none; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- 跟随鼠标的点光：在图像 alpha 上做镜面反射，叠回原图 -->
    <filter id="mtLight">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur"/>
      <feSpecularLighting id="mtSpec" in="blur" result="spec" specularExponent="100" specularConstant="0.1" lighting-color="white">
        <fePointLight id="mtPoint" x="100" y="100" z="300"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceGraphic" result="lit"/>
      <feComposite in="lit" in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="mtLightFlip">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feSpecularLighting id="mtSpecFlip" in="blur" result="spec" specularExponent="100" specularConstant="0.1" lighting-color="white">
        <fePointLight id="mtPointFlip" x="100" y="100" z="300"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceGraphic" result="lit"/>
      <feComposite in="lit" in2="SourceAlpha" operator="in"/>
    </filter>
    <!-- 贴纸投影 -->
    <filter id="mtDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow id="mtDropShadow" dx="2" dy="4" stdDeviation="1.8" flood-color="black" flood-opacity="0.6"/>
    </filter>
    <!-- 背面：把正面图压成半透明的白灰，像贴纸背胶 -->
    <filter id="mtBackFill">
      <feColorMatrix type="matrix" values="0.35 0.35 0.35 0 0.45  0.35 0.35 0.35 0 0.45  0.35 0.35 0.35 0 0.45  0 0 0 1 0"/>
    </filter>
  </defs>
</svg>
<div class="mt-wrap" id="mtWrap">
  <div class="mt-sticker" id="mtSticker">
    <div style="filter:url(#mtLight)"><div class="mt-main"><img id="mtImg" alt=""></div></div>
    <div class="mt-flap-shadow"><div class="mt-flap"><img id="mtImgS" alt="" style="filter:url(#mtBackFill)"></div></div>
    <div class="mt-flap"><div style="filter:url(#mtLightFlip)"><img id="mtImgB" alt="" style="filter:url(#mtBackFill)"></div></div>
  </div>
</div>
<div class="mt-hint" id="mtHint">悬停翻折 · 按住翻更多 · 拖动</div>
<script>
  const CONFIG = {
    photo: "/samples/sample-5.webp", // 贴纸图片
    size: 220,           // 贴纸宽度（px）
    peelHover: 30,       // 悬停翻折（%）
    peelActive: 40,      // 按住翻折（%）
    peelDirection: "0",  // 翻折方向：0 从上往下 / 180 从下往上 / 90 从右往左 / 270 从左往右
    rotate: 30,          // 贴纸歪斜（度）
    shadow: 0.6,         // 投影浓度
    lighting: 0.1,       // 高光强度
    draggable: true,     // 可拖拽
    rounded: 16,         // 圆角（px）
  };

  const wrap = document.getElementById('mtWrap'), sticker = document.getElementById('mtSticker');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  for (const id of ['mtImg', 'mtImgS', 'mtImgB']) document.getElementById(id).src = CONFIG.photo;
  sticker.style.width = `${CONFIG.size}px`;
  sticker.style.setProperty('--rot', `${CONFIG.rotate}deg`);
  sticker.style.setProperty('--radius', `${CONFIG.rounded}px`);
  wrap.style.setProperty('--dir', `${CONFIG.peelDirection}deg`);
  document.getElementById('mtDropShadow').setAttribute('flood-opacity', CONFIG.shadow);
  document.getElementById('mtDropShadow').setAttribute('stdDeviation', 3 * CONFIG.shadow);
  document.getElementById('mtSpec').setAttribute('specularConstant', CONFIG.lighting);
  document.getElementById('mtSpecFlip').setAttribute('specularConstant', CONFIG.lighting);
  if (!CONFIG.draggable) { wrap.style.cursor = 'default'; document.getElementById('mtHint').textContent = '悬停翻折 · 按住翻更多'; }

  // 翻折比例：悬停 → peelHover，按住 → peelActive，离开 → 0
  let hovering = false, pressing = false, dragging = false;
  const applyPeel = () => wrap.style.setProperty('--peel', `${pressing ? CONFIG.peelActive : hovering ? CONFIG.peelHover : 0}%`);
  wrap.addEventListener('pointerenter', () => { hovering = true; userTook = true; applyPeel(); });
  wrap.addEventListener('pointerleave', () => { hovering = false; pressing = false; applyPeel(); });

  // 点光跟随鼠标（相对贴纸坐标；翻转层的 y 要镜像）
  wrap.addEventListener('pointermove', (e) => {
    const r = sticker.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    document.getElementById('mtPoint').setAttribute('x', x); document.getElementById('mtPoint').setAttribute('y', y);
    document.getElementById('mtPointFlip').setAttribute('x', x); document.getElementById('mtPointFlip').setAttribute('y', r.height - y);
  });

  // 拖拽：整体位移
  let sx = 0, sy = 0, ox = 0, oy = 0, userTook = false;
  wrap.addEventListener('pointerdown', (e) => {
    pressing = true; applyPeel();
    if (!CONFIG.draggable) return;
    dragging = true; wrap.classList.add('dragging'); wrap.setPointerCapture(e.pointerId);
    sx = e.clientX - ox; sy = e.clientY - oy;
  });
  wrap.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    ox = e.clientX - sx; oy = e.clientY - sy;
    wrap.style.setProperty('--x', `${ox}px`); wrap.style.setProperty('--y', `${oy}px`);
  });
  const up = () => { pressing = false; dragging = false; wrap.classList.remove('dragging'); applyPeel(); };
  wrap.addEventListener('pointerup', up); wrap.addEventListener('pointercancel', up);

  /* @mt:thumb-start */
  // 缩略图演示：自动悬停 → 按住 → 松开循环；真实鼠标进入后交还
  if (!reduceMotion) {
    let step = 0;
    setInterval(() => {
      if (document.hidden || userTook) return;
      step = (step + 1) % 4;
      hovering = step !== 0; pressing = step === 2; applyPeel();
    }, 900);
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
