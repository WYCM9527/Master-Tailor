<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>按钮变进度</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-color: #5b5bf7;         /* 主色：按钮和进度的颜色 */
    --mt-success: #20b26b;       /* 成功色 */
    --mt-error: #e5484d;         /* 失败色 */
    --mt-radius: 16px;           /* 圆角 */
    --mt-bg: #eef0f6;            /* 页面底色 */
    --mt-font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; /* 字体 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; display: grid; place-items: center; font-family: var(--mt-font); user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }

  .mt-btn {
    --c: var(--mt-color);
    --p: 0;
    --tint: color-mix(in oklch, var(--mt-color) 20%, #fff);
    position: relative; width: 220px; height: 52px; padding: 0; border: 0; border-radius: var(--mt-radius);
    background: none; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; perspective: 600px;
    filter: drop-shadow(0 8px 12px color-mix(in srgb, var(--c) 30%, transparent)); transition: filter 0.3s;
  }
  .mt-btn[data-state="busy"] { cursor: progress; }
  .mt-btn[data-state="ok"] { --c: var(--mt-success); }
  .mt-btn[data-state="err"] { --c: var(--mt-error); animation: mt-shake 0.45s 0.1s; }
  .mt-btn:focus-visible { outline: 2px solid var(--mt-color); outline-offset: 4px; }
  @keyframes mt-shake { 20% { translate: -6px 0; } 40% { translate: 6px 0; } 60% { translate: -4px 0; } 80% { translate: 3px 0; } }

  .mt-flip { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.3, 1.3, 0.5, 1), scale 0.15s; }
  .mt-btn:active .mt-flip { scale: 0.97; }
  .mt-face, .mt-back { position: absolute; inset: 0; display: grid; place-items: center; overflow: hidden; border-radius: var(--mt-radius); backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .mt-face { background: var(--c); color: #fff; clip-path: inset(0 round var(--mt-radius)); transition: background-color 0.3s, color 0.3s, clip-path 0.45s cubic-bezier(0.3, 0.7, 0.2, 1); }
  .mt-back { display: none; background: var(--tint); color: var(--mt-color); transform: rotateX(180deg); }
  .mt-text { display: flex; align-items: center; gap: 8px; white-space: nowrap; transition: opacity 0.2s; }
  .mt-text svg { display: none; flex: none; width: 20px; height: 20px; }
  .mt-btn[data-state="idle"] .i-idle, .mt-btn[data-state="ok"] .i-ok, .mt-btn[data-state="err"] .i-err { display: block; }
  .mt-text b, .mt-pct { font-weight: 600; font-variant-numeric: tabular-nums; }
  /* 填充层叠在底层同一位置，按进度从左往右露出；里面的白字与底下的主色字拼成一行 */
  .mt-fill { position: absolute; inset: 0; display: grid; place-items: center; background: var(--c); color: #fff; clip-path: inset(0 calc(100% - var(--p) * 100%) 0 0); transition: background-color 0.3s; }
  .mt-line { position: absolute; left: 14px; right: 14px; bottom: 8px; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.3); opacity: 0; transition: opacity 0.2s; }
  .mt-line::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: #fff; transform-origin: 0 50%; transform: scaleX(var(--p)); }
  .mt-ring { position: absolute; left: 50%; top: 0; width: 52px; height: 52px; translate: -50% 0; rotate: -90deg; fill: none; stroke-width: 4; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  .mt-ring .mt-trk { stroke: var(--tint); }
  .mt-ring .mt-arc { stroke: var(--mt-color); stroke-linecap: round; stroke-dasharray: calc(var(--p) * 100) 100; opacity: calc(var(--p) * 50); }
  .mt-float { position: absolute; font-size: 12px; color: var(--mt-color); opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  .mt-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* 进行中：五种样式 */
  [data-style="fill"][data-state="busy"] .mt-face,
  [data-style="shrink"][data-state="busy"] .mt-face { background: var(--tint); color: var(--mt-color); }
  [data-style="line"] .mt-fill, [data-style="ring"] .mt-fill { display: none; }
  [data-style="line"][data-state="busy"] .mt-line { opacity: 1; }
  [data-style="shrink"][data-state="busy"] .mt-face { clip-path: inset(calc(50% - 4px) 0 round 4px); }
  [data-style="shrink"] .mt-float { top: 0; left: calc(var(--p) * 100%); translate: -50% 0; }
  [data-style="ring"][data-state="busy"] .mt-face { clip-path: inset(0 calc(50% - 26px) round 26px); background: #fff; }
  [data-style="ring"] .mt-float { top: 50%; left: 50%; translate: -50% -50%; }
  [data-style="shrink"][data-state="busy"] .mt-text, [data-style="ring"][data-state="busy"] .mt-text { opacity: 0; }
  [data-style="shrink"][data-state="busy"] .mt-float { opacity: 1; }
  [data-style="ring"][data-state="busy"] .mt-ring, [data-style="ring"][data-state="busy"] .mt-float { opacity: 1; transition-delay: 0.3s; }
  [data-style="flip"] .mt-back { display: grid; }
  [data-style="flip"][data-state="busy"] .mt-flip { transform: rotateX(180deg); }

  /* 用户开启「减少动态效果」时：形变和翻面直接切换，失败不抖动；进度本身照常显示 */
  @media (prefers-reduced-motion: reduce) {
    .mt-flip, .mt-face, .mt-text, .mt-line, .mt-ring, .mt-float, .mt-fill { transition: none; }
    .mt-btn[data-state="err"] { animation: none; }
  }
</style>
</head>
<body>
<button class="mt-btn" id="mtBtn" type="button" data-style="fill" data-state="idle">
  <span class="mt-flip">
    <span class="mt-face">
      <span class="mt-text">
        <!-- IconPark: upload -->
        <svg class="i-idle" viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M6 24.0083V42H42V24" stroke="currentColor" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/><path d="M33 15L24 6L15 15" stroke="currentColor" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/><path d="M23.9917 32V6" stroke="currentColor" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/></svg>
        <!-- IconPark: check -->
        <svg class="i-ok" viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M43 11L16.875 37L5 25.1818" stroke="currentColor" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/></svg>
        <!-- IconPark: close -->
        <svg class="i-err" viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M8 8L40 40" stroke="currentColor" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/><path d="M8 40L40 8" stroke="currentColor" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/></svg>
        <b></b>
      </span>
      <span class="mt-fill" aria-hidden="true"></span>
      <span class="mt-line" aria-hidden="true"></span>
    </span>
    <span class="mt-back" aria-hidden="true"><b class="mt-pct"></b><span class="mt-fill"><b class="mt-pct"></b></span></span>
  </span>
  <svg class="mt-ring" viewBox="0 0 52 52" aria-hidden="true"><circle class="mt-trk" cx="26" cy="26" r="23"/><circle class="mt-arc" cx="26" cy="26" r="23" pathLength="100"/></svg>
  <b class="mt-float mt-pct" aria-hidden="true"></b>
</button>
<span class="mt-sr" id="mtLive" aria-live="polite"></span>
<script>
  const CONFIG = {
    style: 'fill',       // 样式：fill 底色填充 / line 底部细线 / shrink 收成细条 / ring 缩成圆环 / flip 翻面
    duration: 3,         // 进度时长（秒）：从 0 走到 100% 大约多久
    bursty: true,        // 断续推进：一阵快一阵停，像真实的网络请求；关掉则匀速
    result: 'alternate', // 结果：success 总是成功 / error 总是失败 / alternate 成败交替
    hold: 1.6,           // 结果停留（秒）：「已完成 / 出错了」显示多久后变回按钮
    label: '上传文件',    // 按钮文字
  };
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const STYLES = ['fill', 'line', 'shrink', 'ring', 'flip'];
  const STYLE = STYLES.includes(CONFIG.style) ? CONFIG.style : 'fill';
  const MORPH = reduceMotion || STYLE === 'fill' || STYLE === 'line' ? 0 : 350;   // 先等变形完成再开始走（毫秒）
  const STALL = 350, SETTLE = 250;   // 失败前在断点停多久 / 走满后多久亮出结果（毫秒）
  const TEXT = { idle: CONFIG.label || '开始', ok: '已完成', err: '出错了' };

  const btn = document.getElementById('mtBtn'), live = document.getElementById('mtLive');
  btn.dataset.style = STYLE;
  const faceText = btn.querySelector('.mt-face .mt-text');
  btn.querySelector('.mt-face .mt-fill').appendChild(faceText.cloneNode(true));
  const labels = [...btn.querySelectorAll('.mt-text b')];
  const pcts = [...btn.querySelectorAll('.mt-pct')];

  let state = 'idle', p = 0, runs = 0, plan = null, t0 = 0, failAt = 2, userTook = false;
  function setState(s) {
    state = s;
    btn.dataset.state = s;
    if (s !== 'busy') labels.forEach((b) => { b.textContent = TEXT[s]; });
    if (s === 'ok' || s === 'err') live.textContent = TEXT[s];
  }
  function render() {
    btn.style.setProperty('--p', p.toFixed(4));
    const pct = Math.floor(p * 100) + '%';
    if (state === 'busy') labels.forEach((b) => { b.textContent = '处理中 ' + pct; });
    pcts.forEach((b) => { b.textContent = pct; });
  }

  // 进度路线：均分成 4–6 段，每段先停一会儿再冲一阵，每阵的量随机；不断续时匀速
  function makePlan() {
    const T = Math.max(0.3, CONFIG.duration);
    if (!CONFIG.bursty) return [[0, 0], [T, 1]];
    const n = 4 + Math.floor(Math.random() * 3);
    const w = Array.from({ length: n }, () => 0.4 + Math.random());
    const sum = w.reduce((a, b) => a + b, 0);
    const keys = [[0, 0]];
    let q = 0;
    for (let i = 0; i < n; i++) {
      const a = (T * i) / n, b = (T * (i + 1)) / n;
      keys.push([a + (b - a) * (0.15 + Math.random() * 0.45), q]);
      q = i === n - 1 ? 1 : q + w[i] / sum;
      keys.push([b, q]);
    }
    return keys;
  }
  const easeInOut = (k) => (k < 0.5 ? 4 * k * k * k : 1 - (-2 * k + 2) ** 3 / 2);
  function progressAt(t) {
    for (let i = 1; i < plan.length; i++) {
      const [a, q0] = plan[i - 1], [b, q1] = plan[i];
      if (t <= b) {
        const k = (t - a) / Math.max(1e-6, b - a);
        return q0 + (q1 - q0) * (CONFIG.bursty ? easeInOut(k) : k);
      }
    }
    return 1;
  }

  function start() {
    if (state !== 'idle') return;
    const fail = CONFIG.result === 'error' || (CONFIG.result === 'alternate' && runs % 2 === 1);
    runs++;
    failAt = fail ? 0.55 + Math.random() * 0.3 : 2;
    plan = makePlan();
    p = 0;
    setState('busy');
    render();
    t0 = performance.now() + MORPH;
    requestAnimationFrame(tick);
  }
  function tick(now) {
    if (state !== 'busy') return;
    const q = progressAt(Math.max(0, (now - t0) / 1000));
    if (q >= failAt) { p = failAt; render(); setTimeout(() => finish('err'), STALL); return; }
    p = q;
    render();
    if (q >= 1) { setTimeout(() => finish('ok'), SETTLE); return; }
    requestAnimationFrame(tick);
  }
  function finish(s) {
    setState(s);
    setTimeout(() => { p = 0; render(); setState('idle'); }, Math.max(0.2, CONFIG.hold) * 1000);
  }

  btn.addEventListener('click', () => { userTook = true; start(); });
  setState('idle');
  render();

  /* @mt:thumb-start */
  // 缩略图演示：空闲时自己点一下，成败交替循环；用户一碰就交还
  if (window.__MT_ENV && window.__MT_ENV.thumb && !reduceMotion) {
    setInterval(() => { if (!userTook && !document.hidden && state === 'idle') start(); }, 800);
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
