<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片分段浮起</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-color: #f2f3f8;     /* 文字颜色 */
    --mt-duration: 1.2s;     /* 浮起时长 */
    --mt-shadow: 0.5;        /* 阴影浓度 */
    --mt-font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; /* 字体 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; font-family: var(--mt-font); color: var(--mt-color); }

  /* 舞台：整张背景图 + 若干「碎片」——每片都是同一张图的全尺寸副本，用 clip-path 只留自己那块矩形，所以纹理与底图严丝合缝 */
  .mt-stage { position: fixed; inset: 0; perspective: 1000px; }
  .mt-bgimg { position: absolute; inset: 0; background: var(--img) center / cover no-repeat; }
  .mt-pieces { position: absolute; inset: 0; transform-style: preserve-3d; }
  .mt-piece { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform var(--mt-duration) cubic-bezier(0.2, 0.8, 0.2, 1); transition-delay: var(--d); transform: translate3d(var(--px, 0px), var(--py, 0px), 0); }
  .mt-piece .img { position: absolute; inset: 0; background: var(--img) center / cover no-repeat; clip-path: polygon(var(--l) var(--t), var(--r) var(--t), var(--r) var(--b), var(--l) var(--b)); }
  .mt-piece .shadow { position: absolute; left: var(--l); top: var(--t); width: calc(var(--r) - var(--l)); height: calc(var(--b) - var(--t)); box-shadow: 0 30px 60px rgba(0, 0, 0, var(--mt-shadow)); opacity: 0; transition: opacity var(--mt-duration); transition-delay: var(--d); transform: translateZ(-1px); }
  .mt-stage.up .mt-piece { transform: translate3d(var(--px, 0px), var(--py, 0px), var(--z)); }
  .mt-stage.up .mt-piece .shadow { opacity: 1; }
  .mt-title { position: fixed; left: 6vw; bottom: 8vh; margin: 0; font-size: clamp(28px, 4vw, 56px); font-weight: 300; letter-spacing: -0.02em; text-shadow: 0 2px 20px rgba(0, 0, 0, 0.6); pointer-events: none; }
  .mt-title small { display: block; font-size: 0.32em; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.7; margin-bottom: 8px; }
  @media (prefers-reduced-motion: reduce) { .mt-piece, .mt-piece .shadow { transition: none; } }
</style>
</head>
<body>
<div class="mt-stage" id="mtStage"><div class="mt-bgimg" id="mtBg"></div><div class="mt-pieces" id="mtPieces"></div></div>
<h1 class="mt-title" id="mtTitle"><small>悬停任意处</small><span></span></h1>
<script>
  const CONFIG = {
    photo: "/samples/sample-6.webp",  // 背景图
    title: "把一张图切开，让它们浮起来",   // 标题
    layout: "preset",    // 碎片布局：preset 预设四块 / random 随机 / strips 横向条带 / grid 田字格
    pieces: 4,           // 碎片数量（随机 / 条带布局时生效）
    lift: 65,            // 最大浮起高度（px）
    parallax: 30,        // 鼠标视差幅度（px）
    stagger: 60,         // 相邻碎片的错开（毫秒）
  };
  const stage = document.getElementById('mtStage'), pieces = document.getElementById('mtPieces');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.getElementById('mtBg').style.setProperty('--img', `url("${CONFIG.photo}")`); pieces.style.setProperty('--img', `url("${CONFIG.photo}")`);
  document.querySelector('#mtTitle span').textContent = CONFIG.title;
  const rnd = (a, b) => a + Math.random() * (b - a);
  // 碎片矩形（百分比）：预设四块来自源效果的经典构图；其他布局按规则生成
  function rects() {
    if (CONFIG.layout === 'random') return Array.from({ length: CONFIG.pieces }, () => { const w = rnd(15, 45), h = rnd(15, 45); return { l: rnd(0, 100 - w), t: rnd(0, 100 - h), w, h }; });
    if (CONFIG.layout === 'strips') { const n = Math.max(2, CONFIG.pieces), h = 100 / n; return Array.from({ length: n }, (_, i) => ({ l: rnd(0, 30), t: i * h + 2, w: rnd(50, 70), h: h - 4 })); }
    if (CONFIG.layout === 'grid') { const out = []; for (let r = 0; r < 2; r++) for (let c = 0; c < 2; c++) out.push({ l: c * 50 + 6, t: r * 50 + 8, w: 38, h: 34 }); return out; }
    return [{ t: 80, l: 10, w: 30, h: 20 }, { t: 2, l: 2, w: 40, h: 40 }, { t: 30, l: 60, w: 30, h: 60 }, { t: 10, l: 20, w: 50, h: 60 }];
  }
  const list = rects();
  // 浮起高度按序递增排序（后建的片在上面、浮得更高），并给每片一个视差深度
  const lifts = list.map(() => rnd(CONFIG.lift * 0.15, CONFIG.lift)).sort((a, b) => a - b);
  const els = list.map((r, i) => {
    const p = document.createElement('div'); p.className = 'mt-piece';
    p.style.setProperty('--l', r.l + '%'); p.style.setProperty('--t', r.t + '%'); p.style.setProperty('--r', (r.l + r.w) + '%'); p.style.setProperty('--b', (r.t + r.h) + '%');
    p.style.setProperty('--z', lifts[i] + 'px'); p.style.setProperty('--d', ((list.length - 1 - i) * CONFIG.stagger) + 'ms');
    p.innerHTML = '<div class="shadow"></div><div class="img"></div>'; pieces.appendChild(p);
    return { p, depth: 0.3 + 0.7 * (lifts[i] / CONFIG.lift) };
  });
  let userTook = false;
  stage.addEventListener('pointerenter', () => { userTook = true; stage.classList.add('up'); });
  stage.addEventListener('pointerleave', () => stage.classList.remove('up'));
  // 视差：每片按自己的深度跟随鼠标偏移，浮得越高偏得越多
  const mouse = { x: 0, y: 0 }, cur = { x: 0, y: 0 };
  addEventListener('pointermove', (e) => { mouse.x = (e.clientX / innerWidth - 0.5) * 2; mouse.y = (e.clientY / innerHeight - 0.5) * 2; });
  (function tick() {
    requestAnimationFrame(tick); if (document.hidden || reduceMotion) return;
    cur.x += (mouse.x - cur.x) * 0.08; cur.y += (mouse.y - cur.y) * 0.08;
    els.forEach(({ p, depth }) => { p.style.setProperty('--px', (cur.x * CONFIG.parallax * depth).toFixed(1) + 'px'); p.style.setProperty('--py', (cur.y * CONFIG.parallax * depth).toFixed(1) + 'px'); });
  })();

  /* @mt:thumb-start */
  // 缩略图演示：没有鼠标时定期浮起、落下，并轻轻晃动视差
  if (!reduceMotion) { let t = 0; setInterval(() => { if (userTook || document.hidden) return; stage.classList.toggle('up'); }, 2600); (function sway() { requestAnimationFrame(sway); if (userTook || document.hidden) return; t += 0.01; mouse.x = Math.sin(t) * 0.6; mouse.y = Math.cos(t * 0.7) * 0.4; })(); }
  /* @mt:thumb-end */
</script>
</body>
</html>
