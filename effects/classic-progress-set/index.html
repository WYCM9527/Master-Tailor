<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>经典进度条合集</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-color: #3b82f6;         /* 主色 */
    --mt-track: #e5e7eb;         /* 轨道色 */
    --mt-height: 14px;           /* 高度 */
    --mt-radius: 7px;            /* 圆角 */
    --mt-bg: #ecebe7;            /* 页面底色 */
    --mt-font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; /* 字体 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; display: grid; place-items: center; font-family: var(--mt-font); color: #1f2328; -webkit-tap-highlight-color: transparent; }
  .mt-card { --p: 0; --spd: 1; --cells: 0; width: min(600px, 92vw); box-sizing: border-box; padding: 24px 28px 28px; border-radius: 18px; background: #fff; box-shadow: 0 20px 50px -24px rgba(40, 40, 30, 0.35), 0 0 0 1px rgba(0, 0, 0, 0.04); }
  .mt-head { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .mt-head b { flex: 1; font-size: 16px; font-weight: 600; }
  .mt-pct { font-size: 14px; font-weight: 600; color: #6b7280; font-variant-numeric: tabular-nums; }
  .mt-replay { width: 30px; height: 30px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 8px; background: none; color: #6b7280; cursor: pointer; }
  .mt-replay:hover { background: #f1f2f4; color: #1f2328; }
  .mt-replay:focus-visible { outline: 2px solid var(--mt-color); outline-offset: 1px; }
  .mt-replay svg { width: 16px; height: 16px; }
  .mt-rows { display: grid; gap: 16px; }
  .mt-row { display: grid; grid-template-columns: 76px 1fr; align-items: center; gap: 14px; }
  .mt-nm { font-size: 13px; color: #6b7280; white-space: nowrap; }
  .only .mt-row { grid-template-columns: 1fr; }
  .only .mt-nm { display: none; }

  .mt-bar { --in: clamp(1px, calc(var(--mt-height) * 0.2), 3px); position: relative; height: var(--mt-height); border-radius: var(--mt-radius); background: var(--mt-track); overflow: hidden; }
  .mt-fill { position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--p) * 100%); border-radius: inherit; background: var(--mt-color); }

  /* 斜纹流动：45° 浅色斜纹往前流 */
  .s-stripes .mt-fill { background-image: linear-gradient(45deg, rgba(255, 255, 255, 0.22) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.22) 50%, rgba(255, 255, 255, 0.22) 75%, transparent 75%); background-size: 20px 20px; animation: mt-stripes calc(1s / var(--spd)) linear infinite; }
  @keyframes mt-stripes { from { background-position: 0 0; } to { background-position: 20px 0; } }

  /* 跑马灯：白底细框里三个带高光的小方块从左跑到右，循环 */
  .s-marquee { background: #fff; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--mt-track) 70%, #000 18%); }
  .mt-run { position: absolute; inset: 0; animation: mt-run calc(2.2s / var(--spd)) linear infinite; }
  .mt-run i { position: absolute; top: var(--in); bottom: var(--in); width: calc(var(--mt-height) * 0.7); border-radius: 2px; background: linear-gradient(to bottom, color-mix(in srgb, var(--mt-color) 50%, #fff), var(--mt-color) 50%, color-mix(in srgb, var(--mt-color) 82%, #000)); }
  .mt-run i:nth-child(1) { right: calc(100% + 3px); }
  .mt-run i:nth-child(2) { right: calc(100% + 5px + var(--mt-height) * 0.7); }
  .mt-run i:nth-child(3) { right: calc(100% + 7px + var(--mt-height) * 1.4); }
  @keyframes mt-run { from { transform: translateX(0); } to { transform: translateX(calc(100% + 9px + var(--mt-height) * 2.1)); } }

  /* 分格点亮：白底细框，进度按整格亮起，下一格一闪一闪 */
  .s-segments { background: #fff; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--mt-track) 70%, #000 18%); }
  .s-segments .mt-fill { left: var(--in); top: var(--in); bottom: var(--in); width: calc(var(--cells) * 12px); border-radius: 1px; background: repeating-linear-gradient(90deg, var(--mt-color) 0 10px, transparent 10px 12px); }
  .s-segments .mt-fill::after { content: ""; position: absolute; left: 100%; top: 0; bottom: 0; width: 10px; background: var(--mt-color); animation: mt-blink calc(0.8s / var(--spd)) step-end infinite; }
  .full .s-segments .mt-fill::after { display: none; }
  @keyframes mt-blink { 0% { opacity: 0.85; } 50% { opacity: 0; } }

  /* 光泽胶囊：内凹的胶囊轨道，填充上半截有一层玻璃高光，底下斜纹缓缓流动 */
  .s-aqua { border-radius: calc(var(--mt-height) / 2); box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.22); }
  .s-aqua .mt-fill { border-radius: calc(var(--mt-height) / 2); background-image: linear-gradient(to bottom, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.15) 50%, rgba(0, 0, 0, 0.06) 51%, rgba(255, 255, 255, 0.3)), repeating-linear-gradient(-45deg, var(--mt-color) 0 8px, color-mix(in srgb, var(--mt-color) 72%, #fff) 8px 16px); background-size: 100% 100%, 22.627px 100%; box-shadow: inset 0 -1px 2px rgba(0, 0, 0, 0.18); animation: mt-aqua calc(1.6s / var(--spd)) linear infinite; }
  @keyframes mt-aqua { from { background-position: 0 0, 0 0; } to { background-position: 0 0, 22.627px 0; } }

  /* 不定进度：两段进度一前一后从左扫到右，前一段慢、后一段快 */
  .s-indet i { position: absolute; top: 0; bottom: 0; border-radius: inherit; background: var(--mt-color); }
  .s-indet .a { animation: mt-indet-a calc(2.1s / var(--spd)) cubic-bezier(0.6, 0.8, 0.7, 0.4) infinite; }
  .s-indet .b { animation: mt-indet-b calc(2.1s / var(--spd)) cubic-bezier(0.2, 0.8, 0.4, 1) calc(1.15s / var(--spd)) infinite; left: -200%; right: 100%; }
  @keyframes mt-indet-a { 0% { left: -35%; right: 100%; } 60%, 100% { left: 100%; right: -90%; } }
  @keyframes mt-indet-b { 0% { left: -200%; right: 100%; } 60%, 100% { left: 107%; right: -8%; } }

  /* 光带扫过：实色填充上隔一阵扫过一道白光 */
  .s-sheen .mt-fill { overflow: hidden; }
  .s-sheen .mt-fill::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 40%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent); animation: mt-sheen calc(2s / var(--spd)) ease-in-out infinite; }
  @keyframes mt-sheen { 0% { transform: translateX(-100%); } 70%, 100% { transform: translateX(260%); } }

  .mt-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  @media (max-width: 480px) {
    .mt-card { padding: 20px; }
    .mt-row { grid-template-columns: 64px 1fr; gap: 10px; }
  }

  /* 用户开启「减少动态效果」时：斜纹、光泽、光带不再流动，跑马灯和不定进度停在中段，下一格不闪；重播直接到位 */
  @media (prefers-reduced-motion: reduce) {
    .mt-card *, .mt-card *::after { animation: none !important; }
    .s-segments .mt-fill::after { opacity: 0.35; }
    .mt-run { transform: translateX(calc(50% + 5px + var(--mt-height) * 1.05)); }
    .s-indet .a { left: 20%; right: 40%; }
    .s-indet .b { display: none; }
    .s-sheen .mt-fill::after { display: none; }
  }
</style>
</head>
<body>
<div class="mt-card" id="mtCard">
  <div class="mt-head">
    <b id="mtTitle"></b>
    <span class="mt-pct" id="mtPct">0%</span>
    <button class="mt-replay" id="mtReplay" type="button" aria-label="重播">
      <!-- IconPark: refresh -->
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M42 8V24" stroke="currentColor" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/><path d="M6 24L6 40" stroke="currentColor" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/><path d="M42 24C42 14.0589 33.9411 6 24 6C18.9145 6 14.3216 8.10896 11.0481 11.5M6 24C6 33.9411 14.0589 42 24 42C28.8556 42 33.2622 40.0774 36.5 36.9519" stroke="currentColor" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/></svg>
    </button>
  </div>
  <div class="mt-rows">
    <div class="mt-row" data-style="stripes"><span class="mt-nm">斜纹流动</span><div class="mt-bar s-stripes"><i class="mt-fill"></i></div></div>
    <div class="mt-row" data-style="marquee"><span class="mt-nm">跑马灯</span><div class="mt-bar s-marquee"><span class="mt-run"><i></i><i></i><i></i></span></div></div>
    <div class="mt-row" data-style="segments"><span class="mt-nm">分格点亮</span><div class="mt-bar s-segments"><i class="mt-fill"></i></div></div>
    <div class="mt-row" data-style="aqua"><span class="mt-nm">光泽胶囊</span><div class="mt-bar s-aqua"><i class="mt-fill"></i></div></div>
    <div class="mt-row" data-style="indeterminate"><span class="mt-nm">不定进度</span><div class="mt-bar s-indet"><i class="a"></i><i class="b"></i></div></div>
    <div class="mt-row" data-style="sheen"><span class="mt-nm">光带扫过</span><div class="mt-bar s-sheen"><i class="mt-fill"></i></div></div>
  </div>
</div>
<span class="mt-sr" id="mtLive" aria-live="polite"></span>
<script>
  const CONFIG = {
    style: 'all',          // 样式：all 全部 / stripes 斜纹流动 / marquee 跑马灯 / segments 分格点亮 / aqua 光泽胶囊 / indeterminate 不定进度 / sheen 光带扫过
    value: 66,             // 进度（%）：能显示具体进度的样式走到这里
    speed: 1,              // 速度（倍）：斜纹、跑马灯、闪烁、光带等动画的快慢，以及重播时走到进度的快慢
    label: '正在安装更新',  // 标题
  };
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const INDET = ['marquee', 'indeterminate'];
  const STYLES = ['stripes', 'marquee', 'segments', 'aqua', 'indeterminate', 'sheen'];
  const ONLY = STYLES.includes(CONFIG.style) ? CONFIG.style : null;
  const SPD = clamp(CONFIG.speed, 0.1, 5);
  const TARGET = clamp(CONFIG.value, 0, 100) / 100;

  const card = document.getElementById('mtCard'), pctEl = document.getElementById('mtPct'), live = document.getElementById('mtLive');
  document.getElementById('mtTitle').textContent = CONFIG.label || '正在处理';
  card.style.setProperty('--spd', SPD);
  if (ONLY) {
    card.classList.add('only');
    document.querySelectorAll('.mt-row').forEach((r) => { if (r.dataset.style !== ONLY) r.remove(); });
  }
  const indetOnly = ONLY && INDET.includes(ONLY);

  // 每根能显示进度的条都标成 progressbar；不定进度的两种不带数值
  document.querySelectorAll('.mt-row').forEach((r) => {
    const bar = r.querySelector('.mt-bar');
    bar.setAttribute('role', 'progressbar');
    bar.setAttribute('aria-label', r.querySelector('.mt-nm').textContent);
    if (!INDET.includes(r.dataset.style)) { bar.setAttribute('aria-valuemin', '0'); bar.setAttribute('aria-valuemax', '100'); }
  });
  const valued = [...document.querySelectorAll('.mt-bar[aria-valuemin]')];

  // 分格：轨道内能放下几格（每格 10px + 2px 间隔），进度按整格取
  const segBar = document.querySelector('.s-segments');
  let CELLS = 1;
  const measure = () => {
    if (!segBar) return;
    const inset = parseFloat(getComputedStyle(segBar.querySelector('.mt-fill')).left) || 0;
    CELLS = Math.max(1, Math.floor((segBar.clientWidth - inset * 2 + 2) / 12));
  };
  measure();

  let p = 0, raf = 0, userTook = false;
  function render() {
    card.style.setProperty('--p', p.toFixed(4));
    card.style.setProperty('--cells', Math.min(CELLS, Math.floor(p * CELLS + 1e-6)));
    card.classList.toggle('full', p >= 1);
    const n = Math.round(p * 100);
    pctEl.textContent = indetOnly ? '请稍候…' : n + '%';
    valued.forEach((b) => b.setAttribute('aria-valuenow', n));
  }
  // 重播：从 0 走到进度值，先快后慢，中途有两次短暂停顿
  function replay() {
    cancelAnimationFrame(raf);
    card.querySelectorAll('.mt-run, .s-indet i').forEach((el) => { el.style.animation = 'none'; el.getBoundingClientRect(); el.style.animation = ''; });
    if (reduceMotion) { p = TARGET; render(); return; }
    const T = 1800 / SPD, t0 = performance.now();
    const ease = (k) => {
      const q = k < 0.3 ? k / 0.3 * 0.42 : k < 0.4 ? 0.42 : k < 0.7 ? 0.42 + (k - 0.4) / 0.3 * 0.4 : k < 0.78 ? 0.82 : 0.82 + (1 - (1 - (k - 0.78) / 0.22) ** 2) * 0.18;
      return q;
    };
    const step = (now) => {
      const k = clamp((now - t0) / T, 0, 1);
      p = TARGET * ease(k);
      render();
      if (k < 1) raf = requestAnimationFrame(step);
      else { raf = 0; live.textContent = indetOnly ? '' : `已到 ${Math.round(TARGET * 100)}%`; }
    };
    raf = requestAnimationFrame(step);
  }
  document.getElementById('mtReplay').addEventListener('click', () => { userTook = true; replay(); });
  addEventListener('resize', () => { measure(); render(); });

  render();
  setTimeout(replay, reduceMotion ? 0 : 300);

  /* @mt:thumb-start */
  // 缩略图演示：隔一阵重播一次；用户一碰就交还
  if (window.__MT_ENV && window.__MT_ENV.thumb && !reduceMotion) {
    setInterval(() => { if (!userTook && !document.hidden) replay(); }, 4200);
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
