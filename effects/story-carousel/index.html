<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story 进度条轮播</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-accent: #ffffff;    /* 强调色：进度条填充 */
    --mt-rounded: 16px;      /* 容器圆角 */
  }

  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mt-bg);
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  /* 竖版全屏 story 容器 */
  .mt-story {
    position: relative;
    height: min(560px, 86vh);
    aspect-ratio: 9 / 16;
    border-radius: var(--mt-rounded);
    overflow: hidden;
    background: #000;
    outline: none;
    touch-action: pan-y;
    cursor: pointer;
    user-select: none;
  }
  .mt-story:focus-visible { outline: 2px solid var(--mt-accent); outline-offset: 4px; }

  .mt-item {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .mt-item.is-active { opacity: 1; z-index: 1; }
  .mt-item img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    -webkit-user-drag: none;
  }
  .mt-item .mt-caption {
    position: absolute;
    left: 16px; right: 16px; bottom: 18px;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
  }

  /* 顶部分段进度条：每张一段，当前段实时填充 */
  .mt-bars {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    z-index: 3;
    display: flex;
    gap: 4px;
  }
  .mt-bars .bar {
    flex: 1;
    height: 3px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.3);
    overflow: hidden;
  }
  .mt-bars .bar i {
    display: block;
    height: 100%;
    width: 0;
    background: var(--mt-accent);
  }

  /* 头像行：story 的身份标识 */
  .mt-head {
    position: absolute;
    top: 22px;
    left: 12px;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 8px;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
  }
  .mt-head .avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: conic-gradient(var(--mt-accent), #ff4d6d, #7c4dff, var(--mt-accent));
    display: grid;
    place-items: center;
    color: #111111;
    font-size: 13px;
    font-weight: 800;
  }

  /* 左右点按区的提示（悬停时淡淡显形） */
  .mt-story::after {
    content: '‹ 上一张　　按住暂停　　下一张 ›';
    position: absolute;
    left: 0; right: 0; bottom: 54px;
    text-align: center;
    color: rgba(255, 255, 255, 0.55);
    font-size: 11px;
    letter-spacing: 0.08em;
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
    z-index: 3;
  }
  .mt-story:hover::after { opacity: 1; }

  /* 用户开启「减少动态效果」：淡化瞬间完成（进度计时由 JS 处理，不受影响） */
  @media (prefers-reduced-motion: reduce) {
    .mt-item { transition: none; }
  }
</style>
</head>
<body>
<div class="mt-story" id="mtRoot"></div>
<script>
  const CONFIG = {
    slides: [{"src":"/samples/sample-1.webp","caption":"树枝上的午睡"},{"src":"/samples/sample-2.webp","caption":"退休的老爷车"},{"src":"/samples/sample-3.webp","caption":"金色的黄昏"},{"src":"/samples/sample-4.webp","caption":"山谷醒来"},{"src":"/samples/sample-5.webp","caption":"夹竹桃开了"}], // 故事列表
    perSlide: 4,      // 每张停留时长（秒）
    author: "裁缝大师", // 头像行的名字
  };

  (function () {
    const root = document.getElementById('mtRoot');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const slides = CONFIG.slides;
    const total = slides.length;
    let index = 0;
    let elapsed = 0;       // 当前段已播放毫秒
    let holding = false;   // 按住暂停
    let hoverPause = false;
    let rafId = null;
    let lastTs = null;

    root.setAttribute('role', 'region');
    root.setAttribute('aria-roledescription', 'carousel');
    root.setAttribute('aria-label', '故事轮播');
    root.setAttribute('tabindex', '0');

    const items = slides.map((s, i) => {
      const el = document.createElement('figure');
      el.className = 'mt-item' + (i === 0 ? ' is-active' : '');
      el.style.margin = '0';
      el.setAttribute('role', 'group');
      el.setAttribute('aria-roledescription', 'slide');
      el.setAttribute('aria-label', '第 ' + (i + 1) + ' 张，共 ' + total + ' 张');
      const img = document.createElement('img');
      img.src = s.src;
      img.alt = s.caption || '第 ' + (i + 1) + ' 张故事';
      img.loading = i === 0 ? 'eager' : 'lazy';
      el.appendChild(img);
      if (s.caption) {
        const cap = document.createElement('div');
        cap.className = 'mt-caption';
        cap.textContent = s.caption;
        el.appendChild(cap);
      }
      root.appendChild(el);
      return el;
    });

    // 分段进度条
    const bars = document.createElement('div');
    bars.className = 'mt-bars';
    bars.setAttribute('aria-hidden', 'true');
    const fills = slides.map(() => {
      const bar = document.createElement('div');
      bar.className = 'bar';
      const fill = document.createElement('i');
      bar.appendChild(fill);
      bars.appendChild(bar);
      return fill;
    });
    root.appendChild(bars);

    // 头像行
    const head = document.createElement('div');
    head.className = 'mt-head';
    const avatar = document.createElement('span');
    avatar.className = 'avatar';
    avatar.textContent = (CONFIG.author || '?').slice(0, 1);
    const name = document.createElement('span');
    name.textContent = CONFIG.author;
    head.appendChild(avatar);
    head.appendChild(name);
    root.appendChild(head);

    function paintBars() {
      for (let i = 0; i < total; i++) {
        fills[i].style.width = i < index ? '100%' : i > index ? '0' : (elapsed / (CONFIG.perSlide * 1000)) * 100 + '%';
      }
    }

    function goTo(next) {
      index = ((next % total) + total) % total;
      elapsed = 0;
      items.forEach((el, i) => el.classList.toggle('is-active', i === index));
      paintBars();
    }
    const nextStory = () => goTo(index + 1);
    const prevStory = () => goTo(index - 1);

    // 计时主循环（rAF）：按住 / 悬停 / 后台时不推进；
    // reduced-motion 下不自动前进，只能手动点按
    function tick(ts) {
      if (lastTs !== null && !holding && !hoverPause && !document.hidden && !reduceMotion) {
        elapsed += ts - lastTs;
        if (elapsed >= CONFIG.perSlide * 1000) nextStory();
        else paintBars();
      }
      lastTs = ts;
      rafId = requestAnimationFrame(tick);
    }
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { cancelAnimationFrame(rafId); rafId = null; lastTs = null; }
      else if (!rafId) rafId = requestAnimationFrame(tick);
    });
    rafId = requestAnimationFrame(tick);
    paintBars();

    root.addEventListener('mouseenter', () => (hoverPause = true));
    root.addEventListener('mouseleave', () => (hoverPause = false));
    root.addEventListener('focusin', () => (hoverPause = true));
    root.addEventListener('focusout', () => (hoverPause = false));

    // 点按交互（Pointer Events）：按住暂停；快速点按左 1/3 上一张、其余下一张
    let downTs = 0;
    root.addEventListener('pointerdown', (e) => {
      holding = true;
      downTs = performance.now();
      root.setPointerCapture(e.pointerId);
    });
    root.addEventListener('pointerup', (e) => {
      holding = false;
      // 按住超过 250ms 视为「暂停看图」，不翻页
      if (performance.now() - downTs > 250) return;
      const rect = root.getBoundingClientRect();
      if (e.clientX - rect.left < rect.width / 3) prevStory();
      else nextStory();
    });
    root.addEventListener('pointercancel', () => (holding = false));

    // 键盘
    root.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { e.preventDefault(); nextStory(); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); prevStory(); }
    });
  })();
</script>
</body>
</html>
