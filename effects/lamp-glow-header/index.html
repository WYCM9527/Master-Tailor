<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灯管标题</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-glow: #22d3ee;      /* 灯光颜色 */
    --mt-spread: 30rem;      /* 光锥展开宽度 */
    --mt-height: 14rem;      /* 光锥高度 */
    --mt-intensity: 1;       /* 光强 */
    --mt-color: #f2f3f8;     /* 标题颜色 */
    --mt-fontSize: 52px;     /* 标题字号 */
    --mt-font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; /* 字体 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; display: grid; place-items: center; font-family: var(--mt-font); }

  .mt-scene { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  /* 灯：一根很细、很亮的横线，是整个画面唯一的「硬光源」 */
  .mt-lamp { position: relative; width: min(var(--mt-spread), 90vw); height: var(--mt-height); display: flex; align-items: flex-end; justify-content: center; }
  .mt-tube {
    position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; height: 2px; border-radius: 2px;
    background: var(--mt-glow); box-shadow: 0 0 12px var(--mt-glow), 0 0 40px color-mix(in srgb, var(--mt-glow) 60%, transparent);
    opacity: var(--mt-intensity);
    animation: mt-turn-on 0.8s ease-out both;
  }
  /* 光锥：从灯管向上张开的三角形柔光，两侧对称；用 clip-path 裁三角、再整体模糊 */
  /* 模糊放在外层、裁切放在内层：先裁成三角再整体模糊，边缘才是软的（反过来会把模糊结果又裁出硬边） */
  .mt-cone { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; height: 100%; filter: blur(14px); opacity: var(--mt-intensity); }
  .mt-cone i {
    position: absolute; inset: 0; display: block;
    /* 光从灯管处最强、越远越淡：径向渐变以灯管中心为圆心，再裁成三角 */
    background: radial-gradient(ellipse 100% 130% at 50% 100%, color-mix(in srgb, var(--mt-glow) 42%, transparent), color-mix(in srgb, var(--mt-glow) 10%, transparent) 55%, transparent 80%);
    clip-path: polygon(50% 100%, -8% 0, 108% 0);
    animation: mt-open 0.8s ease-out both;
  }
  /* 灯下的一团晕光，把标题也照亮一点 */
  .mt-halo {
    position: absolute; left: 50%; bottom: -3rem; transform: translateX(-50%); width: 60%; height: 6rem; border-radius: 50%;
    background: var(--mt-glow); filter: blur(60px); opacity: calc(var(--mt-intensity) * 0.35);
  }
  /* 开灯：光锥从收拢到张开，灯管由暗变亮 */
  @keyframes mt-open { from { clip-path: polygon(50% 100%, 35% 0, 65% 0); opacity: 0.3; } to { clip-path: polygon(50% 100%, -8% 0, 108% 0); opacity: var(--mt-intensity); } }
  @keyframes mt-turn-on { from { width: 40%; opacity: 0.2; } to { width: 100%; opacity: var(--mt-intensity); } }

  .mt-title {
    position: relative; margin: 2.6rem 0 0; padding: 0 24px; text-align: center; text-wrap: balance;
    font-size: var(--mt-fontSize); font-weight: 700; letter-spacing: -0.03em; line-height: 1.15; color: var(--mt-color);
    animation: mt-rise 0.8s ease-out both 0.2s;
  }
  .mt-sub { margin: 14px 0 0; color: var(--mt-color); opacity: 0.55; font-size: 16px; animation: mt-rise 0.8s ease-out both 0.35s; }
  @keyframes mt-rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }

  /* 用户开启「减少动态效果」时：不播开灯动画 */
  @media (prefers-reduced-motion: reduce) {
    .mt-tube, .mt-cone i, .mt-title, .mt-sub { animation: none; }
  }
</style>
</head>
<body>
<div class="mt-scene">
  <div class="mt-lamp" aria-hidden="true"><div class="mt-cone"><i></i></div><div class="mt-tube"></div><div class="mt-halo"></div></div>
  <h1 class="mt-title" id="mtTitle"></h1>
  <p class="mt-sub" id="mtSub"></p>
</div>
<script>
  const CONFIG = {
    title: "把灯打开\n就能看清界面",   // 标题（\n 换行）
    sub: "一根灯管，一束光，一句标题",  // 副标题（留空则隐藏）
  };
  const title = document.getElementById('mtTitle'), sub = document.getElementById('mtSub');
  title.textContent = CONFIG.title.replace(/\\n/g, '\n'); title.style.whiteSpace = 'pre-line';
  sub.textContent = CONFIG.sub; if (!CONFIG.sub) sub.hidden = true;
</script>
</body>
</html>
