<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灯管标题</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-glow: #22d3ee;      /* 灯光颜色 */
    --mt-spread: 30rem;      /* 灯管长度（光锥随之展开） */
    --mt-height: 14rem;      /* 光锥向下照亮的高度 */
    --mt-intensity: 1;       /* 光强 */
    --mt-color: #e2e8f0;     /* 标题颜色（渐变的亮端） */
    --mt-fontSize: 56px;     /* 标题字号 */
    --mt-font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; /* 字体 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; display: grid; place-items: center; font-family: var(--mt-font); }

  /* 布局：灯管在画面偏上，光向下照，标题就坐在光里 */
  .mt-scene { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 6vh; box-sizing: border-box; }
  .mt-lamp { position: relative; width: min(var(--mt-spread), 90vw); height: var(--mt-height); }
  /* 灯管：整个画面唯一的硬光源——细、亮、带两层光晕 */
  .mt-tube {
    position: absolute; left: 50%; top: 0; transform: translateX(-50%); width: 100%; height: 2px; border-radius: 2px;
    background: color-mix(in srgb, var(--mt-glow) 85%, #fff); opacity: var(--mt-intensity);
    box-shadow: 0 0 6px var(--mt-glow), 0 0 18px var(--mt-glow), 0 0 48px color-mix(in srgb, var(--mt-glow) 55%, transparent);
    animation: mt-turn-on 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }
  /* 向下的光锥：紧贴灯管处最亮、与灯管同宽，向下略张开并迅速变淡。
     裁成倒梯形再整体大模糊，边缘是软的、又保留「一束光」的方向感 */
  .mt-cone { position: absolute; left: 50%; top: 0; transform: translateX(-50%); width: 100%; height: 100%; filter: blur(30px); opacity: var(--mt-intensity); transform-origin: 50% 0; animation: mt-open 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  .mt-cone i {
    position: absolute; inset: 0; display: block;
    background: linear-gradient(to bottom, color-mix(in srgb, var(--mt-glow) 88%, #fff) 0%, color-mix(in srgb, var(--mt-glow) 55%, transparent) 18%, color-mix(in srgb, var(--mt-glow) 16%, transparent) 55%, transparent 100%);
    clip-path: polygon(0 0, 100% 0, 114% 100%, -14% 100%);
  }
  /* 灯下一大团散射的环境光，把标题区域整体染上一点颜色；灯上方也漏一点极淡的光 */
  .mt-halo { position: absolute; left: 50%; top: 10%; transform: translateX(-50%); width: 130%; height: 120%; border-radius: 50%; background: var(--mt-glow); filter: blur(90px); opacity: calc(var(--mt-intensity) * 0.28); animation: mt-fade 1s ease-out both; }
  .mt-up { position: absolute; left: 50%; top: -3rem; transform: translateX(-50%); width: 70%; height: 3rem; background: var(--mt-glow); filter: blur(40px); opacity: calc(var(--mt-intensity) * 0.12); animation: mt-fade 1s ease-out both; }
  /* 开灯：灯管从中间点亮拉长，光锥由窄张开，环境光淡入 */
  @keyframes mt-turn-on { from { width: 35%; opacity: 0.15; } to { width: 100%; opacity: var(--mt-intensity); } }
  @keyframes mt-open { from { transform: translateX(-50%) scaleX(0.35); opacity: 0.2; } to { transform: translateX(-50%) scaleX(1); opacity: var(--mt-intensity); } }
  @keyframes mt-fade { from { opacity: 0; } }

  /* 标题坐在光里：银灰渐变字（亮端为文字颜色，暗端向底色混），跟灯一起升起 */
  .mt-title {
    position: relative; margin: calc(var(--mt-height) * -0.25) 0 0; padding: 0 24px; text-align: center; text-wrap: balance;
    font-size: var(--mt-fontSize); font-weight: 600; letter-spacing: -0.03em; line-height: 1.12;
    background: linear-gradient(to bottom, var(--mt-color) 20%, color-mix(in srgb, var(--mt-color) 55%, var(--mt-bg)) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: mt-rise 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both 0.15s;
  }
  .mt-sub { position: relative; margin: 16px 0 0; color: var(--mt-color); opacity: 0.5; font-size: 16px; animation: mt-rise 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both 0.3s; }
  @keyframes mt-rise { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }

  /* 用户开启「减少动态效果」时：不播开灯动画 */
  @media (prefers-reduced-motion: reduce) {
    .mt-tube, .mt-cone, .mt-halo, .mt-up, .mt-title, .mt-sub { animation: none; }
  }
</style>
</head>
<body>
<div class="mt-scene">
  <div class="mt-lamp" aria-hidden="true"><div class="mt-halo"></div><div class="mt-up"></div><div class="mt-cone"><i></i></div><div class="mt-tube"></div></div>
  <h1 class="mt-title" id="mtTitle"></h1>
  <p class="mt-sub" id="mtSub"></p>
</div>
<script>
  const CONFIG = {
    title: "把灯打开\n就能看清界面",   // 标题（\n 换行）
    sub: "一根灯管，一束光，一句标题",  // 副标题（留空则隐藏）
  };
  const title = document.getElementById('mtTitle'), sub = document.getElementById('mtSub');
  title.textContent = CONFIG.title.replace(/\\n/g, '\n'); title.style.whiteSpace = 'pre-line';
  sub.textContent = CONFIG.sub; if (!CONFIG.sub) sub.hidden = true;
</script>
</body>
</html>
