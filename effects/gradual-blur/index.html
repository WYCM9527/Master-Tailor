<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>边缘渐进模糊</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
  }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mt-bg);
    display: grid; place-items: center;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #fff;
  }
  /* 舞台：一个固定高度、自身可滚动的容器，模糊层贴在它的边上 */
  .mt-stage {
    position: relative;
    width: min(720px, 90vw);
    height: min(520px, 84vh);
    overflow: hidden;
    border-radius: 16px;
    background: #0e0e14;
  }
  .mt-scroll {
    position: absolute; inset: 0;
    overflow-y: auto; overflow-x: hidden;
    padding: 100px 24px;
    box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; gap: 28px;
    scrollbar-width: none;
  }
  .mt-scroll::-webkit-scrollbar { display: none; }
  .mt-scroll.horizontal { flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 24px 100px; }
  .mt-item { flex: none; width: 100%; max-width: 520px; }
  .mt-scroll.horizontal .mt-item { width: 360px; }
  .mt-item img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 12px; }
  .mt-item figcaption { margin: 10px 4px 0; font-size: 14px; color: rgba(255,255,255,0.6); }
  /* 模糊层组：贴边、不挡交互；每一层由 JS 写入 mask 与 backdrop-filter */
  .mt-blur {
    position: absolute;
    pointer-events: none;
    isolation: isolate;
  }
  .mt-blur > div { position: absolute; inset: 0; }
  .mt-hint {
    position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    font-size: 12px; letter-spacing: 0.14em; color: rgba(255,255,255,0.35);
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="mt-stage" id="mtStage">
  <div class="mt-scroll" id="mtScroll"></div>
  <div class="mt-hint">在里面滚动</div>
</div>
<script>
  const CONFIG = {
    position: "bottom",   // 模糊位置：bottom / top / both / left / right
    strength: 2,          // 模糊强度
    size: 96,             // 模糊带宽度（px）
    divCount: 5,          // 分层数
    exponential: false,   // 指数递增
    curve: "linear",      // 过渡曲线
    opacity: 1,           // 模糊层不透明度
    slides: [{ src: '/samples/sample-1.webp', caption: '' }], // 内容图片
  };

  const stage = document.getElementById('mtStage');
  const scroller = document.getElementById('mtScroll');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const horizontal = CONFIG.position === 'left' || CONFIG.position === 'right';
  if (horizontal) scroller.classList.add('horizontal');

  // 内容：图片 + 说明，重复一遍保证有足够滚动距离
  const list = [...CONFIG.slides, ...CONFIG.slides];
  list.forEach(({ src, caption }) => {
    const fig = document.createElement('figure');
    fig.className = 'mt-item'; fig.style.margin = 0;
    const img = document.createElement('img'); img.src = src; img.alt = caption || '';
    fig.appendChild(img);
    if (caption) { const c = document.createElement('figcaption'); c.textContent = caption; fig.appendChild(c); }
    scroller.appendChild(fig);
  });

  const CURVES = {
    linear: p => p,
    bezier: p => p * p * (3 - 2 * p),
    'ease-in': p => p * p,
    'ease-out': p => 1 - Math.pow(1 - p, 2),
    'ease-in-out': p => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2),
  };
  const DIRECTION = { bottom: 'to top', top: 'to bottom', left: 'to right', right: 'to left' };

  /* 在某一侧建一组模糊层：第 i 层 mask 只覆盖第 i 段，blur 随 i 递增 → 整体呈渐进模糊 */
  function buildBlur(position) {
    const wrap = document.createElement('div');
    wrap.className = 'mt-blur';
    const isV = position === 'top' || position === 'bottom';
    Object.assign(wrap.style, isV
      ? { left: 0, right: 0, height: CONFIG.size + 'px', [position]: 0 }
      : { top: 0, bottom: 0, width: CONFIG.size + 'px', [position]: 0 });
    const n = CONFIG.divCount, inc = 100 / n;
    const curve = CURVES[CONFIG.curve] || CURVES.linear;
    for (let i = 1; i <= n; i++) {
      const progress = curve(i / n);
      // 模糊量：线性按层数递增，或 2^(4·progress) 指数递增；单位 rem（16px 基准）
      const blur = CONFIG.exponential
        ? Math.pow(2, progress * 4) * 0.0625 * CONFIG.strength
        : 0.0625 * (progress * n + 1) * CONFIG.strength;
      const p1 = (inc * i - inc).toFixed(1), p2 = (inc * i).toFixed(1), p3 = inc * i + inc, p4 = inc * i + inc * 2;
      let grad = `transparent ${p1}%, black ${p2}%`;
      if (p3 <= 100) grad += `, black ${p3.toFixed(1)}%`;
      if (p4 <= 100) grad += `, transparent ${p4.toFixed(1)}%`;
      const layer = document.createElement('div');
      const mask = `linear-gradient(${DIRECTION[position]}, ${grad})`;
      layer.style.maskImage = mask; layer.style.webkitMaskImage = mask;
      layer.style.backdropFilter = `blur(${blur.toFixed(3)}rem)`;
      layer.style.webkitBackdropFilter = `blur(${blur.toFixed(3)}rem)`;
      layer.style.opacity = CONFIG.opacity;
      wrap.appendChild(layer);
    }
    stage.appendChild(wrap);
  }
  if (CONFIG.position === 'both') { buildBlur('top'); buildBlur('bottom'); }
  else buildBlur(CONFIG.position);

  /* @mt:thumb-start */
  // 缩略图演示：自动缓慢往返滚动，用户一碰就停
  if (!reduceMotion) {
    let userTook = false, dir = 1;
    for (const ev of ['wheel', 'pointerdown', 'touchstart', 'keydown']) scroller.addEventListener(ev, () => (userTook = true), { passive: true, once: true });
    (function auto() {
      if (userTook) return;
      if (!document.hidden) {
        const key = horizontal ? 'scrollLeft' : 'scrollTop';
        const max = horizontal ? scroller.scrollWidth - scroller.clientWidth : scroller.scrollHeight - scroller.clientHeight;
        scroller[key] += dir * 1.2;
        if (scroller[key] >= max - 1) dir = -1;
        if (scroller[key] <= 1) dir = 1;
      }
      requestAnimationFrame(auto);
    })();
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
