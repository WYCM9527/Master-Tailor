<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔法光环</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色（光环以外透出它） */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; cursor: crosshair; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* 用户开启「减少动态效果」时：JS 停止时间推进，光环定格 */
</style>
</head>
<body>
<canvas id="mtCanvas" aria-hidden="true"></canvas>
<script>
  const CONFIG = {
    color: "#7cff67",       // 内环颜色
    colorTwo: "#42fcff",    // 外环颜色
    speed: 1,               // 扩散速度
    ringCount: 6,           // 环数
    attenuation: 10,        // 辉光收拢
    lineThickness: 2,       // 线宽
    baseRadius: 0.35,       // 起始半径
    radiusStep: 0.1,        // 环间距
    followMouse: false,     // 跟随鼠标
    clickBurst: true,       // 点击爆发
  };
  // 固定参数：环随生命周期放大的量、每环缺口指数、进/出场时长、噪点、鼠标偏移、悬停放大、视差
  const SCALE_RATE = 0.1, RING_GAP = 1.5, FADE_IN = 0.7, FADE_OUT = 0.5, NOISE = 0.1, MOUSE_INFLUENCE = 0.2, HOVER_SCALE = 1.2, PARALLAX = 0.05;

  const canvas = document.getElementById('mtCanvas');
  const gl = canvas.getContext('webgl', { antialias: false, alpha: true, premultipliedAlpha: false });
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const VS = `
    attribute vec2 aPos;
    void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
  `;
  // 片元：每个环有自己的生命周期（3.45s 循环，错相 2.95i）：出生时半径为基准值、随时间略放大并淡入淡出；
  // 环的亮度是到环线距离的指数衰减 + 一圈细亮线；角度项让每环有一个逐环加大的「缺口」；
  // 颜色从内环色到外环色插值，加噪点，alpha 取最大通道
  const FS = `
    precision highp float;
    uniform float uTime, uAtten, uThick, uBaseR, uStep, uScaleRate, uNoise, uFadeIn, uFadeOut, uGap;
    uniform float uMouseK, uHover, uHoverScale, uParallax, uBurst;
    uniform vec2  uRes, uMouse;
    uniform vec3  uColor, uColorTwo;
    uniform int   uCount;
    const float HP = 1.5707963, CYCLE = 3.45;

    float fade(float t) { return t < uFadeIn ? smoothstep(0.0, uFadeIn, t) : 1.0 - smoothstep(uFadeOut, CYCLE - 0.2, t); }
    float ring(vec2 p, float ri, float cut, float t0, float px) {
      float t = mod(uTime + t0, CYCLE);
      float r = ri + t / CYCLE * uScaleRate;
      float d = abs(length(p) - r);
      float a = atan(abs(p.y), abs(p.x)) / HP;                  // 0（水平）→ 1（竖直）
      float th = max(1.0 - a, 0.5) * px * uThick;
      float h = (1.0 - smoothstep(th, th * 1.5, d)) + 1.0;      // 细亮线
      d += pow(cut * a, 3.0) * r;                                // 缺口：竖直方向被推远
      return h * exp(-uAtten * d) * fade(t);
    }
    void main() {
      float px = 1.0 / min(uRes.x, uRes.y);
      vec2 p = (gl_FragCoord.xy - 0.5 * uRes) * px;
      p -= uMouse * uMouseK;
      p /= mix(1.0, uHoverScale, uHover) + uBurst * 0.3;
      vec3 c = vec3(0.0);
      float rcf = max(float(uCount) - 1.0, 1.0);
      for (int i = 0; i < 10; i++) {
        if (i >= uCount) break;
        float fi = float(i);
        vec2 pr = p - fi * uParallax * uMouse;
        vec3 rc = mix(uColor, uColorTwo, fi / rcf);
        c = mix(c, rc, vec3(ring(pr, uBaseR + fi * uStep, pow(uGap, fi), i == 0 ? 0.0 : 2.95 * fi, px)));
      }
      c *= 1.0 + uBurst * 2.0;
      float n = fract(sin(dot(gl_FragCoord.xy + uTime * 100.0, vec2(12.9898, 78.233))) * 43758.5453);
      c += (n - 0.5) * uNoise;
      gl_FragColor = vec4(c, max(c.r, max(c.g, c.b)));
    }
  `;

  // ---- WebGL 底座 ----
  function compile(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  const U = (n) => gl.getUniformLocation(prog, n);
  const hexRgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);

  const dpr = Math.min(2, devicePixelRatio || 1);
  function resize() {
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(U('uRes'), canvas.width, canvas.height);
  }
  resize(); addEventListener('resize', resize);
  gl.uniform1f(U('uAtten'), CONFIG.attenuation);
  gl.uniform1f(U('uThick'), CONFIG.lineThickness);
  gl.uniform1f(U('uBaseR'), CONFIG.baseRadius);
  gl.uniform1f(U('uStep'), CONFIG.radiusStep);
  gl.uniform1f(U('uScaleRate'), SCALE_RATE);
  gl.uniform1f(U('uNoise'), NOISE);
  gl.uniform1f(U('uFadeIn'), FADE_IN);
  gl.uniform1f(U('uFadeOut'), FADE_OUT);
  gl.uniform1f(U('uGap'), RING_GAP);
  gl.uniform1f(U('uMouseK'), CONFIG.followMouse ? MOUSE_INFLUENCE : 0);
  gl.uniform1f(U('uHoverScale'), HOVER_SCALE);
  gl.uniform1f(U('uParallax'), CONFIG.followMouse ? PARALLAX : 0);
  gl.uniform1i(U('uCount'), Math.max(1, Math.min(10, CONFIG.ringCount)));
  gl.uniform3fv(U('uColor'), hexRgb(CONFIG.color));
  gl.uniform3fv(U('uColorTwo'), hexRgb(CONFIG.colorTwo));
  const uTime = U('uTime'), uMouse = U('uMouse'), uHover = U('uHover'), uBurst = U('uBurst');

  // 鼠标：以中心为原点的 −0.5…0.5（8% 平滑）；悬停量 8% 趋近；点击爆发按 0.95 衰减
  const m = { x: 0, y: 0, sx: 0, sy: 0 };
  let hovered = false, hover = 0, burst = 0;
  addEventListener('pointermove', (e) => { m.x = e.clientX / innerWidth - 0.5; m.y = -(e.clientY / innerHeight - 0.5); hovered = true; });
  document.addEventListener('mouseleave', () => { m.x = 0; m.y = 0; hovered = false; });
  if (CONFIG.clickBurst) addEventListener('pointerdown', () => { burst = 1; });

  let time = reduceMotion ? 1 : 0, last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    if (document.hidden) { last = now; return; }
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!reduceMotion) time += dt * CONFIG.speed;
    m.sx += (m.x - m.sx) * 0.08; m.sy += (m.y - m.sy) * 0.08;
    hover += ((hovered ? 1 : 0) - hover) * 0.08;
    burst *= 0.95; if (burst < 0.001) burst = 0;
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(uTime, time);
    gl.uniform2f(uMouse, m.sx, m.sy);
    gl.uniform1f(uHover, hover);
    gl.uniform1f(uBurst, burst);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  gl.clearColor(0, 0, 0, 0);
  requestAnimationFrame(frame);
</script>
</body>
</html>
