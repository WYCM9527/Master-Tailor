<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>像素雪</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }

  /* 用户开启「减少动态效果」时：雪花静止（JS 同步处理） */
  @media (prefers-reduced-motion: reduce) {
    canvas { opacity: 0.85; }
  }
</style>
</head>
<body>
<canvas id="mtCanvas" aria-hidden="true"></canvas>
<script>
  const CONFIG = {
    cell: 6,           // 像素大小（px）
    density: 160,      // 雪量（同屏雪花数）
    speed: 1,          // 下落速度倍率
    wind: 0.4,         // 风（负左正右）
    pile: true,        // 底部积雪
    color: "#ffffff",  // 雪的颜色
  };

  const canvas = document.getElementById('mtCanvas');
  const ctx = canvas.getContext('2d');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let cols = 0, rows = 0, piles = [];
  function resize() {
    // 画布按像素格数取整，格子始终对齐
    cols = Math.ceil(innerWidth / CONFIG.cell); rows = Math.ceil(innerHeight / CONFIG.cell);
    canvas.width = cols; canvas.height = rows; // 1 画布像素 = 1 雪花像素，靠 CSS 放大
    piles = new Array(cols).fill(0); // 每列积雪高度（格）
  }
  resize(); addEventListener('resize', resize);

  // 雪花：格坐标 + 各自的下落速度与横向漂移相位；大小 1 或 2 格
  const flakes = Array.from({ length: CONFIG.density }, () => spawn(true));
  function spawn(anywhere) {
    return { x: Math.random() * cols, y: anywhere ? Math.random() * rows : -2, v: 4 + Math.random() * 8, ph: Math.random() * Math.PI * 2, s: Math.random() < 0.25 ? 2 : 1 };
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!document.hidden) {
      if (!reduceMotion) {
        for (let i = 0; i < flakes.length; i++) {
          const f = flakes[i];
          f.ph += dt * 2;
          f.y += f.v * CONFIG.speed * dt;
          f.x += (CONFIG.wind * 6 + Math.sin(f.ph) * 1.5) * dt;
          if (f.x < 0) f.x += cols; if (f.x >= cols) f.x -= cols;
          const col = Math.floor(f.x);
          const floor = rows - (CONFIG.pile ? piles[col] || 0 : 0);
          if (f.y >= floor - 1) {
            // 落地：堆一格积雪（有上限，避免堆满屏），然后从顶部重生
            if (CONFIG.pile && piles[col] < rows * 0.25) piles[col] += 0.6;
            flakes[i] = spawn(false);
          }
        }
      }
      ctx.clearRect(0, 0, cols, rows);
      ctx.fillStyle = CONFIG.color;
      for (const f of flakes) ctx.fillRect(Math.floor(f.x), Math.floor(f.y), f.s, f.s);
      if (CONFIG.pile) for (let c = 0; c < cols; c++) { const h = Math.floor(piles[c]); if (h > 0) ctx.fillRect(c, rows - h, 1, h); }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
