<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>丝绸流动</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色（canvas 覆盖前的兜底色） */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* 用户开启「减少动态效果」时：JS 停止时间推进，保留一帧静态缎面 */
  @media (prefers-reduced-motion: reduce) { canvas { opacity: 0.9; } }
</style>
</head>
<body>
<canvas id="mtCanvas" aria-hidden="true"></canvas>
<script>
  const CONFIG = {
    color: "#7b7481",  // 丝绸颜色
    speed: 5,          // 流速
    scale: 1,          // 纹理密度
    rotation: 0,       // 纹理角度（度）
    grain: 1.5,        // 颗粒强度
  };

  const canvas = document.getElementById('mtCanvas');
  const gl = canvas.getContext('webgl', { antialias: true });
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 顶点着色器：一个覆盖全屏的大三角形，把裁剪坐标换算成 0–1 的 uv
  const VS = `
    attribute vec2 aPos;
    varying vec2 vUv;
    void main() { vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }
  `;
  // 片元着色器：两组正弦相位叠加出缎面「光泽走向」，再减一层白噪声当织物颗粒
  const FS = `
    precision highp float;
    varying vec2 vUv;
    uniform float uTime;      // 累计时间（秒 × 0.1，慢速基准）
    uniform vec3  uColor;     // 丝绸主色
    uniform float uSpeed;     // 流速
    uniform float uScale;     // 纹理密度
    uniform float uRotation;  // 纹理角度（弧度）
    uniform float uGrain;     // 颗粒强度

    /* 廉价白噪声：正弦打散取小数（e 做无理数系数避免周期感） */
    float noise(vec2 p) {
      vec2 r = 2.71828182 * sin(2.71828182 * p);
      return fract(r.x * r.y * (1.0 + p.x));
    }
    /* 旋转 uv，让缎面纹理可以斜着铺 */
    vec2 rot(vec2 uv, float a) {
      float c = cos(a), s = sin(a);
      return mat2(c, -s, s, c) * uv;
    }

    void main() {
      float rnd = noise(gl_FragCoord.xy);            // 每像素固定颗粒
      vec2 uv = rot(vUv * uScale, uRotation);
      vec2 tex = uv * uScale;
      float t = uSpeed * uTime;                       // 流动相位
      tex.y += 0.03 * sin(8.0 * tex.x - t);           // 先给纬线一点横向起伏
      /* 主纹理：低频大褶皱（外层 sin）内嵌高频细缎纹（内层 sin），随时间错相流动 */
      float pattern = 0.6 + 0.4 * sin(
        5.0 * (tex.x + tex.y + cos(3.0 * tex.x + 5.0 * tex.y) + 0.02 * t)
        + sin(20.0 * (tex.x + tex.y - 0.1 * t))
      );
      vec3 col = uColor * pattern - rnd / 15.0 * uGrain;  // 颗粒做减法：暗点更像织物
      gl_FragColor = vec4(col, 1.0);
    }
  `;

  // ---- WebGL 底座：编译 → 链接 → 全屏三角形 ----
  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW); // 一个大三角覆盖全屏
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  const U = (n) => gl.getUniformLocation(prog, n); // uniform 定位小工具

  // hex 颜色转 0–1 RGB，交给 shader
  function hexRgb(hex) {
    const h = hex.replace('#', '');
    return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16) / 255);
  }

  const dpr = Math.min(2, devicePixelRatio || 1);
  function resize() {
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  resize(); addEventListener('resize', resize);

  // 固定 uniform：参数改动会重建页面，所以设一次即可
  gl.uniform3fv(U('uColor'), hexRgb(CONFIG.color));
  gl.uniform1f(U('uSpeed'), CONFIG.speed);
  gl.uniform1f(U('uScale'), CONFIG.scale);
  gl.uniform1f(U('uRotation'), (CONFIG.rotation * Math.PI) / 180);
  gl.uniform1f(U('uGrain'), CONFIG.grain);
  const uTime = U('uTime');

  // 时间用「秒 × 0.1」做慢速基准（speed 再在其上放大），减少动态时定格在一帧
  let time = reduceMotion ? 3 : 0;
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    if (document.hidden) { last = now; return; }        // 切后台暂停，回来不跳帧
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!reduceMotion) time += 0.1 * dt;
    gl.uniform1f(uTime, time);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
