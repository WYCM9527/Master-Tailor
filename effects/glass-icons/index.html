<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>玻璃图标</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;          /* 页面底色 */
    --mt-size: 16px;           /* 图标尺寸（基准字号） */
    --mt-textColor: #ffffff;   /* 文字颜色 */
  }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mt-bg);
    display: grid; place-items: center;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--mt-textColor);
  }
  /* 网格：所有尺寸用 em，基准字号即「图标尺寸」 */
  .mt-grid {
    display: grid;
    gap: 5em;
    padding: 3em;
    font-size: var(--mt-size);
  }
  .mt-icon {
    position: relative;
    width: 4.5em; height: 4.5em;
    background: transparent; border: 0; padding: 0; outline: none; cursor: pointer;
    perspective: 24em;
    transform-style: preserve-3d;
    -webkit-tap-highlight-color: transparent;
    color: inherit; font: inherit;
  }
  /* 彩色背卡：默认以右下角为轴转 15°，悬停转到 25° 并向左上后方退一点 */
  .mt-back {
    position: absolute; inset: 0;
    border-radius: 1.25em;
    transform-origin: 100% 100%;
    transform: rotate(15deg);
    box-shadow: 0.5em -0.5em 0.75em hsla(223, 10%, 10%, 0.15);
    transition: transform 0.3s cubic-bezier(0.83, 0, 0.17, 1);
  }
  /* 玻璃前板：半透白 + 背景模糊 + 内描边，悬停向你浮起 2em */
  .mt-front {
    position: absolute; inset: 0;
    border-radius: 1.25em;
    background: hsla(0, 0%, 100%, 0.15);
    backdrop-filter: blur(0.75em);
    -webkit-backdrop-filter: blur(0.75em);
    box-shadow: 0 0 0 0.1em hsla(0, 0%, 100%, 0.3) inset;
    transform-origin: 80% 50%;
    display: flex;
    transition: transform 0.3s cubic-bezier(0.83, 0, 0.17, 1);
  }
  .mt-front span {
    margin: auto;
    width: 1.5em; height: 1.5em;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.25em; line-height: 1;
  }
  /* 名称：默认藏在下方，悬停淡入并下移 20% */
  .mt-label {
    position: absolute; top: 100%; left: 0; right: 0;
    text-align: center; white-space: nowrap;
    line-height: 2; font-size: 1em;
    opacity: 0;
    transition: opacity 0.3s cubic-bezier(0.83, 0, 0.17, 1), transform 0.3s cubic-bezier(0.83, 0, 0.17, 1);
  }
  .mt-icon:hover .mt-back, .mt-icon.is-hover .mt-back { transform: rotate(25deg) translate3d(-0.5em, -0.5em, 0.5em); }
  .mt-icon:hover .mt-front, .mt-icon.is-hover .mt-front { transform: translateZ(2em); }
  .mt-icon:hover .mt-label, .mt-icon.is-hover .mt-label { opacity: 1; transform: translateY(20%); }

  /* 用户开启「减少动态效果」时：状态直接切换 */
  @media (prefers-reduced-motion: reduce) {
    .mt-back, .mt-front, .mt-label { transition: none; }
  }
</style>
</head>
<body>
<div class="mt-grid" id="mtGrid" role="list"></div>
<script>
  const CONFIG = {
    labels: "文件｜书籍｜收藏｜云端｜音乐｜设置",   // 图标名称
    icons: "▤｜▣｜♥｜☁｜♪｜⚙",                 // 图标符号
    colors: ["#1a6dff", "#a21aff", "#ff1a2e", "#3d1aff", "#ffa61a", "#0fcc1f"], // 卡片颜色
    columns: 3,          // 每行几个
    autoDemo: true,      // 自动轮流悬停
  };

  const grid = document.getElementById('mtGrid');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  grid.style.gridTemplateColumns = `repeat(${CONFIG.columns}, auto)`;

  // 卡片渐变：主色 → 同色略深，模拟源站「hsl 色相偏 15° 的双色渐变」质感
  function darken(hex, pct) {
    const n = parseInt(hex.replace('#', ''), 16);
    const f = (v) => Math.max(0, Math.min(255, Math.round(v * (1 - pct))));
    return `rgb(${f(n >> 16 & 255)}, ${f(n >> 8 & 255)}, ${f(n & 255)})`;
  }

  const labels = CONFIG.labels.split('｜').map(s => s.trim()).filter(Boolean);
  const icons = CONFIG.icons.split('｜').map(s => s.trim());
  const items = labels.map((label, i) => {
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'mt-icon'; btn.setAttribute('aria-label', label); btn.setAttribute('role', 'listitem');
    const color = CONFIG.colors[i % CONFIG.colors.length];
    btn.innerHTML = `<span class="mt-back"></span><span class="mt-front"><span aria-hidden="true"></span></span><span class="mt-label"></span>`;
    btn.querySelector('.mt-back').style.background = `linear-gradient(${color}, ${darken(color, 0.18)})`;
    btn.querySelector('.mt-front span').textContent = icons[i] || '✦';
    btn.querySelector('.mt-label').textContent = label;
    grid.appendChild(btn);
    return btn;
  });

  /* @mt:thumb-start */
  // 自动演示：逐个轮流「悬停」；真实鼠标进入网格后交还控制
  if (CONFIG.autoDemo && !reduceMotion) {
    let i = 0, auto = true;
    grid.addEventListener('pointerenter', () => { auto = false; items.forEach(b => b.classList.remove('is-hover')); });
    grid.addEventListener('pointerleave', () => { auto = true; });
    setInterval(() => {
      if (document.hidden || !auto) return;
      items.forEach(b => b.classList.remove('is-hover'));
      items[i % items.length].classList.add('is-hover');
      i++;
    }, 1100);
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
