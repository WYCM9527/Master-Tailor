<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文字坠落堆叠</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-color: #f2f3f8;     /* 文字颜色 */
    --mt-accent: #ffffff;    /* 强调词颜色（首尾两个词） */
    --mt-fontSize: 28px;     /* 字号 */
    --mt-font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; /* 字体 */
  }

  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; }

  /* 舞台：文字段落居中排布；掉落时每个词切换为绝对定位由 JS 驱动 */
  .mt-stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    cursor: pointer;
    font-family: var(--mt-font);
    font-size: var(--mt-fontSize);
    font-weight: 600;
    color: var(--mt-color);
    user-select: none;
  }
  .mt-para {
    max-width: min(720px, 86vw);
    line-height: 1.8;
    text-align: center;
  }
  .mt-para .w {
    display: inline-block;
    padding: 0 0.12em;
    border-radius: 4px;
    will-change: transform;
  }
  .mt-para .w.accent { color: var(--mt-accent); }
  .mt-hint {
    position: fixed;
    left: 50%; bottom: 22px;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.4);
    font: 13px/1 -apple-system, "PingFang SC", sans-serif;
    letter-spacing: 0.12em;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  /* 用户开启「减少动态效果」时：不掉落（JS 同步处理） */
  @media (prefers-reduced-motion: reduce) {
    .mt-stage { cursor: default; }
  }
</style>
</head>
<body>
<div class="mt-stage" id="mtStage">
  <p class="mt-para" id="mtPara"></p>
</div>
<div class="mt-hint" id="mtHint">点击文字</div>
<script>
  const CONFIG = {
    text: "点击 这段 文字 看看 它们 会 怎样 一个一个 掉 下来 然后 堆 在 一起", // 段落文案，按空格分词
    trigger: "click",  // 触发方式：click 点击 / hover 鼠标移入 / auto 自动
    gravity: 1400,     // 重力（px/s²）
    bounce: 0.35,      // 弹性：落地反弹保留的速度比例
    stagger: 60,       // 掉落错开（毫秒）
    spin: true,        // 翻滚
  };

  const stage = document.getElementById('mtStage');
  const para = document.getElementById('mtPara');
  const hint = document.getElementById('mtHint');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const words = CONFIG.text.split(/\s+/).filter(Boolean);
  para.setAttribute('aria-label', CONFIG.text);
  const hintText = { click: '点击文字', hover: '把鼠标移到文字上', auto: '' }[CONFIG.trigger] || '';
  hint.textContent = hintText;

  const cells = words.map((w, i) => {
    const s = document.createElement('span');
    s.className = 'w' + ((i === 0 || i === words.length - 1) ? ' accent' : '');
    s.textContent = w;
    para.appendChild(s);
    return s;
  });

  // ---- 简易刚体物理：每个词是一个矩形，受重力、墙地与彼此碰撞（AABB 分离 + 速度交换），落定后仍可被拖拽甩动 ----
  let bodies = null, raf = 0, dropping = false, grabbed = null;
  function drop() {
    if (dropping || reduceMotion) return;
    dropping = true;
    hint.style.opacity = '0';
    const sr = stage.getBoundingClientRect();
    const now = performance.now();
    // 记录原位，切换为绝对定位的「幽灵」节点（保持视觉位置不变）
    bodies = cells.map((el, i) => {
      const r = el.getBoundingClientRect();
      return {
        el, x: r.left - sr.left, y: r.top - sr.top, w: r.width, h: r.height,
        vx: (Math.random() - 0.5) * 60, vy: 0, rot: 0, vr: CONFIG.spin ? (Math.random() - 0.5) * 6 : 0,
        start: now + i * CONFIG.stagger, held: false,
      };
    });
    para.style.visibility = 'hidden';
    for (const b of bodies) {
      const ghost = b.el.cloneNode(true);
      ghost.style.cssText = 'position:absolute;left:0;top:0;margin:0;visibility:visible;cursor:grab;touch-action:none;user-select:none;';
      ghost.style.transform = 'translate(' + b.x + 'px,' + b.y + 'px)';
      stage.appendChild(ghost);
      b.node = ghost;
      // 拖拽：按住一个词就把它拎起来跟手，松手时按最后的移动速度甩出去
      ghost.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        grabbed = { b, dx: e.clientX - sr.left - b.x, dy: e.clientY - sr.top - b.y, lx: e.clientX, ly: e.clientY, lt: performance.now() };
        b.held = true; b.vx = b.vy = 0; ghost.style.cursor = 'grabbing'; try { ghost.setPointerCapture(e.pointerId); } catch (_) {}
      });
    }
    let last = now;
    function step(t) {
      if (document.hidden) { last = t; raf = requestAnimationFrame(step); return; }
      const dt = Math.min(0.033, (t - last) / 1000); last = t;
      const W = sr.width, floor = sr.height - 12;
      // 1. 积分
      for (const b of bodies) {
        if (t < b.start || b.held) continue;
        b.vy += CONFIG.gravity * dt;
        b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt;
        b.vr *= 0.98;
        // 碰撞按不旋转的矩形算，倾角只是视觉：限制在 ±25° 内，免得转成竖的跟邻居穿插
        if (Math.abs(b.rot) > 0.45) { b.rot = Math.sign(b.rot) * 0.45; b.vr = -b.vr * 0.3; }
        if (b.x < 0) { b.x = 0; b.vx = Math.abs(b.vx) * 0.5; }
        if (b.x + b.w > W) { b.x = W - b.w; b.vx = -Math.abs(b.vx) * 0.5; }
        if (b.y + b.h > floor) {
          b.y = floor - b.h;
          if (Math.abs(b.vy) < 60) { b.vy = 0; b.vx *= 0.8; b.vr *= 0.7; b.rot *= 0.9; }   // 落地：慢慢摆平
          else { b.vy = -b.vy * CONFIG.bounce; b.vx *= 0.8; b.vr += (Math.random() - 0.5) * 2; }
        }
      }
      // 2. 两两碰撞：沿重叠更小的轴把两块推开，法向速度按弹性交换，切向加摩擦
      const active = bodies.filter(b => t >= b.start);
      for (let iter = 0; iter < 2; iter++) for (let i = 0; i < active.length; i++) for (let j = i + 1; j < active.length; j++) {
        const a = active[i], b = active[j];
        const ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x), oy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
        if (ox <= 0 || oy <= 0) continue;
        const ma = a.held ? 0 : 1, mb = b.held ? 0 : 1, tot = ma + mb || 1;
        if (ox < oy) {
          const s = (a.x + a.w / 2 < b.x + b.w / 2 ? -1 : 1);
          a.x += s * ox * (ma / tot); b.x -= s * ox * (mb / tot);
          const rel = a.vx - b.vx; if (rel * s < 0) { const e = CONFIG.bounce; a.vx -= rel * (1 + e) / 2 * ma; b.vx += rel * (1 + e) / 2 * mb; }
        } else {
          const s = (a.y + a.h / 2 < b.y + b.h / 2 ? -1 : 1);
          a.y += s * oy * (ma / tot); b.y -= s * oy * (mb / tot);
          const rel = a.vy - b.vy;
          if (rel * s < 0) {
            const e = CONFIG.bounce;
            a.vy -= rel * (1 + e) / 2 * ma; b.vy += rel * (1 + e) / 2 * mb;
            // 落到别人身上：轻微摩擦与一点扭转，堆得歪歪斜斜
            const off = ((a.x + a.w / 2) - (b.x + b.w / 2)) / Math.max(1, (a.w + b.w) / 2);
            a.vx *= 0.9; b.vx *= 0.9; if (CONFIG.spin) { a.vr += off * 0.8 * ma; b.vr -= off * 0.8 * mb; }
          }
        }
      }
      // 3. 写回
      for (const b of bodies) b.node.style.transform = 'translate(' + b.x + 'px,' + b.y + 'px) rotate(' + b.rot + 'rad)';
      raf = requestAnimationFrame(step);
    }
    raf = requestAnimationFrame(step);
  }
  // 拖拽跟手与甩出
  stage.addEventListener('pointermove', (e) => {
    if (!grabbed) return;
    const g = grabbed, sr = stage.getBoundingClientRect(), now = performance.now(), dt = Math.max(1, now - g.lt) / 1000;
    g.b.x = e.clientX - sr.left - g.dx; g.b.y = e.clientY - sr.top - g.dy;
    g.b.vx = (e.clientX - g.lx) / dt * 0.6; g.b.vy = (e.clientY - g.ly) / dt * 0.6;   // 记录甩动速度
    g.lx = e.clientX; g.ly = e.clientY; g.lt = now;
  });
  const release = () => { if (!grabbed) return; grabbed.b.held = false; grabbed.b.node.style.cursor = 'grab'; grabbed = null; };
  stage.addEventListener('pointerup', release); stage.addEventListener('pointercancel', release);

  function reset() {
    cancelAnimationFrame(raf);
    if (bodies) for (const b of bodies) b.node.remove();
    bodies = null; grabbed = null;
    para.style.visibility = '';
    hint.style.opacity = '';
    dropping = false;
  }

  // 点击空白处：未掉落则掉落；已掉落则复位（点在词上是拖拽，不触发）
  if (CONFIG.trigger === 'click') stage.addEventListener('click', (e) => { if (e.target !== stage && e.target !== para && !para.contains(e.target)) return; dropping ? reset() : drop(); });
  if (CONFIG.trigger === 'hover') para.addEventListener('pointerenter', drop);
  if (CONFIG.trigger === 'auto') setTimeout(drop, 600);

  /* @mt:thumb-start */
  // 缩略图演示：自动掉落 → 停 2s → 复位 → 再掉，循环
  if (!reduceMotion) {
    setTimeout(drop, 800);
    setInterval(() => {
      if (document.hidden) return;
      if (dropping) { reset(); setTimeout(drop, 700); }
    }, 5200);
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
