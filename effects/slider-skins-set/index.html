<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>滑块皮肤合集</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #f2f1ee;            /* 页面底色 */
    --mt-color: #ff7a1a;         /* 主色 */
    --mt-thickness: 5px;         /* 粗细：轨道线条的粗细，胶囊和凹槽按比例加粗 */
    --mt-size: 28px;             /* 拇指大小 */
    --mt-gap: 7px;               /* 镂空间隙：镂空皮肤里拇指和轨道之间的空隙 */
    --mt-width: 360px;           /* 滑块长度 */
    --mt-font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; /* 字体 */
  }
  /* 当前值注册成数字属性，点轨道或按键跳值时能带回弹过渡 */
  @property --v { syntax: "<number>"; inherits: true; initial-value: 0; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; display: grid; place-items: center; font-family: var(--mt-font); color: #23262d; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  .mt-card { width: min(calc(var(--mt-width) + 168px), 94vw); display: grid; gap: 10px; }
  .mt-tile { position: relative; display: grid; grid-template-columns: 64px 1fr 36px; align-items: center; gap: 14px; padding: 16px 20px; border-radius: 18px; background: #fff; box-shadow: 0 10px 30px rgba(30, 24, 10, 0.07); overflow: hidden; transition: --v 0.32s cubic-bezier(0.3, 1.35, 0.5, 1); }
  .mt-card.drag .mt-tile { transition: none; }
  .mt-card.single .mt-tile { grid-template-columns: 1fr 40px; padding: 30px 28px; }
  .mt-card.single .mt-name { display: none; }
  .mt-name { font-size: 13px; color: #8a8f98; }
  .mt-num { font-size: 14px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  /* 滑块容器：--x 为拇指中心，原生 range 透明地盖在最上层负责拖动、键盘和读屏 */
  .mt-sl { --S: var(--mt-size); --x: calc(var(--S) / 2 + var(--v) * (100% - var(--S))); --c2: var(--mt-color); position: relative; height: 48px; }
  .mt-sl > * { position: absolute; pointer-events: none; }
  .mt-sl input { inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; pointer-events: auto; -webkit-appearance: none; appearance: none; background: none; }
  .mt-sl input::-webkit-slider-thumb { -webkit-appearance: none; width: var(--S); height: 48px; }
  .mt-sl input::-moz-range-thumb { width: var(--S); height: 48px; border: 0; background: none; }
  .mt-sl:has(input:focus-visible) .thumb { outline: 2px solid var(--mt-color); outline-offset: 3px; }
  .line { left: 0; right: 0; top: 50%; height: var(--mt-thickness); margin-top: calc(var(--mt-thickness) / -2); border-radius: 99px; }

  /* 镂空：照片感底图；轨道在拇指两侧各断开一段间隙，拇指是圆环，按住时填满 */
  .s-cutout { background: radial-gradient(circle at 68% 42%, #ffe9a8 0 15px, rgba(255, 233, 168, 0.35) 16px, transparent 46px), radial-gradient(ellipse 46% 70% at 22% 118%, #2d2466 0 98%, transparent 100%), radial-gradient(ellipse 58% 64% at 88% 124%, #43327f 0 98%, transparent 100%), linear-gradient(180deg, #ff9f7f, #d0619c 52%, #6a44a8); }
  .s-cutout .mt-name, .s-cutout .mt-num { color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35); }
  .s-cutout .mt-sl:hover { --c2: color-mix(in srgb, var(--mt-color), #000 18%); }
  .s-cutout .l { left: 0; right: auto; width: max(0px, var(--v) * (100% - var(--S)) - var(--mt-gap)); background: var(--c2); }
  .s-cutout .r { left: calc(var(--S) + var(--v) * (100% - var(--S)) + var(--mt-gap)); background: rgba(255, 255, 255, 0.6); }
  .s-cutout .ring { top: 50%; left: var(--x); width: var(--S); height: var(--S); translate: -50% -50%; box-sizing: border-box; border-radius: 50%; border: var(--mt-thickness) solid var(--c2); transition: border-width 0.3s, border-color 0.2s; }
  .s-cutout .mt-sl:active .ring { border-width: calc(var(--S) / 2); }

  /* 霓虹：深色底，越往右填充越亮、光晕越大，拇指下方映出一团光 */
  .s-neon { background: #0e0c1b; box-shadow: 0 10px 30px rgba(14, 12, 27, 0.25); }
  .s-neon .mt-name { color: rgba(255, 255, 255, 0.5); }
  .s-neon .mt-num { color: color-mix(in srgb, var(--mt-color) 55%, #fff); text-shadow: 0 0 calc(var(--v) * 12px * var(--glow)) var(--mt-color); }
  .s-neon .pool { top: 50%; left: var(--x); width: 240px; height: 120px; translate: -50% -50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--mt-color) 34%, transparent), transparent); opacity: calc(var(--v) * var(--glow)); }
  .s-neon .base { background: color-mix(in srgb, var(--mt-color) 14%, #1d1a33); }
  .s-neon .fill { right: auto; width: var(--x); background: linear-gradient(90deg, color-mix(in srgb, var(--mt-color) 30%, transparent), var(--mt-color) 75%, color-mix(in srgb, var(--mt-color) 45%, #fff)); box-shadow: 0 0 calc((2px + var(--v) * 12px) * var(--glow)) color-mix(in srgb, var(--mt-color) calc(35% + var(--v) * 65%), transparent), 0 0 calc(var(--v) * 30px * var(--glow)) color-mix(in srgb, var(--mt-color) 45%, transparent); filter: brightness(calc(0.7 + var(--v) * 0.65)); }
  .s-neon .dot { top: 50%; left: var(--x); width: calc(var(--S) * 0.62); height: calc(var(--S) * 0.62); translate: -50% -50%; border-radius: 50%; background: radial-gradient(circle, #fff 0 34%, var(--mt-color) 38%); box-shadow: 0 0 calc((4px + var(--v) * 16px) * var(--glow)) var(--mt-color); }

  /* 胶囊数值：粗轨道，数值写在药丸形拇指里，按住微微放大 */
  .s-pill .mt-sl { --S: 56px; --h: calc(12px + var(--mt-thickness) * 2); }
  .s-pill .base, .s-pill .fill { top: 50%; height: var(--h); translate: 0 -50%; border-radius: 99px; }
  .s-pill .base { left: 0; right: 0; background: #eceef2; box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.06); }
  .s-pill .fill { left: 0; width: calc(var(--x) + var(--S) / 2); background: var(--mt-color); }
  .s-pill .knob { top: 50%; left: var(--x); width: var(--S); height: calc(var(--h) + 12px); translate: -50% -50%; border-radius: 99px; background: #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18); display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--mt-color); font-variant-numeric: tabular-nums; transition: scale 0.2s; }
  .s-pill .mt-sl:active .knob { scale: 1.08; }
  .s-pill .mt-num { visibility: hidden; }

  /* 刻度尺：细线 + 指针，下方每 5% 一根刻度，走过的刻度亮起，指针头上顶着数值 */
  .s-ruler .mt-sl { --S: 18px; height: 70px; }
  .s-ruler .base, .s-ruler .fill { top: 26px; height: max(2px, calc(var(--mt-thickness) / 2)); border-radius: 2px; }
  .s-ruler .base { left: calc(var(--S) / 2); right: calc(var(--S) / 2); background: #d9dbe0; }
  .s-ruler .fill { left: calc(var(--S) / 2); width: calc(var(--v) * (100% - var(--S))); background: var(--mt-color); }
  .s-ruler .tick { top: 34px; width: 1px; height: 6px; margin-left: -0.5px; background: #c9ccd3; transition: background-color 0.15s, height 0.15s; }
  .s-ruler .tick.major { height: 11px; width: 2px; margin-left: -1px; }
  .s-ruler .tick.on { background: var(--mt-color); }
  .s-ruler .lab { top: 50px; translate: -50% 0; font-size: 10px; color: #a3a7af; font-variant-numeric: tabular-nums; }
  .s-ruler .needle { top: 14px; left: var(--x); width: 3px; height: 26px; translate: -50% 0; border-radius: 2px; background: var(--mt-color); }
  .s-ruler .tag { top: -8px; left: var(--x); translate: -50% 0; padding: 2px 7px; border-radius: 6px; background: var(--mt-color); color: #fff; font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; transition: scale 0.2s; }
  .s-ruler .mt-sl:active .tag { scale: 1.12; }
  .s-ruler .mt-num { visibility: hidden; }

  /* 拟物凹槽：浅灰底上压出的凹槽，凸起的圆钮中间嵌一颗主色灯，按住时圆钮压下 */
  .s-soft { background: #e7eaf0; box-shadow: none; }
  .s-soft .groove, .s-soft .fill { top: 50%; translate: 0 -50%; border-radius: 99px; }
  .s-soft .groove { left: 0; right: 0; height: calc(8px + var(--mt-thickness) * 1.6); background: #e7eaf0; box-shadow: inset 3px 3px 6px #c5cad3, inset -3px -3px 6px #fff; }
  .s-soft .fill { left: 3px; width: calc(var(--x) - 3px); height: calc(2px + var(--mt-thickness) * 1.6); background: linear-gradient(90deg, color-mix(in srgb, var(--mt-color) 50%, #e7eaf0), var(--mt-color)); }
  .s-soft .knob { top: 50%; left: var(--x); width: var(--S); height: var(--S); translate: -50% -50%; border-radius: 50%; background: linear-gradient(145deg, #f4f6fa, #d8dce4); box-shadow: 5px 5px 10px #c2c7d0, -5px -5px 10px #fff; transition: box-shadow 0.2s; }
  .s-soft .knob::after { content: ""; position: absolute; inset: 36%; border-radius: 50%; background: var(--mt-color); box-shadow: 0 0 6px color-mix(in srgb, var(--mt-color) 60%, transparent); transition: inset 0.2s; }
  .s-soft .mt-sl:active .knob { box-shadow: 2px 2px 5px #c2c7d0, -2px -2px 5px #fff, inset 2px 2px 4px #cfd3db; }
  .s-soft .mt-sl:active .knob::after { inset: 30%; }
  .s-soft .mt-num { color: #5d6472; }

  /* 用户开启「减少动态效果」时：跳值不过渡，按下态直接切换 */
  @media (prefers-reduced-motion: reduce) {
    .mt-tile, .mt-sl * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="mt-card" id="mtCard"></div>
<script>
  const CONFIG = {
    skin: 'all',        // 皮肤：all 全部 / cutout 镂空 / neon 霓虹 / pill 胶囊数值 / ruler 刻度尺 / soft 拟物凹槽
    value: 60,          // 初始值（0–100）
    glow: 1,            // 霓虹强度（倍）：霓虹皮肤的光晕随数值增强的幅度
    sync: true,         // 联动：拖动任一条时其余皮肤一起动
  };
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  const SKINS = [
    { id: 'cutout', name: '镂空', html: '<i class="line l"></i><i class="line r"></i><i class="ring thumb"></i>' },
    { id: 'neon', name: '霓虹', html: '<i class="pool"></i><i class="line base"></i><i class="line fill"></i><i class="dot thumb"></i>' },
    { id: 'pill', name: '胶囊数值', html: '<i class="base"></i><i class="fill"></i><b class="knob thumb"></b>' },
    { id: 'ruler', name: '刻度尺', html: '<i class="base"></i><i class="fill"></i><i class="needle thumb"></i><b class="tag"></b>' },
    { id: 'soft', name: '拟物凹槽', html: '<i class="groove"></i><i class="fill"></i><i class="knob thumb"></i>' },
  ];
  const card = document.getElementById('mtCard');
  card.style.setProperty('--glow', clamp(+CONFIG.glow || 0, 0, 3));
  const only = SKINS.find((s) => s.id === CONFIG.skin);
  if (only) card.classList.add('single');

  let userTook = false;
  const tiles = (only ? [only] : SKINS).map((s) => {
    const tile = document.createElement('div');
    tile.className = `mt-tile s-${s.id}`;
    tile.innerHTML = `<span class="mt-name">${s.name}</span><div class="mt-sl">${s.html}<input type="range" min="0" max="100" step="1" aria-label="${s.name}皮肤滑块"></div><output class="mt-num"></output>`;
    card.append(tile);
    const sl = tile.querySelector('.mt-sl'), input = sl.querySelector('input');
    const t = { s, tile, sl, input, num: tile.querySelector('.mt-num'), knob: sl.querySelector('.knob'), tag: sl.querySelector('.tag'), ticks: [] };
    if (s.id === 'ruler') {
      // 21 根刻度（每 5%），每 25% 一根长刻度并标数字
      for (let i = 0; i <= 20; i++) {
        const k = document.createElement('i'), pos = `calc(var(--S) / 2 + ${i / 20} * (100% - var(--S)))`;
        k.className = `tick${i % 5 ? '' : ' major'}`; k.style.left = pos; sl.insertBefore(k, input); t.ticks.push(k);
        if (i % 5 === 0) { const lab = document.createElement('span'); lab.className = 'lab'; lab.textContent = i * 5; lab.style.left = pos; sl.insertBefore(lab, input); }
      }
    }
    // 按住后真正移动才关掉 --v 的过渡（跟手）；单击轨道或按键跳值时保留回弹过渡
    let pressed = false;
    input.addEventListener('pointerdown', () => { userTook = true; pressed = true; });
    input.addEventListener('pointermove', () => { if (pressed) card.classList.add('drag'); });
    ['pointerup', 'pointercancel', 'blur'].forEach((ev) => input.addEventListener(ev, () => { pressed = false; card.classList.remove('drag'); }));
    input.addEventListener('keydown', () => { userTook = true; card.classList.remove('drag'); });
    input.addEventListener('input', () => { userTook = true; set(+input.value, CONFIG.sync ? null : t); });
    return t;
  });

  function paint(t, v) {
    t.tile.style.setProperty('--v', (v / 100).toFixed(4));
    t.num.textContent = v;
    if (t.knob && t.s.id === 'pill') t.knob.textContent = v;
    if (t.tag) t.tag.textContent = v;
    t.ticks.forEach((k, i) => k.classList.toggle('on', i * 5 <= v));
    t.input.setAttribute('aria-valuetext', `${v}%`);
  }
  // 联动时所有皮肤共用一个值，否则只改当前这条
  function set(v, one) {
    v = clamp(Math.round(v), 0, 100);
    (one ? [one] : tiles).forEach((t) => { if (+t.input.value !== v) t.input.value = v; paint(t, v); });
  }
  const v0 = clamp(Math.round(+CONFIG.value || 0), 0, 100);
  // 打开时从 0 弹到初始值
  tiles.forEach((t) => { t.input.value = 0; paint(t, 0); });
  setTimeout(() => { if (!userTook) set(v0, null); }, reduceMotion ? 0 : 300);

  /* @mt:thumb-start */
  // 缩略图演示：所有皮肤一起被拖到几组数值；用户一碰就交还
  if (window.__MT_ENV && window.__MT_ENV.thumb && !reduceMotion) {
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const drag = (to, ms) => new Promise((done) => {
      const from = +tiles[0].input.value, t0 = performance.now();
      card.classList.add('drag');
      (function f(now) {
        if (userTook) { card.classList.remove('drag'); return done(); }
        const k = Math.min(1, (now - t0) / ms), e = k < 0.5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
        set(from + (to - from) * e, null);
        if (k < 1) requestAnimationFrame(f); else { card.classList.remove('drag'); done(); }
      })(t0);
    });
    (async () => {
      await wait(1100);
      const seq = [92, 18, 74, 40];
      for (let i = 0; !userTook; i = (i + 1) % seq.length) {
        if (document.hidden) { await wait(500); continue; }
        await drag(seq[i], 900); await wait(800);
      }
    })();
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
