<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>淡入淡出轮播</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-accent: #ffffff;    /* 强调色：分页器与箭头悬停 */
    --mt-duration: 0.5s;     /* 切换过渡时长 */
    --mt-ratio: 16 / 9;      /* 容器宽高比 */
    --mt-rounded: 16px;      /* 容器圆角 */
  }

  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mt-bg);
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  .mt-carousel {
    position: relative;
    width: min(720px, 92vw);
    aspect-ratio: var(--mt-ratio);
    border-radius: var(--mt-rounded);
    overflow: hidden;
    background: #14151f;
    outline: none;
  }
  .mt-carousel:focus-visible { box-shadow: 0 0 0 2px var(--mt-accent); }

  .mt-viewport { position: absolute; inset: 0; touch-action: pan-y; cursor: grab; }
  .mt-viewport.dragging { cursor: grabbing; }

  /* ===== 过渡层：交叉淡化（三态都在原位，只变透明度） ===== */
  .mt-slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity var(--mt-duration) ease;
    background: linear-gradient(135deg, #1a1c2c, #2a2f4a);
  }
  .mt-slide.is-active { opacity: 1; z-index: 1; }
  .mt-slide.is-prev { opacity: 0; }

  .mt-slide img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    -webkit-user-drag: none;
    user-select: none;
  }
  .mt-caption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 42px 20px 14px;
    color: #fff;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.02em;
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.62));
  }

  /* ===== 箭头 ===== */
  .mt-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
    width: 40px; height: 40px;
    border: none;
    border-radius: 50%;
    background: rgba(10, 10, 15, 0.55);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .mt-arrow:hover { background: var(--mt-accent); color: #111111; }
  .mt-arrow.prev { left: 12px; }
  .mt-arrow.next { right: 12px; }

  /* ===== 分页器：bullets / fraction / progress 三种 ===== */
  .mt-pager { position: absolute; z-index: 2; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; gap: 7px; }
  .mt-pager .dot {
    width: 8px; height: 8px;
    border: none; border-radius: 50%;
    background: rgba(255, 255, 255, 0.4);
    cursor: pointer; padding: 0;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .mt-pager .dot.active { background: var(--mt-accent); transform: scale(1.25); }
  .mt-pager.fraction {
    left: auto; right: 12px; bottom: 12px;
    padding: 3px 10px;
    background: rgba(10, 10, 15, 0.55);
    border-radius: 999px;
    color: #fff; font-size: 12.5px;
    font-family: ui-monospace, monospace;
    justify-content: flex-end;
    width: max-content; margin-left: auto;
  }
  .mt-pager.progress { bottom: 0; }
  .mt-pager.progress .bar { width: 100%; height: 3px; background: rgba(255,255,255,0.18); }
  .mt-pager.progress .bar i { display: block; height: 100%; background: var(--mt-accent); transition: width var(--mt-duration) ease; }

  /* 用户开启「减少动态效果」：瞬间切换、不自动播放（JS 同步处理） */
  @media (prefers-reduced-motion: reduce) {
    .mt-slide { transition: none; }
  }
</style>
</head>
<body>
<div class="mt-carousel" id="mtRoot"></div>
<script>
  const CONFIG = {
    slides: [{"src":"/samples/sample-1.webp","caption":"第一帧 · 夜枭小憩"},{"src":"/samples/sample-2.webp","caption":"第二帧 · 海边老爷车"},{"src":"/samples/sample-3.webp","caption":"第三帧 · 日落海滩"},{"src":"/samples/sample-4.webp","caption":"第四帧 · 山谷晨光"},{"src":"/samples/sample-5.webp","caption":"第五帧 · 蓝天夹竹桃"}], // 幻灯片列表
    interval: 4,      // 自动播放间隔（秒，0 为不自动播放）
    pager: "bullets", // 分页器样式：bullets 圆点 / fraction 数字 / progress 进度条 / none 不显示
    arrows: true,     // 是否显示左右箭头
  };

  // ================= 轮播核心（骨架部分各效果通用） =================
  (function () {
    const root = document.getElementById('mtRoot');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const slides = CONFIG.slides;
    const total = slides.length;
    let index = 0;

    // ---- 无障碍骨架：容器即轮播区域 ----
    root.setAttribute('role', 'region');
    root.setAttribute('aria-roledescription', 'carousel');
    root.setAttribute('aria-label', '图片轮播');
    root.setAttribute('tabindex', '0');

    // ---- 生成幻灯片 ----
    const viewport = document.createElement('div');
    viewport.className = 'mt-viewport';
    viewport.setAttribute('aria-live', CONFIG.interval > 0 ? 'off' : 'polite');
    const slideEls = slides.map((s, i) => {
      const el = document.createElement('div');
      el.className = 'mt-slide' + (i === 0 ? ' is-active' : '');
      el.setAttribute('role', 'group');
      el.setAttribute('aria-roledescription', 'slide');
      el.setAttribute('aria-label', '第 ' + (i + 1) + ' 张，共 ' + total + ' 张');
      const img = document.createElement('img');
      img.src = s.src;
      img.alt = s.caption || '第 ' + (i + 1) + ' 张图片';
      img.loading = i === 0 ? 'eager' : 'lazy';
      el.appendChild(img);
      if (s.caption) {
        const cap = document.createElement('div');
        cap.className = 'mt-caption';
        cap.textContent = s.caption;
        el.appendChild(cap);
      }
      viewport.appendChild(el);
      return el;
    });
    root.appendChild(viewport);

    // ---- 切换（三态类切换：无缝循环的关键） ----
    function goTo(next, dir) {
      next = (next + total) % total;
      if (next === index || total < 2) return;
      const current = slideEls[index];
      const target = slideEls[next];
      // 把新卡瞬时放到「进入侧」（next 从右进，prev 从左进），再触发过渡
      target.style.transition = 'none';
      target.classList.toggle('is-prev', dir < 0);
      void target.offsetWidth; // 强制 reflow，让上面的瞬时定位生效
      target.style.transition = '';
      current.classList.remove('is-active');
      current.classList.toggle('is-prev', dir > 0);
      target.classList.remove('is-prev');
      target.classList.add('is-active');
      index = next;
      updatePager();
    }
    const nextSlide = () => goTo(index + 1, 1);
    const prevSlide = () => goTo(index - 1, -1);

    // ---- 自动播放：悬停/聚焦/后台暂停；reduced-motion 下不启动 ----
    let timer = null;
    function play() {
      if (timer || CONFIG.interval <= 0 || reduceMotion || total < 2) return;
      timer = setInterval(nextSlide, CONFIG.interval * 1000);
    }
    function pause() {
      clearInterval(timer);
      timer = null;
    }
    root.addEventListener('mouseenter', pause);
    root.addEventListener('mouseleave', play);
    root.addEventListener('focusin', pause);
    root.addEventListener('focusout', play);
    document.addEventListener('visibilitychange', () => (document.hidden ? pause() : play()));
    play();

    // ---- 拖拽 / 触摸（Pointer Events 统一） ----
    let dragStartX = null;
    let dragDx = 0;
    viewport.addEventListener('pointerdown', (e) => {
      dragStartX = e.clientX;
      dragDx = 0;
      viewport.classList.add('dragging');
      viewport.setPointerCapture(e.pointerId);
    });
    viewport.addEventListener('pointermove', (e) => {
      if (dragStartX === null) return;
      dragDx = e.clientX - dragStartX;
    });
    viewport.addEventListener('pointerup', () => {
      viewport.classList.remove('dragging');
      if (dragStartX === null) return;
      if (Math.abs(dragDx) > 50) (dragDx < 0 ? nextSlide : prevSlide)();
      dragStartX = null;
    });
    viewport.addEventListener('pointercancel', () => {
      viewport.classList.remove('dragging');
      dragStartX = null;
    });

    // ---- 键盘 ----
    root.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
    });

    // ---- 箭头 ----
    if (CONFIG.arrows && total > 1) {
      for (const [cls, label, fn] of [['prev', '上一张', prevSlide], ['next', '下一张', nextSlide]]) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'mt-arrow ' + cls;
        btn.setAttribute('aria-label', label);
        btn.textContent = cls === 'prev' ? '‹' : '›';
        btn.addEventListener('click', fn);
        root.appendChild(btn);
      }
    }

    // ---- 分页器：bullets / fraction / progress ----
    let updatePager = () => {};
    if (CONFIG.pager !== 'none' && total > 1) {
      const pager = document.createElement('div');
      pager.className = 'mt-pager ' + CONFIG.pager;
      if (CONFIG.pager === 'bullets') {
        const dots = slides.map((_s, i) => {
          const dot = document.createElement('button');
          dot.type = 'button';
          dot.className = 'dot' + (i === 0 ? ' active' : '');
          dot.setAttribute('aria-label', '跳到第 ' + (i + 1) + ' 张');
          dot.addEventListener('click', () => goTo(i, i > index ? 1 : -1));
          pager.appendChild(dot);
          return dot;
        });
        updatePager = () => dots.forEach((d, i) => d.classList.toggle('active', i === index));
      } else if (CONFIG.pager === 'fraction') {
        pager.setAttribute('aria-hidden', 'true');
        updatePager = () => (pager.textContent = (index + 1) + ' / ' + total);
        updatePager();
      } else if (CONFIG.pager === 'progress') {
        pager.setAttribute('aria-hidden', 'true');
        const bar = document.createElement('div');
        bar.className = 'bar';
        const fill = document.createElement('i');
        bar.appendChild(fill);
        pager.appendChild(bar);
        updatePager = () => (fill.style.width = ((index + 1) / total) * 100 + '%');
        updatePager();
      }
      root.appendChild(pager);
    }
  })();
</script>
</body>
</html>
