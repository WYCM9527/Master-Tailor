<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全息反光卡</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-holo: 0.55;         /* 全息强度 */
    --mt-gloss: 0.5;         /* 高光强度 */
    --mt-rounded: 18px;      /* 卡片圆角 */
  }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mt-bg);
    display: grid;
    place-items: center;
    overflow: hidden;
    perspective: 1000px;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .mt-card {
    position: relative;
    width: min(320px, 76vw);
    aspect-ratio: 3 / 4;
    border-radius: var(--mt-rounded);
    overflow: hidden;
    background: #14151f;
    transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
    will-change: transform;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
    cursor: pointer;
  }
  .mt-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* 全息层：多色条纹渐变，随鼠标位置平移；用 overlay 混合让颜色贴着卡面 */
  .mt-card .holo {
    position: absolute; inset: 0;
    background: linear-gradient(115deg,
      transparent 20%, rgba(255, 80, 120, 0.9) 32%, rgba(255, 220, 90, 0.9) 40%,
      rgba(90, 255, 160, 0.9) 48%, rgba(80, 180, 255, 0.9) 56%, rgba(200, 90, 255, 0.9) 64%, transparent 78%);
    background-size: 260% 260%;
    background-position: var(--px, 50%) var(--py, 50%);
    mix-blend-mode: color-dodge;
    opacity: calc(var(--mt-holo) * 0.6);
    pointer-events: none;
  }
  /* 高光：跟随鼠标的白色柔光点 */
  .mt-card .gloss {
    position: absolute; inset: 0;
    background: radial-gradient(260px at var(--gx, 50%) var(--gy, 50%), rgba(255, 255, 255, calc(var(--mt-gloss) * 0.55)), transparent 60%);
    mix-blend-mode: soft-light;
    pointer-events: none;
  }
  .mt-card .meta {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 40px 18px 16px;
    color: #fff; font-weight: 700; letter-spacing: 0.12em; font-size: 13px;
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.55));
  }

  /* 用户开启「减少动态效果」时：卡片不倾斜，全息与高光固定在中心 */
  @media (prefers-reduced-motion: reduce) {
    .mt-card { transform: none !important; }
  }
</style>
</head>
<body>
<div class="mt-card" id="mtCard">
  <img id="mtPhoto" src="/samples/sample-6.webp" alt="">
  <div class="holo" aria-hidden="true"></div>
  <div class="gloss" aria-hidden="true"></div>
  <div class="meta" id="mtTitle">HOLO · 001</div>
</div>
<script>
  const CONFIG = {
    photo: "/samples/sample-6.webp", // 卡面图片
    tilt: 12,       // 倾斜幅度（度）
    lag: 0.2,       // 跟随迟滞（1 完全跟手）
    title: "HOLO · 001", // 卡片标题
  };

  const card = document.getElementById('mtCard');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.getElementById('mtPhoto').src = CONFIG.photo;
  document.getElementById('mtTitle').textContent = CONFIG.title;

  // 目标 / 当前的归一化鼠标位置（-0.5…0.5），离开时回中
  let tx = 0, ty = 0, x = 0, y = 0, auto = true;
  card.addEventListener('pointermove', e => {
    auto = false;
    const r = card.getBoundingClientRect();
    tx = (e.clientX - r.left) / r.width - 0.5; ty = (e.clientY - r.top) / r.height - 0.5;
  });
  card.addEventListener('pointerleave', () => { tx = 0; ty = 0; });
  document.documentElement.addEventListener('pointerleave', () => (auto = true));

  function frame() {
    if (!document.hidden) {
      const k = reduceMotion ? 1 : CONFIG.lag;
      x += (tx - x) * k; y += (ty - y) * k;
      card.style.setProperty('--ry', (x * CONFIG.tilt * 2) + 'deg');
      card.style.setProperty('--rx', (-y * CONFIG.tilt * 2) + 'deg');
      card.style.setProperty('--gx', ((x + 0.5) * 100) + '%'); card.style.setProperty('--gy', ((y + 0.5) * 100) + '%');
      card.style.setProperty('--px', ((0.5 - x) * 100) + '%'); card.style.setProperty('--py', ((0.5 - y) * 100) + '%');
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* @mt:thumb-start */
  // 缩略图演示：虚拟指针在卡面上画圈；真实鼠标一动就交还
  if (!reduceMotion) {
    let t = 0;
    setInterval(() => {
      if (document.hidden || !auto) return;
      t += 0.03;
      tx = Math.cos(t) * 0.4; ty = Math.sin(t * 1.3) * 0.4;
    }, 30);
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
