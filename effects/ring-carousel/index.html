<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 环形轮播</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-accent: #f9cf00;    /* 强调色：数字角标 */
    --mt-duration: 0.8s;     /* 转动过渡时长 */
    --mt-rounded: 14px;      /* 卡片圆角 */
  }

  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mt-bg);
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  .mt-carousel {
    position: relative;
    width: min(760px, 94vw);
    height: min(380px, 58vh);
    outline: none;
    /* 环形的纵深感来自透视 */
    perspective: 1200px;
    touch-action: pan-y;
    cursor: grab;
  }
  .mt-carousel.dragging { cursor: grabbing; }
  .mt-carousel:focus-visible { outline: 2px solid var(--mt-accent); outline-offset: 4px; }

  /* 舞台：所有卡片贴在它上面，转它 = 转整个环 */
  .mt-stage {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    transition: transform var(--mt-duration) cubic-bezier(0.33, 1, 0.68, 1);
  }

  .mt-card {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 36%;
    aspect-ratio: 4 / 3;
    margin: 0;
    border-radius: var(--mt-rounded);
    overflow: hidden;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
    background: linear-gradient(135deg, #1a1c2c, #2a2f4a);
    /* 背面隐藏：转到环后方的卡不透出镜像 */
    backface-visibility: hidden;
  }
  .mt-card img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    -webkit-user-drag: none;
    user-select: none;
  }

  .mt-fraction {
    position: absolute;
    left: 50%;
    bottom: -8px;
    transform: translateX(-50%);
    padding: 3px 12px;
    border-radius: 999px;
    background: rgba(10, 10, 15, 0.6);
    color: var(--mt-accent);
    font-size: 12.5px;
    font-family: ui-monospace, monospace;
  }

  /* 用户开启「减少动态效果」：转动瞬间到位、不自动旋转（JS 同步处理） */
  @media (prefers-reduced-motion: reduce) {
    .mt-stage { transition: none; }
  }
</style>
</head>
<body>
<div class="mt-carousel" id="mtRoot"></div>
<script>
  const CONFIG = {
    slides: [{"src":"/samples/sample-1.svg","caption":""},{"src":"/samples/sample-2.svg","caption":""},{"src":"/samples/sample-3.svg","caption":""},{"src":"/samples/sample-4.svg","caption":""},{"src":"/samples/sample-5.svg","caption":""},{"src":"/samples/sample-6.svg","caption":""},{"src":"/samples/sample-7.svg","caption":""},{"src":"/samples/sample-8.svg","caption":""}], // 环上的图片
    interval: 3.5, // 自动旋转间隔（秒，0 为不自动旋转）
    dimBack: true, // 后方的卡片是否压暗（增强前后层次）
  };

  (function () {
    const root = document.getElementById('mtRoot');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const slides = CONFIG.slides;
    const total = slides.length;
    const step = 360 / total; // 相邻卡片的圆心角
    // 累加角度而不取模：环永远朝同一方向转，无缝循环
    let turned = 0;

    root.setAttribute('role', 'region');
    root.setAttribute('aria-roledescription', 'carousel');
    root.setAttribute('aria-label', '3D 环形轮播');
    root.setAttribute('tabindex', '0');

    const stage = document.createElement('div');
    stage.className = 'mt-stage';
    root.appendChild(stage);

    // 半径由卡片宽度和张数决定：r = (卡宽/2) / tan(π/N)，再放大一点留出缝隙
    const cardW = root.clientWidth * 0.36;
    const radius = Math.round((cardW / 2) / Math.tan(Math.PI / total) * 1.18);

    const cards = slides.map((s, i) => {
      const el = document.createElement('figure');
      el.className = 'mt-card';
      el.setAttribute('role', 'group');
      el.setAttribute('aria-roledescription', 'slide');
      el.setAttribute('aria-label', '第 ' + (i + 1) + ' 张，共 ' + total + ' 张');
      // 每张卡先转到自己的圆周角，再沿法线推到半径处
      el.style.transform =
        'translate(-50%, -50%) rotateY(' + (i * step) + 'deg) translateZ(' + radius + 'px)';
      const img = document.createElement('img');
      img.src = s.src;
      img.alt = s.caption || '第 ' + (i + 1) + ' 张图片';
      img.loading = 'lazy';
      el.appendChild(img);
      stage.appendChild(el);
      return el;
    });

    const fraction = document.createElement('div');
    fraction.className = 'mt-fraction';
    fraction.setAttribute('aria-hidden', 'true');
    root.appendChild(fraction);

    const indexNow = () => ((Math.round(-turned / step) % total) + total) % total;

    function render() {
      stage.style.transform = 'rotateY(' + turned + 'deg)';
      const idx = indexNow();
      fraction.textContent = (idx + 1) + ' / ' + total;
      if (CONFIG.dimBack) {
        // 按与正前方的环形距离压暗：正前方最亮，绕到后面最暗
        cards.forEach((c, i) => {
          let off = Math.abs(i - idx);
          off = Math.min(off, total - off);
          c.style.filter = 'brightness(' + Math.max(0.4, 1 - off * (1.2 / total) * 2) + ')';
        });
      }
    }

    const nextSlide = () => { turned -= step; render(); };
    const prevSlide = () => { turned += step; render(); };

    // 自动旋转：悬停 / 聚焦 / 后台暂停；reduced-motion 不启动
    let timer = null;
    function play() {
      if (timer || CONFIG.interval <= 0 || reduceMotion || total < 2) return;
      timer = setInterval(nextSlide, CONFIG.interval * 1000);
    }
    function pause() { clearInterval(timer); timer = null; }
    root.addEventListener('mouseenter', pause);
    root.addEventListener('mouseleave', play);
    root.addEventListener('focusin', pause);
    root.addEventListener('focusout', play);
    document.addEventListener('visibilitychange', () => (document.hidden ? pause() : play()));
    play();

    // 拖拽 / 触摸：横向滑动转环（Pointer Events）
    let dragStartX = null, dragDx = 0;
    root.addEventListener('pointerdown', (e) => {
      dragStartX = e.clientX; dragDx = 0;
      root.classList.add('dragging');
      root.setPointerCapture(e.pointerId);
    });
    root.addEventListener('pointermove', (e) => {
      if (dragStartX === null) return;
      dragDx = e.clientX - dragStartX;
    });
    root.addEventListener('pointerup', () => {
      root.classList.remove('dragging');
      if (dragStartX === null) return;
      if (Math.abs(dragDx) > 50) (dragDx < 0 ? nextSlide : prevSlide)();
      dragStartX = null;
    });
    root.addEventListener('pointercancel', () => { root.classList.remove('dragging'); dragStartX = null; });

    // 键盘
    root.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
    });

    render();
  })();
</script>
</body>
</html>
