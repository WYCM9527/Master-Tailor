<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>点场波纹</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* 用户开启「减少动态效果」时：静止的均匀点阵（JS 同步处理） */
  @media (prefers-reduced-motion: reduce) {
    canvas { opacity: 0.8; }
  }
</style>
</head>
<body>
<canvas id="mtCanvas" aria-hidden="true"></canvas>
<script>
  const CONFIG = {
    spacing: 28,       // 点间距（px）
    dotSize: 6,        // 点最大直径（px）
    waveLength: 320,   // 波长（px）
    speed: 1,          // 波速倍率
    mode: "ripple",    // 波形：ripple 中心涟漪 / diagonal 斜向推进 / noise 随机起伏
    color: "#ffffff",  // 点的颜色
    mouse: true,       // 鼠标激起涟漪
  };

  const canvas = document.getElementById('mtCanvas');
  const ctx = canvas.getContext('2d');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dpr = Math.min(2, devicePixelRatio || 1);
  let W = 0, H = 0;
  function resize() { W = innerWidth; H = innerHeight; canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  resize(); addEventListener('resize', resize);

  // 鼠标涟漪：记录最近一次点击/移动点与时刻
  const ripples = [];
  addEventListener('pointermove', e => { if (CONFIG.mouse && (ripples.length === 0 || performance.now() - ripples[ripples.length - 1].t > 250)) ripples.push({ x: e.clientX, y: e.clientY, t: performance.now() }); });

  // 每个点的「高度」h ∈ [-1, 1]：由波形决定，再叠加鼠标涟漪；映射到大小与透明度
  function height(x, y, t) {
    const k = Math.PI * 2 / CONFIG.waveLength;
    let h;
    if (CONFIG.mode === 'ripple') h = Math.sin(Math.hypot(x - W / 2, y - H / 2) * k - t * 2);
    else if (CONFIG.mode === 'diagonal') h = Math.sin((x + y) * k * 0.7 - t * 2);
    else h = Math.sin(x * k * 0.9 + t) * Math.cos(y * k * 1.3 - t * 0.8);
    for (const r of ripples) {
      const age = (performance.now() - r.t) / 1000;
      if (age > 2.5) continue;
      const d = Math.hypot(x - r.x, y - r.y);
      const front = age * 260; // 涟漪扩散速度
      h += Math.exp(-Math.abs(d - front) / 40) * (1 - age / 2.5) * 1.2;
    }
    return h;
  }

  let t = 0;
  function frame() {
    if (!document.hidden) {
      if (!reduceMotion) t += 0.016 * CONFIG.speed;
      while (ripples.length && performance.now() - ripples[0].t > 2500) ripples.shift();
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = CONFIG.color;
      const s = CONFIG.spacing;
      for (let y = s / 2; y < H; y += s) for (let x = s / 2; x < W; x += s) {
        const h = reduceMotion ? 0 : Math.max(-1, Math.min(1.5, height(x, y, t)));
        const n = (h + 1) / 2.5; // 0–1
        const r = CONFIG.dotSize * (0.25 + 0.75 * n) / 2;
        ctx.globalAlpha = 0.2 + 0.8 * n;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
