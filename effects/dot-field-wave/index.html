<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>点场波纹</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* 用户开启「减少动态效果」时：静止的均匀点阵（JS 同步处理） */
  @media (prefers-reduced-motion: reduce) { canvas { opacity: 0.9; } }
</style>
</head>
<body>
<canvas id="mtCanvas" aria-hidden="true"></canvas>
<script>
  const CONFIG = {
    dotRadius: 1.5,           // 点的直径（px）
    dotSpacing: 14,           // 点间距（px）
    cursorRadius: 500,        // 鼓包范围（px）
    bulgeOnly: true,          // 鼓包模式（关则按鼠标速度甩开）
    bulgeStrength: 67,        // 鼓包高度
    glowColor: "#120f17",     // 暗晕颜色
    waveAmplitude: 0,         // 自动漂浮幅度（px）
    sparkle: false,           // 随机闪烁
    gradientFrom: "#7cff67",  // 渐变起色
    gradientTo: "#a0ffbc",    // 渐变止色
  };

  const GLOW_RADIUS = 160;    // 暗晕半径（px）

  const canvas = document.getElementById('mtCanvas');
  const ctx = canvas.getContext('2d');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dpr = Math.min(2, devicePixelRatio || 1);

  // 点阵：ax/ay 原位，sx/sy 平滑后的绘制位，vx/vy 甩开模式的速度
  let W = 0, H = 0, dots = [];
  function build() {
    const step = CONFIG.dotRadius + CONFIG.dotSpacing;
    const cols = Math.floor(W / step), rows = Math.floor(H / step);
    const padX = (W % step) / 2, padY = (H % step) / 2;
    dots = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const ax = padX + c * step + step / 2, ay = padY + r * step + step / 2;
      dots.push({ ax, ay, sx: ax, sy: ay, vx: 0, vy: 0 });
    }
  }
  function resize() {
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
  }
  resize(); addEventListener('resize', resize);

  // 鼠标：位置 + 速度（每 20ms 采样一次、50% 平滑）—— 点只在鼠标「动」的时候被推
  const mouse = { x: -9999, y: -9999, px: -9999, py: -9999, speed: 0 };
  addEventListener('pointermove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
  setInterval(() => {
    const d = Math.hypot(mouse.px - mouse.x, mouse.py - mouse.y);
    mouse.speed += (d - mouse.speed) * 0.5;
    if (mouse.speed < 0.001) mouse.speed = 0;
    mouse.px = mouse.x; mouse.py = mouse.y;
  }, 20);

  function hexRgb(hex) {
    const h = hex.replace('#', '');
    return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16));
  }
  const glowRgb = hexRgb(CONFIG.glowColor).join(', ');

  let engagement = 0, glowOpacity = 0, frameCount = 0;
  function frame() {
    requestAnimationFrame(frame);
    if (document.hidden) return;                     // 切后台暂停
    frameCount++;
    const t = frameCount * 0.02;

    // 参与度：鼠标越快越高（速度/5 钳到 1），慢慢起落；暗晕透明度再跟一层平滑
    const targetEngagement = reduceMotion ? 0 : Math.min(mouse.speed / 5, 1);
    engagement += (targetEngagement - engagement) * 0.06;
    if (engagement < 0.001) engagement = 0;
    glowOpacity += (engagement - glowOpacity) * 0.08;

    ctx.clearRect(0, 0, W, H);
    // 点阵整体用一条对角线性渐变着色
    const grad = ctx.createLinearGradient(0, 0, W, H);
    grad.addColorStop(0, CONFIG.gradientFrom);
    grad.addColorStop(1, CONFIG.gradientTo);
    ctx.fillStyle = grad;

    const crSq = CONFIG.cursorRadius * CONFIG.cursorRadius;
    const rad = CONFIG.dotRadius / 2;
    ctx.beginPath();
    for (let i = 0; i < dots.length; i++) {
      const d = dots[i];
      const dx = mouse.x - d.ax, dy = mouse.y - d.ay;
      const distSq = dx * dx + dy * dy;

      if (distSq < crSq && engagement > 0.01) {
        const dist = Math.sqrt(distSq);
        const angle = Math.atan2(dy, dx);
        if (CONFIG.bulgeOnly) {
          /* 鼓包：离鼠标越近推得越远（二次衰减），乘参与度，15% 趋近 */
          const falloff = 1 - dist / CONFIG.cursorRadius;
          const push = falloff * falloff * CONFIG.bulgeStrength * engagement;
          d.sx += (d.ax - Math.cos(angle) * push - d.sx) * 0.15;
          d.sy += (d.ay - Math.sin(angle) * push - d.sy) * 0.15;
        } else {
          /* 甩开：速度场——鼠标越快、离得越近，点被甩得越远 */
          const move = (500 / Math.max(dist, 0.001)) * (mouse.speed * 0.1);
          d.vx -= Math.cos(angle) * move;
          d.vy -= Math.sin(angle) * move;
        }
      } else if (CONFIG.bulgeOnly) {
        d.sx += (d.ax - d.sx) * 0.1;                  // 范围外归位
        d.sy += (d.ay - d.sy) * 0.1;
      }
      if (!CONFIG.bulgeOnly) {
        d.vx *= 0.9; d.vy *= 0.9;                    // 甩开模式：速度衰减后弹回
        d.sx += (d.ax + d.vx - d.sx) * 0.1;
        d.sy += (d.ay + d.vy - d.sy) * 0.1;
      }

      let x = d.sx, y = d.sy;
      if (CONFIG.waveAmplitude > 0 && !reduceMotion) {   // 自动漂浮：正弦轻晃
        y += Math.sin(d.ax * 0.03 + t) * CONFIG.waveAmplitude;
        x += Math.cos(d.ay * 0.03 + t * 0.7) * CONFIG.waveAmplitude * 0.5;
      }
      // 随机闪烁：约 3% 的点每 8 帧换一批放大 1.8 倍
      let r = rad;
      if (CONFIG.sparkle) {
        const hash = ((i * 2654435761) ^ (frameCount >> 3)) >>> 0;
        if (hash % 100 < 3) r = rad * 1.8;
      }
      ctx.moveTo(x + r, y);
      ctx.arc(x, y, r, 0, Math.PI * 2);
    }
    ctx.fill();

    // 暗晕：跟着鼠标的径向渐变圆，透明度随参与度——鼠标动起来周围的点像被拨暗
    if (glowOpacity > 0.005) {
      const g = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, GLOW_RADIUS);
      g.addColorStop(0, `rgba(${glowRgb}, ${glowOpacity})`);
      g.addColorStop(1, `rgba(${glowRgb}, 0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(mouse.x, mouse.y, GLOW_RADIUS, 0, Math.PI * 2); ctx.fill();
    }
  }
  requestAnimationFrame(frame);

  /* @mt:thumb-start */
  // 缩略图演示：一个虚拟指针在画面里画 8 字，让鼓包与暗晕动起来；真实鼠标进入后交还控制
  if (!reduceMotion) {
    let tt = 0, auto = true;
    addEventListener('pointerenter', () => { auto = false; });
    setInterval(() => {
      if (document.hidden || !auto) return;
      tt += 0.04;
      mouse.x = W * (0.5 + 0.35 * Math.sin(tt));
      mouse.y = H * (0.5 + 0.3 * Math.sin(tt * 2));
    }, 30);
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
