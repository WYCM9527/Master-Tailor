<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>虹彩流光</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色（canvas 覆盖前的兜底色） */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* 用户开启「减少动态效果」时：JS 停止时间推进，保留一帧静态色斑 */
  @media (prefers-reduced-motion: reduce) { canvas { opacity: 0.9; } }
</style>
</head>
<body>
<canvas id="mtCanvas" aria-hidden="true"></canvas>
<script>
  const CONFIG = {
    tint: "#4d3380",     // 色调
    speed: 1,            // 翻涌速度
    amplitude: 0.1,      // 鼠标偏移量
    mouseReact: true,    // 跟随鼠标
  };

  const canvas = document.getElementById('mtCanvas');
  const gl = canvas.getContext('webgl');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 顶点着色器：全屏大三角形
  const VS = `
    attribute vec2 aPos;
    varying vec2 vUv;
    void main() { vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }
  `;
  // 片元着色器：8 轮 sin/cos 互相反馈，累出一对混沌相位 (a, d)，
  // 再用 cos 把相位翻译成互相渗染的大块虹彩色斑
  const FS = `
    precision highp float;
    varying vec2 vUv;
    uniform float uTime;       // 时间（秒）
    uniform vec3  uTint;       // 色调（最后整体乘上去）
    uniform vec2  uRes;        // 画布分辨率
    uniform vec2  uMouse;      // 鼠标位置（0–1）
    uniform float uAmplitude;  // 鼠标偏移量
    uniform float uSpeed;      // 翻涌速度

    void main() {
      float mr = min(uRes.x, uRes.y);
      vec2 uv = (vUv * 2.0 - 1.0) * uRes / mr;        // 以短边归一的居中坐标
      uv += (uMouse - vec2(0.5)) * uAmplitude;         // 鼠标轻推整幅画面

      /* 相位反馈循环：a 与 d 彼此进入对方的三角函数，8 轮后自然形成流体状等值线 */
      float d = -uTime * 0.5 * uSpeed;
      float a = 0.0;
      for (float i = 0.0; i < 8.0; ++i) {
        a += cos(i - d - a * uv.x);
        d += sin(uv.y * i + a);
      }
      d += uTime * 0.5 * uSpeed;
      /* 相位 → 颜色：三个通道各取不同组合的 cos，再整体过一遍 cos 揉出虹彩 */
      vec3 col = vec3(cos(uv * vec2(d, a)) * 0.6 + 0.4, cos(a + d) * 0.5 + 0.5);
      col = cos(col * cos(vec3(d, a, 2.5)) * 0.5 + 0.5) * uTint * 3.3;
      gl_FragColor = vec4(col, 1.0);
    }
  `;

  // ---- WebGL 底座 ----
  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  const U = (n) => gl.getUniformLocation(prog, n);

  function hexRgb(hex) {
    const h = hex.replace('#', '');
    return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16) / 255);
  }

  const dpr = Math.min(2, devicePixelRatio || 1);
  function resize() {
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(U('uRes'), canvas.width, canvas.height);
  }

  gl.uniform3fv(U('uTint'), hexRgb(CONFIG.tint));
  gl.uniform1f(U('uSpeed'), CONFIG.speed);
  gl.uniform1f(U('uAmplitude'), CONFIG.mouseReact ? CONFIG.amplitude : 0);
  const uTime = U('uTime'), uMouse = U('uMouse');
  resize(); addEventListener('resize', resize);

  // 鼠标位置（0–1，y 翻转成 GL 习惯的下小上大）
  let mx = 0.5, my = 0.5;
  if (CONFIG.mouseReact) {
    addEventListener('pointermove', (e) => {
      mx = e.clientX / innerWidth;
      my = 1 - e.clientY / innerHeight;
    });
  }

  let time = reduceMotion ? 8 : 0;   // 减少动态：定格在一帧丰富的色斑上
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    if (document.hidden) { last = now; return; }   // 切后台暂停
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!reduceMotion) time += dt;
    gl.uniform1f(uTime, time);
    gl.uniform2f(uMouse, mx, my);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
