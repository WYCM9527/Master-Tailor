<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>缩略图长成头图</title>
    <style>
      :root {
        --mt-bg: #0a0a0f; /* 页面底色 */
        --mt-duration: 0.5s; /* 转场时长 */
        --mt-ease: cubic-bezier(0.32, 0.72, 0, 1); /* 缓动曲线 */
        --mt-rounded: 10px; /* 缩略图圆角 */
        --mt-accent: #ffffff; /* 强调色：图注与返回按钮 */
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--mt-bg);
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #f2f2f7;
      }

      .mt-app {
        position: relative;
        width: min(880px, 94vw);
        height: min(560px, 92vh);
        background: #101016;
        border-radius: 18px;
        overflow: clip;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
      }
      .page {
        position: absolute;
        inset: 0;
        overflow: auto;
        background: #101016;
      }
      .page[hidden] {
        display: none;
      }
      h1,
      h2 {
        outline: none;
      }

      /* ---- 图库页：小方缩略图 ---- */
      .page-gallery {
        padding: 24px 28px;
      }
      .page-gallery h2 {
        margin: 0 0 16px;
        font-size: 21px;
      }
      .thumb-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
      .thumb {
        border: none;
        padding: 0;
        background: none;
        cursor: pointer;
        display: grid;
        gap: 7px;
        color: inherit;
        font: inherit;
        text-align: left;
      }
      .thumb:focus-visible {
        outline: 2px solid var(--mt-accent);
        outline-offset: 2px;
      }
      .thumb img {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: var(--mt-rounded);
        -webkit-user-drag: none;
      }
      .thumb .cap {
        font-size: 12.5px;
        color: #9a9ba8;
      }

      /* ---- 大图页：宽幅头图 ---- */
      .page-hero .hero {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 8.2;
        object-fit: cover;
      }
      .page-hero .body {
        padding: 16px 28px 24px;
      }
      .page-hero h1 {
        margin: 0 0 8px;
        font-size: 24px;
        color: var(--mt-accent);
      }
      .page-hero p {
        margin: 0;
        line-height: 1.7;
        color: #b9bac6;
        font-size: 14px;
      }
      .back {
        position: absolute;
        top: 14px;
        left: 14px;
        z-index: 2;
        border: none;
        border-radius: 999px;
        padding: 8px 16px;
        background: rgba(10, 10, 15, 0.6);
        color: var(--mt-accent);
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      .back:focus-visible {
        outline: 2px solid var(--mt-accent);
      }

      /* ===== 过渡层：缩略图 ↔ 头图 承接 =====
         关键是比例变化（方图长成宽图）：old/new 快照都设满尺寸 + cover 裁切，
         形变全程画面不拉伸，只是取景框在变。 */
      ::view-transition-group(pic) {
        animation-duration: var(--mt-duration);
        animation-timing-function: var(--mt-ease);
      }
      ::view-transition-old(pic),
      ::view-transition-new(pic) {
        height: 100%;
        width: 100%;
        object-fit: cover;
      }
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: var(--mt-duration);
      }

      /* @mt:fallback 无 API 回退：两页交叉淡化（承接形变不可复刻，节奏一致保证可用） */
      .page.fx-in,
      .page.fx-out {
        animation-duration: var(--mt-duration);
        animation-timing-function: var(--mt-ease);
        animation-fill-mode: both;
      }
      .page.fx-in {
        z-index: 2;
        animation-name: fx-fade-in;
      }
      .page.fx-out {
        z-index: 1;
        animation-name: fx-fade-out;
      }
      @keyframes fx-fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes fx-fade-out {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }

      /* 用户开启「减少动态效果」：一律瞬间切换（JS 同步跳过转场） */
      @media (prefers-reduced-motion: reduce) {
        ::view-transition-group(*),
        ::view-transition-old(*),
        ::view-transition-new(*) {
          animation: none !important;
        }
        .page.fx-in,
        .page.fx-out {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="mt-app" id="mtApp">
      <section class="page page-gallery" id="pageGallery" aria-label="图库页">
        <h2 tabindex="-1">图库</h2>
        <div class="thumb-grid" id="thumbGrid"></div>
      </section>

      <section class="page page-hero" id="pageHero" aria-label="大图页" hidden>
        <button type="button" class="back" id="backBtn">‹ 图库</button>
        <img class="hero" id="heroImg" alt="" />
        <div class="body">
          <h1 id="heroTitle" tabindex="-1">图片标题</h1>
          <p>小方缩略图跨页长成这幅宽图：比例从方到宽，画面全程按裁切取景，不会被拉伸。返回时缩回原来那格。</p>
        </div>
      </section>
    </div>

    <script>
      const CONFIG = {
        slides: [{ src: '/samples/sample-1.webp', caption: '示例标题' }], // 图库图片（图 + 图注）
      };

      (function () {
        const html = document.documentElement;
        const app = document.getElementById('mtApp');
        const pageGallery = document.getElementById('pageGallery');
        const pageHero = document.getElementById('pageHero');
        const heroImg = document.getElementById('heroImg');
        const heroTitle = document.getElementById('heroTitle');
        const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
        let navigating = false; // 转场进行中忽略新的导航
        let activeThumb = null; // 点开的缩略图，返回时共享元素名挂回它

        // ---- 生成缩略图 ----
        const grid = document.getElementById('thumbGrid');
        const thumbs = CONFIG.slides.map((s, i) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'thumb';
          const img = document.createElement('img');
          img.src = s.src;
          img.alt = s.caption || '第 ' + (i + 1) + ' 张';
          const cap = document.createElement('span');
          cap.className = 'cap';
          cap.textContent = s.caption || '第 ' + (i + 1) + ' 张';
          btn.append(img, cap);
          btn.addEventListener('click', () => {
            activeThumb = btn;
            heroImg.src = s.src;
            heroImg.alt = img.alt;
            heroTitle.textContent = cap.textContent;
            go(pageHero, 'forward');
          });
          grid.appendChild(btn);
          return btn;
        });

        // ---- 共享元素命名：只在参与转场时挂 ----
        function nameThumb(on) {
          if (!activeThumb) return;
          activeThumb.querySelector('img').style.viewTransitionName = on ? 'pic' : '';
        }
        function nameHero(on) {
          heroImg.style.viewTransitionName = on ? 'pic' : '';
        }

        function swap(from, to) {
          from.hidden = true;
          to.hidden = false;
        }
        function focusHeading(to) {
          const heading = to.querySelector('h1, h2');
          if (heading) heading.focus({ preventScroll: true });
        }

        // ---- 方向化转场 ----
        function go(to, direction) {
          const from = to === pageHero ? pageGallery : pageHero;
          if (navigating || !to.hidden) return;

          if (reduceMotion.matches) {
            swap(from, to);
            focusHeading(to);
            return;
          }
          navigating = true;
          html.dataset.vt = direction;

          const cleanup = () => {
            nameThumb(false);
            nameHero(false);
            delete html.dataset.vt;
            navigating = false;
            focusHeading(to);
          };

          if (document.startViewTransition) {
            if (direction === 'forward') nameThumb(true);
            else nameHero(true);
            const vt = document.startViewTransition(() => {
              swap(from, to);
              if (direction === 'forward') {
                nameThumb(false);
                nameHero(true);
              } else {
                nameHero(false);
                nameThumb(true);
              }
            });
            vt.finished.finally(cleanup);
          } else {
            // @mt:fallback：两页短暂同框交叉淡化
            to.hidden = false;
            from.classList.add('fx-out');
            to.classList.add('fx-in');
            const done = () => {
              to.removeEventListener('animationend', done);
              from.hidden = true;
              from.classList.remove('fx-out');
              to.classList.remove('fx-in');
              cleanup();
            };
            to.addEventListener('animationend', done);
          }
        }
        const goBack = () => go(pageGallery, 'back');

        // ---- 返回途径：按钮 / Esc / Backspace / 左缘右滑 ----
        document.getElementById('backBtn').addEventListener('click', goBack);
        document.addEventListener('keydown', (e) => {
          if (pageHero.hidden) return;
          if (e.key === 'Escape' || e.key === 'Backspace') {
            e.preventDefault();
            goBack();
          }
        });
        let edgeStartX = null;
        app.addEventListener('pointerdown', (e) => {
          if (pageHero.hidden) return;
          const rect = app.getBoundingClientRect();
          edgeStartX = e.clientX - rect.left <= 32 ? e.clientX : null;
        });
        app.addEventListener('pointerup', (e) => {
          if (edgeStartX !== null && e.clientX - edgeStartX > 60) goBack();
          edgeStartX = null;
        });
        app.addEventListener('pointercancel', () => (edgeStartX = null));

        /* @mt:thumb-start */
        // 缩略图演示：自动点开→返回往返播放，轮换不同缩略图；切后台暂停，reduced-motion 不启动
        if (!reduceMotion.matches) {
          let demoIndex = 0;
          setInterval(() => {
            if (document.hidden || navigating) return;
            if (pageHero.hidden) {
              thumbs[demoIndex % thumbs.length].click();
              demoIndex++;
            } else {
              goBack();
            }
          }, 2400);
        }
        /* @mt:thumb-end */
      })();
    </script>
  </body>
</html>
