<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字符画图</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; display: grid; place-items: center; }
  canvas { display: block; max-width: 94vw; max-height: 90vh; cursor: crosshair; touch-action: none; }
</style>
</head>
<body>
<canvas id="mtCanvas" role="img" aria-label="用字符拼成的图片"></canvas>
<script>
  const CONFIG = {
    photo: "/samples/sample-1.webp",  // 图片
    cell: 9,                 // 字符格大小（px，越小越细）
    charset: " .:-=+*#%@",   // 字符表：从暗到亮
    colored: false,          // 用画面颜色着色（关闭则单色）
    color: "#7cf49a",        // 单色模式下的字符颜色
    invert: false,           // 反转明暗（浅色底用）
    reveal: true,            // 进场时字符随机逐个出现
    magnify: true,           // 鼠标附近格子更细（放大镜）
  };

  const canvas = document.getElementById('mtCanvas'), ctx = canvas.getContext('2d');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dpr = Math.min(2, devicePixelRatio || 1), W = 720, H = 480;
  canvas.width = W * dpr; canvas.height = H * dpr; canvas.style.width = W + 'px'; canvas.style.height = H + 'px'; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = Math.floor(W / CONFIG.cell), rows = Math.floor(H / (CONFIG.cell * 1.15));
  let lum = null, rgb = null, order = null, t0 = 0;
  const img = new Image(); img.src = CONFIG.photo;
  img.onload = () => {
    // 缩到一格一像素取亮度与颜色
    const small = document.createElement('canvas'); small.width = cols; small.height = rows; const sc = small.getContext('2d');
    const s = Math.max(cols / img.width, rows / img.height), dw = img.width * s, dh = img.height * s;
    sc.drawImage(img, (cols - dw) / 2, (rows - dh) / 2, dw, dh);
    const d = sc.getImageData(0, 0, cols, rows).data;
    lum = new Float32Array(cols * rows); rgb = new Array(cols * rows);
    for (let i = 0; i < cols * rows; i++) { const r = d[i * 4], g = d[i * 4 + 1], b = d[i * 4 + 2]; let l = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255; if (CONFIG.invert) l = 1 - l; lum[i] = l; rgb[i] = `rgb(${r},${g},${b})`; }
    // 进场顺序：随机打乱的索引，按时间逐个亮起
    order = new Float32Array(cols * rows); for (let i = 0; i < order.length; i++) order[i] = Math.random();
    t0 = performance.now();
  };
  const mouse = { x: -1e4, y: -1e4 };
  canvas.addEventListener('pointermove', (e) => { const r = canvas.getBoundingClientRect(); mouse.x = (e.clientX - r.left) * (W / r.width); mouse.y = (e.clientY - r.top) * (H / r.height); });
  canvas.addEventListener('pointerleave', () => { mouse.x = mouse.y = -1e4; });

  const chars = [...CONFIG.charset];
  function frame(now) {
    requestAnimationFrame(frame);
    if (document.hidden || !lum) return;
    ctx.clearRect(0, 0, W, H);
    const cw = CONFIG.cell, ch = CONFIG.cell * 1.15, progress = (CONFIG.reveal && !reduceMotion) ? Math.min(1, (now - t0) / 1800) : 1;
    ctx.font = `${cw * 1.3}px ui-monospace, Menlo, Consolas, monospace`; ctx.textBaseline = 'top';
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const i = y * cols + x;
      if (order[i] > progress) continue;
      const px = x * cw, py = y * ch;
      ctx.fillStyle = CONFIG.colored ? rgb[i] : CONFIG.color;
      // 放大镜：鼠标 90px 内把一格拆成 2×2 更细的格，用原图采样不到就用同亮度字符加密度模拟
      if (CONFIG.magnify && Math.hypot(px - mouse.x, py - mouse.y) < 90) {
        ctx.font = `${cw * 0.7}px ui-monospace, Menlo, Consolas, monospace`;
        const c = chars[Math.min(chars.length - 1, Math.floor(lum[i] * chars.length))];
        ctx.fillText(c, px, py); ctx.fillText(c, px + cw / 2, py); ctx.fillText(c, px, py + ch / 2); ctx.fillText(c, px + cw / 2, py + ch / 2);
        ctx.font = `${cw * 1.3}px ui-monospace, Menlo, Consolas, monospace`;
      } else {
        ctx.fillText(chars[Math.min(chars.length - 1, Math.floor(lum[i] * chars.length))], px, py);
      }
    }
  }
  requestAnimationFrame(frame);
  // 点击重放进场
  canvas.addEventListener('click', () => { t0 = performance.now(); });
</script>
</body>
</html>
