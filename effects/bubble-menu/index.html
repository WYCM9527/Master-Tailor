<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>气泡菜单</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;              /* 页面底色 */
    --mt-menuBg: #ffffff;          /* 药丸底色 */
    --mt-contentColor: #111111;    /* 药丸文字色 */
  }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mt-bg);
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  /* 顶栏：左 logo 胶囊、右圆形汉堡钮，都是白底带柔影的「气泡」 */
  .mt-bar {
    position: absolute; left: 0; right: 0; top: 32px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px;
    pointer-events: none;
  }
  .mt-bubble {
    background: var(--mt-menuBg);
    color: var(--mt-contentColor);
    border-radius: 9999px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
    pointer-events: auto;
  }
  .mt-logo {
    height: 56px; min-width: 120px; padding: 0 32px;
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 800; letter-spacing: 0.12em; font-size: 14px;
  }
  .mt-toggle {
    width: 56px; height: 56px; border: 0; cursor: pointer; padding: 0;
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  }
  .mt-toggle span {
    display: block; width: 26px; height: 2px; border-radius: 2px;
    background: var(--mt-contentColor);
    transition: transform 0.3s ease;
    transform-origin: center;
  }
  /* 开启态：两条线交叉成 × */
  .mt-toggle.is-open span:first-child { transform: translateY(4px) rotate(45deg); }
  .mt-toggle.is-open span:last-child { transform: translateY(-4px) rotate(-45deg); }

  /* 全屏浮层：药丸列表居中，3 列布局；第二行不满时居中 */
  .mt-overlay {
    position: absolute; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    pointer-events: none;
  }
  .mt-overlay.is-shown { display: flex; }
  .mt-list {
    list-style: none; margin: 0; padding: 0 24px;
    width: 100%; max-width: 1600px;
    display: flex; flex-wrap: wrap; row-gap: 4px;
    pointer-events: auto;
  }
  .mt-list li { flex: 0 0 calc(100% / 3); display: flex; justify-content: center; align-items: stretch; box-sizing: border-box; }
  .mt-list li:nth-child(4):nth-last-child(2) { margin-left: calc(100% / 6); }
  .mt-list li:nth-child(4):last-child { margin-left: calc(100% / 3); }
  /* 大号药丸：白底、圆角、倾斜；进场 scale 0→1 用带过冲的贝塞尔模拟弹簧 */
  .mt-pill {
    --rot: 0deg;
    width: 100%;
    min-height: 160px;
    padding: clamp(1.5rem, 3vw, 8rem) 0;
    border-radius: 999px;
    background: var(--mt-menuBg);
    color: var(--mt-contentColor);
    text-decoration: none;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
    display: flex; align-items: center; justify-content: center;
    position: relative; box-sizing: border-box;
    white-space: nowrap; overflow: hidden;
    font-size: clamp(1.5rem, 4vw, 4rem);
    font-weight: 400;
    transform: rotate(var(--rot)) scale(0);
    transition:
      transform var(--dur, 0.5s) cubic-bezier(0.34, 1.56, 0.64, 1) var(--delay, 0s),
      background 0.3s ease-in-out, color 0.3s ease-in-out;
    will-change: transform;
  }
  .mt-overlay.is-open .mt-pill { transform: rotate(var(--rot)) scale(1); }
  /* 悬停：放大一点并染成自己的颜色；按下缩一点 */
  .mt-overlay.is-open .mt-pill:hover,
  .mt-overlay.is-open .mt-pill.is-hover { transform: rotate(var(--rot)) scale(1.06); background: var(--hover-bg); color: #fff; transition-delay: 0s; }
  .mt-overlay.is-open .mt-pill:active { transform: rotate(var(--rot)) scale(0.94); }
  /* 标签：从下方 24px 淡入，比药丸稍晚一点 */
  .mt-pill span {
    display: inline-block; line-height: 1.2; height: 1.2em;
    transform: translateY(24px); opacity: 0;
    transition: transform var(--dur, 0.5s) cubic-bezier(0.22, 1, 0.36, 1) var(--delay, 0s),
                opacity var(--dur, 0.5s) cubic-bezier(0.22, 1, 0.36, 1) var(--delay, 0s);
  }
  .mt-overlay.is-open .mt-pill span { transform: translateY(0); opacity: 1; }
  /* 关闭：0.2s 快速缩回，不要交错 */
  .mt-overlay.is-closing .mt-pill { transition: transform 0.2s cubic-bezier(0.55, 0, 1, 0.45) 0s; }
  .mt-overlay.is-closing .mt-pill span { transition: transform 0.2s ease-in 0s, opacity 0.2s ease-in 0s; }

  /* 用户开启「减少动态效果」时：直接出现 / 消失，不做弹簧与交错 */
  @media (prefers-reduced-motion: reduce) {
    .mt-pill, .mt-pill span, .mt-toggle span { transition: none !important; }
  }
</style>
</head>
<body>
<nav class="mt-bar" aria-label="主导航">
  <div class="mt-bubble mt-logo" id="mtLogo">LOGO</div>
  <button type="button" class="mt-bubble mt-toggle" id="mtToggle" aria-label="打开菜单" aria-pressed="false"><span></span><span></span></button>
</nav>
<div class="mt-overlay" id="mtOverlay" aria-hidden="true">
  <ul class="mt-list" id="mtList" role="menu"></ul>
</div>
<script>
  const CONFIG = {
    items: "首页｜关于｜作品｜博客｜联系", // 菜单项，用「｜」分隔
    logoText: "LOGO",                          // 左上角标识
    hoverColors: ["#3b82f6", "#10b981", "#f59e0b", "#ef4444", "#8b5cf6"], // 悬停颜色（按序分配）
    rotation: 8,       // 倾斜角度（度）
    duration: 0.5,     // 弹出时长（s）
    stagger: 0.12,     // 交错间隔（s）
    autoDemo: true,    // 自动开合演示
  };

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.getElementById('mtLogo').textContent = CONFIG.logoText;
  const toggle = document.getElementById('mtToggle');
  const overlay = document.getElementById('mtOverlay');
  const list = document.getElementById('mtList');

  // 生成药丸：倾斜方向按 −,+,+,+,− 的节奏交替（首尾向左、中间向右），颜色按序取
  const names = CONFIG.items.split('｜').map(s => s.trim()).filter(Boolean);
  const pills = names.map((name, i) => {
    const li = document.createElement('li'); li.setAttribute('role', 'none');
    const a = document.createElement('a');
    a.className = 'mt-pill'; a.href = '#'; a.setAttribute('role', 'menuitem');
    a.addEventListener('click', e => e.preventDefault());
    const sign = (i === 0 || i === names.length - 1) ? -1 : 1;
    a.style.setProperty('--rot', `${sign * CONFIG.rotation}deg`);
    a.style.setProperty('--hover-bg', CONFIG.hoverColors[i % CONFIG.hoverColors.length]);
    a.style.setProperty('--dur', `${CONFIG.duration}s`);
    const span = document.createElement('span'); span.textContent = name;
    a.appendChild(span); li.appendChild(a); list.appendChild(li);
    return a;
  });

  let open = false, closeTimer = 0;
  function setOpen(next) {
    open = next;
    toggle.classList.toggle('is-open', open);
    toggle.setAttribute('aria-pressed', String(open));
    toggle.setAttribute('aria-label', open ? '关闭菜单' : '打开菜单');
    overlay.setAttribute('aria-hidden', String(!open));
    clearTimeout(closeTimer);
    if (open) {
      overlay.classList.remove('is-closing');
      overlay.classList.add('is-shown');
      // 每颗药丸的交错延迟：序号 × 间隔 ± 50ms 随机，弹得更有生气
      pills.forEach((p, i) => p.style.setProperty('--delay', `${Math.max(0, i * CONFIG.stagger + (Math.random() - 0.5) * 0.1)}s`));
      requestAnimationFrame(() => requestAnimationFrame(() => overlay.classList.add('is-open')));
    } else {
      overlay.classList.add('is-closing');
      overlay.classList.remove('is-open');
      closeTimer = setTimeout(() => { overlay.classList.remove('is-shown', 'is-closing'); }, reduceMotion ? 0 : 220);
    }
  }
  let userTook = false;   // 用户碰过开关后，自动演示交还控制
  toggle.addEventListener('click', () => { userTook = true; setOpen(!open); });

  /* @mt:thumb-start */
  // 自动演示：开 → 逐个悬停一遍 → 关，循环；用户一点开关就交还控制
  if (CONFIG.autoDemo && !reduceMotion) {
    let step = 0;
    setInterval(() => {
      if (document.hidden || userTook) return;
      const phase = step % 8;
      if (phase === 0) setOpen(true);
      else if (phase >= 2 && phase <= 5) {
        pills.forEach(p => p.classList.remove('is-hover'));
        const target = pills[(phase - 2) % pills.length];
        if (target) target.classList.add('is-hover');
      } else if (phase === 6) { pills.forEach(p => p.classList.remove('is-hover')); setOpen(false); }
      step++;
    }, 900);
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
