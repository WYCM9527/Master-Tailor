<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>点击涟漪</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;          /* 页面底色 */
    --mt-color: #26283a;       /* 按钮底色 */
    --mt-rippleColor: #ffffff; /* 涟漪颜色 */
    --mt-duration: 0.6s;       /* 涟漪扩散时长 */
  }

  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mt-bg);
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  .mt-ripple-btn {
    position: relative;
    overflow: hidden;
    padding: 16px 40px;
    font-size: 17px;
    font-weight: 600;
    color: #f2f3f8;
    background: var(--mt-color);
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }

  .mt-ripple-btn .ripple {
    position: absolute;
    border-radius: 50%;
    background: var(--mt-rippleColor);
    opacity: 0.5;
    transform: scale(0);
    pointer-events: none;
    animation: mt-ripple var(--mt-duration) ease-out forwards;
  }

  @keyframes mt-ripple {
    to { transform: scale(2.6); opacity: 0; }
  }

  /* 用户开启「减少动态效果」时：涟漪退化为一次快速的整体高亮闪烁 */
  @media (prefers-reduced-motion: reduce) {
    .mt-ripple-btn .ripple {
      animation: mt-flash 0.25s ease-out forwards;
      transform: none;
      border-radius: 12px;
      inset: 0 !important;
      width: auto !important;
      height: auto !important;
    }
    @keyframes mt-flash {
      from { opacity: 0.35; }
      to { opacity: 0; }
    }
  }
</style>
</head>
<body>
<button class="mt-ripple-btn" id="mtBtn" type="button">点我试试</button>
<script>
  const CONFIG = {
    label: "点我试试",  // 按钮文字
    fromCenter: false, // true = 涟漪始终从按钮中心扩散；false = 从点击位置扩散
  };

  const btn = document.getElementById('mtBtn');
  btn.textContent = CONFIG.label;

  // 在指定位置生成一枚涟漪，动画结束后自动移除节点
  function spawnRipple(clientX, clientY) {
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const x = CONFIG.fromCenter ? rect.width / 2 : clientX - rect.left;
    const y = CONFIG.fromCenter ? rect.height / 2 : clientY - rect.top;
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (x - size / 2) + 'px';
    ripple.style.top = (y - size / 2) + 'px';
    ripple.addEventListener('animationend', () => ripple.remove());
    btn.appendChild(ripple);
  }

  btn.addEventListener('pointerdown', (e) => spawnRipple(e.clientX, e.clientY));

  /* @mt:thumb-start */
  if (window.__MT_ENV && window.__MT_ENV.thumb) {
    // 缩略图演示：每 1.6 秒在按钮上随机位置自动点一下
    setInterval(() => {
      if (document.hidden) return;
      const rect = btn.getBoundingClientRect();
      spawnRipple(
        rect.left + rect.width * (0.25 + Math.random() * 0.5),
        rect.top + rect.height * (0.3 + Math.random() * 0.4)
      );
    }, 1600);
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
