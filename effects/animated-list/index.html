<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>滚入列表</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;            /* 页面底色 */
    --mt-itemBg: #222222;        /* 条目底色 */
    --mt-selectedBg: #333333;    /* 选中底色 */
    --mt-textColor: #ffffff;     /* 文字颜色 */
  }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mt-bg);
    display: grid; place-items: center;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .mt-wrap { position: relative; width: min(500px, 90vw); }
  /* 列表容器：固定高度自滚动，隐藏滚动条 */
  .mt-list {
    max-height: min(400px, 70vh);
    overflow-y: auto;
    padding: 16px;
    outline: none;
    scrollbar-width: none;
  }
  .mt-list::-webkit-scrollbar { display: none; }
  /* 条目：进入视口前缩小透明，进入后 0.2s 放大浮现 */
  .mt-item {
    margin-bottom: 16px;
    transform: scale(var(--from, 0.7));
    opacity: 0;
    transition: transform var(--dur, 0.2s) ease-out, opacity var(--dur, 0.2s) ease-out;
  }
  .mt-item.in { transform: scale(1); opacity: 1; }
  .mt-item > div {
    padding: 16px;
    border-radius: 8px;
    background: var(--mt-itemBg);
    color: var(--mt-textColor);
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .mt-item.selected > div { background: var(--mt-selectedBg); }
  /* 两端渐隐：顶部 50px、底部 100px 的底色渐变，透明度随滚动位置变化 */
  .mt-fade { position: absolute; left: 0; right: 0; pointer-events: none; transition: opacity 0.3s ease; }
  .mt-fade.top { top: 0; height: 50px; background: linear-gradient(to bottom, var(--mt-bg), transparent); }
  .mt-fade.bottom { bottom: 0; height: 100px; background: linear-gradient(to top, var(--mt-bg), transparent); }

  /* 用户开启「减少动态效果」时：条目直接可见 */
  @media (prefers-reduced-motion: reduce) { .mt-item { transition: none; transform: none; opacity: 1; } }
</style>
</head>
<body>
<div class="mt-wrap">
  <div class="mt-list" id="mtList" role="listbox" tabindex="0" aria-label="列表"></div>
  <div class="mt-fade top" id="mtTop"></div>
  <div class="mt-fade bottom" id="mtBottom"></div>
</div>
<script>
  const CONFIG = {
    items: "晨间新闻｜产品更新｜团队周报｜设计评审｜用户反馈｜发布计划｜数据周报｜市场动态｜招聘进展｜财务简报｜季度目标｜年度回顾", // 条目
    duration: 0.2,         // 浮现时长（s）
    fromScale: 0.7,        // 起始缩放
    showGradients: true,   // 两端渐隐
    keyboardNav: true,     // 键盘选中
  };

  const list = document.getElementById('mtList');
  const topFade = document.getElementById('mtTop'), bottomFade = document.getElementById('mtBottom');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let userTook = false;   // 用户碰过列表后，自动演示交还控制
  if (!CONFIG.showGradients) { topFade.remove(); bottomFade.remove(); }

  const names = CONFIG.items.split('｜').map(s => s.trim()).filter(Boolean);
  const items = names.map((name, i) => {
    const li = document.createElement('div');
    li.className = 'mt-item'; li.dataset.index = i; li.setAttribute('role', 'option');
    li.style.setProperty('--from', CONFIG.fromScale);
    li.style.setProperty('--dur', `${CONFIG.duration}s`);
    li.innerHTML = '<div></div>'; li.firstChild.textContent = name;
    li.addEventListener('click', () => select(i));
    li.addEventListener('mouseenter', () => select(i, false));
    list.appendChild(li);
    return li;
  });

  // 进入视口 50% 以上就浮现，离开则缩回（滚回来还会再浮一次）
  const io = new IntersectionObserver((entries) => {
    entries.forEach((e) => e.target.classList.toggle('in', e.isIntersecting));
  }, { root: list, threshold: 0.5 });
  items.forEach((li) => io.observe(li));

  // 选中态 + 键盘导航：↑↓/Tab 移动，Enter 确认；选中项滚到可见
  let selected = -1;
  function select(i, ensureVisible = true) {
    selected = i;
    items.forEach((li, k) => { li.classList.toggle('selected', k === i); li.setAttribute('aria-selected', String(k === i)); });
    if (!ensureVisible) return;
    const el = items[i], top = el.offsetTop, bottom = top + el.offsetHeight, extra = 50;
    if (top < list.scrollTop + extra) list.scrollTo({ top: top - extra, behavior: reduceMotion ? 'auto' : 'smooth' });
    else if (bottom > list.scrollTop + list.clientHeight - extra) list.scrollTo({ top: bottom - list.clientHeight + extra, behavior: reduceMotion ? 'auto' : 'smooth' });
  }
  if (CONFIG.keyboardNav) {
    list.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown' || (e.key === 'Tab' && !e.shiftKey)) { e.preventDefault(); userTook = true; select(Math.min(selected + 1, items.length - 1)); }
      else if (e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey)) { e.preventDefault(); userTook = true; select(Math.max(selected - 1, 0)); }
      else if (e.key === 'Enter' && selected >= 0) { e.preventDefault(); items[selected].firstChild.style.outline = '2px solid rgba(255,255,255,0.6)'; setTimeout(() => (items[selected].firstChild.style.outline = ''), 300); }
    });
  }

  // 两端渐隐的透明度随滚动位置：顶部滚过 50px 全显，底部离底 50px 内渐隐
  function onScroll() {
    if (!CONFIG.showGradients) return;
    topFade.style.opacity = Math.min(list.scrollTop / 50, 1);
    const bottomDist = list.scrollHeight - (list.scrollTop + list.clientHeight);
    bottomFade.style.opacity = list.scrollHeight <= list.clientHeight ? 0 : Math.min(bottomDist / 50, 1);
  }
  list.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  /* @mt:thumb-start */
  // 缩略图演示：自动往返滚动并顺序选中；用户一碰就交还
  if (!reduceMotion) {
    for (const ev of ['wheel', 'pointerdown', 'touchstart']) list.addEventListener(ev, () => (userTook = true), { passive: true, once: true });
    let dir = 1, tick = 0;
    (function auto() {
      if (userTook) return;
      if (!document.hidden) {
        const max = list.scrollHeight - list.clientHeight;
        list.scrollTop += dir * 1.5;
        if (list.scrollTop >= max - 1) dir = -1;
        if (list.scrollTop <= 1) dir = 1;
        if (++tick % 70 === 0) select((selected + 1) % items.length, false);
      }
      requestAnimationFrame(auto);
    })();
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
