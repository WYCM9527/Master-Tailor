<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>点击火花</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-accent: #ffffff;    /* 按钮颜色 */
  }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mt-bg);
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  /* 火花画在铺满页面的 canvas 上，页面任何位置点击都会炸花 */
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .mt-btn {
    position: relative;
    z-index: 1;
    padding: 14px 32px;
    border: 1px solid var(--mt-accent);
    background: var(--mt-accent);
    color: #0a0a0f;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.12s ease;
  }
  .mt-btn:active { transform: scale(0.96); }
  .mt-hint {
    position: fixed;
    left: 50%; bottom: 22px;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.35);
    font-size: 13px;
    letter-spacing: 0.12em;
  }

  /* 用户开启「减少动态效果」时：不出火花，只保留按钮按压反馈 */
  @media (prefers-reduced-motion: reduce) {
    canvas { display: none; }
  }
</style>
</head>
<body>
<canvas id="mtSpark" aria-hidden="true"></canvas>
<button type="button" class="mt-btn" id="mtBtn">点我一下</button>
<div class="mt-hint">页面任意位置点击都有火花</div>
<script>
  const CONFIG = {
    count: 8,          // 火花数量
    length: 14,        // 火花长度（px）
    distance: 60,      // 飞出距离（px）
    duration: 450,     // 持续时间（毫秒）
    thickness: 2,      // 线条粗细
    color: "#ffffff",  // 火花颜色
    label: "点我一下",  // 按钮文字
  };

  const canvas = document.getElementById('mtSpark');
  const ctx = canvas.getContext('2d');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.getElementById('mtBtn').textContent = CONFIG.label;
  const dpr = Math.min(2, devicePixelRatio || 1);
  function resize() {
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  addEventListener('resize', resize);

  // 每次点击生成一组火花：等角分布、带随机微扰；每根是一条沿径向飞出并变短的线段
  const bursts = [];
  function burst(x, y) {
    if (reduceMotion) return;
    const sparks = [];
    for (let i = 0; i < CONFIG.count; i++) {
      const a = (Math.PI * 2 * i) / CONFIG.count + (Math.random() - 0.5) * 0.3;
      sparks.push({ a, d: CONFIG.distance * (0.8 + Math.random() * 0.4) });
    }
    bursts.push({ x, y, sparks, start: performance.now() });
  }
  addEventListener('pointerdown', e => burst(e.clientX, e.clientY));

  const easeOut = t => 1 - Math.pow(1 - t, 3);
  function frame(now) {
    if (!document.hidden) {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      ctx.strokeStyle = CONFIG.color;
      ctx.lineWidth = CONFIG.thickness;
      ctx.lineCap = 'butt';
      for (let i = bursts.length - 1; i >= 0; i--) {
        const b = bursts[i];
        const t = (now - b.start) / CONFIG.duration;
        if (t >= 1) { bursts.splice(i, 1); continue; }
        const k = easeOut(t);
        // 线段外端飞到 k×距离，长度随时间缩短到 0
        const len = CONFIG.length * (1 - t);
        for (const s of b.sparks) {
          const r1 = s.d * k, r0 = Math.max(0, r1 - len);
          ctx.beginPath();
          ctx.moveTo(b.x + Math.cos(s.a) * r0, b.y + Math.sin(s.a) * r0);
          ctx.lineTo(b.x + Math.cos(s.a) * r1, b.y + Math.sin(s.a) * r1);
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* @mt:thumb-start */
  // 缩略图演示：每隔一会儿在随机位置炸一次火花
  if (!reduceMotion) {
    setInterval(() => {
      if (document.hidden) return;
      burst(innerWidth * (0.2 + Math.random() * 0.6), innerHeight * (0.25 + Math.random() * 0.5));
    }, 900);
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
