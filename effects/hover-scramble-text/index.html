<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>悬停乱序文字</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-color: #f2f3f8;     /* 文字颜色 */
    --mt-accent: #ffffff;    /* 乱字颜色 */
    --mt-fontSize: 30px;     /* 字号 */
    --mt-font: "JetBrains Mono", ui-monospace, monospace; /* 字体 */
  }

  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mt-bg);
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  .mt-scr {
    max-width: 80vw;
    text-align: center;
    font-family: var(--mt-font);
    font-size: var(--mt-fontSize);
    font-weight: 600;
    line-height: 1.6;
    color: var(--mt-color);
    cursor: default;
    user-select: none;
  }
  .mt-scr .c {
    display: inline-block;
    min-width: 0.62em;
    text-align: center;
    white-space: pre;
  }
  .mt-scr .c.hit { color: var(--mt-accent); }

  /* 用户开启「减少动态效果」时：不扰动（JS 同步处理） */
  @media (prefers-reduced-motion: reduce) {
    .mt-scr .c { transition: none; }
  }
</style>
</head>
<body>
<p class="mt-scr" id="mtScr"></p>
<script>
  const CONFIG = {
    text: "把鼠标划过这行字，它会被扰动、再自己复原。", // 文案
    radius: 70,      // 扰动半径（px）
    duration: 800,   // 复原时长（毫秒）
    speed: 40,       // 乱字刷新（毫秒）
    glyphs: "symbol", // 乱字字符：symbol 符号 / latin 字母数字 / block 方块与线
  };

  const POOLS = {
    symbol: "!@#$%&*+=?/<>{}[]|~^",
    latin: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789",
    block: "▓▒░█▀▄▌▐│─┼",
  };
  const host = document.getElementById('mtScr');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const chars = Array.from(CONFIG.text);
  const pool = Array.from(POOLS[CONFIG.glyphs] || POOLS.symbol);
  host.setAttribute('aria-label', CONFIG.text);

  // 每个字位记录「扰动到期时间」，到期前每次刷新都换乱字，到期后写回原字
  const cells = chars.map(ch => {
    const c = document.createElement('span');
    c.className = 'c';
    c.textContent = ch;
    c.setAttribute('aria-hidden', 'true');
    c.dataset.until = '0';
    host.appendChild(c);
    return c;
  });

  function disturbAt(x, y) {
    if (reduceMotion) return;
    const now = performance.now();
    cells.forEach((c, i) => {
      if (!chars[i].trim()) return;
      const r = c.getBoundingClientRect();
      const dx = r.left + r.width / 2 - x, dy = r.top + r.height / 2 - y;
      if (Math.hypot(dx, dy) <= CONFIG.radius) c.dataset.until = String(now + CONFIG.duration);
    });
  }
  host.addEventListener('pointermove', e => disturbAt(e.clientX, e.clientY));

  // 统一刷新：被扰动且未到期的位换乱字，到期的复原
  setInterval(() => {
    if (document.hidden) return;
    const now = performance.now();
    cells.forEach((c, i) => {
      const until = Number(c.dataset.until);
      if (until > now) {
        c.textContent = pool[Math.floor(Math.random() * pool.length)];
        c.classList.add('hit');
      } else if (c.textContent !== chars[i]) {
        c.textContent = chars[i];
        c.classList.remove('hit');
      }
    });
  }, CONFIG.speed);

  /* @mt:thumb-start */
  // 缩略图演示：一个看不见的指针在文字上来回扫过；真实鼠标进入后交还控制
  if (!reduceMotion) {
    let t = 0, auto = true;
    host.addEventListener('pointerenter', () => (auto = false));
    host.addEventListener('pointerleave', () => (auto = true));
    setInterval(() => {
      if (document.hidden || !auto) return;
      const r = host.getBoundingClientRect();
      t += 0.035;
      const x = r.left + r.width * (0.5 + 0.45 * Math.sin(t));
      const y = r.top + r.height * (0.5 + 0.3 * Math.sin(t * 2.3));
      disturbAt(x, y);
    }, 40);
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
