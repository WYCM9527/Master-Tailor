<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>魔术移动转场</title>
    <style>
      :root {
        --mt-bg: #0a0a0f; /* 页面底色 */
        --mt-duration: 0.6s; /* 转场时长 */
        --mt-ease: cubic-bezier(0.4, 0, 0.2, 1); /* 缓动曲线 */
        --mt-accent: #ffffff; /* 强调色：标题与徽章 */
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--mt-bg);
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #f2f2f7;
      }

      .mt-app {
        position: relative;
        width: min(880px, 94vw);
        height: min(560px, 92vh);
        background: #101016;
        border-radius: 18px;
        overflow: clip;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
      }
      .page {
        position: absolute;
        inset: 0;
      }
      .page[hidden] {
        display: none;
      }

      /* ---- 同一组元素在两幕里的不同位置 ----
         三个承接元素静态命名（两幕互斥显示，不会重名）：
         title / pic / badge 各自从 A 幕的位置飞到 B 幕的新位置。 */
      .badge {
        position: absolute;
        view-transition-name: badge;
        font-family: ui-monospace, monospace;
        font-size: 13px;
        letter-spacing: 0.16em;
        color: var(--mt-accent);
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 999px;
        padding: 6px 14px;
      }
      .pic {
        position: absolute;
        view-transition-name: pic;
        object-fit: cover;
        border-radius: 14px;
      }
      .headline {
        view-transition-name: title;
        margin: 0;
        font-weight: 700;
        color: var(--mt-accent);
        outline: none;
        line-height: 1.25;
      }
      .note {
        margin: 0;
        color: #9a9ba8;
        font-size: 13.5px;
        max-width: 300px;
        line-height: 1.7;
      }

      /* A 幕：标题大字在左下（与说明组成一个流式组块，永不互相挤压），
         图小在右上，徽章左上 */
      .slide-a .badge {
        top: 28px;
        left: 40px;
      }
      .slide-a .pic {
        top: 28px;
        right: 40px;
        width: 34%;
        aspect-ratio: 4 / 3;
      }
      .slide-a .copy {
        position: absolute;
        left: 40px;
        right: 40px;
        bottom: 38px;
        display: grid;
        gap: 12px;
        justify-items: start;
      }
      .slide-a .headline {
        font-size: clamp(28px, 4.6vw, 46px);
        max-width: 90%;
      }
      .slide-a .note {
        max-width: 380px;
      }

      /* B 幕：标题小字居上，图大居中偏下，徽章右下 */
      .slide-b .badge {
        right: 28px;
        bottom: 26px;
      }
      .slide-b .pic {
        left: 50%;
        bottom: 66px;
        translate: -50% 0;
        width: 62%;
        aspect-ratio: 16 / 9;
      }
      .slide-b .headline {
        position: absolute;
        top: 30px;
        left: 50%;
        translate: -50% 0;
        font-size: 22px;
        white-space: nowrap;
      }
      .slide-b .note {
        position: absolute;
        top: 78px;
        left: 50%;
        translate: -50% 0;
        text-align: center;
      }

      .stage-btn {
        position: absolute;
        z-index: 2;
        right: 22px;
        top: 50%;
        translate: 0 -50%;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 999px;
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        background: rgba(10, 10, 15, 0.5);
        color: var(--mt-accent);
        font-size: 17px;
        cursor: pointer;
      }
      .stage-btn.prev {
        right: auto;
        left: 22px;
      }
      .stage-btn:focus-visible {
        outline: 2px solid var(--mt-accent);
        outline-offset: 2px;
      }

      /* ===== 过渡层：多元素同步形变 =====
         位置与尺寸的补间由浏览器自动生成，这里只统一时长与曲线；
         图片快照按 cover 裁切避免比例变化拉伸。 */
      ::view-transition-group(title),
      ::view-transition-group(pic),
      ::view-transition-group(badge) {
        animation-duration: var(--mt-duration);
        animation-timing-function: var(--mt-ease);
      }
      ::view-transition-old(pic),
      ::view-transition-new(pic) {
        height: 100%;
        width: 100%;
        object-fit: cover;
      }
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: var(--mt-duration);
      }

      /* @mt:fallback 无 API 回退：两幕交叉淡化（多元素飞行不可复刻，节奏一致保证可用） */
      .page.fx-in,
      .page.fx-out {
        animation-duration: var(--mt-duration);
        animation-timing-function: var(--mt-ease);
        animation-fill-mode: both;
      }
      .page.fx-in {
        z-index: 2;
        animation-name: fx-fade-in;
      }
      .page.fx-out {
        z-index: 1;
        animation-name: fx-fade-out;
      }
      @keyframes fx-fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes fx-fade-out {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }

      /* 用户开启「减少动态效果」：一律瞬间切换（JS 同步跳过转场） */
      @media (prefers-reduced-motion: reduce) {
        ::view-transition-group(*),
        ::view-transition-old(*),
        ::view-transition-new(*) {
          animation: none !important;
        }
        .page.fx-in,
        .page.fx-out {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="mt-app" id="mtApp">
      <section class="page slide-a" id="slideA" aria-label="第一幕">
        <span class="badge">SCENE 01</span>
        <img class="pic" id="picA" alt="" />
        <div class="copy">
          <h1 class="headline" id="titleA" tabindex="-1"></h1>
          <p class="note">同一组元素——标题、图片、徽章——将各自飞到下一幕的新位置。</p>
        </div>
        <button type="button" class="stage-btn next" id="nextBtn" aria-label="下一幕">›</button>
      </section>

      <section class="page slide-b" id="slideB" aria-label="第二幕" hidden>
        <span class="badge">SCENE 02</span>
        <img class="pic" id="picB" alt="" />
        <h1 class="headline" id="titleB" tabindex="-1"></h1>
        <p class="note">位置与尺寸全部换了，但它们是同一批物体。按 Esc 回到上一幕。</p>
        <button type="button" class="stage-btn prev" id="prevBtn" aria-label="上一幕">‹</button>
      </section>
    </div>

    <script>
      const CONFIG = {
        titleText: '设计，是一次移动。', // 主标题（两幕共用，跟着飞）
        picture: '/samples/sample-6.webp', // 配图（两幕共用，边飞边变尺寸）
      };

      (function () {
        const html = document.documentElement;
        const slideA = document.getElementById('slideA');
        const slideB = document.getElementById('slideB');
        const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
        let navigating = false; // 转场进行中忽略新的导航

        document.getElementById('titleA').textContent = CONFIG.titleText;
        document.getElementById('titleB').textContent = CONFIG.titleText;
        for (const id of ['picA', 'picB']) {
          const img = document.getElementById(id);
          img.src = CONFIG.picture;
          img.alt = CONFIG.titleText;
        }

        function swap(from, to) {
          from.hidden = true;
          to.hidden = false;
        }
        function focusHeading(to) {
          const heading = to.querySelector('h1');
          if (heading) heading.focus({ preventScroll: true });
        }

        // ---- 方向化转场（魔术移动本身对称，方向只用于记录） ----
        function go(to, direction) {
          const from = to === slideB ? slideA : slideB;
          if (navigating || !to.hidden) return;

          if (reduceMotion.matches) {
            swap(from, to);
            focusHeading(to);
            return;
          }
          navigating = true;
          html.dataset.vt = direction;

          const cleanup = () => {
            delete html.dataset.vt;
            navigating = false;
            focusHeading(to);
          };

          if (document.startViewTransition) {
            const vt = document.startViewTransition(() => swap(from, to));
            vt.finished.finally(cleanup);
          } else {
            // @mt:fallback：两幕短暂同框交叉淡化
            to.hidden = false;
            from.classList.add('fx-out');
            to.classList.add('fx-in');
            const done = () => {
              to.removeEventListener('animationend', done);
              from.hidden = true;
              from.classList.remove('fx-out');
              to.classList.remove('fx-in');
              cleanup();
            };
            to.addEventListener('animationend', done);
          }
        }
        const goBack = () => go(slideA, 'back');

        // ---- 换幕途径：按钮 / Esc / Backspace ----
        document.getElementById('nextBtn').addEventListener('click', () => go(slideB, 'forward'));
        document.getElementById('prevBtn').addEventListener('click', goBack);
        document.addEventListener('keydown', (e) => {
          if (slideB.hidden) return;
          if (e.key === 'Escape' || e.key === 'Backspace') {
            e.preventDefault();
            goBack();
          }
        });

        /* @mt:thumb-start */
        // 缩略图演示：两幕自动往返；切后台暂停，reduced-motion 不启动
        if (!reduceMotion.matches) {
          setInterval(() => {
            if (document.hidden || navigating) return;
            if (slideB.hidden) go(slideB, 'forward');
            else goBack();
          }, 2600);
        }
        /* @mt:thumb-end */
      })();
    </script>
  </body>
</html>
