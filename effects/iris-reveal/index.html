<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>圆形揭示转场</title>
    <style>
      :root {
        --mt-bg: #0a0a0f; /* 页面底色 */
        --mt-imageA: url('/samples/sample-4.webp'); /* 第一幕海报 */
        --mt-imageB: url('/samples/sample-8.webp'); /* 第二幕海报 */
        --mt-duration: 0.65s; /* 转场时长 */
        --mt-accent: #ffffff; /* 强调色：标题与按钮 */
        --iris-ease: cubic-bezier(0.4, 0, 0.2, 1); /* 圆形展开曲线 */
        --app-radius: 18px; /* 舞台圆角，转场快照也按它裁 */
        /* 圆心由 JS 写入，相对容器（::view-transition-new(page) 的盒子就是这一页的盒子，与容器重合；回退路径同样） */
        --iris-x: 50%;
        --iris-y: 50%;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--mt-bg);
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #f2f2f7;
      }

      .mt-app {
        position: relative;
        width: min(880px, 94vw);
        height: min(560px, 92vh);
        border-radius: var(--app-radius);
        overflow: clip;
        background: #101016;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
      }
      .page {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        cursor: pointer;
      }
      .page[hidden] {
        display: none;
      }
      .page::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(transparent 45%, rgba(0, 0, 0, 0.62));
        pointer-events: none;
      }
      .page-a {
        background-image: var(--mt-imageA);
      }
      .page-b {
        background-image: var(--mt-imageB);
      }
      .poster-copy {
        position: absolute;
        left: 44px;
        bottom: 40px;
        z-index: 1;
        pointer-events: none;
      }
      .poster-copy h1 {
        margin: 0 0 6px;
        font-size: clamp(28px, 5vw, 46px);
        color: var(--mt-accent);
        outline: none;
      }
      .poster-copy p {
        margin: 0;
        color: rgba(255, 255, 255, 0.72);
        font-size: 14.5px;
      }
      .stage-btn {
        position: absolute;
        z-index: 2;
        bottom: 20px;
        right: 22px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 999px;
        padding: 9px 20px;
        background: rgba(10, 10, 15, 0.45);
        color: var(--mt-accent);
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      .stage-btn.prev {
        right: auto;
        left: 22px;
      }
      .stage-btn:focus-visible {
        outline: 2px solid var(--mt-accent);
        outline-offset: 2px;
      }

      /* ===== 过渡层：圆形揭示 =====
         前进：新幕从圆心睁开（半径 0 → 盖满最远角）；返回：旧幕收回圆点。
         垫底一幕保持不动。快照在顶层渲染、不受容器 overflow 裁切，所以在 group 上补舞台圆角
         （只写 border-radius 不裁内容，必须配 overflow: clip）。 */
      ::view-transition-group(page) {
        border-radius: var(--app-radius);
        overflow: clip;
      }
      ::view-transition-old(page),
      ::view-transition-new(page) {
        animation-duration: var(--mt-duration);
        animation-timing-function: var(--iris-ease);
        animation-fill-mode: both;
      }
      html[data-vt='forward']::view-transition-new(page) {
        animation-name: iris-in;
      }
      html[data-vt='forward']::view-transition-old(page) {
        animation-name: hold-still;
      }
      html[data-vt='back']::view-transition-old(page) {
        animation-name: iris-out;
        z-index: 1;
      }
      html[data-vt='back']::view-transition-new(page) {
        animation-name: hold-still;
      }

      @keyframes iris-in {
        from {
          clip-path: circle(0px at var(--iris-x) var(--iris-y));
        }
        to {
          clip-path: circle(142% at var(--iris-x) var(--iris-y));
        }
      }
      @keyframes iris-out {
        from {
          clip-path: circle(142% at var(--iris-x) var(--iris-y));
        }
        to {
          clip-path: circle(0px at var(--iris-x) var(--iris-y));
        }
      }
      @keyframes hold-still {
        from {
          opacity: 1;
        }
        to {
          opacity: 1;
        }
      }

      /* @mt:fallback 无 API 回退：同一组 keyframes 直接加在真实页面上（页面盒子 = 容器，圆心坐标通用） */
      .page.fx-in,
      .page.fx-out {
        animation-duration: var(--mt-duration);
        animation-timing-function: var(--iris-ease);
        animation-fill-mode: both;
      }
      html[data-vt='forward'] .page.fx-in {
        animation-name: iris-in;
        z-index: 2;
      }
      html[data-vt='forward'] .page.fx-out {
        animation-name: hold-still;
        z-index: 1;
      }
      html[data-vt='back'] .page.fx-out {
        animation-name: iris-out;
        z-index: 2;
      }
      html[data-vt='back'] .page.fx-in {
        animation-name: hold-still;
        z-index: 1;
      }

      /* 用户开启「减少动态效果」：一律瞬间切换（JS 同步跳过转场） */
      @media (prefers-reduced-motion: reduce) {
        ::view-transition-group(*),
        ::view-transition-old(*),
        ::view-transition-new(*) {
          animation: none !important;
        }
        .page.fx-in,
        .page.fx-out {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="mt-app" id="mtApp">
      <section class="page page-a" id="pageA" aria-label="第一幕，点击任意处睁开下一幕">
        <div class="poster-copy">
          <h1 tabindex="-1">在点击处睁眼。</h1>
          <p>第一幕 · 点海报任意位置，从那里揭示下一幕</p>
        </div>
        <button type="button" class="stage-btn next" id="nextBtn">下一幕 ›</button>
      </section>

      <section class="page page-b" id="pageB" aria-label="第二幕，点击任意处收回" hidden>
        <div class="poster-copy">
          <h1 tabindex="-1">收回原点。</h1>
          <p>第二幕 · 点任意位置或按 Esc，圆从原点合拢</p>
        </div>
        <button type="button" class="stage-btn prev" id="prevBtn">‹ 上一幕</button>
      </section>
    </div>

    <script>
      const CONFIG = {
        centerMode: 'click', // 圆心位置：click 跟随点击 / center 固定画面中心
      };

      (function () {
        const html = document.documentElement;
        const app = document.getElementById('mtApp');
        const pageA = document.getElementById('pageA');
        const pageB = document.getElementById('pageB');
        const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
        let navigating = false; // 转场进行中忽略新的导航

        // ---- 圆心：点击位置或画面中心，坐标相对容器 ----
        // 快照 ::view-transition-new(page) 的盒子就是这一页的盒子（与容器重合），clip-path 的圆心按它算，
        // 不能直接用 clientX / clientY，否则容器不在视口左上角时圆心会整体偏掉
        function setOrigin(e) {
          if (CONFIG.centerMode === 'center' || !e) {
            html.style.setProperty('--iris-x', '50%');
            html.style.setProperty('--iris-y', '50%');
            return;
          }
          const a = app.getBoundingClientRect();
          html.style.setProperty('--iris-x', e.clientX - a.left + 'px');
          html.style.setProperty('--iris-y', e.clientY - a.top + 'px');
        }

        function swap(from, to) {
          from.hidden = true;
          to.hidden = false;
        }
        function focusHeading(to) {
          const heading = to.querySelector('h1');
          if (heading) heading.focus({ preventScroll: true });
        }

        // ---- 方向化转场 ----
        function go(to, direction) {
          const from = to === pageB ? pageA : pageB;
          if (navigating || !to.hidden) return;

          if (reduceMotion.matches) {
            swap(from, to);
            focusHeading(to);
            return;
          }
          navigating = true;
          html.dataset.vt = direction;

          from.style.viewTransitionName = 'page';
          const cleanup = () => {
            from.style.viewTransitionName = '';
            to.style.viewTransitionName = '';
            delete html.dataset.vt;
            navigating = false;
            focusHeading(to);
          };

          if (document.startViewTransition) {
            const vt = document.startViewTransition(() => {
              swap(from, to);
              from.style.viewTransitionName = '';
              to.style.viewTransitionName = 'page';
            });
            vt.finished.finally(cleanup);
          } else {
            // @mt:fallback：两幕短暂同框，播同一形状的 keyframes；
            // 单侧动画的结束事件从容器上冒泡捕获
            to.hidden = false;
            from.classList.add('fx-out');
            to.classList.add('fx-in');
            const done = () => {
              app.removeEventListener('animationend', done);
              from.hidden = true;
              from.classList.remove('fx-out');
              to.classList.remove('fx-in');
              cleanup();
            };
            app.addEventListener('animationend', done);
          }
        }
        const goBack = () => go(pageA, 'back');

        // ---- 换幕途径：点海报任意处 / 按钮 / Esc ----
        pageA.addEventListener('click', (e) => {
          setOrigin(e);
          go(pageB, 'forward');
        });
        pageB.addEventListener('click', (e) => {
          if (e.target.closest('.stage-btn')) return;
          setOrigin(e);
          goBack();
        });
        document.getElementById('nextBtn').addEventListener('click', (e) => {
          e.stopPropagation();
          setOrigin(e);
          go(pageB, 'forward');
        });
        document.getElementById('prevBtn').addEventListener('click', (e) => {
          setOrigin(e);
          goBack();
        });
        document.addEventListener('keydown', (e) => {
          if (pageB.hidden) return;
          if (e.key === 'Escape' || e.key === 'Backspace') {
            e.preventDefault();
            setOrigin(null);
            goBack();
          }
        });

        /* @mt:thumb-start */
        // 缩略图演示：自动睁开→收回往返（圆心画面中心）；只在缩略图里跑，切后台暂停，reduced-motion 不启动
        if (window.__MT_ENV && window.__MT_ENV.thumb && !reduceMotion.matches) {
          setInterval(() => {
            if (document.hidden || navigating) return;
            setOrigin(null);
            if (pageB.hidden) go(pageB, 'forward');
            else goBack();
          }, 2600);
        }
        /* @mt:thumb-end */
      })();
    </script>
  </body>
</html>
