<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时间线轮播</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-accent: #ffffff;    /* 强调色：时间线节点与年份 */
    --mt-duration: 0.6s;     /* 内容切换时长 */
    --mt-rounded: 14px;      /* 图片圆角 */
  }

  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mt-bg);
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  .mt-timeline {
    width: min(680px, 92vw);
    outline: none;
    touch-action: pan-y;
  }
  .mt-timeline:focus-visible { outline: 2px solid var(--mt-accent); outline-offset: 4px; }

  /* 内容区：图 + 年份大字，交叉淡化 + 轻微上移进场 */
  .mt-stage {
    position: relative;
    aspect-ratio: 16 / 9;
    border-radius: var(--mt-rounded);
    overflow: hidden;
    background: #14151f;
    cursor: grab;
  }
  .mt-stage.dragging { cursor: grabbing; }
  .mt-item {
    position: absolute;
    inset: 0;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity var(--mt-duration) ease, transform var(--mt-duration) cubic-bezier(0.22, 1, 0.36, 1);
  }
  .mt-item.is-active { opacity: 1; transform: none; z-index: 1; }
  .mt-item img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    -webkit-user-drag: none;
    user-select: none;
  }
  .mt-item .year {
    position: absolute;
    left: 22px;
    top: 14px;
    font-size: 44px;
    font-weight: 800;
    color: var(--mt-accent);
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.5);
    font-family: ui-monospace, monospace;
    letter-spacing: 0.02em;
  }
  .mt-item .mt-caption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 42px 20px 14px;
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.65));
  }

  /* 时间轴：一条横线 + 可点的年份节点 */
  .mt-axis {
    position: relative;
    display: flex;
    justify-content: space-between;
    margin-top: 26px;
    padding: 0 8px;
  }
  .mt-axis::before {
    content: '';
    position: absolute;
    left: 0; right: 0;
    top: 5px;
    height: 2px;
    background: rgba(255, 255, 255, 0.15);
  }
  .mt-node {
    position: relative;
    border: none;
    background: none;
    padding: 14px 6px 0;
    cursor: pointer;
    color: #6d7285;
    font-size: 13px;
    font-family: ui-monospace, monospace;
    transition: color 0.15s ease;
  }
  .mt-node::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #2a2d3f;
    border: 2px solid rgba(255, 255, 255, 0.25);
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  .mt-node:hover { color: #f2f3f8; }
  .mt-node.active { color: var(--mt-accent); font-weight: 700; }
  .mt-node.active::before {
    background: var(--mt-accent);
    border-color: var(--mt-accent);
    transform: translateX(-50%) scale(1.25);
  }

  /* 用户开启「减少动态效果」：内容瞬间切换、不自动前进（JS 同步处理） */
  @media (prefers-reduced-motion: reduce) {
    .mt-item { transition: none; }
  }
</style>
</head>
<body>
<div class="mt-timeline" id="mtRoot"></div>
<script>
  const CONFIG = {
    slides: [{"src":"/samples/sample-1.webp","caption":"品牌诞生，第一间工作室"},{"src":"/samples/sample-2.webp","caption":"第一款产品上线"},{"src":"/samples/sample-3.webp","caption":"用户突破一百万"},{"src":"/samples/sample-4.webp","caption":"海外市场启航"},{"src":"/samples/sample-5.webp","caption":"新总部落成"}], // 里程碑列表（标题写事件）
    years: "2019｜2021｜2022｜2024｜2026", // 每个里程碑的年份（用「｜」分隔，与图片一一对应）
    interval: 4, // 自动前进间隔（秒，0 为不自动前进）
  };

  (function () {
    const root = document.getElementById('mtRoot');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const slides = CONFIG.slides;
    const years = CONFIG.years.split('｜').map((s) => s.trim());
    const total = slides.length;
    let index = 0;

    root.setAttribute('role', 'region');
    root.setAttribute('aria-roledescription', 'carousel');
    root.setAttribute('aria-label', '时间线轮播');
    root.setAttribute('tabindex', '0');

    const stage = document.createElement('div');
    stage.className = 'mt-stage';
    const items = slides.map((s, i) => {
      const el = document.createElement('figure');
      el.className = 'mt-item' + (i === 0 ? ' is-active' : '');
      el.style.margin = '0';
      el.setAttribute('role', 'group');
      el.setAttribute('aria-roledescription', 'slide');
      el.setAttribute('aria-label', (years[i] || '第 ' + (i + 1) + ' 站') + '，共 ' + total + ' 站');
      const img = document.createElement('img');
      img.src = s.src;
      img.alt = s.caption || '第 ' + (i + 1) + ' 张图片';
      img.loading = i === 0 ? 'eager' : 'lazy';
      el.appendChild(img);
      const year = document.createElement('div');
      year.className = 'year';
      year.textContent = years[i] || '';
      el.appendChild(year);
      if (s.caption) {
        const cap = document.createElement('div');
        cap.className = 'mt-caption';
        cap.textContent = s.caption;
        el.appendChild(cap);
      }
      stage.appendChild(el);
      return el;
    });
    root.appendChild(stage);

    // 时间轴节点
    const axis = document.createElement('div');
    axis.className = 'mt-axis';
    const nodes = slides.map((_s, i) => {
      const node = document.createElement('button');
      node.type = 'button';
      node.className = 'mt-node' + (i === 0 ? ' active' : '');
      node.textContent = years[i] || (i + 1);
      node.setAttribute('aria-label', '跳到 ' + (years[i] || '第 ' + (i + 1) + ' 站'));
      node.addEventListener('click', () => goTo(i));
      axis.appendChild(node);
      return node;
    });
    root.appendChild(axis);

    function goTo(next) {
      next = (next + total) % total;
      if (next === index) return;
      items[index].classList.remove('is-active');
      items[next].classList.add('is-active');
      nodes[index].classList.remove('active');
      nodes[next].classList.add('active');
      index = next;
    }
    const nextSlide = () => goTo(index + 1);
    const prevSlide = () => goTo(index - 1);

    // 自动前进：悬停 / 聚焦 / 后台暂停；reduced-motion 不启动
    let timer = null;
    function play() {
      if (timer || CONFIG.interval <= 0 || reduceMotion || total < 2) return;
      timer = setInterval(nextSlide, CONFIG.interval * 1000);
    }
    function pause() { clearInterval(timer); timer = null; }
    root.addEventListener('mouseenter', pause);
    root.addEventListener('mouseleave', play);
    root.addEventListener('focusin', pause);
    root.addEventListener('focusout', play);
    document.addEventListener('visibilitychange', () => (document.hidden ? pause() : play()));
    play();

    // 拖拽 / 触摸（Pointer Events）
    let dragStartX = null, dragDx = 0;
    stage.addEventListener('pointerdown', (e) => {
      dragStartX = e.clientX; dragDx = 0;
      stage.classList.add('dragging');
      stage.setPointerCapture(e.pointerId);
    });
    stage.addEventListener('pointermove', (e) => {
      if (dragStartX === null) return;
      dragDx = e.clientX - dragStartX;
    });
    stage.addEventListener('pointerup', () => {
      stage.classList.remove('dragging');
      if (dragStartX === null) return;
      if (Math.abs(dragDx) > 50) (dragDx < 0 ? nextSlide : prevSlide)();
      dragStartX = null;
    });
    stage.addEventListener('pointercancel', () => { stage.classList.remove('dragging'); dragStartX = null; });

    // 键盘
    root.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
    });
  })();
</script>
</body>
</html>
