<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>柔光极光带</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色（极光以外透出它） */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* 用户开启「减少动态效果」时：JS 停止时间推进，极光定格 */
</style>
</head>
<body>
<canvas id="mtCanvas" aria-hidden="true"></canvas>
<script>
  const CONFIG = {
    color1: "#f7f7f7",      // 第一层颜色
    color2: "#27ff64",      // 第二层颜色
    speed: 0.6,             // 流动速度
    scale: 1.5,             // 起伏尺度
    brightness: 1,          // 亮度
    noiseAmplitude: 1,      // 起伏幅度
    bandHeight: 0.5,        // 带的高度
    bandSpread: 1,          // 带的厚度
    colorSpeed: 1,          // 色相流转速度
    mouseInfluence: 0.25,   // 鼠标偏移
  };
  const NOISE_FREQ = 2.5, OCTAVE_DECAY = 0.1, LAYER_OFFSET = 0;   // 噪声基频 / 倍频衰减 / 两层时间差

  const canvas = document.getElementById('mtCanvas');
  const gl = canvas.getContext('webgl', { antialias: false, alpha: true, premultipliedAlpha: false });
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const VS = `
    attribute vec2 aPos;
    void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
  `;
  // 片元：三层三维 Perlin 噪声决定「带」在每个 x 处的高度偏移，带的亮度是到中心线距离的指数衰减；
  // 两层带各乘一条随 x 与时间流转的余弦调色板，再乘各自的颜色
  const FS = `
    precision highp float;
    uniform float uTime;
    uniform vec2  uRes, uMouse;
    uniform float uSpeed, uScale, uBright, uNoiseFreq, uNoiseAmp, uBandH, uBandSpread, uDecay, uLayerOff, uColorSpeed, uMouseK;
    uniform vec3  uC1, uC2;
    #define TAU 6.28318

    // 单位球面上的随机梯度
    vec3 gradHash(vec3 p) {
      p = vec3(dot(p, vec3(127.1, 311.7, 234.6)), dot(p, vec3(269.5, 183.3, 198.3)), dot(p, vec3(169.5, 283.3, 156.9)));
      vec3 h = fract(sin(p) * 43758.5453123);
      float phi = acos(2.0 * h.x - 1.0), theta = TAU * h.y;
      return vec3(cos(theta) * sin(phi), sin(theta) * cos(phi), cos(phi));
    }
    float quintic(float t) { float t2 = t * t, t3 = t * t2; return 6.0 * t3 * t2 - 15.0 * t2 * t2 + 10.0 * t3; }
    vec3 cosPalette(float t, vec3 a, vec3 b, vec3 c, vec3 d) { return a + b * cos(TAU * (c * t + d)); }
    // 三维 Perlin：8 个格点梯度、五次平滑插值
    float perlin3(float amp, float freq, float px, float py, float pz) {
      float x = px * freq, y = py * freq;
      float fx = floor(x), fy = floor(y), fz = floor(pz), cx = ceil(x), cy = ceil(y), cz = ceil(pz);
      float d000 = dot(gradHash(vec3(fx, fy, fz)), vec3(x - fx, y - fy, pz - fz));
      float d100 = dot(gradHash(vec3(cx, fy, fz)), vec3(x - cx, y - fy, pz - fz));
      float d010 = dot(gradHash(vec3(fx, cy, fz)), vec3(x - fx, y - cy, pz - fz));
      float d110 = dot(gradHash(vec3(cx, cy, fz)), vec3(x - cx, y - cy, pz - fz));
      float d001 = dot(gradHash(vec3(fx, fy, cz)), vec3(x - fx, y - fy, pz - cz));
      float d101 = dot(gradHash(vec3(cx, fy, cz)), vec3(x - cx, y - fy, pz - cz));
      float d011 = dot(gradHash(vec3(fx, cy, cz)), vec3(x - fx, y - cy, pz - cz));
      float d111 = dot(gradHash(vec3(cx, cy, cz)), vec3(x - cx, y - cy, pz - cz));
      float sx = quintic(x - fx), sy = quintic(y - fy), sz = quintic(pz - fz);
      float ly0 = mix(mix(d000, d100, sx), mix(d010, d110, sx), sy);
      float ly1 = mix(mix(d001, d101, sx), mix(d011, d111, sx), sy);
      return amp * mix(ly0, ly1, sz);
    }
    // 一层极光带的亮度
    float band(float t, vec2 shift) {
      vec2 uv = gl_FragCoord.xy / uRes.y + shift;
      float n = 0.0, freq = uNoiseFreq, amp = uNoiseAmp;
      vec2 sp = uv * uScale;
      for (int i = 0; i < 3; i++) { n += perlin3(amp, freq, sp.x, sp.y, t); amp *= uDecay; freq *= 2.0; }
      float yBand = uv.y * 10.0 - uBandH * 10.0;
      return 0.3 * max(exp(uBandSpread * (1.0 - 1.1 * abs(n + yBand))), 0.0);
    }

    void main() {
      vec2 uv = gl_FragCoord.xy / uRes;
      float t = uSpeed * 0.4 * uTime;
      vec2 shift = (uMouse - 0.5) * uMouseK;
      vec3 col = vec3(0.0);
      col += 0.99 * band(t, shift) * cosPalette(uv.x + uTime * uSpeed * 0.2 * uColorSpeed, vec3(0.5), vec3(0.5), vec3(1.0), vec3(0.3, 0.20, 0.20)) * uC1;
      col += 0.99 * band(t + uLayerOff, shift) * cosPalette(uv.x + uTime * uSpeed * 0.1 * uColorSpeed, vec3(0.5), vec3(0.5), vec3(2.0, 1.0, 0.0), vec3(0.5, 0.20, 0.25)) * uC2;
      col *= uBright;
      gl_FragColor = vec4(col, clamp(length(col), 0.0, 1.0));
    }
  `;

  // ---- WebGL 底座 ----
  function compile(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  const U = (n) => gl.getUniformLocation(prog, n);
  const hexRgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);

  const dpr = Math.min(2, devicePixelRatio || 1);
  function resize() {
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(U('uRes'), canvas.width, canvas.height);
  }
  resize(); addEventListener('resize', resize);
  gl.uniform1f(U('uSpeed'), CONFIG.speed);
  gl.uniform1f(U('uScale'), CONFIG.scale);
  gl.uniform1f(U('uBright'), CONFIG.brightness);
  gl.uniform1f(U('uNoiseFreq'), NOISE_FREQ);
  gl.uniform1f(U('uNoiseAmp'), CONFIG.noiseAmplitude);
  gl.uniform1f(U('uBandH'), CONFIG.bandHeight);
  gl.uniform1f(U('uBandSpread'), CONFIG.bandSpread);
  gl.uniform1f(U('uDecay'), OCTAVE_DECAY);
  gl.uniform1f(U('uLayerOff'), LAYER_OFFSET);
  gl.uniform1f(U('uColorSpeed'), CONFIG.colorSpeed);
  gl.uniform1f(U('uMouseK'), CONFIG.mouseInfluence);
  gl.uniform3fv(U('uC1'), hexRgb(CONFIG.color1));
  gl.uniform3fv(U('uC2'), hexRgb(CONFIG.color2));
  const uTime = U('uTime'), uMouse = U('uMouse');

  // 鼠标 0–1（y 向上），5% 平滑
  const target = { x: 0.5, y: 0.5 }, mouse = { x: 0.5, y: 0.5 };
  addEventListener('pointermove', (e) => { target.x = e.clientX / innerWidth; target.y = 1 - e.clientY / innerHeight; });

  let time = reduceMotion ? 3 : 0, last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    if (document.hidden) { last = now; return; }
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!reduceMotion) time += dt;
    mouse.x += (target.x - mouse.x) * 0.05; mouse.y += (target.y - mouse.y) * 0.05;
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(uTime, time);
    gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  gl.clearColor(0, 0, 0, 0);
  requestAnimationFrame(frame);
</script>
</body>
</html>
