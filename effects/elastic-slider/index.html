<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弹性滑块</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-bounce: cubic-bezier(0.34, 1.56, 0.64, 1); /* 回弹手感 */
    --mt-thickness: 8px;     /* 滑轨粗细 */
    --mt-hoverThicken: 1;    /* 悬停时变粗：1 开 / 0 关 */
    --mt-fill: #ffffff;      /* 已填充颜色 */
    --mt-track: #3a3a3a;     /* 轨道颜色 */
  }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mt-bg);
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #f2f3f8;
  }
  .mt-slider {
    display: flex;
    align-items: center;
    gap: 16px;
    width: min(420px, 80vw);
    user-select: none;
    touch-action: none;
  }
  .mt-icon { font-size: 14px; opacity: 0.6; width: 1.4em; text-align: center; }
  /* 滑轨：拖过头时用 scaleX 拉长、并向拖动方向整体偏移，形成橡皮筋感 */
  .mt-track {
    position: relative;
    flex: 1;
    height: var(--mt-thickness);
    border-radius: 999px;
    background: var(--mt-track);
    cursor: pointer;
    transform-origin: var(--origin, center);
    transform: translateX(var(--shift, 0px)) scaleX(var(--stretch, 1)) scaleY(var(--thick, 1));
    transition: transform 0.45s var(--mt-bounce);
  }
  .mt-track.dragging { transition: none; }
  .mt-slider:hover .mt-track { --thick: calc(1 + 0.5 * var(--mt-hoverThicken)); }
  .mt-fill {
    position: absolute; inset: 0;
    width: var(--v, 50%);
    border-radius: inherit;
    background: var(--mt-fill);
  }
  .mt-value {
    min-width: 3ch;
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-size: 14px;
    opacity: 0.8;
  }

  /* 用户开启「减少动态效果」时：不拉伸、不回弹 */
  @media (prefers-reduced-motion: reduce) {
    .mt-track { transition: none; transform: none !important; }
  }
</style>
</head>
<body>
<div class="mt-slider" id="mtSlider" role="slider" aria-label="音量" aria-valuemin="0" aria-valuemax="100" tabindex="0">
  <span class="mt-icon" aria-hidden="true">–</span>
  <div class="mt-track" id="mtTrack"><div class="mt-fill" id="mtFill"></div></div>
  <span class="mt-icon" aria-hidden="true">+</span>
  <span class="mt-value" id="mtValue"></span>
</div>
<script>
  const CONFIG = {
    value: 60,        // 初始值（0–100）
    stretch: 30,      // 最大拉伸（px）
    showValue: true,  // 显示数值
  };

  const slider = document.getElementById('mtSlider');
  const track = document.getElementById('mtTrack');
  const fill = document.getElementById('mtFill');
  const valueEl = document.getElementById('mtValue');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!CONFIG.showValue) valueEl.style.display = 'none';

  let value = CONFIG.value;
  function render() {
    fill.style.setProperty('--v', value + '%');
    valueEl.textContent = Math.round(value);
    slider.setAttribute('aria-valuenow', Math.round(value));
  }
  render();

  // 拖动：值夹在 0–100；拖过头的距离转成拉伸量与偏移量
  let dragging = false;
  function update(clientX) {
    const r = track.getBoundingClientRect();
    const raw = (clientX - r.left) / r.width;
    value = Math.min(100, Math.max(0, raw * 100));
    render();
    if (reduceMotion) return;
    let over = 0;
    if (raw < 0) over = raw * r.width; else if (raw > 1) over = (raw - 1) * r.width;
    const k = Math.max(-1, Math.min(1, over / 160)) * CONFIG.stretch; // 越拽越难拉：软限
    track.style.setProperty('--origin', over > 0 ? 'left' : 'right');
    track.style.setProperty('--stretch', (1 + Math.abs(k) / r.width).toFixed(4));
    track.style.setProperty('--shift', (k * 0.4).toFixed(1) + 'px');
  }
  function release() {
    dragging = false;
    track.classList.remove('dragging');
    track.style.setProperty('--stretch', '1');
    track.style.setProperty('--shift', '0px');
  }
  slider.addEventListener('pointerdown', e => {
    dragging = true; track.classList.add('dragging');
    slider.setPointerCapture(e.pointerId);
    update(e.clientX);
  });
  slider.addEventListener('pointermove', e => { if (dragging) update(e.clientX); });
  slider.addEventListener('pointerup', release);
  slider.addEventListener('pointercancel', release);
  slider.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { value = Math.min(100, value + 5); render(); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { value = Math.max(0, value - 5); render(); }
  });

  /* @mt:thumb-start */
  // 缩略图演示：模拟一次拖到右端、拽过头、弹回，再拖回来；用户上手即停
  if (!reduceMotion) {
    let auto = true, t = 0;
    slider.addEventListener('pointerdown', () => (auto = false));
    setInterval(() => {
      if (document.hidden || !auto) return;
      const r = track.getBoundingClientRect();
      t += 0.02;
      const phase = t % 2;
      if (phase < 1) { track.classList.add('dragging'); update(r.left + r.width * (0.2 + phase * 1.1)); }
      else if (phase < 1.02) release();
    }, 30);
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
