<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弹性滑块</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-thickness: 8px;     /* 滑轨粗细 */
    --mt-hoverThicken: 1;    /* 悬停时变粗：1 开 / 0 关 */
    --mt-fill: #ffffff;      /* 已填充颜色 */
    --mt-track: #3a3a3a;     /* 轨道颜色 */
  }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mt-bg);
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #f2f3f8;
  }
  .mt-slider {
    display: flex;
    align-items: center;
    gap: 16px;
    width: min(420px, 80vw);
    user-select: none;
    touch-action: none;
  }
  /* 端点图标：拖过头时被向外推出（--push），并在刚过头的瞬间放大脉冲一下（--pulse） */
  .mt-icon {
    font-size: 14px; opacity: 0.6; width: 1.4em; text-align: center;
    transform: translateX(var(--push, 0px)) scale(var(--pulse, 1));
    transition: transform 0.2s ease-out;
  }
  /* 滑轨：拖过头时用 scaleX 从远端为轴拉长、同时 scaleY 压扁（最扁 0.8），像被拽长的橡皮筋 */
  .mt-track {
    position: relative;
    flex: 1;
    height: var(--mt-thickness);
    border-radius: 999px;
    background: var(--mt-track);
    cursor: pointer;
    transform-origin: var(--origin, center);
    transform: scaleX(var(--stretch, 1)) scaleY(calc(var(--squash, 1) * var(--thick, 1)));
  }
  .mt-slider:hover .mt-track { --thick: calc(1 + 0.5 * var(--mt-hoverThicken)); }
  .mt-fill {
    position: absolute; inset: 0;
    width: var(--v, 50%);
    border-radius: inherit;
    background: var(--mt-fill);
  }
  .mt-value {
    min-width: 3ch;
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-size: 14px;
    opacity: 0.8;
  }

  /* 用户开启「减少动态效果」时：不拉伸、不回弹 */
  @media (prefers-reduced-motion: reduce) {
    .mt-track { transition: none; transform: none !important; }
  }
</style>
</head>
<body>
<div class="mt-slider" id="mtSlider" role="slider" aria-label="音量" aria-valuemin="0" aria-valuemax="100" tabindex="0">
  <span class="mt-icon" aria-hidden="true">–</span>
  <div class="mt-track" id="mtTrack"><div class="mt-fill" id="mtFill"></div></div>
  <span class="mt-icon" aria-hidden="true">+</span>
  <span class="mt-value" id="mtValue"></span>
</div>
<script>
  const CONFIG = {
    value: 60,        // 初始值（0–100）
    stretch: 50,      // 最大拉伸（px）
    showValue: true,  // 显示数值
  };

  const slider = document.getElementById('mtSlider');
  const track = document.getElementById('mtTrack');
  const fill = document.getElementById('mtFill');
  const valueEl = document.getElementById('mtValue');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!CONFIG.showValue) valueEl.style.display = 'none';

  let value = CONFIG.value;
  function render() {
    fill.style.setProperty('--v', value + '%');
    valueEl.textContent = Math.round(value);
    slider.setAttribute('aria-valuenow', Math.round(value));
  }
  render();

  // 拖动：值夹在 0–100；拖过头的像素距离经 sigmoid 软限（最大 stretch）变成 overflow
  const icons = slider.querySelectorAll('.mt-icon');
  let dragging = false, overflow = 0, region = 'middle', springRaf = 0;
  const decay = (v, max) => (2 * (1 / (1 + Math.exp(-v / max)) - 0.5)) * max;
  function applyOverflow() {
    const r = track.getBoundingClientRect();
    track.style.setProperty('--stretch', (1 + overflow / r.width).toFixed(4));
    track.style.setProperty('--squash', (1 - 0.2 * (overflow / CONFIG.stretch)).toFixed(4));   // 拉得越长越扁
    icons[0].style.setProperty('--push', region === 'left' ? `${-overflow}px` : '0px');
    icons[1].style.setProperty('--push', region === 'right' ? `${overflow}px` : '0px');
  }
  // 刚拽出端点的瞬间：该侧图标 1.4 倍脉冲
  function pulse(icon) {
    icon.style.setProperty('--pulse', '1.4');
    setTimeout(() => icon.style.setProperty('--pulse', '1'), 125);
  }
  function update(clientX) {
    const r = track.getBoundingClientRect();
    const raw = (clientX - r.left) / r.width;
    value = Math.min(100, Math.max(0, raw * 100));
    render();
    if (reduceMotion) return;
    cancelAnimationFrame(springRaf);
    const prev = region;
    let over = 0;
    if (clientX < r.left) { region = 'left'; over = r.left - clientX; }
    else if (clientX > r.right) { region = 'right'; over = clientX - r.right; }
    else region = 'middle';
    if (region !== prev && region !== 'middle') pulse(icons[region === 'left' ? 0 : 1]);
    overflow = decay(over, CONFIG.stretch);
    track.style.setProperty('--origin', region === 'left' ? 'right' : 'left');   // 从远端为轴拉长
    applyOverflow();
  }
  // 松手：overflow 用弹簧（刚度 170、阻尼比对应 bounce 0.4）振荡回 0
  function release() {
    dragging = false;
    if (reduceMotion || overflow === 0) { overflow = 0; applyOverflow(); return; }
    const from = overflow, stiffness = 170, damping = 26 * (1 - 0.4), mass = 1;
    const zeta = damping / (2 * Math.sqrt(mass * stiffness)), w0 = Math.sqrt(stiffness / mass), wd = w0 * Math.sqrt(1 - zeta * zeta);
    const t0 = performance.now();
    cancelAnimationFrame(springRaf);
    (function tick(now) {
      const t = (now - t0) / 1000;
      const env = Math.exp(-zeta * w0 * t);
      const x = env * (Math.cos(wd * t) + ((zeta * w0) / wd) * Math.sin(wd * t));   // 欠阻尼位移
      overflow = from * x;
      applyOverflow();
      if (t < 1.2 && Math.abs(overflow) > 0.05) springRaf = requestAnimationFrame(tick);
      else { overflow = 0; applyOverflow(); }
    })(t0);
  }
  slider.addEventListener('pointerdown', e => {
    dragging = true;
    slider.setPointerCapture(e.pointerId);
    update(e.clientX);
  });
  slider.addEventListener('pointermove', e => { if (dragging) update(e.clientX); });
  slider.addEventListener('pointerup', release);
  slider.addEventListener('pointercancel', release);
  slider.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { value = Math.min(100, value + 5); render(); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { value = Math.max(0, value - 5); render(); }
  });

  /* @mt:thumb-start */
  // 缩略图演示：模拟一次拖到右端、拽过头、弹回，再拖回来；用户上手即停
  if (!reduceMotion) {
    let auto = true, t = 0;
    slider.addEventListener('pointerdown', () => (auto = false));
    setInterval(() => {
      if (document.hidden || !auto) return;
      const r = track.getBoundingClientRect();
      t += 0.02;
      const phase = t % 2;
      if (phase < 1) update(r.left + r.width * (0.2 + phase * 1.1));
      else if (phase < 1.02) release();
    }, 30);
  }
  /* @mt:thumb-end */
</script>
</body>
</html>
