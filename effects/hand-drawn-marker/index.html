<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手绘标注</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #0a0a0f;        /* 页面底色 */
    --mt-color: #f2f3f8;     /* 文字颜色 */
    --mt-fontSize: 28px;     /* 字号 */
    --mt-font: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; /* 字体 */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; display: grid; place-items: center; }

  .mt-wrap { position: relative; max-width: 720px; padding: 0 28px; }
  /* 墨迹层：一张与段落等大的 SVG，垫在文字下面，笔画都画在这里 */
  .mt-ink { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 0; }
  .mt-ink path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .mt-text {
    position: relative; z-index: 1; margin: 0;
    font-family: var(--mt-font); font-size: var(--mt-fontSize); line-height: 1.9; color: var(--mt-color); text-align: center; text-wrap: balance;
  }
  .mt-text mark { background: transparent; color: inherit; }
</style>
</head>
<body>
<div class="mt-wrap" id="mtWrap">
  <svg class="mt-ink" id="mtInk" aria-hidden="true"></svg>
  <p class="mt-text" id="mtText"></p>
</div>
<script>
  const CONFIG = {
    text: "好的界面不靠解释，【重要的话】要让人一眼看见——像用荧光笔在纸上【划出来】那样直接。", // 段落文字，用【】包住要标注的词
    action: "highlight",  // 标注样式：highlight 荧光笔 / underline 下划线 / box 方框 / circle 圈 / strike 删除线 / bracket 方括号
    color: "#ff9800",     // 笔的颜色
    strokeWidth: 1.5,     // 线条粗细（px，荧光笔样式不受此影响）
    duration: 600,        // 画完一处标注的时长（毫秒）
    iterations: 2,        // 每处描几遍（手绘感来自多遍略有偏差的笔画）
    padding: 2,           // 标注与文字的间距（px）
    roughness: 1,         // 手抖程度：0 工整，3 很潦草
  };

  const wrap = document.getElementById('mtWrap'), ink = document.getElementById('mtInk'), text = document.getElementById('mtText');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const NS = 'http://www.w3.org/2000/svg';

  // 解析【】：包住的部分变成 <mark>
  CONFIG.text.split(/(【[^】]*】)/).forEach(part => {
    if (part.startsWith('【')) { const m = document.createElement('mark'); m.textContent = part.slice(1, -1); text.appendChild(m); }
    else if (part) text.append(part);
  });

  // ---- 手绘几何：每个坐标都加一点随机偏移，同一处描两遍时两遍的偏移不同，就有了「手画」的味道 ----
  const R = () => (Math.random() - 0.5) * 2 * CONFIG.roughness;
  const line = (x1, y1, x2, y2, bow = 1) => {
    // 三次贝塞尔：控制点落在 1/3 与 2/3 处并带更大的偏移，让线条微微弯
    const dx = x2 - x1, dy = y2 - y1;
    return `M${x1 + R()} ${y1 + R()} C${x1 + dx * 0.3 + R()} ${y1 + dy * 0.3 + R() * 2 * bow},${x1 + dx * 0.7 + R()} ${y1 + dy * 0.7 + R() * 2 * bow},${x2 + R()} ${y2 + R()}`;
  };
  const ellipse = (cx, cy, rx, ry) => {
    // 48 个采样点各自抖一下，再用二次贝塞尔经过相邻中点平滑连接；起点角度随机，两遍不会从同一处起笔
    const n = 48, a0 = Math.random() * Math.PI * 2, pts = [];
    for (let i = 0; i < n; i++) { const a = a0 + i / n * Math.PI * 2; pts.push([cx + Math.cos(a) * (rx + R() * 1.5), cy + Math.sin(a) * (ry + R() * 1.5)]); }
    const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
    let d = `M${mid(pts[0], pts[1]).join(' ')}`;
    for (let i = 1; i <= n; i++) { const p = pts[i % n], m = mid(p, pts[(i + 1) % n]); d += ` Q${p[0]} ${p[1]} ${m[0]} ${m[1]}`; }
    return d;
  };
  // 按样式为一个矩形生成一遍笔画（返回 path 数组与建议线宽）
  function strokes(r, pass) {
    const p = CONFIG.padding, x0 = r.x - p, y0 = r.y - p, x1 = r.x + r.w + p, y1 = r.y + r.h + p, w = CONFIG.strokeWidth;
    const rev = pass % 2 === 1; // 第二遍反方向描
    const L = (a, b, c, d) => rev ? line(c, d, a, b) : line(a, b, c, d);
    switch (CONFIG.action) {
      case 'underline': return { w, d: [L(x0, y1, x1, y1)] };
      case 'strike': { const ym = r.y + r.h / 2; return { w, d: [L(x0, ym, x1, ym)] }; }
      case 'box': return { w, d: [L(x0, y0, x1, y0), L(x1, y0, x1, y1), L(x1, y1, x0, y1), L(x0, y1, x0, y0)] };
      case 'circle': return { w, d: [ellipse((x0 + x1) / 2, (y0 + y1) / 2, (x1 - x0) / 2 + p * 2, (y1 - y0) / 2 + p)] };
      case 'bracket': { const k = Math.min(10, r.h * 0.3); return { w, d: [L(x0 + k, y0, x0, y0), L(x0, y0, x0, y1), L(x0, y1, x0 + k, y1), L(x1 - k, y0, x1, y0), L(x1, y0, x1, y1), L(x1, y1, x1 - k, y1)] }; }
      default: { // highlight：一条与文字同高的粗线，微微倾斜，像荧光笔一划
        const ym = r.y + r.h / 2, tilt = R() * r.h * 0.08;
        return { w: r.h * 0.95, d: [L(r.x, ym + tilt, r.x + r.w, ym - tilt)], soft: true };
      }
    }
  }

  let anims = [], loopTimer = 0;
  function draw(animate) {
    ink.innerHTML = ''; anims.forEach(a => a.cancel()); anims = [];
    const base = wrap.getBoundingClientRect();
    ink.setAttribute('viewBox', `0 0 ${base.width} ${base.height}`);
    // 每处标注按行拆成矩形（换行的词会有多个），总时长按各矩形宽度分配，逐个、逐遍顺序画
    const rects = [];
    for (const m of text.querySelectorAll('mark')) for (const c of m.getClientRects()) rects.push({ x: c.left - base.left, y: c.top - base.top, w: c.width, h: c.height });
    const totalW = rects.reduce((s, r) => s + r.w, 0) || 1;
    let t = 0;
    for (const r of rects) {
      const rectDur = CONFIG.duration * (r.w / totalW);
      for (let pass = 0; pass < CONFIG.iterations; pass++) {
        const s = strokes(r, pass), passDur = rectDur / CONFIG.iterations, segDur = passDur / s.d.length;
        for (const d of s.d) {
          const path = document.createElementNS(NS, 'path');
          path.setAttribute('d', d); path.setAttribute('stroke', CONFIG.color); path.setAttribute('stroke-width', s.w);
          if (s.soft) { path.setAttribute('stroke-linecap', 'butt'); path.setAttribute('opacity', pass === 0 ? '0.75' : '0.45'); }
          ink.appendChild(path);
          if (animate && !reduceMotion) {
            const len = path.getTotalLength();
            path.style.strokeDasharray = len; path.style.strokeDashoffset = len;
            anims.push(path.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: Math.max(60, segDur), delay: t, fill: 'forwards', easing: 'ease-out' }));
          }
          t += segDur;
        }
      }
    }
    return t;
  }

  // 演示循环：画好 → 停一会儿 → 墨迹淡出 → 换一组随机偏移重画
  function cycle() {
    const total = draw(true);
    ink.style.transition = 'none'; ink.style.opacity = '1';
    if (reduceMotion) return;
    loopTimer = setTimeout(() => {
      ink.style.transition = 'opacity 0.35s'; ink.style.opacity = '0';
      loopTimer = setTimeout(() => { if (document.hidden) { loopTimer = setTimeout(cycle, 1500); return; } cycle(); }, 400);
    }, total + 2400);
  }
  cycle();
  addEventListener('resize', () => { clearTimeout(loopTimer); cycle(); });
</script>
</body>
</html>
