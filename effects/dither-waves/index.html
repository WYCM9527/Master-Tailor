<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>像素抖动波</title>
<style>
  :root {
    /* ===== 可调参数（由裁缝大师写入当前值，也可手动修改） ===== */
    --mt-bg: #000000;        /* 页面底色（噪浪之下的暗部） */
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mt-bg); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  /* 用户开启「减少动态效果」时：JS 停止时间推进，保留一帧静态噪浪 */
  @media (prefers-reduced-motion: reduce) { canvas { opacity: 0.9; } }
</style>
</head>
<body>
<canvas id="mtCanvas" aria-hidden="true"></canvas>
<script>
  const CONFIG = {
    color: "#808080",   // 波浪颜色
    speed: 0.05,        // 翻滚速度
    frequency: 3,       // 噪浪频率
    amplitude: 0.3,     // 层次强度
    colorNum: 4,        // 色阶数
    pixelSize: 2,       // 像素粒度
    mouse: true,        // 鼠标凹陷
    mouseRadius: 1,     // 凹陷半径
  };

  const canvas = document.getElementById('mtCanvas');
  const gl = canvas.getContext('webgl');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const VS = `
    attribute vec2 aPos;
    void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
  `;
  // 片元着色器：三重嵌套 fbm 揉出翻滚的噪浪，再用 8×8 Bayer 有序抖动量化成少量色阶，
  // 得到复古印刷 / 老游戏渐变的质感
  const FS = `
    precision highp float;
    uniform float uTime;      // 时间（秒）
    uniform vec2  uRes;       // 分辨率
    uniform float uSpeed;     // 翻滚速度
    uniform float uFreq;      // 噪浪频率（fbm 每层频率倍增系数）
    uniform float uAmp;       // 层次强度（fbm 每层幅度衰减系数）
    uniform vec3  uColor;     // 波浪颜色
    uniform vec2  uMouse;     // 鼠标（像素坐标，已平滑）
    uniform float uMouseOn;   // 鼠标凹陷开关
    uniform float uRadius;    // 凹陷半径
    uniform float uLevels;    // 色阶数
    uniform float uPixel;     // 像素粒度

    /* —— 经典 Perlin 2D（公域 webgl-noise 实现）—— */
    vec4 mod289(vec4 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
    vec4 permute(vec4 x) { return mod289(((x * 34.0) + 1.0) * x); }
    vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
    vec2 fade(vec2 t) { return t*t*t*(t*(t*6.0-15.0)+10.0); }
    float cnoise(vec2 P) {
      vec4 Pi = floor(P.xyxy) + vec4(0.0,0.0,1.0,1.0);
      vec4 Pf = fract(P.xyxy) - vec4(0.0,0.0,1.0,1.0);
      Pi = mod289(Pi);
      vec4 ix = Pi.xzxz, iy = Pi.yyww, fx = Pf.xzxz, fy = Pf.yyww;
      vec4 i = permute(permute(ix) + iy);
      vec4 gx = fract(i * (1.0/41.0)) * 2.0 - 1.0;
      vec4 gy = abs(gx) - 0.5;
      vec4 tx = floor(gx + 0.5);
      gx = gx - tx;
      vec2 g00 = vec2(gx.x, gy.x), g10 = vec2(gx.y, gy.y);
      vec2 g01 = vec2(gx.z, gy.z), g11 = vec2(gx.w, gy.w);
      vec4 norm = taylorInvSqrt(vec4(dot(g00,g00), dot(g01,g01), dot(g10,g10), dot(g11,g11)));
      g00 *= norm.x; g01 *= norm.y; g10 *= norm.z; g11 *= norm.w;
      float n00 = dot(g00, vec2(fx.x, fy.x));
      float n10 = dot(g10, vec2(fx.y, fy.y));
      float n01 = dot(g01, vec2(fx.z, fy.z));
      float n11 = dot(g11, vec2(fx.w, fy.w));
      vec2 fade_xy = fade(Pf.xy);
      vec2 n_x = mix(vec2(n00, n01), vec2(n10, n11), fade_xy.x);
      return 2.3 * mix(n_x.x, n_x.y, fade_xy.y);
    }

    /* fbm：8 层叠加，|noise| 让层次出现山脊线 */
    float fbm(vec2 p) {
      float value = 0.0;
      float amp = 1.0;
      for (int i = 0; i < 8; i++) {
        value += amp * abs(cnoise(p));
        p *= uFreq;
        amp *= uAmp;
      }
      return value;
    }
    /* 三重嵌套：fbm 的输入再被 fbm 扭曲，浪层互相咬合翻滚 */
    float pattern(vec2 p) {
      vec2 p2 = p - uTime * uSpeed;
      return fbm(p - fbm(p + fbm(p2)));
    }

    /* —— 8×8 Bayer 阈值：2×2 矩阵三层递归（免查表公式）—— */
    float bayer2(vec2 a) { a = floor(a); return fract(a.x / 2.0 + a.y * a.y * 0.75); }
    float bayer4(vec2 a) { return bayer2(0.5 * a) * 0.25 + bayer2(a); }
    float bayer8(vec2 a) { return bayer4(0.5 * a) * 0.25 + bayer2(a); }

    /* 有序抖动：亮度加 Bayer 阈值扰动后量化到 uLevels 个色阶 */
    vec3 dither(vec2 fragPx, vec3 color) {
      vec2 cell = floor(fragPx / uPixel);           // 像素粒度：多物理像素共用一格
      float threshold = bayer8(cell) - 0.25;
      float stepSize = 1.0 / (uLevels - 1.0);
      color += threshold * stepSize;
      color = clamp(color - 0.2, 0.0, 1.0);         // 压一点暗部，浪谷沉进黑场
      return floor(color * (uLevels - 1.0) + 0.5) / (uLevels - 1.0);
    }

    void main() {
      vec2 uv = gl_FragCoord.xy / uRes;
      vec2 p = uv - 0.5;
      p.x *= uRes.x / uRes.y;                        // 等比坐标

      float f = pattern(p);

      /* 鼠标凹陷：半径内把浪压暗，像手指按进浪里 */
      if (uMouseOn > 0.5) {
        vec2 m = (uMouse / uRes - 0.5) * vec2(1.0, -1.0);
        m.x *= uRes.x / uRes.y;
        float d = length(p - m);
        f -= 0.5 * (1.0 - smoothstep(0.0, uRadius, d));
      }

      vec3 col = mix(vec3(0.0), uColor, f);
      col = dither(gl_FragCoord.xy, col);
      gl_FragColor = vec4(col, 1.0);
    }
  `;

  // ---- WebGL 底座 ----
  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  const U = (n) => gl.getUniformLocation(prog, n);

  function hexRgb(hex) {
    const h = hex.replace('#', '');
    return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16) / 255);
  }

  // 抖动是像素艺术：不乘 dpr，1 CSS 像素 = 1 渲染像素，格子才够大
  function resize() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(U('uRes'), canvas.width, canvas.height);
  }

  gl.uniform1f(U('uSpeed'), CONFIG.speed);
  gl.uniform1f(U('uFreq'), CONFIG.frequency);
  gl.uniform1f(U('uAmp'), CONFIG.amplitude);
  gl.uniform3fv(U('uColor'), hexRgb(CONFIG.color));
  gl.uniform1f(U('uMouseOn'), CONFIG.mouse ? 1 : 0);
  gl.uniform1f(U('uRadius'), CONFIG.mouseRadius);
  gl.uniform1f(U('uLevels'), CONFIG.colorNum);
  gl.uniform1f(U('uPixel'), CONFIG.pixelSize);
  const uTime = U('uTime'), uMouse = U('uMouse');
  resize(); addEventListener('resize', resize);

  // 鼠标目标位置 + 每帧 5% 平滑趋近（凹陷跟手但不生硬）
  let tx = innerWidth / 2, ty = innerHeight / 2;
  let cx = tx, cy = ty;
  if (CONFIG.mouse) {
    addEventListener('pointermove', (e) => { tx = e.clientX; ty = e.clientY; });
    addEventListener('pointerleave', () => { tx = innerWidth / 2; ty = innerHeight / 2; });
  }

  let time = reduceMotion ? 4 : 0;   // 减少动态：定格一帧层浪
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    if (document.hidden) { last = now; return; }   // 切后台暂停
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!reduceMotion) time += dt;
    cx += 0.05 * (tx - cx);
    cy += 0.05 * (ty - cy);
    gl.uniform1f(uTime, time);
    gl.uniform2f(uMouse, cx, cy);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
