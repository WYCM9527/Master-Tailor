name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 门禁 + 构建：契约校验、单测、lint、产物（按 GitHub Pages 的子路径构建，供 deploy 使用）
  build:
    runs-on: ubuntu-latest
    env:
      # 项目站部署在 https://<owner>.github.io/<repo>/；绑定自定义域名后在仓库 Variables 里把 SITE_BASE_PATH 设为 /
      BASE_PATH: ${{ vars.SITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # 效果冒烟：无头 Chromium 逐个打开 272 个效果，查异常 / 外链 / 空白渲染（scripts/smoke.ts）。
  # runner 只有软件渲染，重效果一个要十几秒，切 4 片并行、每片按核数开并发
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm smoke --shard=${{ matrix.shard }}/4
        env:
          # 2 核软件渲染：视口缩到 960×540 省一半像素；失败效果的截图上传为 artifact 便于排查
          SMOKE_VIEWPORT: 960x540
          SMOKE_SHOTS: 1
          SMOKE_SHOTS_DIR: ${{ runner.temp }}/mt-smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-shots-${{ matrix.shard }}
          path: ${{ runner.temp }}/mt-smoke
          if-no-files-found: ignore

  # 部署到 GitHub Pages：只在 main 推送、且仓库已启用 Pages（Settings → Pages → Source: GitHub Actions）时执行。
  # 私有仓库启用 Pages 需要付费套餐，未启用时这一步跳过、不算失败。
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检查仓库是否已启用 Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::仓库尚未启用 GitHub Pages，跳过部署（公开仓库：Settings → Pages → Source 选 GitHub Actions；私有仓库需付费套餐）"
          fi
      - name: 部署
        id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
