<!doctype html>
<html lang="zh-CN">
  <!--
  转场核心模板（内容生产参考，不参与构建）

  所有 category 为 transition（sub 非 scroll）的效果共享这份骨架：
  一个「迷你站」里有列表页和详情页两个 .page，go() 用同文档 View Transitions
  （document.startViewTransition）在两页间切换，转场动画全部写在 CSS 的
  「过渡层」里——多数形态只需改那一段。

  方向化：go() 在 <html> 上写 data-vt="forward|back"，CSS 按它选 keyframes，
  返回严格反向播放。

  基线能力（validate 强制，不做成参数）：
  startViewTransition 主引擎 · @mt:fallback 无 API 时的 CSS 类回退（同一套 keyframes）·
  prefers-reduced-motion 瞬间切换 · 返回按钮 + Esc/Backspace + 左缘拖拽返回 ·
  转场后聚焦新页标题 · 转场进行中忽略新的导航

  共享元素形态（sub: shared）追加约定：
  只给「参与本次转场」的元素挂 view-transition-name——点击哪张卡就临时给哪张卡挂名，
  转场结束立刻摘掉；详情页里的承接元素可以常挂（页面 hidden 即 display:none 时不参与快照，
  不会重名）。文档内同一时刻重名会导致整个转场被跳过。
-->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>转场核心模板</title>
    <style>
      :root {
        --mt-bg: #0a0a0f; /* 页面底色 */
        --mt-accent: #7aa2ff; /* 强调色：链接与焦点 */
        --mt-duration: 0.35s; /* 转场时长 */
        --mt-ease: cubic-bezier(0.2, 0.8, 0.2, 1); /* 转场缓动曲线 */
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--mt-bg);
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #f2f2f7;
      }

      /* ===== 迷你站外框：两个 .page 绝对定位互斥显示 ===== */
      .mt-app {
        position: relative;
        width: min(880px, 94vw);
        height: min(560px, 92vh);
        background: #101016;
        border-radius: 18px;
        overflow: clip;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
      }
      .page {
        position: absolute;
        inset: 0;
        overflow: auto;
        background: #101016;
      }
      .page[hidden] {
        display: none;
      }
      h1,
      h2 {
        outline: none; /* 转场后 JS 聚焦标题，不需要可见焦点环 */
      }

      /* ---- 列表页 ---- */
      .page-list {
        padding: 26px 30px;
      }
      .page-list h2 {
        margin: 0 0 18px;
        font-size: 22px;
      }
      .card-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
      }
      .card {
        border: none;
        border-radius: 14px;
        padding: 0;
        overflow: hidden;
        cursor: pointer;
        background: #1a1b24;
        color: inherit;
        text-align: left;
        font: inherit;
      }
      .card:focus-visible {
        outline: 2px solid var(--mt-accent);
        outline-offset: 2px;
      }
      .card .thumb {
        height: 120px;
        background: linear-gradient(135deg, #2a2f4a, #1a1c2c);
      }
      .card .name {
        display: block;
        padding: 12px 14px;
        font-weight: 600;
      }

      /* ---- 详情页 ---- */
      .page-detail .hero {
        height: 220px;
        background: linear-gradient(135deg, #2a2f4a, #1a1c2c);
      }
      .page-detail .body {
        padding: 22px 30px;
      }
      .page-detail h1 {
        margin: 0 0 12px;
        font-size: 26px;
      }
      .page-detail p {
        margin: 0 0 10px;
        line-height: 1.7;
        color: #b9bac6;
      }
      .back {
        position: absolute;
        top: 14px;
        left: 14px;
        z-index: 2;
        border: none;
        border-radius: 999px;
        padding: 8px 16px;
        background: rgba(10, 10, 15, 0.55);
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      .back:focus-visible {
        outline: 2px solid var(--mt-accent);
      }

      /* ===== 过渡层（各形态改这里）=====
         go() 转场期间给「离场页」「进场页」都挂 view-transition-name: page，
         于是 ::view-transition-old(page) 是旧页快照、::view-transition-new(page) 是新页快照，
         按 <html data-vt> 的方向选 keyframes。模板默认是一组「推屏」：
         前进 = 新页右侧推入、旧页让位左移；返回严格反向。 */
      ::view-transition-old(page),
      ::view-transition-new(page) {
        animation-duration: var(--mt-duration);
        animation-timing-function: var(--mt-ease);
        animation-fill-mode: both;
      }
      html[data-vt='forward']::view-transition-new(page) {
        animation-name: page-in-fwd;
      }
      html[data-vt='forward']::view-transition-old(page) {
        animation-name: page-out-fwd;
      }
      html[data-vt='back']::view-transition-new(page) {
        animation-name: page-in-back;
      }
      html[data-vt='back']::view-transition-old(page) {
        animation-name: page-out-back;
      }
      /* 快照默认按几何拉伸；两页尺寸一致时无感，涉及比例变化的形态请给
         old/new 快照加 object-fit: cover 兜底 */

      @keyframes page-in-fwd {
        from {
          transform: translateX(100%);
        }
        to {
          transform: none;
        }
      }
      @keyframes page-out-fwd {
        from {
          transform: none;
        }
        to {
          transform: translateX(-25%);
        }
      }
      @keyframes page-in-back {
        from {
          transform: translateX(-25%);
        }
        to {
          transform: none;
        }
      }
      @keyframes page-out-back {
        from {
          transform: none;
        }
        to {
          transform: translateX(100%);
        }
      }

      /* @mt:fallback 无 API 回退：浏览器没有 startViewTransition 时，
         JS 把同一套 keyframes 以类名方式加在真实 .page 元素上（两页短暂同框），
         动画结束再隐藏旧页。方向仍由 <html data-vt> 决定，效果一致。 */
      .page.fx-in,
      .page.fx-out {
        animation-duration: var(--mt-duration);
        animation-timing-function: var(--mt-ease);
        animation-fill-mode: both;
      }
      .page.fx-out {
        z-index: 1;
      }
      .page.fx-in {
        z-index: 2;
      }
      html[data-vt='forward'] .page.fx-in {
        animation-name: page-in-fwd;
      }
      html[data-vt='forward'] .page.fx-out {
        animation-name: page-out-fwd;
      }
      html[data-vt='back'] .page.fx-in {
        animation-name: page-in-back;
      }
      html[data-vt='back'] .page.fx-out {
        animation-name: page-out-back;
      }

      /* 用户开启「减少动态效果」：一律瞬间切换（JS 同步跳过转场） */
      @media (prefers-reduced-motion: reduce) {
        ::view-transition-group(*),
        ::view-transition-old(*),
        ::view-transition-new(*) {
          animation: none !important;
        }
        .page.fx-in,
        .page.fx-out {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="mt-app" id="mtApp">
      <!-- 列表页 -->
      <section class="page page-list" id="pageList" aria-label="列表页">
        <h2 tabindex="-1">精选专题</h2>
        <div class="card-grid" id="cardGrid"></div>
      </section>

      <!-- 详情页 -->
      <section class="page page-detail" id="pageDetail" aria-label="详情页" hidden>
        <button type="button" class="back" id="backBtn">‹ 返回</button>
        <div class="hero" id="detailHero"></div>
        <div class="body">
          <h1 id="detailTitle" tabindex="-1">专题标题</h1>
          <p>这里是详情页正文。转场核心模板关注的是两页之间怎么过渡，正文内容只是演示占位。</p>
          <p>把「过渡层」那段 CSS 换成自己的 keyframes，就得到一个新的转场形态。</p>
        </div>
      </section>
    </div>

    <script>
      const CONFIG = {
        items: ['春季系列', '夏季系列', '秋季系列', '冬季系列'], // 列表页卡片标题
      };

      // ================= 转场核心（骨架部分各效果通用） =================
      (function () {
        const html = document.documentElement;
        const app = document.getElementById('mtApp');
        const pageList = document.getElementById('pageList');
        const pageDetail = document.getElementById('pageDetail');
        const detailTitle = document.getElementById('detailTitle');
        const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
        let navigating = false; // 转场进行中忽略新的导航

        // ---- 生成列表卡片 ----
        const grid = document.getElementById('cardGrid');
        for (const name of CONFIG.items) {
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'card';
          card.innerHTML = '<span class="thumb"></span><span class="name"></span>';
          card.querySelector('.name').textContent = name;
          card.addEventListener('click', () => {
            detailTitle.textContent = name;
            go(pageDetail, 'forward');
          });
          grid.appendChild(card);
        }

        // ---- DOM 换页（两条路径共用）----
        function swap(from, to) {
          from.hidden = true;
          to.hidden = false;
        }
        // 转场后把焦点移到新页标题（tabindex="-1"），屏幕阅读器从新页顶部继续
        function focusHeading(to) {
          const heading = to.querySelector('h1, h2');
          if (heading) heading.focus({ preventScroll: true });
        }

        /**
         * 方向化转场：go(目标页, 'forward' | 'back')
         * 1. <html data-vt> 写方向，CSS 据此选 keyframes（返回严格反向）
         * 2. 优先 startViewTransition；没有该 API 走 @mt:fallback 类回退
         * 3. reduced-motion 一律瞬间切换
         */
        function go(to, direction) {
          const from = to === pageDetail ? pageList : pageDetail;
          if (navigating || !to.hidden) return;

          if (reduceMotion.matches) {
            swap(from, to);
            focusHeading(to);
            return;
          }
          navigating = true;
          html.dataset.vt = direction;

          // 共享元素形态在这里给参与元素挂名，例如：
          //   点击的卡片.style.viewTransitionName = 'hero';
          // 并在 cleanup 里摘掉（重名会导致转场被跳过）。
          from.style.viewTransitionName = 'page';
          const cleanup = () => {
            from.style.viewTransitionName = '';
            to.style.viewTransitionName = '';
            delete html.dataset.vt;
            navigating = false;
            focusHeading(to);
          };

          if (document.startViewTransition) {
            const vt = document.startViewTransition(() => {
              swap(from, to);
              from.style.viewTransitionName = '';
              to.style.viewTransitionName = 'page';
            });
            vt.finished.finally(cleanup);
          } else {
            // @mt:fallback：两页短暂同框，播同一套 keyframes，动画结束后隐藏旧页
            to.hidden = false;
            from.classList.add('fx-out');
            to.classList.add('fx-in');
            const done = () => {
              to.removeEventListener('animationend', done);
              from.hidden = true;
              from.classList.remove('fx-out');
              to.classList.remove('fx-in');
              cleanup();
            };
            to.addEventListener('animationend', done);
          }
        }
        const goBack = () => go(pageList, 'back');

        // ---- 返回途径：按钮 / Esc / Backspace / 左缘右滑 ----
        document.getElementById('backBtn').addEventListener('click', goBack);
        document.addEventListener('keydown', (e) => {
          if (pageDetail.hidden) return;
          if (e.key === 'Escape' || e.key === 'Backspace') {
            e.preventDefault();
            goBack();
          }
        });
        // 左缘拖拽返回（iOS 手势的简化版：从容器左缘 32px 内起手、右滑超过 60px 触发）
        let edgeStartX = null;
        app.addEventListener('pointerdown', (e) => {
          if (pageDetail.hidden) return;
          const rect = app.getBoundingClientRect();
          edgeStartX = e.clientX - rect.left <= 32 ? e.clientX : null;
        });
        app.addEventListener('pointerup', (e) => {
          if (edgeStartX !== null && e.clientX - edgeStartX > 60) goBack();
          edgeStartX = null;
        });
        app.addEventListener('pointercancel', () => (edgeStartX = null));

        /* @mt:thumb-start */
        // 卡片缩略图演示：自动前进→返回往返播放；切后台暂停，reduced-motion 不启动
        if (!reduceMotion.matches) {
          const firstCard = grid.querySelector('.card');
          setInterval(() => {
            if (document.hidden || navigating) return;
            if (pageDetail.hidden) firstCard.click();
            else goBack();
          }, 2400);
        }
        /* @mt:thumb-end */
      })();
    </script>
  </body>
</html>
